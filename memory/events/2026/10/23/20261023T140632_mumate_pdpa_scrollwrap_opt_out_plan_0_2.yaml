outcome:
  status: decided
  slice: "1"
  decision: >-
    The business team checked staging and asked for the full policy on the
    screen, a tick that unlocks only after scrolling to the end with a message
    on an early tap, and one tick only, without the AI box. The owner asked for
    conventions; the agent reported that ChatGPT and Claude train on chats by
    default with a switch in settings (ChatGPT on legitimate interest under
    GDPR), that ChatGPT Health conversations are not used to train foundation
    models, and that health details in questions make opt-out risky under PDPA
    section 26, and it recommended an off-by-default switch in settings. The
    owner decided to follow the team: "เอางี้นะ ทีมยืนยันว่าให้ทำตามนี้ ...
    ผมคิดว่าผมตัดสินใจ ตามทีม เค้าบอกผมว่า ทำได้แบบ opt-out ของ chatgpt ครับ
    ดังนั้น เราคงต้องทำตามแบบนั้นครับ แผนคือเราจะทำ scroll wrap
    (เอาเนื้อหา อื่นๆ ออกและให้เหลือ เนื้อหา policy ฉบับเต็ม) แล้วให้ user
    scrollwrap ลงมา แล้วติ๊ก ยินยอมอันเดียว จากนั้นเปิดเลย,แล้ว ค่อยบอก user
    ไป จัดการได้ใน setting".
  implementation_calls:
    - "Accepting records ai_training accepted at the current version, except when the member's latest ai_training answer is a no; an explicit no is kept."
    - "Slice 1 is revised rather than followed by slice 2: production still runs v1, so one release asks members once."
    - "Layout sample A (whole page scrolls, bar fixed at the bottom) is the agent's lean; the owner may pick sample B."
  supersedes:
