  defect:
    - "Owner, on his phone after PR 883 went live: the notice showed briefly, the page seemed to reload, and it was gone."
    - "Cause (from code; matches the report, not reproduced on a device by the agent): sw.ts uses skipWaiting + clientsClaim; pages/_app.tsx reloads once on controllerchange when an old service worker controlled the page, which happens a few seconds after the first visit following every deploy. PromoPopup wrote its once-per-session key when the notice opened, and sessionStorage survives the reload, so it did not open again. Every returning visitor hits this once per deploy."
  fix:
    - "PR 885 (c859aaa, merged by the owner as 83ed2f1, 2026-10-06 12:43:52Z): the notice's session key is written in close() (X, backdrop, image tap), not on open; 'รับทราบ' unchanged. The Qi check-in promo still writes on open (same flaw, out of scope; it returns after 2026-10-09 04:00)."
