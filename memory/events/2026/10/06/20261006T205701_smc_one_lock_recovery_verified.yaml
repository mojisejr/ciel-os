    dispense completion and final clear return active slot 1 to Empty. The
    retry window has exactly two unlock transmissions, preparation and
    dispense, both attempt 1; no unlock is replayed during reconnection.
    These one-lock recovery cases pass. This is an ongoing-work checkpoint
    naming no final delivery slice, because wider plan acceptance is unresolved.
