    release and closure. One subsequent dispense opens lock 1. The owner holds
    it open, removes computer-side USB, closes it while USB is removed, then
    reinserts USB on the agreed cues. Disconnected UI disables actuation and
    persisted Open HWREC002 remains pending with no completion or clear. COM4
