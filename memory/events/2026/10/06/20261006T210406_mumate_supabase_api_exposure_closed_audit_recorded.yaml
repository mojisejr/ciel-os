workstream:
  id: mumate-supabase-db-audit
  lane: single
  objective: >-
    Research MuMate's production Supabase database, security first, at the
    owner's request ("research prod database ทั้งหมด รวมถึงด้านความปลอดภัย"),
    and record what was found and the one fix applied the same evening. No
    workstream was opened; the owner will continue with Supabase and infra
    work in the next session.
  scope:
    - Code survey of mootech-fe, mootech-be, bazi-sft-dataset and mumate-infra for how they reach the database and Storage.
    - A read-only catalog audit of production, run by the owner.
    - Closing the database's public API access to schema public, run by the owner.
  out_of_scope:
    - Every other finding below; each waits for an owner decision or a workstream.

outcome:
  status: recorded
  slice: none
  completed:
    - >-
      ACCESS. The agent's own read of production (ssh to mumate-2 with
      env/backup.env) was refused by the harness as a production read, as
      recorded before; it was not retried. The agent wrote a read-only audit
      (catalog, settings and statistics only, no member row contents) and a
      wrapper that runs it as mumate_backup on mumate-2; the owner ran it at
      13:49Z and again at 14:01Z. The Supabase CLI on this machine is not
      logged in, so dashboard-only settings were read by the owner.
    - >-
      FINDING, NOW CLOSED. Before the fix, 174 of 189 tables in schema public
      had row level security off while Supabase's API roles anon and
      authenticated held full table privileges on them, the members' tables
      among them, and default privileges granted the same on every new table
      postgres created. The Data API (PostgREST) was running. No code in the
      four repositories calls the Data API or supabase-js table queries; their
      supabase-js use is Storage with the service-role key, and Supabase Auth
      has 0 users.
    - >-
      EXPOSURE CHECK. The owner read the dashboard API logs filtered to the
      Data API path and reported 0 rows. The first screenshot covered the last
      60 minutes; the range of the final check was not confirmed to the agent.
      Logs reach back about 7 days at most, so earlier access cannot be ruled
      out either way.
    - >-
      FIX, owner-run in the SQL editor between the two audits (20:49-21:01 +07:00), from a file the
      agent prepared and first proved on a throwaway local Postgres (owner role
      still reads and writes; anon denied; a new table not granted): revoke all
      privileges of anon and authenticated on public tables, sequences and
      functions; revoke the same from postgres's default privileges in public;
      enable (not force) RLS on every public table, with no policies. The
      in-transaction check returned 0 tables without RLS and 0 readable by the
      API roles.
    - >-
      VERIFIED. The 14:01Z audit shows public 189 tables, 189 with RLS; no
      public table in the exposure list; postgres's default privileges in
      public no longer name anon or authenticated. The apps connect as
      postgres, the table owner, which non-forced RLS does not restrict, and
      mumate_backup has BYPASSRLS. The owner then opened member-data pages on
      bazichart.mumate.co and reported them normal.
  measured_facts:
    - "Postgres 17.6, database 403 MB, max_connections 60, about 18 backends at audit time; all 250 public objects owned by postgres."
    - "No pg_cron, no realtime publication, 0 vault secrets, 0 Supabase Auth users; seven Storage buckets, all public, mootech holding 13,710 objects (about 7.1 GB)."
    - "idle_in_transaction_session_timeout and idle_session_timeout are 0 (none); the database-wide statement_timeout was not measured, because the audit set its own."
    - "No migration ledger exists for schema public; only Supabase's own auth, realtime and storage ledgers."
    - "The heaviest statement by total time ran 37,716 calls at a 345 ms mean; its text is hidden from mumate_backup."

