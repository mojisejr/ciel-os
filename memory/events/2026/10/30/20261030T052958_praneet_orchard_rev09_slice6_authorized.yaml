    recipe products that match products on the shelf; an unmatched product
    has no group ('โอเค'). The sprays recorded as notes before the form
    existed (28 and 29 Oct) are converted once by the agent ('แปลงก็ดี');
    after that the owner fills the details himself, or tells the agent, who
    records them with orchard add. The nursery care log may change in
    parallel with praneet-nursery-001 ('จริงๆ ทำได้เลย').
  why: >-
    Rotating groups needs each plot's real history of what was sprayed. The
    history reads groups from shelf products, so the shelf the owner fills
    from his bottles comes before the history import and the conversion.

