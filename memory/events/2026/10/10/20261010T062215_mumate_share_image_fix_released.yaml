outcome:
  status: recorded
  result: >-
    /api/og/share answers 200 with a 1200x630 PNG through the public hostname
    on staging and production (fe a1900ff); before, every request died and
    Caddy answered 503 after 20 s.
  cause: >-
    Next 14.2 builds an edge route's req.url from the server's listen
    hostname and port plus X-Forwarded-Proto (next-server.js
    attachRequestMeta). Behind Caddy that is https://0.0.0.0:3000, so the
    route fetched its background over TLS from a plain-HTTP port
    (ERR_SSL_WRONG_VERSION_NUMBER inside the fe container; http on the same
    address 200), Satori could not size the image, the response died, and
    Caddy retried 20 s then served its 503 page. Staging reproduced it:
    direct with X-Forwarded-Proto https -> empty reply in 15 ms; http or no
    header -> 200 in about 1 s. On Vercel the origin was the public host.
  change: >-
    lib/og/asset-origin.ts (new, edge-safe): a listen-address origin
    (0.0.0.0, localhost, 127.0.0.1, [::], [::1]) becomes
    http://127.0.0.1:<port>; a real host is unchanged. share.tsx takes its
    own-asset origin from it. No other route builds URLs from req.url's
    origin.
  verification:
    - "scripts/og-asset-origin.test.ts 4/4 (fails on the old share.tsx); npm test 306 files passed / 22 skipped, 3875 tests passed / 211 skipped; eslint and tsc clean on changed files; pushed with --no-verify over the known verify-architecture baseline."
    - "Staging (deploy-history ok 2026-10-09T23:20:12Z, fe a1900ff + bazi 6b08b51): /api/og/share with LINE's preview user agent through app.staging.mumate.co -> 200 image/png 1200x630 (5.5 s cold, then 1.2 s with a card image parameter); no fe image errors."
    - "Production: ops-status all ✅, 0 5xx in 20 min and 0 db_query_stall before the release; deploy-history ok 2026-10-09T23:21:42Z FE_TAG=a1900ff BAZI_TAG=6b08b51; ops-status ✅; /api/og/share with LINE's preview UA through bazichart.mumate.co -> 200 image/png 1200x630 in 2.9 s then 1.2 s; LINE sign-in still 302 to access.line.me authorize; no fe image errors, 0 5xx since the release."
  delegation_used: "Agent merged PR 887 and pressed the staging and production releases (owner: continue with the pending item, 20261010T054626); the merge auto-built Vercel fe production (accepted by the owner)."

