workstream:
  id: mumate-vercel-to-do-001
  lane: single
  objective: >-
    Fixes 3 and 4 of slice 7 (20261010T054626): bazi survives a stalled
    database statement without the user seeing an error or a hang, and a hung
    app on production is recreated in about 2 minutes instead of about 10.
  scope:
    - bazi-sft-dataset PR 49, mumate-infra PR 50, staging stall injection, production release and timer change.
  out_of_scope:
    - Fix 2 (share image), next.
    - The stall's origin (network vs client/pooler), which the new log line now measures.

outcome:
  status: recorded
  result: >-
    bazi 6b08b51 runs on staging and production with every query bounded at
    5 s and a single transparent retry on a fresh pool (30 s). An injected
    stall on staging returned normal 200 responses in about 5.1 s instead of
    hanging. Production's health timer ticks every minute (mumate-infra
    c169e98), so the unchanged two-bad-tick recovery recreates a hung app
    about 2 minutes after Docker marks it unhealthy.
  change:
    - "bazi src/db/resilient-sql.ts (new) wraps the postgres.js pool used by drizzle, raw unsafe() and tagged templates (incl. /api/health). On a stall the pool is retired with end({timeout: 30}) so queries already on it finish, a fresh pool inherits drizzle's parser/serializer overrides, and the query is retried once. Database errors pass through untouched. Each stall logs {event: db_query_stall, kind, waited_ms, action} with no SQL or parameters. Writes are retried too (rationale in 20261010T054626)."
    - "mumate-infra systemd/mumate-health.timer OnUnitActiveSec 5min -> 1min; owner-facing wait text '~2 นาที' on production, '~10 นาที' elsewhere; runbooks 00 and 04 and comments follow. Recovery rules unchanged."
  verification:
    - "bazi unit tests (stand-in pools) 9/9: normal path, stall -> fresh-pool retry with graceful retirement, .values() and tagged template, database error not retried, concurrent stalls replace the pool once, write retried and logged, second stall gives up with DbStallError, drizzle parsers carried over."
    - "bazi real-socket proof (npm run test:db-stall, PostgreSQL 17 in a disposable local container, removed afterwards; a TCP proxy silences open connections): plain postgres.js does not answer within 1.5 s (bug reproduced); through the guard the normal rows come back in under 2 s; a stalled insert lands exactly once. 3/3."
    - "bazi runtime-critical 107/107; eslint clean on changed files; tsc 0 errors outside the known stale .next/dev validator; branch container smoke passed (run 38001485241)."
    - "mumate-infra scripts/*.test.sh all pass, incl. a new check that a 5-minute staging host still says ~10 minutes."
    - "Staging (mumate-2, fe 23bdc6f + bazi 6b08b51, deploy-history ok 23:04:23Z): warmed the pool, dropped outbound packets of bazi's 3 open connections to pgstaging (iptables in bazi's netns via a throwaway alpine helper), fired 3 parallel /api/health -> 200 db ok in 5221, 5116, 5123 ms; next call 91 ms; three db_query_stall retry_on_fresh_pool lines; rule removed; Docker health stayed healthy."
    - "Production: ops-status all ✅ and 0 5xx in 30 min before the release; deploy-history ok 2026-10-09T23:06:18Z FE_TAG=23bdc6f BAZI_TAG=6b08b51; ops-status ✅; public /v2 200. Timer applied by git pull (c169e98) + daemon-reload + restart (unit is a link); health ticks logged 23:07:01, 23:08:02, 23:09:04Z, all healthy. Since the release: 0 5xx, 0 db_query_stall, no bazi-calling traffic yet (06:09 +07)."
  delegation_used: "Agent merged bazi PR 49 and mumate-infra PR 50 and pressed the staging and production releases under 20261010T054626; the merge to pdf-dev also auto-built Vercel bazi production (accepted by the owner, 20261009T203227)."

