workstream:
  id: mumate-vercel-to-do-001
  lane: single
  objective: >-
    Extend slice 7 (20261009T201451) with two fixes for the bazi hang of
    2026-10-09 20:20-20:30 +07, under the owner's condition that users must
    not feel it as an error or a frozen screen. Fix 2 (share image) follows
    after these.
  scope:
    - "Fix 3, bazi-sft-dataset: bound every database query on the client side; on a stall, discard the stuck connection and retry automatically on a fresh one, so the user sees a few seconds' delay, not an error and not a hang. Log each timeout with bounded metadata. Staging proof includes an injected stall."
    - "Fix 4, mumate-infra: recover a bazi (or fe) that stays unhealthy within about 1-2 minutes instead of about 10."
  out_of_scope:
    - A Supabase-wide statement_timeout for the postgres role (affects fe, crons and migrations; does not cover a statement that never reaches the database).
    - Vercel, DNS, cleanup items.

outcome:
  status: decided
  decision: >-
    Fixes 3 and 4 are authorized inside slice 7 with the same delegation as
    fix 1: the agent merges and releases to staging then production when
    nothing needs a new decision and every step is safe, and reports. After
    them, fix 2 (share image) continues.
  cause_as_established: >-
    Supabase Postgres logs 13:10-13:35Z (owner export, kept in the
    owner-controlled .assets, not copied here) show no database error in the
    hang window except five 'canceling statement due to statement timeout'
    at 13:30:18.672-.675Z, all via Supavisor as role postgres with
    command_tag PARSE and an empty query, i.e. Postgres had received only
    the Parse message of each statement and was waiting for the rest. They
    ended about 10 s after the health timer began recreating bazi (13:30:08Z;
    new container 13:30:19Z) - consistent with the stuck client sockets
    closing at the stop's kill, an inference since Docker's event buffer no
    longer held that minute. Role postgres has no statement_timeout
    (rolconfig only search_path); authenticator has 8s. So the database was
    idle, not slow or locked: bazi's statements stalled between its
    postgres.js client and Postgres, and with no client-side bound each held
    one of bazi's 10 pool connections until restart. Unknown: whether the
    bytes were lost in the DO-AWS path or held back by the client/pooler.
  design_choices:
    - "Reads: short first bound, then a single retry on a fresh connection with a longer bound, so a legitimately slow read still completes."
    - "Writes: also retried once after a stall. In the observed failure the statement never executed (Postgres in PARSE; a dropped socket aborts the implicit transaction), so a retry cannot double it; a duplicate is possible only for a write that was genuinely executing past its bound, which bazi's single-row writes do not approach. Each retried write is logged so any such case is visible. The owner may ask for writes to be excluded."

