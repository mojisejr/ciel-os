  lane: single
  objective: >-
    Record plan revision 2.0 - the system rebuilt around the shop's real
    work (editable settings tables, a care log on every lot, a storefront
    stock table by variety, bag and height, orders from chat to receipt with
    the customer's own page, and a Shopee-style back office) - as confirmed
    by the owner. Slices 18-23 replace the planned slices 14, 16 and 17. No
    slice is started: slice 18 waits for its samples.
  scope:
    - Plan only; no code in this record.
outcome:
  status: recorded
  decision: >-
    After four syncup rounds (evt_20261016T223530_praneet_nursery_redesign_syncup_round1
    and the rounds of 2026-10-17) and a screen map of every page the system
    will have (storefront, the customer's own page, back office), the owner
    confirmed the shared understanding and the map as written, including the
    agent's leans on the two open points: the bottom menu วันนี้ · สต็อก ·
    ออเดอร์ · ลูกค้า · เมนู with posts and settings under เมนู, and the work
    order 18 (frame, shared parts, settings) then 19 (lot pages and care log),
    20 (stock table), 21 (orders and customer page), 22 (interest and
    reminders) and 23 (pictures for resellers). The rounds settled: one lot
    is one bag number; bag numbers, plant kinds with their ready height,
    varieties, shipping and bag weights are tables the owner edits (bag 7 =
    3.5 x 9, 9 = 4.5 x 12, 12 = 6 x 14 inches to start); care entries go on
    each lot's timeline, entered once for the whole field or chosen lots,
    with optional product lines and a remembered tank volume, customers see
    only kind and purpose; the storefront groups lots into rows of variety x
    bag x 10 cm band by the middle height of the latest round, which the
    owner can split at sale; the price sits on the stock row and the price
    sold sits on each order line; orders pick lots at packing; slips stay in
    LINE and the owner marks paid; post tracking numbers or truck plate and
    driver phone (name optional); the customer confirms receipt on a private
    page merged with /me; phone customers share the same list and get links
    by SMS. Guess hit rate over the four rounds: 18 of 25 questions in the
    first three rounds, then all three leans of round four.
