  decision: >-
    The owner asked whether Render could be suspended outright now and later
    deleted or moved to the free tier. The agent read Render (mootech-be:
    standard plan, running; MORNING_CRON_ENABLED off - both cron entries skip;
    about 1,300 requests a day, all 200, the pm2 monitor's rate recorded at
    the 2026-09-29 observation close; FE main b4633c5 has no BE call left,
    only comments) and recommended: suspend today, not free tier, not delete
    yet; drop the pm2 target and check Omise first; keep step 6 for after
    the cutover. On billing the agent said Render stops charging the instance
    while suspended, while any paid workspace plan continues (not verified
    from the account). The owner answered "งั้นเราหยุดค่าใช้จ่ายที่ไม่จำเป็นกันก่อน".
    The owner also proposed a workstream for cost; the agent recommended
    keeping Render in this workstream and opening a cost workstream after the
    cutover holds (week of 2026-10-12).
  owner_decisions:
    - "Suspend Render mootech-be today, after the pm2 target is dropped and Omise is checked."
    - "Plan order change: slice 4 step 3 (remove BE-era env keys from Vercel and redeploy) moves after the DigitalOcean cutover, with the Vercel clean-up - the code no longer reads those keys (NEXT_PUBLIC_BACKEND_URL, CONSENT_SECRET, AI_CONSUME_SECRET, CREDIT_ENFORCE, RENDER_API_KEY appear only in comments on main b4633c5), and no production redeploy happens in the cutover-preparation week."
    - "D7 of mumate-vercel-to-do-001 (R7 not in the cutover week) is kept: the suspend falls in the week before; the quiet days may overlap the cutover because the FE does not call BE; the delete waits until after."
