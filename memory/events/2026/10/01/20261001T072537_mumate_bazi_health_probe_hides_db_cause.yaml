    - "bazi's Dockerfile HEALTHCHECK has --timeout=5s; /api/health awaits createDbSqlClient()`select 1` with no timeout of its own, and src/db/client.ts sets connect_timeout 10 s. When the database cannot be reached, Docker kills the probe before the route can answer 503 (the same shape as mootech-fe's HEALTH_DB_TIMEOUT_MS 5000 against a 5 s probe). That is why the first production release showed only 'Health check exceeded timeout (5s)' instead of a db failure."
    - "The first production release also had no earlier set to roll back to (first deploy on a new host): the safety net was absent, not untested. A wrong value that still parses (APP_DATABASE_URL = the project API URL) connects or hangs and points away from the cause - the same failure shape as port 5000 on the CU12 lane."

