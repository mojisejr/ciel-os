workstream:
  id: ciel-os-template-001
  lane: single
  objective: >-
    Separate CIEL's engine from the owner's working HQ as a clean, private
    template repository, ciel-os-template, that carries everything this HQ has
    except its memory.
  scope:
    - Open the workstream at plan revision 0.1 and authorize slice 1.
    - Record the owner's answers on visibility, OWNER.md, free teaching, and
      ciel-os staying public.
  out_of_scope:
    - Any change to src/, test/, or a child repository in this decision.
    - Any GitHub action, including creating the template repository.
    - Changing the license of ciel-mini-template.

outcome:
  status: decided
  completed:
    - >-
      The owner said to open a workstream for the template so the record shows
      when and how the split was made.
    - >-
      ciel-os-template is private for now; the owner will use it alone first.
    - >-
      The template carries no memory. OWNER.md is kept with the owner's rules
      while he is the only user; its public form is decided later.
    - >-
      ciel-os stays public and remains the owner's HQ. The owner was told that
      on the Free plan a private repository loses the "main requires pull
      requests" ruleset; that is one reason it stays public.
    - >-
      Improvements land in ciel-os first and are then synced to the template,
      which is not edited directly. The owner named the repository
      ciel-os-template.
    - >-
      License intent, for whenever a template goes public: no selling the
      template and no paid courses; free teaching is allowed; software built
      with it, including the template files inside that project, may be used
      commercially.
  not_completed:
    - >-
      No engine change, template repository, project identity, or GitHub state
      exists yet. Slice 1 waits for its start condition in the plan.

