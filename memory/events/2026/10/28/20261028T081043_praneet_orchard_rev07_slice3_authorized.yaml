  decision: >-
    The owner authorized carrying on to the next slice when nothing needs his
    decision ('แล้วเดินต่อ slice ถัดไปได้เลยถ้าเกิดว่าไม่มี อะไรต้องเคาะ') and
    agreed to an office command that records work for him ('orchard add ผมเอาครับ
    ... เราทำงานด้วยกันครับ'). On the agent's four questions he answered 'Q1 =
    OK, Q2 = OK, Q3 = ใช่ และที่คุนไม่แน่ใจก็ใช่, Q4 = ใช่ ให้ sync กันแต่ไม่ ทำให้ข้อมูล
    ทั้งคู่ มีปัญหา ไปต่อไม่ได้ ให้บันทึกต่อได้ก็คือ จบ'. So: Work_Logs rows come in
    as work records without pay, because they do not say how each person was
    paid; Labor_Ledger shows read-only on each person's page as old Sheet
    history and does not count toward balances, which still start at 0; the
    Sheet wording is kept as written, untranslated, and categorized later;
    the name table the agent proposed is confirmed, including every name it
    was unsure of; imported P-4 work links to the graft rounds and lots
    praneet already has, without making either side unable to carry on.
    The name table holds people's names and stays in .assets, untracked.
  why: >-
    Work_Logs carries 38 spellings for about 12 people and no per-person pay,
    and Labor_Ledger uses 37 pay wordings; importing money would mean guessing,
    and the 2026-10-22 settlement never reached the Sheet.

