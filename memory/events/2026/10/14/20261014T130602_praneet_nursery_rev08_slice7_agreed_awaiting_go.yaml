outcome:
  status: agreed-awaiting-go
  decision: >-
    The first sale is the owner's old 70-80 cm stock, added by him as a
    ready lot, sold cheap and shown honestly ("not pretty, good price"); a
    one-sentence shop note plus real photos including the worst tree becomes
    the standard for every lot, no grade system. One price per shape. Target
    anyone, mainly growers. Channel is Facebook posts with the LINE link,
    posted by hand: no auto-post and no Facebook API; the owner asks in the
    ciel-os chat, the agent builds posts in praneet-office and uploads them
    to a new /ops "posts" page for copying from his phone. Results are
    measured with our own per-post link codes (click counts, no personal
    data; the code rides into the LINE chat text) and a "came from" field on
    customers and orders. Order lines get a free-tree field (usually 2 per
    100, entered as actually given). Referral codes are built in slice 7:
    any customer can refer, never on their own order, only a new customer's
    first order counts once it is received, the reward is free trees on the
    referrer's next order (default 2 per 100 bought, one year, no cash),
    nothing extra for the referred buyer. TikTok and ads stay out unless the
    owner orders them.
