workstream:
  id: praneet-nursery-001
  lane: single
  objective: >-
    Authorize slice 7 under plan revision 0.9: referrals become a system the
    customer can see, replacing the revision 0.8 referral rules.
  scope:
    - "praneet-web: personal no-login referral page, invite link /r/<code>, codes read from LINE chat without storing text, automatic code on a first received order, claimable free-tree balance, order-form suggestions; privacy wording for reading codes (owner approves)."
  out_of_scope:
    - Pushing messages to customers, LIFF and LINE Login, friends' names on a customer's page.
outcome:
  status: decided
  decision: >-
    After a syncup round (6 of 7 guesses matched; on R1 the owner had meant
    per friend and accepted per 100 trees), the owner confirmed and said go.
    Everyone keeps 100-for-2; a referred buyer's first order gets 100-for-3;
    the referrer earns +1 free tree per full 100 the friend buys in that
    first order, counted when it is received; never the referrer's own code.
    Claim any amount with a purchase, or a full 100 without one (plus the
    usual 2); the balance expires a year after the last earning, stated
    clearly to the customer. A private no-login link shows code, invite
    link, balance, expiry and history with no names or phones; the owner can
    reissue it. The invite link /r/<code> lands with the invitation and fills
    the code into the LINE chat. The webhook reads referral and post codes
    from chat text without storing it and pre-fills the order form. Codes
    are issued automatically on a customer's first received order.
  owner_statements:
    - "ผมพอจะเข้าใจละ ผมว่ามันควรจะเป็นระบบ นะไม่ควรจะเป็น manual ขนาดนี้ ผมว่า แล้ว ลูกค้าก็ดูต้นแถมตัวเองไม่ได้ ว่าตัวเองได้เท่าไหร่แล้ว"
    - "ถ้าใครแนะนำเพื่อนมาซื้อ ให้เขาได้ ต้นแถมรอบหน้า เป็น +1 ต้น ไปเรื่อยๆ สะสมไป แล้วเขาต้องเชคได้ว่าตัวเอง ได้ต้นแถมกี่ต้นแล้ว แล้วจะเคลมได้แบบ เต็มๆ ก็คือ 100 ต้นถ้าไม่ซื้อเลย ถูกป่ะ ถ้าซื้อ แล้วจะเคลมต้นแถมกี่ต้นก็ว่าไป, ทีนี้คนที่มาซื้อ ถ้ามาจากการแนะนำ คนนั้นก็จะได้แถม จาก 100 ละ 2 เป็น 100 ละ 3 ทันที"
    - "เขาเข้าไปในระบบ แบบไม่ต้อง login แล้วรู้ว่าข้อมูลของเขามีอะไรไม่ได้เหรอ ?"
