outcome:
  status: decided
  decision: >-
    The owner said go for slice 6. Revision 0.6 records what was agreed
    before the go: payment slips go to a private Vercel Blob store, readable
    only through /ops after login, kept six months after the order closes,
    then exported to a zip in a git-ignored folder of praneet-office for the
    owner to keep, and deleted from Blob only after the zip is verified.
    Orders open only on lots the owner has declared ready (no pre-order); an
    order may hold several lots and shapes; prices start from the lot price
    and the owner may change them per order; under 50 trees cannot be saved
    and 50-99 warns; customers pay in full before shipping, trees and
    shipping in one total. Stock drops when the order is saved and returns on
    cancel, is one number per lot, cannot go below zero or be taken from a lot
    with no count; the system never sets sold out by itself. Customers who
    phone can be added by hand with name and phone. The agent designs the
    order summary (items, shipping, total, ship and expected arrival dates,
    PromptPay QR with the amount, bank account) with placeholder numbers
    until the owner gives the real ones. The back office warns when a lot is
    not measured for over three weeks. Bare-root sales stay out. The owner
    asked to stop for his call if a problem comes up, and otherwise to finish
    and report.
