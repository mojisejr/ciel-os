workstream:
  id: ciel-skills-001
  lane: single
  objective: >-
    Open the ciel-skills workstream - a standalone, client-neutral skill pack
    built from syncup, the design set and motion-scene-design - and authorize
    slice 1 (repository, guardrails, installer).
  scope:
    - Plan 0.1; slice 1 creates the private repository ciel-skills, registers it as a CIEL project, and lands README, the rule tests and the installer with no skill content.
  out_of_scope:
    - Slices 2-4 work (their own decisions); any change to CIEL's AGENTS.md, OWNER.md, src or tests; the old oracle-skills repository and its install.sh.

outcome:
  status: decided
  slice: "1"
  parallelism: approved
  decision: >-
    Owner, 2026-10-12, after reviewing the skills audit and the draft plan:
    the pack must not be bound to CIEL ("ไม่อยากให้ผูกกับ ciel ciel ไม่จำเป็น
    ต้องรู้ว่ามี skill ชุดนี้อยู่ ... และ ไม่มี skills ชุดนี้ ciel ก็ยังทำงานได้
    เหมือนเดิม"); no owner name in the skills; name it ciel-skills so later
    workflow skills share one family name; design against the mumate-fe
    harness incident ("skill บางอันไปสร้าง harness ใหม่บน repo เป้าหมาย แล้ว
    ทำให้ เกิด ci ที่ block นั่นนี่เต็มไปหมด"). On opening: "โอเค ผมว่าเรา
    เริ่มได้เลยครับ บันทึกการตัดสินใจ" and, for the end state, "หลังจากทำเสร็จ
    ทดสอบเสร็จ แล้วใช้งานได้อย่างมั่นใจแล้ว เรา ยก เอา oracle-skills เดิมออก
    แล้วแทนที่ด้วย ciel skills" - written into slice 4.
  agent_defaults_not_objected: >-
    Proposed by the agent and left standing by the owner: motion-scene-design
    joins the pack; skill files are written in English and reply in the
    user's language; the repository is private until the pack is stable;
    neutral skills carry no prefix and a future CIEL-aware skill takes the
    prefix ciel-.
  placement: >-
    The ciel-skills checkout lives at ~/ghq/github.com/mojisejr/ciel-skills,
    outside the HQ tree, so its independence is physical as well as textual.
  parallelism_basis: >-
    This workstream touches ciel-os only for its plan and records; it edits no
    file another active workstream owns, and its product is a separate
    repository.

