outcome:
  status: decided
  parallelism: approved
  decision: >-
    After three rounds on pay the owner said 'บันทึก และ go slice 2 ได้เลยครับ'.
    One add-work form for every pay method; each task type carries a default
    method (day, piece, hour) that can be changed per task. Piece and hourly
    work may be paid to the whole team or to each person, because both happen
    ('บางทีก็จ่ายทั้งทีม บางทีก็จ่ายรายคน'); a team is a named group with members
    so per-person hours can be kept. Hours are whole half-hours only, never
    minutes ('จะไม่มาคิดค่าแรง x นาทีเป็นอันขาด'). The day wage (one or half a
    day per person) counts day-rate tasks only. Extra pay is an added line
    with a reason, not an edited rate. Amounts are owed when the work is
    recorded and paid when paid; most hourly work is settled the same day,
    so each person's line on the day page has a 'paid' action. Slice 2
    acceptance now checks balances from the opening figure the owner
    confirms; the comparison with the Sheet stays in slice 3. Samples of the
    add-work and day pages under these rules come before code. Parallel
    running stays approved.

