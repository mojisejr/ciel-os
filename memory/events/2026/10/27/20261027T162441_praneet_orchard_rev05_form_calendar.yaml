outcome:
  status: decided
  parallelism: approved
  decision: >-
    The owner liked the round 4 pages and asked whether the form was the
    fastest and least cluttered and whether a modal would work better. The
    answer was inline expansion, with three rules: it opens only on his tap,
    it opens below what he tapped, and a closed section still shows its value
    on one line. Round 5 flattens the form into one card, orders it as plot,
    task, people, pay, and shows pay as one summary line that opens on
    'change'. It does not reduce taps; the speed comes from remembered plot
    and people, frequent words and pay defaults. He then asked that 'what was
    done' be free ('ทำอะไรต้องยืดหยุ่น'): the text box is primary and the
    frequent words only insert text, as revision 0.2 already agreed; rounds 3
    to 5 had dropped the box by the agent's mistake. Spraying has its own form
    in slice 5; until then it is recorded as ordinary work. He chose 'เอารอบห้า'.
    For the Calendar he chose one all-day event per day instead of one per
    task, because this is his main calendar, and nothing about pay in it, not
    even half days or hours ('ไม่ใส่ ตามคุนเลย'). The 8-task day quoted in
    revision 0.4 was wrong: 24 Oct has 8 rows because 4 are whole-row
    duplicates; after removing them the busiest day has 5 tasks, so the
    acceptance now reads a 10-task day. Parallel running stays approved.

