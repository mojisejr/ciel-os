  status: built-awaiting-owner
  completed:
    - "praneet-web PR 32 (branch feat/orchard-calendar, head 45c16316e5120b6de0b4aec982cfa05c2c49d653). Work recorded in /ops is written to the owner's main calendar as one all-day event a day: Sage, transparent, no reminders. The title is 'สวน · <n> งาน · <who>'. The body lists the work by plot in his words with notes under each line, then a link to the day. No money, half days, hours, counts or units are written, and imported Sheet days are not written. Migration 018 adds orchard_calendar, which holds the hash last written per day. A day waits while its text differs from that hash, so edits, moves, hides and renames are all caught. The event id comes from the date, so a retry never duplicates an event. The write runs after the answer (waitUntil), one run at a time on one connection, and the running one re-reads the days after releasing its lock. A failure keeps its reason on the day, and /ops/orchard shows the waiting days with a retry button. Access uses Vercel OIDC, then Google STS, then generateAccessToken for a service account with the calendar.events scope; no key is stored. The README holds the owner's Cloud Shell setup."
    - "praneet-office PR 25 (branch feat/orchard-calendar, head 8f5196153c20a08b8dce4c848865c69d77b6e302) adds bun run orchard calendar [--write], which shows the waiting days and retries them through the same route."
    - "bun run check passed on head 45c1631: type check, build and 109 of 109 tests. The new test runs against a local Google stand-in and checks: one event for two works and its exact text; no money words; the event fields; no event for an imported day; the token exchange path; one create per day across a move; a rename rewriting days; and a Google failure leaving the day waiting with its reason, shown on the page and cleared by the button."
    - "Three earlier full runs failed 10 or 11 tests while the machine's load average was 10 to 12, including forms the slice does not touch. One orchard list test failed in every run: it tapped the word filter before the plot filter's page loaded, and the background write made that page slower. The test now waits for the URL."
    - "The owner chose Vercel OIDC over a key file ('ผมว่าให้ vercel ขอสิทธิ์จบสุดถ้างั้น'). He also confirmed two points: the owner's own work shows his account name ('Q1 = ชื่อนั้นแหละ'), and notes go out as written, with money kept out of notes ('Q2 = ตามที่คุนว่า')."
    - "The real 27 and 28 Oct days were rendered from the office's normal day read and shown to the owner; nothing was written. A direct production read with the reader role was refused by the harness, so the office route was used instead."
