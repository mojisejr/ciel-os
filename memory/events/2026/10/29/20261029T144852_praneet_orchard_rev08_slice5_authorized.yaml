  decision: >-
    After two syncup rounds the owner confirmed the shared understanding
    ('ยืนยัน') and approved the split ('อนุมัติ 0.8 เริ่ม slice 5'). The old
    slice 5 becomes slice 5 (chemical shelf and diary), slice 6 (spray
    details and group history) and slice 7 (tank-mix checker). The old
    slices 6 and 7 become 8 and 9, and production rounds move to slice 8.
    One shelf serves the orchard and the nursery, with have, low or out and
    no counting down. The diary is one free-text note per plot per day,
    with no finding buttons and no follow-up dates. A spray is recorded once,
    as daily work with optional details. Rules are hard only when a primary
    source states them. Photos wait until the owner has his own NAS, and
    Gemini-style parent_event links are not built.
  why: >-
    The owner wants the agent to group and rotate chemicals correctly from
    real orchard history and sources it can trust, because a wrong mix
    settles out or breeds resistance and wastes money. The shelf and diary
    are useful at once and need neither the rules nor the history.

