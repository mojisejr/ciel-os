  slice: none
  decisions_by_owner:
    - "Replace the broken bun-installed Claude Code with Anthropic's native installer, then move the old installs out with a way back."
    - "Delete the anvil fork state now; Codex forks again from the latest block when it resumes."
    - "Clean the AI-1 list (caches and logs only), then stop the clean-up. The owner prefers to delete session histories himself inside each app."
    - "The z.ai token printed to the session on 2026-10-19 (alias clz in ~/.zshrc) needs no rotation; the owner says it had already expired. Not verified here."
  completed:
    claude_cli: >-
      Cause: bun skips the postinstall of @anthropic-ai/claude-code, so
      ~/.bun/bin/claude stayed a 500-byte stub. The installer script was read
      in full before running it (checksum-verified download, no sudo). Native
      2.1.303 now sits at ~/.local/bin/claude, first and only on PATH.
      ~/.zshrc, ~/.zprofile and ~/.claude/settings.json were byte-identical
      before and after; ~/.claude.json gained installMethod native and one
      key, autoUpdatesProtectedForNative.
    old_installs: >-
      bun 2.1.197, Homebrew npm 1.0.43 and nvm npm 2.1.270 (plus a failed
      npm staging folder) were moved, not deleted, to
      ~/.claude-old-installs-20261019/ (625 MB) with restore.sh. bun's global
      manifest no longer lists claude-code; arra-oracle-skills is unaffected.
    anvil: >-
      The growth source. An idle anvil fork of bitkubchain (port 18559,
      started by a Codex-run start-fork.mjs in the jaothui-dashboard
      buffalo-write-integrity worktree) was stopped, and its four
      ~/.foundry/anvil/tmp/anvil-state-* folders (26 GB) were deleted by
      name. The script forks from the latest block each run and loads no
      saved state, so nothing reads those folders. The worktree and Foundry
      binaries were untouched.
    ai_caches: >-
      About 14 GiB: opencode logs and tool-output (opencode.db, auth and
      storage kept), Trae's downloaded update, Playwright chromium builds
      older than 1243, Puppeteer Chrome 119 and 121 (127 kept), VS Code's
      VSIX cache, crash dumps and old session logs (current session kept),
      and Claude CLI logs older than 3 days.
  result: "Free space went from 2.2 GiB to 41 GiB (91 % used)."
  kept:
    - "Backups made before the native install: ~/.zshrc, ~/.zprofile, ~/.zshenv, ~/.profile and ~/.claude.json, each with the suffix .bak-20261019. The .claude.json copy holds login data."
    - "Playwright MCP browser profiles mcp-chrome-* (388 MB): they may hold logins agents use."
