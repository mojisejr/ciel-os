    judged by the agent from what happens. Round 2: the bare @OWNER.md import in
    AGENTS.md plus the Wake echo ("ผมว่าโอเค"); CLAUDE.md reduced to
    the import plus Claude-only notes ("โอเคตามนี้"); recorded as revision 0.2
    of this workstream ("ไม่ต้องเปิด workstream ใหม่ถ้าเรื่องเดียวกัน"); the
