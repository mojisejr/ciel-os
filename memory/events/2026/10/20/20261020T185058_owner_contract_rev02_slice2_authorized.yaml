    นั้นเลยครับ"). After the shared understanding: "ผมว่าเราล่างแผนได้เลย",
    with the open unknowns to be proved along the way, handed to the owner
    step by step where the agent cannot observe them. After the plan draft:
    "ไม่มี session. ไหนทำงานอยู๋แล้ว คุนลุยได้เลย".
