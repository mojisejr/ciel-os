outcome:
  status: decided
  decision: >-
    The owner asked how the board would look with 10-20 lots and how to find
    a lot easily on phones while keeping desktop good. The agent measured the
    test database's 10 lots (about 4,500 px of cards on a 390 px phone, about
    9,000 px expected at 20) and recommended two tiers, status and height
    chips with the 50 cm split, filters in the URL, sold-out folded, and no
    search box until about 30-40 lots. Three samples with 18 sample lots and
    real photos were rendered on the live page: 1 list rows, 2 two-column
    cards, 3 a home carousel. The owner chose sample 2 (the agent had leaned
    to 1). The shop sentence of revision 0.8 stays on the card, clamped to
    two lines. Slice 12 is placed before slice 8 in PLAN.md so slice 8 stays
    the last declared slice.
