  decision: >-
    The owner supplied two 3D mascot images and asked for placements. The
    agent rendered three mockups on the live home page at 390 px (A beside the
    headline, B a LINE card plus a sticky LINE bar, C a 7-Eleven-like green
    greeting band with four quick tiles and a bottom tab bar). The owner chose
    B + C; the agent advised one bottom bar only, and the owner kept B's LINE
    bar over C's tab bar. Images are converted to WebP before use (512 px full
    body, 160 px face crop with the hat). The public header changes from the
    drawn face to the 3D face crop; the back office, favicon and link previews
    keep the drawn face. Revision 1.0 adds slice 10, numbered after 9 so
    earlier records stay true. No new workstream: the owner left that to the
    agent, who kept it in praneet-nursery-001 as slice 9 was.
