  objective: >-
    Record the owner's decision on what follows the Supabase audit: no
    workstream that moves Supabase into mumate-infra for now; the Friday
    2026-10-09 cutover stays the main line.
  scope:
    - What is deferred, what replaces it for now, and what still has to happen after the cutover.
