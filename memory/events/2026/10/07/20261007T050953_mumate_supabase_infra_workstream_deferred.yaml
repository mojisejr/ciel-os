outcome:
  status: recorded
  slice: none
  decision: >-
    Owner, 2026-10-07 about 05:05 +07:00, after the agent agreed with his
    reasoning that the dashboard is enough for now: "โอเค เอาตามนี้ครับ".
    No workstream is opened. A nightly audit job in mumate-infra is not
    built.
  reasoning:
    - >-
      Owner: the dashboard already handled the fix, and he can see the state
      there (Advisors, Security Advisor). He did not want to load the
      DigitalOcean hosts for it.
    - >-
      Agent, agreeing on different grounds: the host cost would be small. A
      run is a short-lived container about once a night, and mumate-2 used
      1.1 of 3.9 GB. The deciding point is that the database now has two
      independent locks. The API roles have no grants on public, including
      for new tables created by postgres, and the Data API is off. Exposure
      would return only if both were reopened, so a nightly alarm adds
      little next to the cutover.
  replaces_for_now:
    - "The owner opens Advisors > Security Advisor after each production migration, or at least monthly."
    - "Every migration that creates a public table also enables RLS on it, as book_order and the promo_* tables already did."
  still_required_after_cutover:
    - >-
      Per-app database roles in place of postgres, a postgres password
      rotation, and new anon and service-role keys. The dashboard locks do
      not cover anyone holding the postgres password or the service-role key.
      After the cutover app env lives on DigitalOcean only, so it is changed
      once. This is SQL-editor and env work, not new infrastructure.
    - "Owner decisions on real-data copies: the full dump and prod env backups under mootech-fe/testenv on the laptop, and the non-anonymised staging copy."
  revisit_when:
    - "The team starts changing the schema often, or more people get database access; then reconsider the nightly audit in mumate-infra."

