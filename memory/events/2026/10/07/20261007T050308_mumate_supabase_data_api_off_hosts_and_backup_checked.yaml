  completed:
    - >-
      IMPACT RESEARCH, before the switch. No repository on this machine calls
      the Data API against MuMate: mootech-fe, bazi-sft-dataset, mootech-be
      and mumate-infra use supabase-js for Storage only, with no Edge
      Functions; L-vault, o and opilot call the Data API but on tables of
      other projects. One past use was found: bongbing-oracle's notes record
      a production backfill of member_subscription on 2026-08-26 sent as an
      HTTP POST with the service-role key, so turning the Data API off also
      closes that ad-hoc route to production data, which the revoke did not
      (service_role keeps its grants). A local hook refuses any command that
      names the production project ref, so that search was made without it.
    - >-
      SWITCH. Before about 04:51 +07:00 the owner turned the Data API off in
      the dashboard, ran the audit again, checked the app, uploaded an image
      to confirm Storage, and told the team that production is no longer
      changed with the service-role key over HTTP.
    - >-
      NOT PROVEN FROM OUTSIDE, by the owner's choice. The 04:51 audit still
      lists two PostgREST connections. The owner's browser check without a key
      returned "No API key found", which the gateway answers before any
      routing and so does not tell on from off; the agent proposed a check
      with the anon key, and the owner declined it as unnecessary because he
      switched it off by hand.
    - >-
      CHECKS AFTER. Audit 21:51Z: public 189 tables, 189 with RLS, none
      reachable by the API roles. Vercel production and app.staging health
      200 with db ok. On the owner's words "คุนเข้าไปอ่านได้เลย", ops-status
      over the tailnet: mumate-prod-1 fe and bazi healthy (db-probing health),
      disk 9%; mumate-2 fe and bazi healthy, last backup 2026-10-06 02:01Z.
      mumate-infra (origin/main 68cf7dd) has no use of the Data API or of the
      revoked roles; staging, pgtmp and arena restores connect as the
      container's superuser, which RLS does not restrict.
    - >-
      BACKUP MECHANISM PROVEN. As mumate_backup through env/backup.env on
      mumate-2, with row_security off as pg_dump sets it, counts of user,
      user_provider, member_payment and book_order returned without error
      (bypassrls true). The first real dump after the change is the timer run
      at 2026-10-07 02:03Z (09:03 +07:00).
