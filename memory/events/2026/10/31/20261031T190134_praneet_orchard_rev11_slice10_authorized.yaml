  decision: >-
    The owner asked how to record work that is not paid yet. The agent read
    praneet-web and the production days of 29 and 30 Oct, read-only. Unpaid
    work is already owed until a payment is recorded, and a blank rate
    already reads as not priced. Two gaps remain: piece and hourly work
    cannot be saved without a quantity or hours, so the 30 Oct work of the
    grafting team carries hours and a rate the owner typed only to save it;
    and once people are chosen the form offers no 'not paid' choice, though
    the database has one. The owner confirmed the first is the one he hit
    and asked for a small slice before the fix ('เปิด เป็น slice เล้กให้ผม
    ก่อนแก้ไข แล้วเปิด PR มาแล้วสรุป ให้ผมฟังครับ'). Slice 10 covers both
    gaps and comes before slice 8 in the index. It is numbered 10 so that
    slices 8 and 9, already named in committed events, keep their meaning.
  why: >-
    Wages are recorded every day, and a figure typed only to get past the
    form makes the amount owed wrong. Slice 8 builds costs on these wages.

