outcome:
  status: recorded
  decision: >-
    The owner judged the site and system on the right track but not yet
    serving the buyers he wants. Three research passes (what the system has;
    Thai seedling buyers; LINE OA, notify and share patterns) and four syncup
    rounds led to revision 1.4 in PLAN.md: resellers are the main customer
    (superseding revision 0.8's "เน้นคนซื้อไปปลูก"); split resellers and
    farmers by the picture, not the person; follow a lot through LINE Login
    with the reminder date set on the web and a Vercel cron sending one LINE
    message, plus an automatic alert when the owner sets a lot ready
    (revision 0.2 and 0.9's LINE Login deferral lifted for this; LIFF for
    orders and payment stays deferred); interest, not reservation, first,
    with followers told two days before the public post; a deposit
    reservation (50%, held 14 days after the ready alert, forfeited on a
    no-show) only on a later decision; trees under 50 cm sold on request at a
    price agreed in chat; a bag-size table and a yearly average bag weight
    (dry and wet); a roll pallet holds 100 trees in #9 bags at 1,700 THB
    (1,900 to the South). Order: slices 15, 16, 17, then 14, all placed
    before slice 8. Guess hit rate over the syncup: 8 of 15 over three rounds,
    then both final leans accepted.
  owner_statements:
    - "เราไม่อยากให้ลูกค้าแค่เข้ามาดู ว่า ต้นยังไม่พร้อมขายแล้วออกไป"
