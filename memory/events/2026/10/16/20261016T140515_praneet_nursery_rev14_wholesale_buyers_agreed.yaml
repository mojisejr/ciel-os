  objective: >-
    Record plan revision 1.4 - designing for wholesale buyers (nursery shops
    that resell first, large-plot farmers second): "is it in stock" on the
    first screen, following a lot with LINE alerts, and pictures a shop can
    pass on - as agreed after research and a four-round syncup. Slices 15, 16
    and 17 are planned; none is started until the owner picks a sample.
  scope:
