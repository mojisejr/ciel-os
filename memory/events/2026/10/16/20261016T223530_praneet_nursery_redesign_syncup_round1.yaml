    - "ให้ผมแค่ใส่ได้ว่า วันนี้เราพ่นยา หรือ ใส่ปุ๋ย ใส่เกี่ยวกับอะไรก็พอแล้ว ... ให้มี สามารถใส่ ชื่อยาได้ด้วย แบบ optional"
