workstream:
  id: praneet-nursery-001
  lane: single
  objective: >-
    Record the first round of the owner's redesign syncup: stop patching the
    back office, map the shop's real work end to end, and redesign the back
    office (and the parts of the storefront it touches) as one plan revision
    2.0 in this workstream; slices 14, 16 and 17 wait. This record authorizes
    no slice.
  scope:
    - Syncup answers only; no plan text and no code in this record.
outcome:
  status: recorded
  decision: >-
    The owner said the back office reads like a prototype that grew by
    patches and that he does not understand much of it. Research (the
    back-office inventory, mobile admin patterns of Shopify, Shopee Seller,
    Square, Stripe and LINE OA, NN/g and Apple/Material guidance) and
    production usage (only lots, measuring, status changes and referral codes
    have been used; no real orders or posts; 70-A's status toggled six times
    on 2026-10-16 with no confirmation) were shown. The owner then told his
    workflow: grafting chambers, transplanting into nursery bags in rounds
    (each bagging day, bag size or re-graft is its own lot, age from the
    bagging day), care (height, spraying, fertilizing), selecting trees by
    height at sale, interest and reminders, a PromptPay QR in LINE, slips in
    LINE, post-office tracking or a truck notice with the plate, and the
    customer confirming receipt. His answers to round 1: one lot is one bag
    size, recorded with bagging date, bag number and count; bags are named by
    the shop number (เบอร์ 7, 9, 12) that growers use, not inches, and the
    agent researches the mapping. Care entries sit on each lot's timeline: by
    default only "sprayed" or "fertilized" and what for, front and back;
    optional product lines (brand name, common name, amount per tank, group)
    with the tank volume entered once and remembered, and autocomplete or
    saved favourites from past entries. One list price per lot; the real
    price is set per order line after bargaining (for example 40 to 38 baht),
    an order holds several lots and kinds (for example 50 cm, 80 cm and
    พวงมณี) each with its own price, and the receipt shows the price sold.
    Slips stay in the LINE chat as the proof: the owner marks paid himself
    and no slip image needs to be stored. The customer gets a private page
    for their orders without logging in, tied to the LINE id the shop
    already has. Slices 14, 16 and 17 wait for plan revision 2.0; the owner
    merged praneet-web PR 19 (the micro fix).
  owner_statements:
