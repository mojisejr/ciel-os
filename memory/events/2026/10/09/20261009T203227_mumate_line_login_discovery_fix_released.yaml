  objective: >-
    Fix 1 of slice 7 (20261009T201451): stop LINE sign-in failing on
    DigitalOcean by removing next-auth's per-request OpenID discovery from
    access.line.me, and release it to staging and production under the
    owner's delegation.
  scope:
    - mootech-fe PR 886, staging and production builds and releases, verification on both hosts.
  out_of_scope:
    - Fix 2 (share image timeout), put to the owner next.
    - Vercel retirement and the cleanup items of 20261009T044823.

outcome:
  status: recorded
  result: >-
    LINE sign-in no longer depends on access.line.me from the server. fe
    23bdc6f with bazi 922ba28 runs healthy on staging and production. Probes
    through the real NextAuth flow reach LINE's token endpoint every time on
    both hosts, against intermittent timeouts on the old code.
  change: >-
    pages/api/auth/[...nextauth].ts gives the LINE provider wellKnown
    undefined and its issuer, authorize, token, userinfo and jwks endpoints
    directly (values equal to LINE's discovery document; issuer, authorize
    and token from lib/auth/link-providers.ts ENDPOINTS.line).
    disable_ios_auto_login, scope, checks and HS256 id_token unchanged.
  owner_decision: >-
    After seeing the fix plan, the owner said Vercel is about to be retired
    and he does not intend to roll back to it: users are already on
    DigitalOcean, it is much faster, and no user has reported a problem to
    the team. He allowed the merge although it auto-deploys Vercel
    production. This is direction for slice 7, not an approval of any
    Vercel removal.
  verification:
    - "Code: new vitest spec scripts/line-provider-no-discovery.test.ts 5/5 (Issuer.discover never called; client equal to the one built from LINE's real discovery document incl. token auth method client_secret_basic; authorize URL keeps disable_ios_auto_login; HS256 LINE id_token accepted at callback; foreign iss rejected); all 5 fail on the old code. npm test 3871 passed, 211 skipped; eslint and tsc clean on the changed files. Pre-push verify-architecture red only on four untouched baseline files, so the branch went up with --no-verify after the checks."
    - "Probe (scratch script, no account created): csrf -> POST /api/auth/signin/line -> 302 to access.line.me authorize with state -> GET /api/auth/callback/line with that state and a bogus code. invalid_grant from LINE means the token endpoint was reached and client authentication accepted."
    - "Staging old code (83ed2f1): batches of 6, 4 and 12 runs had sign-in timeouts ('outgoing request timed out after 3500ms'), 1 of 12 in the cleanest batch. Staging new code (23bdc6f): 20/20 sign-in redirects, 20/20 invalid_grant, 0 timeouts. Google sign-in 302 to accounts.google.com; /v2, /api/health, /api/auth/providers 200."
    - "Production before (20:00-20:30 +07): timeouts continued (8 message lines among 22 LINE sign-in/callback requests). Production deploy-history ok 2026-10-09T13:31:28Z FE_TAG=23bdc6f BAZI_TAG=922ba28; ops-status exit 0, all ✅; /api/health sha 23bdc6f container production. Production probe 10/10 sign-in redirects, 10/10 invalid_grant, 0 timeouts (adds ten invalid_grant lines to fe logs about 20:32 +07)."
    - "Organic traffic 13:32:45Z-13:40:42Z (after the probes): no real sign-in or callback on any provider (164 requests in all), no next-auth error, 0 Caddy 5xx since the release. The only fe errors were one share-image burst (fix 2) at 13:38Z. A real LINE login on the new code is not yet observed."
  side_effects:
    - "Pushing the branch made Vercel build a Preview of PR 886; merging made Vercel build mootech-fe Production at 23bdc6f. Read-only check: mootech-fe.vercel.app /v2 still serves the maintenance page and /api/health reports 23bdc6f. The bazi merge of mumate-referral-release-001 did the same for bazi at 922ba28 at 11:02 +07."

