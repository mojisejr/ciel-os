outcome:
  status: recorded
  slice: "6"
  finding:
    - "Report (owner, from a team member on Android): inside LINE, on the 'used Google before?' screen, tapping Google did not leave for the external browser - the page bounced back."
    - "Evidence on mumate-prod-1 (Caddy log, LINE user agents): requests carried 'LIFF' in the user agent (rich menu opened liff.line.me/2011679472-...). Each Google tap produced /?liff.state=...&liffClientId=2011679472&...&code=... -> 307 /v2 and the same screen again (05:02:29, 05:02:38; after a first rich-menu edit still 05:24:40/43/45/48)."
    - "Cause: since login-identity slice 7c (PRs 864/865, 2026-10-02, on Vercel) the LIFF SDK loads only on demand. In the LIFF browser openInExternalBrowser (lib/browser/open-external.ts) calls liff.init on the tap; the launch parameters are gone after client navigation, so init runs LINE's login round trip and reloads the page, and liff.openWindow({external:true}) never runs. Outside LIFF the same button uses ?openExternalBrowser=1, which works (staging walk 2026-10-02; staging has no rich menu, so the LIFF path was never walked)."
    - "Not caused by the move: NEXT_PUBLIC_LIFF_ID on Vercel production and the LIFF id in the prod-1 bundle are the same, 2011679472-sNcCbR2K (the container build passes no NEXT_PUBLIC_LIFF_ID and the code default equals Vercel's value); same domain, same frozen code."
  fix:
    - "Owner had the rich menu changed from LIFF URLs to plain https URLs (LINE OA). A first edit did not take (still LIFF at 05:24); after a further change LINE requests from 05:26:15 carry no 'LIFF' in the user agent, and the owner reports Google now goes out. No Google callback was seen on prod-1 by 05:29; the confirmation is the owner's."
    - "Effect: share-invite uses its LINE deep-link fallback instead of shareTargetPicker (handled in lib/v2/share-invite.ts)."
    - "Left in code: any remaining entry through a LIFF URL (old links, other LIFF apps) still bounces; lib/line/liff.ts says it and @line/liff can be removed once no LIFF URL is used - a candidate for the post-cutover login-identity batch."
  also_today:
    - "Team account 77e9a98b-... deleted via /ops (20261009T045935); prod-1's /ops key is staging's - the owner's decision on restoring Vercel's OPS_DASHBOARD_KEY and GLASS_BOX_KEY is open."
    - "HQ round hq/20261005 merged as ciel-os PR 84 (cca75b1); this record is on the new standing branch hq/20261009."

