outcome:
  status: recorded
  slice: none
  owner_statement: "ผมคิดว่าเราควร closeout เก็บประสบการณ์เหตุการตรงนี้เอาไว้ด้วยครับเราจะได้จำได้ ว่าเคยเกิดอะไรขึ้นครับ ก่อนเราจะปิด hq session นี้"
  what_happened:
    - "05:05 - preparing the round PR, bun run check failed 43/1 (load average 2.9, so a real assertion, not a timeout)."
    - "05:05 - to find the failing test the agent ran a bare `bun test` at the HQ root. Bun discovered 28 test files in five child checkouts (orchard-decision-lab 20, pilot-task-ledger 3, pilot-task-report 3, clear-together 1, mbti-planner-pilot 1) and ran them with HQ as the working folder. orchard-decision-lab defaults ORCHARD_LAB_DB_PATH to ./data/orchard-decision-lab.sqlite, so it created HQ/data/orchard-decision-lab.sqlite (16 KB, empty, new - nothing copied or moved). HQ did not ignore data/, so it showed as untracked."
    - "The failing test was test/projects/validate.test.ts: a hand-written list of projects/*/project.yaml. 6ba6ddb (clear-together lane, Codex, 2026-10-02 19:55) registered projects/clear-together without adding it. Red for about 33 hours; no lane saw it because every lane checked HQ with wake only, and wake validates the registry but runs no tests. Third time in four registrations (a827400 and ba59b5e on 09-29, repaired in 45083d3; a02ddfa on 09-19 remembered the line)."
    - "05:06 - the agent added the missing line (9a3e41c) and pushed hq/20261001; the owner stopped the PR creation and asked where data/ came from."
    - "Owner's questions that set the direction: closing HQ should check HQ only, children finish in their own PRs; does the registry test break when HQ is cloned to another machine or Windows; ignore output comprehensively; do it in this PR."
    - "Findings on those questions: the test reads projects/ (committed in HQ), not checkouts/, so a clone without checkouts stays green; adding or removing a registration turns it red until the hand list is edited; it compares 'projects/x/project.yaml' against paths built with node:path join, which on Windows use backslashes, so it would fail there (inferred - HQ bun run check has never been run on Windows; ciel-windows-portability-001 is paused before start)."
  completed:
    - "data/orchard-decision-lab.sqlite deleted by filename and data/ removed; HQ clean; checkouts/orchard-decision-lab and checkouts/clear-together unchanged; no other stray file in HQ including ignored ones."
    - "e63ce24: bunfig.toml sets the test root to test/ (a bare bun test now runs HQ's 44 tests only and creates nothing); validate.test.ts asserts every directory in projects/ has exactly one valid project.yaml, compared as relative '/' paths (proven: a folder without project.yaml fails; adding or removing a registration passes untouched); root-anchored .gitignore for data/, imports/, .local/, tmp/, build and test-report folders, sqlite/db/log files (git ls-files -ci empty; memory/, test/, docs/ not ignored)."
    - "bun run check 44 pass / 0 fail; wake validationErrors []."
  lessons:
    - "A check that only runs at the end of a round finds the round's breakage at the end. Wake is the only HQ check every session runs; anything wake does not run (bun run check) can stay red for days. A lane that writes to projects/, test/ or src/ runs bun run check before it reports done."
    - "Run the narrowest command that answers the question. Diagnosing one failing HQ test needed `bun test test/`; the bare form executed five other projects' code in HQ's folder. Never run a child project's tests or scripts from the HQ root."
    - "Code that writes relative to the current folder (orchard ./data and ./imports, clear-together .local/files) writes wherever it is started. Child projects are run from their own checkout."
    - "A second hand-written copy of committed truth goes stale; derive it from the source instead (projects/ is the registry). Same principle as AGENTS.md: state each thing once."
    - "Portability is proven, not assumed: path comparisons with '/' against join() output pass on macOS and fail on Windows. Compare relative paths normalised to '/'."
    - "The owner's instinct to stop and ask 'where did this come from' caught an agent side effect before it was committed to a public repository. Agents report side effects first, unasked."
    - "Same round, same agent, earlier: a commit hash was reported from recall (f7b3fc4, never existed) and a SHA was written into pull_request.base; both needed superseding events. Hashes come from git output in the same step."

