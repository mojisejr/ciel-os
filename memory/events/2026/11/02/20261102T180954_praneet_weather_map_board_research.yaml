outcome:
  status: weather-map-board-researched-for-discussion
  owner_direction: >-
    Owner supplies the faonam Facebook reel and asks for that treatment or a
    Windy-like weather map, with original Blender components standing on map
    tiles like Monopoly miniatures. This adds a concrete shared-map-world
    direction to the pending monsoon storyboard. Preserve earlier styles and
    proposals; do not interpret this research request as full-film approval.
  reference_observations: >-
    Resolved the share URL to reel 1862013194973985 from faonam.com. Initial
    public playback was available; the owner then explicitly reported logging
    in. Resumed normal reel navigation without changing trust/security settings.
    Native player duration was 381.133333 seconds. Inspected opening and sampled
    approximately 80, 191 and 310 seconds through its visible progress control.
    Visible treatment includes a pale province map, day/time strip, cloud icons,
    rain strokes/blue rain-area washes, geographic callouts, compact subtitles
    and intercut flat village/weather illustrations. On-screen credits name
    Natural Earth and province boundaries apisit/thailand.json. These sampled
    views do not identify the author's toolchain, prove 3D geometry or prove
    use of map tiles or Windy data. No whole-clip semantic/listening review.
  recommended_route: >-
    Use MapLibre for geography, camera and base-map tiles; add Three.js in its
    custom 3D layer, sharing camera/depth, to place GLB components at anchored
    coordinates/altitudes. Create original orchard/cloud/terrain components
    in Blender, export web-ready meshes/materials, then animate weather and
    state changes in the shared map scene. Browser frame capture and existing
    FFmpeg/approved narration finish the video. This is a proposed integration,
    not a tested implementation or performance result. Stylized miniature
    sizes/heights are explanatory symbols rather than surveyed dimensions.
  costs_and_data: >-
    OpenFreeMap states public tiles are free without registration/API keys,
    commercial use is allowed, and video needs OpenMapTiles/OpenStreetMap
    attribution. Its offline download limits and lack of SLA still apply.
    Mapterhorn offers public terrain tiles with a global 30m base and separate
    source attribution; confirm relevant terrain-source terms before adoption.
    A Windy-like look needs base geography, optional elevation, a scalar weather
    color field, and wind-vector particles as distinct layers. Seasonal teaching
    can use labelled illustrative flows without weather API calls. Real dated
    forecasts need sourced/modelled data and valid times; NOAA/GFS is a candidate
    requiring local extraction/conversion, not fake measurement values. NOAA
    data generally has public-domain use subject to stated exceptions.
    Windy's production Map Forecast API lists EUR990/year and trial is for
    development only, so it is outside the existing two-service spending intent.
    Open-Meteo's free endpoint is non-commercial; its paid commercial service
    is not assumed to fit the owner's budget. Free rendered look and free data
    hosting are separate from renderer source-code licences.
  local_checks: >-
    Current video workspace has MapLibre GL JS 6.16.0; Three.js and deck.gl are
    not installed there. Installed Blender 5.2.3 LTS exposes EXPORT_SCENE_OT_gltf
    in a factory/background read-only capability check. No model was exported,
    no new package installed, no scene changed, no weather key/account created,
    and no paid provider call, upload, social write or remote Git write occurred.
