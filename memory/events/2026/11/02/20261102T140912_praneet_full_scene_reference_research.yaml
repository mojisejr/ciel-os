  owner_intent: >-
    Owner supplies the maphappenth Burma-history clip and asks which tools can
    produce that treatment from code. When asked which element matters most,
    owner explicitly wants the whole combination that makes the style, and
    hypothesizes that garden content has a gap for this treatment. Preserve
    that full-style direction rather than reducing it to a map feature alone.
    Market absence is an owner hypothesis, not a verified research result.
  observed_reference: >-
    Public browser playback and sampled frames show a 162-second history clip
    with full-frame relief-like textured maps, colored territories, city icons,
    paths/army markers, purposeful pan/zoom, compact subtitles and intercut
    historical painted illustrations. The page carries a creator AI-generated
    label. A CAPTCHA modal was closed through its normal Close control without
    solving it; public playback remained available. The inspected video and
    profile biography did not identify the production software. Relief shading
    alone does not prove actual 3D geometry, parallax, a DEM source, a particular
    generative model, or that every frame was built from code.
  research_and_proposal: >-
    MapLibre provides real-data terrain/hillshade and programmable geographic
    camera/layers; its official example integrates Three.js 3D models. Three.js
    supports authored browser scenes, glTF assets, cameras/lights/shadows.
    Blender's Python API and background rendering support scripted original
    models, materials, cameras and movie frames. Its artwork can be used
    commercially and the software needs no paid subscription. Recommend a
    video-first Blender/Python garden proof, retaining MapLibre for geographic
    stories, with Three.js optional for browser previews/shared model assets.
    This is a recommendation, not a measured renderer-quality comparison.
    Reuse the current HTML Thai overlays, FFmpeg and accepted audio where useful.
    Google Earth imagery has explicit promotional-video restrictions; educational
    monetization is separately allowed under attribution requirements. Therefore
    Earth Studio is not the default for a nursery-promotional/LINE-CTA pipeline.
  next_proof_proposal: >-
    Propose about twenty seconds of coherent visual storytelling using existing
    gak-sok narration: a detailed orchard world, camera approach, state changes
    and a root/soil view with restrained captions. Geographic maps should appear
    where they explain the topic. Assess tree anatomy/detail, material/lighting,
    camera continuity, legibility, narration alignment and actual render time.
    Build reusable original tree/branch/root/soil assets for the intended look.
    Whole-style development includes composition and rhythm, not only installing
    a renderer. No prototype or durable STYLE.md revision is approved by this
    research checkpoint; request a concrete proof scope before installing/building.
  local_boundary: >-
