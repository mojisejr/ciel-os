  completed:
    - "Found and fixed while building the way back: deploy.sh kept one .env.last-good for every profile, so each ebook deploy overwrote fe/bazi's way back and a later rollback --profile full reported ok and changed nothing. It had already happened on staging. mumate-infra PR 65 gives each profile its own file (.env.last-good, .env.last-good.ebook), and rollback.sh puts back only its own profile's tags. scripts/ebook-rollback.test.sh has 17 checks, and 10 of them fail against the old main."
    - "PR 65 also adds promote-ebook-production and rollback-ebook-production, through scripts/ebook-release.sh. Gates: staging runs a full-SHA build that is healthy and reports the same SHA in health; the commit is on mumate-ebook-bot main; it ran ok on staging for at least 10 minutes; production has env/ebook.env; production is all ✅. Neither button ever names fe or bazi. scripts/ebook-release.test.sh has 21 checks."
    - "/ebook-api retries for 8 s while ebook is recreated (lb_try_duration). PR 66 moved the route to caddy/ebook-route.caddy, so the Caddyfile is byte-identical to a92d303. Locally, a 5 s outage of a stand-in upstream gave 20 of 40 requests a 502 on the old route and 0 of 40 on the new one. On staging after a Caddy recreate, a real ebook recreate gave 40 of 40 a 200, the slowest in 0.7 s."
    - "Staging Caddy runs the new config (docker compose up -d --force-recreate caddy). The site was unreachable for about 1 s: 4 of 60 probes failed, all within 23:39:33-34 +07:00."
    - "Gate 1, the rehearsal on staging. '[TEST] E-Book 95' now handles a received slip as the live flow does: External Request, tag bot_slip_sent (created through the API in place of eb_slip_sent), mark the conversation open, and notify by email to the owner only. App down (ebook stopped, /ebook-api 503): after mmbot test and a GIF, the reply still arrived at 23:29, bot_slip_sent and bot_slip were set, ebook recorded nothing, and the owner confirmed the email. App up: the owner sent a real 1-baht slip; order 6 came back 200200, paid and delivered within 5 s, and the owner confirmed the delivery and the email."
    - "Learned for the live edit: when ManyChat's External Request fails, the actions after it in the same step still run. Drag-to-reorder of actions did not register in the builder, so in the rehearsal flow External Request stayed first."
    - "Checks: mumate-infra scripts/test-all.sh 23 files, 0 failed; bin/caddy-validate.sh staging and production both valid."
  deviations:
