  completed:
    - "Found when the owner asked whether everything was ready: production /ebook-api/health said db down, and the ebook log repeated `prepared statement ... does not exist` on every 60 s retry tick. prod-sql.sh as ebook_app still worked (psql uses unnamed statements)."
    - "Cause: db-role.sh copied bazi's URL, which is on Supabase's pooler port 6543 (transaction mode, as are fe's and bazi's). Bun SQL prepares statements by default, and in that mode they can land on another server connection. Staging talks to Postgres directly, so it never showed. Reproduced locally with pgbouncer 1.26.1 (max_prepared_statements=0) in front of Postgres 16, using two Bun SQL pools and 60 parallel prepared queries: transaction mode failed 22 of 60; with prepare:false, 1 of 60 still failed; session mode failed 0 of 180 and test/pg.test.ts passed."
    - "Fix on mumate-prod-1: EBOOK_DATABASE_URL switched from the pooler's :6543 to :5432 (session mode), same role and password, rewritten on the host and written by bin/env-set.sh (env_set|replaced, length 163, no value displayed). whoami|ebook_app through prod-sql.sh. Then `docker compose --profile ebook up -d --force-recreate --no-deps ebook`; fe (16 h), bazi (2 days) and caddy kept running. Health went back to env production, db ok, and over the next ~3 minutes the log shows only `listening`, with no retry_error."
    - "mumate-infra PR 70 makes db-role.sh write 5432 for a Supabase pooler URL on 6543, with a test; scripts/test-all.sh 25 files, 0 failed."
  not_verified:
    - "No production slip has reached the bot since the fix (events 0); the owner's gate 4 purchase is the first end-to-end proof."

