  decision: >-
    The owner tried the back office on his phone. Adding products wrapped
    the text, the buttons looked cramped, and the keyboard jumped and
    covered the input. He asked for agents to research the whole UI and
    report causes and fixes. Two read-only agents ran: a code audit and a
    measurement at 320, 360 and 390 px against the local test database.
    They found six causes: the tank-row grid, the chip style, save-bar
    wrapping, two pinned bottom bars, Enter saving the form, and code that
    moves the focus. The owner took the agent's recommendation and asked to
    build it and send the PR ('เอาตามคุนครับทำมาเลยครับ ... ส่ง PR มาเลยครับ'),
    minding memory during build and test. Because he said to build directly,
    no sample round is held. Before and after shots go in the PR.
  why: >-
    The owner records work on his phone daily. At 360 px a product row's
    group line is 33 px wide and breaks into five lines, and the keyboard
    hides what he types.

