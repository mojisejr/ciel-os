  id: praneet-orchard-001
  lane: single
  objective: >-
    Plan revision 1.8 widens slice 14 to four routine cards. Flower
    induction becomes its own card, counted per plot and fruit, and spot or
    trunk spraying stops counting as spraying. The record authorizes slice
    14 at the new revision.
  scope:
    - "workstreams/praneet-orchard-001/PLAN.md and slices/14.md."

outcome:
  status: decided
  parallelism: approved
  decision: >-
    The owner picked card sample A, one card per routine. Reviewing the
    proposed word labels against real work, he answered Q17 to Q24. Spot
    spraying is not counted ('พ่นเฉพาะจุดไม่นับ'), and the question
    covered trunk spraying too. Flower induction ('ทำสาร') gets its own card,
    because the flowering window needs its own day count. A shelf product
    is an induction agent through a new kind, 'สารบังคับออกดอก'. It is kept
    apart from 'ฮอร์โมน' because it specifically forces flowering. Counting
    works from the product kind, never from the title. A tank holding only
    an induction agent counts as induction only. A tank that also holds
    insecticide or fungicide counts as both. He did not object to that rule
    when it was stated. Induction is counted per plot and fruit ('แยกตามแปลง
    และ ผลไม้ ด้วยครับ'), and the fruit is chosen from the system's crop
    list. The watering figures stand as recorded: no watering in the rainy
    season or on rainy days, and sometimes he forgets to record it.
  why: >-
    Counting induction-only tanks as spraying would show a plot as freshly
    protected when it was not. Counting per plot alone would hide a fruit
    in the same plot that has not been induced yet.
  agent_calls:
    - "Spraying counts only the foliar method; trunk, base and spot spraying do not. Base spraying was not asked and follows the trunk answer."
    - "A work holding an induction product cannot be saved without a fruit, so no induction row goes uncounted."

