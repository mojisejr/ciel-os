outcome:
  status: decided
  parallelism: approved
  decision: >-
    The owner asked for a phone view of the days since each plot was last
    sprayed, fertilised and watered. A four-round syncup followed. It used a
    read-only production read of the work words (granted: 'เอาเลย') and a
    web research agent on how farm software groups this work. The owner
    confirmed the summary ('พร้อมแล้วครับ'). The view is per plot and covers
    every plot including P-4. It sits at the top of the Today page, with no
    alerts yet. Every sprayer job counts as spraying, whatever the tank holds.
    Fertilising means soil fertiliser only. Watering with fertiliser counts
    as both. Fungicide drench, trunk injection, trunk painting, herbicide and
    lime count as none. Labels sit on the work word, the owner confirms them,
    and every card links to the work it counts. He answered the zone rule as
    'Q18 โอเคเลย'; the open question was Q16, so it is read as Q16. Zones
    are optional and named 1, 2, 3; they are slice 15. Slice 14 starts with
    two card samples on the real page for him to pick from.
  why: >-
    The 183 work words mix Thai and English and many name several jobs,
    and none has a category yet. Matching text alone would count pipe repair
    as watering and herbicide as spraying, and the owner said a wrong count
    would mislead him at once.

