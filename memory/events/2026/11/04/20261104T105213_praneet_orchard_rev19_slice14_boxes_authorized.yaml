  decision: >-
    Seeing the merged cards, the owner said the counts did not fit his work.
    His example was 'ขูดต้นแล้วพ่นยา' at สวนมะขาม, which is not a spray round,
    and he found the pill buttons cluttered. He asked whether to roll back.
    A read-only production check found nothing written to the new columns:
    0 labelled words, 0 works with a fruit, 0 inducer products, and no work
    recorded since the deploy. The agent recommended rolling back the code
    and keeping migration 027 and its empty columns, and the owner agreed
    ('rollback เลย'). A syncup of three rounds followed, and the owner
    confirmed the summary ('ตรงแล้ว'). There are no categories, no word
    labels and no guessing. A box is one thing on one plot. Its short name
    is typed by the owner and the plot name is added, as in 'พ่นยา ·
    สวนมะขาม'. It counts only the work he puts in. The form's 'ติดตามในกล่อง'
    section starts closed. A box can be started from an old work, and a
    forgotten work can be added from the box. The newest non-hidden work
    decides the days. Boxes with the most days sit on top, with no colour,
    and a box can be closed. In chat the agent asks which box before
    putting work in one he did not name. He said to finish the work
    without stopping, unless something needs his decision.
  why: >-
    Only the owner knows which pieces of work are the same routine. Any
    rule over words or products will mistake some, and he said a wrong
    count misleads him at once.
  agent_calls:
    - "Slice number 14 is reused for the new design, so the slice index stays as Wake reads it. Git keeps the first design."
    - "Migration 027 stays in the repository unchanged, because production recorded its checksum. The new slice's migration drops the empty columns only after checking that they are empty."
    - "The samples step stays in the slice, because the owner's standing rule is rendered samples before a page is built. Building the data layer does not wait for his pick."

