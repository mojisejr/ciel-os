outcome:
  status: recorded
  completed:
    - "What happened: the first design counted spraying, fertilising, watering and flower induction from labels on the work words, plus the work's method and products. It was built, tested and merged, with migration 027. When the owner saw it, he said the counts did not fit. 'ขูดต้นแล้วพ่นยา' is not a spray round, and the pill buttons felt cluttered. It was rolled back the same day."
    - "Why it missed: the rules tried to decide which works are the same routine, and only the owner knows that. The syncup asked how to classify work; it never asked whether he wanted the system to classify it at all. Two leans at the core missed (Q27, Q28)."
    - "What he chose instead: tracking boxes he pins and fills himself, with nothing guessed. The work is still recorded as before. A forgotten work is added from the box, and the newest round counts."
    - "Why the rollback was clean: nothing had been written to the new columns. A read-only production check proved that before the agent recommended rolling back. The columns were kept until the next migration dropped them, and only after checking they were empty."
  lessons:
    - "Before designing rules that interpret the owner's free-text records, ask first whether he wants the system to interpret them, or to let him mark things himself."
    - "Show the real data through the proposed rules before building. The Q19 table of real counts was the step that surfaced the doubt; it came after the build was authorized."
    - "When a merged change is doubted, read production before answering 'is a rollback safe'. The answer rested on counts, not on an expectation."
    - "Migration order across a revert matters: revert live, then the migration that drops the old columns, then the new code."

