  decision: >-
    The owner asked to link works that continue over days, such as grafting,
    mowing and pruning, which are recorded day by day, unpaid, and paid when
    the team comes to settle, citing the 30 and 31 Oct grafting works. Two
    syncup rounds agreed (10 of 11 guesses matched): a job groups any works,
    on days that need not be consecutive; a work belongs to one job at most;
    hours stay per person per day; 'คิดเงินรอบนี้' on the job's page pays the
    ticked unpaid days for each person or team and marks them paid, hourly and
    piece work only; one 'จบงาน' button takes a job out of the picker and can
    be undone; linking and unlinking work from both the add-work and the edit
    forms; praneet-office reads and writes jobs; no calendar change; no other
    kind of link. The page layout is chosen from samples on the real page
    before it is built. The owner then said to start and to run the migration
    ('ถ้าพร้อมแล้วผมคิดว่าคุนเริ่มได้เลยครับ ! แล้ว รัน migration ได้เลยครับ'),
    which authorizes running slice 11's additive migration on production
    while its PR is a draft.
  why: >-
    The owner's multi-day hourly work is paid at the end or in parts; today
    the works and the payments carry no link, so neither he nor the agent can
    tell which days a payment settled.

