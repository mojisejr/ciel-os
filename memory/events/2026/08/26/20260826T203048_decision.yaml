workstream:
  id: ciel-v0.1-implementation-entry-001
  objective: >-
    Select a reproducible implementation language and runtime for CIEL core
    before implementing deterministic validation and read-only Wake behavior.
  scope:
    - Select the CIEL core implementation toolchain.
    - Define the boundary between CIEL core and managed workspaces.
  out_of_scope:
    - Requiring managed workspaces to use TypeScript or Bun.
    - Adding a database, daemon, MCP server, skill, second client bridge, or runtime feature.

outcome:
  status: decided
  completed:
    - The owner selected TypeScript as the CIEL core implementation language.
    - The owner selected Bun as the runtime, package manager, and test runner.
    - The tested initial runtime baseline is Bun 1.3.2.
  not_completed:
    - Event validation and read-only Wake behavior have not been implemented.
    - No managed-workspace language policy has been created.

