outcome:
  # `decided`, not `recorded`. src/portfolio/read.ts:404-419 only lets a decision
  # authorize a plan when type is `decision` AND outcome.status is exactly
  # `decided`; with `recorded` the machinery reads past it and the lane stays
  # unauthorized while reporting no error. That is the 676c90a defect, which this
  # lane has already made once today.
  status: decided
  parallelism: approved
  slice: "4"
  completed:
    - >-
      SLICE 4 IS AUTHORIZED AT PLAN REVISION 0.5. The owner's instruction in this
      session, after being shown the step order, the file-level plan and the DoD
      audit: "เขียน decision แล้ว ปรับแผนใน workstream ได้เลยถ้าต้องทำ". Observed
      directly in this session rather than relayed.
    - >-
      THE PLAN IS AT 0.5, AND THE BUMP IS THE POINT. Acceptance criteria changed, so
      the revision changed; 0.4's strategy - decisions 7 to 10 - is untouched. The
      bump also repairs an instrument defect recorded earlier today at aa54c29: wake
      was reporting "Owner decision authorizes plan revision 0.4 slice 4" against
      the 0.4 record whose own body refuses slice 4 three times. Because
      decisionAuthorizesPlan compares evidence.plan_revision to the plan's CURRENT
      revision, that stale event no longer authorizes anything, and this record
      becomes the single authorization for slice 4. The instrument and the record
      now agree, and they agree because a real decision was made rather than because
      the reader was patched.
    - >-
      DoD 4 AMENDMENT ONE - `isPaid` HAS THREE VALUES AND THE DoD WAS WRITTEN FOR
      TWO. lib/v2/subscription.ts is the single authority on who has paid and
      answers `true`, `false`, or `null`, where `null` means a v2 row carried a
      tier_code the resolver refuses to understand and therefore fails closed. Owner
      decision 8 says a paying account may never be the loser, and a `null` may be a
      paying account. So `null` must never lose, and a pair where NEITHER side can
      be determined is refused and routed to support rather than guessed - decision
      9 already names support as the fallback for whatever the flow refuses. The
      survivor rule consumes that verdict and must never re-derive it; re-reading the
      subscription tables to answer "who paid" is the second copy of a selection
      rule that #369 B2 closed once already.
    - >-
      DoD 4 AMENDMENT TWO - WHAT THE LOSING ACCOUNT KEEPS CANNOT BE COUNTED BY
      PROVIDER NAME. DoD 4 promises the member is told what is left behind before
      anything is written. The existing rule in lib/auth/link-account.ts answers that
      by counting distinct provider NAMES, and a name is not a way in: measured today
      by length, 1,783 of 2,258 Google rows hold a 253-to-342-character `ya29` access
      token against 475 holding a 21-character Google `sub`. Revision 0.3 had already
      measured the same split as 1,787 against 466; the three-row difference is slice
      3 writing three real identities since. Slice 4 therefore computes what remains
      from identities that can actually authenticate.
    - >-
      A CORRECTION IS WITHDRAWN, NOT QUIETLY DROPPED. The slice-3 acceptance closeout
      at aa54c29 carried a correction saying DoD 4 should read "every provider row of
      the losing account" rather than "exactly one user_provider row". It was proposed
      because the owner's account was seen holding five Google rows. The measurement
      explains those five - `ya29` rows plus one real identity - and unlink deletes by
      provider, which is why all five vanished together. DoD 4's original wording is
      right for a reason nobody had written down: the member proves ONE identity in
      the session, so exactly that row moves, and moving any other row would transfer
      a credential that was never proven.
    - >-
      THE GOAL WAS AUDITED BEFORE AUTHORIZING, NOT ASSUMED. Against the owner's own
      statement of the goal - members can link, focus on new and paying members, older
      members need only be able to come back and link - DoD 4 completed serves new
      members (slice 3 already covers them), paying members (decision 8 plus amendment
      one), and existing members who can still sign in and hold two accounts, which is
      the case slice 4 exists for. A member who cannot sign in at all never reaches the
      merge by construction, and revision 0.3 already establishes that this group is
      the inactive one and that a single legacy login heals them while the legacy path
      serves traffic.

  not_completed:
    - >-
      AN ASSUMPTION THE OWNER HAS NOT CONFIRMED, AND IT CONCERNS MONEY. I asked
      whether a member whose subscription has LAPSED counts as someone we protect;
      the answer did not come before the instruction to proceed. This record assumes
      the narrower reading: protected means `isPaid` is `true` or `null`, so a side
      whose verdict is `false` because its subscription expired CAN be the loser. The
      rule is written as a pure function with the protective predicate injected, so
      reversing this is a one-line change and no rewrite. It must be confirmed before
      the flow is walked by a real member on the shadow, which is the last point where
      it is still free.
    - >-
      DEFERRED - THE UNLINK ROUTE'S LAST-METHOD RULE. It counts provider names, so a
      member holding a dead `ya29` row plus one live method can unlink the live one.
      Under OWNER.md's side-issue test it does not block slice 4, slice 4 has a safe
      workaround (it applies the correct standard inside its own flow), and the harm
      is not imminent: while the legacy path serves traffic, that member's next Google
      login heals them through email discovery, per revision 0.3. THE TRIGGER IS THE
      FLIP, not this branch - after slice 5 the FE route serves that login and email
      discovery is deliberately absent from it. Recorded as a precondition on slice 5
      in PLAN.md, beside the paid-member check that shares the same trigger.
    - >-
      DEFERRED - THE 1,783 DEAD ROWS STAY. Revision 0.3 already closed this: slice 2
      is closed, no further cleanup is authorized, and the rows harm nobody while the
      legacy path serves traffic. The owner said in conversation today that they could
      be deleted if they do not touch paying members. That would REVERSE a recorded
      decision, so it is not assumed here and needs its own decision event if he wants
      it. The merge is identity-scoped and never matches those rows, so slice 4 does
      not care either way.
    - >-
      NOT VERIFIED - whether the merge survives the member's next legacy login. The
      reasoning is that registerOrLogin looks up by `id_token` first and only falls to
      email discovery on a miss, so the surviving account's new row is found and
      discovery never runs. That is reasoned from revision 0.3's reading of
      mootech-be, not observed. Recorded in PLAN.md 0.5 and confirmed by slice 5's
      observation.

