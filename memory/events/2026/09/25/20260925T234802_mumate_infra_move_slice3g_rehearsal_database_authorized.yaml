workstream:
  id: mumate-infra-move-001
  lane: single
  objective: >-
    Authorize plan revision 0.6 slice 3: add sub-slice 3g, a rehearsal database the
    shadow FE can serve from, built from the existing backup and restore tooling rather
    than from a paid data-cloning option, and return this lane to active because a paused
    workstream cannot be handed work.

outcome:
  status: decided
  parallelism: approved
  slice: "3"
  decision: >-
    The owner asked whether Supabase branching could give staging a safe database, named
    the alternative himself - a spare container with a DigitalOcean database holding data
    identical to production - and asked for research before a recommendation. He then
    chose pgtmp, declined the Supabase branch for now on cost, refused the
    Point-in-Time Recovery add-on, and agreed this arena belongs to this lane rather
    than to the login lane that needs it first. He confirmed disk headroom and dump
    freshness himself before this was recorded.

    WHY THIS LANE AND NOT THE LOGIN LANE. Revision 0.5 already drew the boundary: the
    FE's database client affects every route, so its runtime behaviour is this lane's.
    Where the shadow FE's DATABASE_URL points is the same kind of fact. The login lane
    asks for an arena; it does not restore one.

    WHY THE COST COMPARISON WENT THIS WAY. A Supabase branch is genuinely isolated and a
    persistent branch is intended for a staging environment, but it carries no production
    data without the PITR add-on, which is priced per retention week for what
    bin/backup.sh already writes nightly. bin/restore-verify.sh --keep already restores
    that dump into pgtmp and leaves it running for a service to point at - the mechanism
    slice 2's BE dogfood used. The branch's one real advantage, keeping the transaction
    pooler in the test path, is deferred until a rehearsal needs it.

    THE OWNER'S OWN CORRECTION, and the reason 3g delivers a command rather than a
    database. Offered a retention rule, he did not simply accept it: he required the copy
    be re-creatable at will, because the arena's value is being available for every
    future risky step - he named the flip to DigitalOcean specifically. So the deletion
    date stands AND what is delivered is the command that rebuilds it.

    WHAT THIS DOES NOT AUTHORIZE. No resumption of 3c, no flip, no DNS, no traffic, no
    production deployment, no provider setting, no secret value in any repository file,
    and no container belonging to another lane.

