unresolved:
  - >-
    pgtmp is a direct connection, so the transaction pooler is in no test path. A
    pooler-specific fault will not reproduce on the arena.
  - >-
    The arena holds real member data on the droplet for as long as it lives. The
    retention rule is the mitigation and nothing enforces it automatically.
  - >-
    Carried by this lane - 3c under the quiet gate, the payment test webhook from the
    team, Vercel Preview resolving to the production database, HEALTH_DB_TIMEOUT_MS equal
    to the Docker probe timeout so the 503 never reaches the healthcheck, and
    mootech-fe origin/main failing its own verify-architecture pre-push gate.

next_action:
  action: >-
    With the owner running the commands on the shadow host: confirm disk, stand the arena
    up from the latest backup, verify the table and user-row counts, point the shadow FE
    at it, prove /api/health reports database OK on loopback and through the public
    staging hostname, and record the deletion date and the one-value path back to
    production.
  acceptance_check:
    - The arena reports more than 100 tables and user rows greater than zero.
    - The shadow FE answers database OK against the arena rather than production.
    - The command that rebuilds the arena is in the repository, not only in a session.
