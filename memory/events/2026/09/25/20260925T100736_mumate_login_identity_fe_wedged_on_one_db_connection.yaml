unresolved:
  - >-
    lib/db/index.ts runs the whole application on one database connection with no
    idle, connect or lifetime bound. Candidate repair is to give the pool more than
    one connection and bounds that recycle a dead one. It touches every route, it
    is not this lane's file, and it needs an owner decision about where it belongs -
    most plausibly with mumate-infra-move-001, whose move is what makes it bite.
  - >-
    Whether production has ever wedged this way. Not investigated.
  - >-
    Whether a health signal exists that would have caught this from outside. The
    container healthcheck did; nothing else did, and a page-fetching monitor would
    have reported the site healthy throughout.
  - >-
    Carried unchanged - slice 3's remaining sequence resumes from step 4, slice 4
