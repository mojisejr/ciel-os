outcome:
  # Not terminal scope - names slice 3 of a plan whose last declared slice is 5 -
  # so `recorded` raises no warning, on the same reading of read.ts:510-512 and
  # 561-587 that aa54c29 states.
  status: recorded
  parallelism: approved
  slice: "3"
  completed:
    - >-
      THE PARSER DROPS TWO SLICE HEADINGS IN THIS PLAN, NOT ONE. aa54c29 reported
      "### 4b. Stop handing out the second account in the first place". The second
      is "### 4-legacy. The inventory that produced owner decision 5" at PLAN.md
      line 663, by the identical mechanism: /^### (\d+)\.\s/gm at
      src/portfolio/read.ts:156 matches the digit, then requires a period and meets
      a hyphen. Raised by the teammate session, and verified here by running the
      reader's own regex over the file rather than by reading it: the parser yields
      exactly 1, 2, 3, 4, 5, and of the seventeen `###` headings in the plan the
      only two dropped that are SLICES are 4b and 4-legacy.
    - >-
      THE VERIFICATION ALSO SHOWS THE PARSER IS CORRECT ABOUT EVERYTHING ELSE,
      which is what makes this worth restating. Ten prose headings - "What 0.3 got
      backwards", "Owner decisions 7-10", and the rest - are dropped too, and
      should be. So the parser is not indiscriminate; it is silently selective
      AMONG SLICE HEADINGS, which is the reason nothing has ever complained.
    - >-
      TWO INSTANCES MAKE IT A NAMING PATTERN, AND THAT IS THE CORRECTION.
      aa54c29 called the fix "a one-character plan heading change or a parser
      change", which is true of 4b alone and understates the finding. This plan
      names slices by suffixing a number when a slice is inserted beside an
      existing one (4b) or retired in place (4-legacy). The parser accepts bare
      integers only. Any plan that keeps that habit will keep producing headings
      the machinery drops without a word, so the choice in front of the owner is
      about the convention, not about one heading.
    - >-
      4-legacy IS NOT ITSELF A HAZARD, and the teammate said so when raising it. It
      reads as historical and nobody will authorize it. It matters only as the
      second instance. The hazard remains 4b, which owner decision 8 adds as real
      future work and which cannot be authorized while the parser cannot see it.

  not_completed:
    - >-
      NOT REPAIRED, and deliberately. Both the regex at read.ts:156 and the plan
      headings are in ciel-os with no owner-approved workstream covering them, and
      the fix is a choice between changing the plan's naming convention and
      changing the parser to accept suffixed slices. Repairing the instrument
      mid-round on my own judgement is the move this round has twice recorded as
      the one that needs his word first.
    - >-
      The other defect from aa54c29 is untouched by this correction: wake still
