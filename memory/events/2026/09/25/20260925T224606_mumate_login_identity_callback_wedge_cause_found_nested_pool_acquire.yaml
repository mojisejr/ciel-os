workstream:
  id: mumate-login-identity-001
  lane: single
  objective: >-
    Name the operation that wedged the shadow callback, which the incident record at
    20260925T193259 states it could not identify. It is slice 4's own code: a nested
    acquisition of the application's single database connection from inside a
    transaction that already holds it. Written before this session's context is
    cleared, because the evidence that pins it was read live from a wedged container
    and cannot be recovered afterwards.
  scope:
    - The stalled operation, named, with the evidence that pins it.
    - The mechanism, and why max 1 is the amplifier and not the cause.
    - Two corrections I owe: one to my own message to HQ, one to a sentence in the incident record.
    - Two further defects found in the same session, neither recorded anywhere yet.
    - What the shadow is carrying right now.
  out_of_scope:
