the_fix_i_would_write:
  shape: >-
    Move the READ of the paid signals inside the transaction and keep the RULE where it
    is. lib/v2/subscription.ts already exports pure resolvers - toSubRows,
    resolveMembershipFromRows, decidesWithoutLegacy - so the transaction can read
    member_subscription and member_payment through tx.execute and feed those functions.
    MergeDeps.resolveStanding then disappears entirely, and this class of bug is gone by
    construction rather than by remembering not to write it.
  why_not_simply_raise_max: >-
    Raising max would hide this defect rather than remove it, and it would hide it in
    the direction that ships: the deadlock would become an intermittent hang whenever
    enough merges ran at once.
  the_test_that_should_have_existed: >-
    A fake store whose transaction models a pool of exactly ONE slot, with the standing
    resolver required to take the same slot. Against the current code that test hangs;
    against the fix it passes. Without it, no number of assertions means anything about
    this class.

