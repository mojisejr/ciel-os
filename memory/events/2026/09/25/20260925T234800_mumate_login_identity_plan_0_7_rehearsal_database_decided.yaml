workstream:
  id: mumate-login-identity-001
  lane: single
  objective: >-
    Authorize plan revision 0.7 slice 4: insert a rehearsal-database phase between 8b
    and 8c so the collision is walked against an isolated copy of production before it
    is walked against production itself, and record the owner's three decisions that
    settle where that copy comes from, how long it may live, and which lane owns it.

outcome:
  status: decided
  parallelism: approved
  slice: "4"
  decision: >-
    The owner asked, unprompted, whether Supabase branching would let staging be
    exercised safely, and named the alternative himself: a spare container with a
    database on DigitalOcean holding data identical to production. He asked for
    research before a recommendation, and said that if it worked he considered a
    staging database worth the investment in its own right - "เวลาเราจะทดสอบ อะไรที่
    เสี่ยงๆ มากๆ" - especially once main flips to DigitalOcean. That framing is why this
    is a plan revision and not a one-off setup step.

    WHAT THE RESEARCH FOUND, and what changed the recommendation. Supabase branching
    creates a separate project per branch - its own database, URL and credentials - and
    a persistent branch is intended for a long-lived staging environment. It fits. But
    a branch carries NO production data: Supabase states plainly that it is not cloning
    production data, and the dashboard's "Include data" option requires the
    Point-in-Time Recovery add-on, priced per retention week. That is a recurring cost
    for something bin/backup.sh already produces nightly. Meanwhile the alternative the
    owner named turned out to be four fifths built already: bin/restore-verify.sh
    --keep restores the latest production dump into the pgtmp service and deliberately
    leaves it running so another service can point at it, which is what slice 2's BE
    dogfood did. The recommendation followed the evidence rather than the newer
    technology.

    THE OWNER'S DECISIONS. He took pgtmp for slice 4; declined the Supabase branch for
    now on cost ("ประหยัดเอาไว้ก่อน"); refused the PITR add-on outright; accepted that
    DoD 4 may be satisfied by a rehearsal on the copy; agreed the arena belongs to the
    infrastructure lane; and on retention he did not simply accept the expiry rule as
    offered - he required that the copy be re-creatable at will, because the arena's
    point is to be there on every future risky step and not to be one kept snapshot.
    Decision 13 is written from that correction.

    WHAT THIS DOES NOT AUTHORIZE. No production walk, no traffic flip, no push, no pull
    request, no change to constants/api/endpoint.ts, and no Supabase branch. Phase 8c
    remains forbidden until the arena stands and the fixed image is deployed on it.

