outcome:
  status: recorded
  parallelism: approved
  slice: "3"
  completed:
    - >-
      THE FIRST SUCCESSFUL LINK. The callback answered
      "Location: /v2/settings/connected?linked=line". Every earlier attempt in
      this workstream ended in a refusal - correct refusals, but the write path
      had never run. It has now.
    - >-
      IT HAPPENED IN THE LINE IN-APP BROWSER, ON A REAL DEVICE. The callback
      query string carries liffClientId, liffRedirectUri and
      lineAppVersion=26.14.0 - parameters the LINE app itself appends, which no
      desktop browser produces - and the User-Agent is Android. This is the
      environment `disable_ios_auto_login` and the SameSite=Lax cookie exist for,
      and the one whose SameSite=None variant took every provider's login down on
      2026-09-22. It had never been exercised: both earlier attempts were Chrome
      on macOS.
    - >-
      THE OWNER CONFIRMED ALL THREE ACCEPTANCE CONDITIONS ON THE SCREEN - LINE
      reads linked, the existing Google row is still shown, and he was not signed
      out. The DoD clause about NextAuth not overwriting the session during
      linking is therefore observed rather than merely argued from the code.
    - >-
      UNLINK WORKED IN REAL LIFE TOO, and it is in the same log immediately
      before - DELETE /api/auth/link/unlink/line, then the start route, then the
      callback. So the sequence proven is unlink a non-last method, then re-link
      it, both against production data.
    - >-
      THE MERGE THAT MADE IT POSSIBLE WAS PERFORMED BY THE OWNER, BY HAND, and it
      is the first operation of slice 4's shape ever run. Measured first, read-only -
      the LINE account "f948bb56-f930-4fb3-be3f-5b328ea1beca" held 1 chart and 0
      payments; the Google account "b54b765a-c01b-471f-bf7c-0c2a1a448bdd" held 2
      charts and 1 payment. Under owner decision 8 the paying side survives, so
      the Google account won and the direction did not reverse. Both rows carry
      the same date of birth, which corroborates one person holding two accounts.
    - >-
      THE MOVE TOUCHED user_id AND NOTHING ELSE, deliberately. `update_at` was
      left alone because PLAN 0.4 records it as the closest true login clock this
      system has - restamping it would have quietly destroyed the measurement
      slice 5 depends on. The statement was pinned to the row's own `id`, never to
      `provider`, so it could not reach another member. Verified afterwards: the
      Google account reads `google,google,google,google,google,line` and the LINE
      account reads null.
    - >-
      A DUMP WAS TAKEN BEFORE ANYTHING WAS WRITTEN, kept outside the repository by
      the owner. It was needed by design, because the test's second step deletes
      the row; had the re-link failed, that dump was the only way back.

  not_completed:
    - >-
      GOOGLE LINKING HAS STILL NEVER BEEN ATTEMPTED, in any environment. Its
      RS256/JWKS branch is now exercised by a test against a key set this repo
      serves, but no real Google round trip has happened.
    - >-
      iOS IS STILL UNTOUCHED. The webview proven here is Android. The iOS
      app-switch that `disable_ios_auto_login=true` exists to prevent is the
      specific hazard, and an Android pass is not evidence about it.
    - >-
      SLICE 3 IS NOT ACCEPTED BY THIS RECORD. The condition revision 0.4 added is
      met and the evidence is here; accepting the slice is the owner's word, as it
      was for slice 1.
    - >-
      The merge that produced this state exists as one hand-run SQL statement, not
      as a feature. No member can do this for themselves. That is slice 4, and it
      is still unauthorized.

  evidence_of_limits:
    - >-
      One member, one direction, one provider, one device. The linking path is
      proven to work; nothing here says how it behaves for a member whose losing
      account holds payments, whose provider rows number more than one, or who is
      on iOS.
    - >-
      The screen-level confirmations are the owner's own observation. The log
      proves the route answered `linked=line` and that the callback came from the
      LINE app; it does not prove what the screen rendered afterwards.

a_finding_that_narrows_dod_4:
  what: >-
    The owner's Google account holds FIVE `user_provider` rows spelling google,
    not one. The first query hid this because it used string_agg(DISTINCT ...);
    the verification query without DISTINCT showed
    `google,google,google,google,google,line`.
  why_it_matters_now: >-
    DoD 4, written hours earlier, says the merge shows "exactly one
    `user_provider` row changing `user_id`". That is true of this member's LINE
    side and false in general: a member whose losing account holds several rows of
    one provider needs all of them moved, or the account keeps a live credential
    after the merge claims to have taken it. The clause should read "every provider
    row of the losing account, and nothing else". Not yet edited into PLAN.md.
  and_it_changes_what_unlink_means: >-
    `deleteProviderRows` is scoped by `(user_id, provider)` rather than by row id -
    correct, because a row id arriving near a request must not delete another
    member's credential. But it means one press of "ถอดบัญชี" on Google would
    delete all five rows at once. Unlinking LINE was safe for exactly the reason
    the code checks: `others` held `google`, so the last-method guard passed, and
    only the single line row was deleted.
  the_likely_cause_and_why_it_is_worth_chasing: >-
    Not established. The shape is consistent with the legacy path writing a new
    row whenever the Google subject changed, which is the same root as the 1,443
    members holding no usable Google row. If that is what these five are, the owner
    is himself a member of the set the flip would hand a new empty account. A
    read-only query over `length(id_token)` on those rows would settle it and was
    handed to him; its result is not in.

