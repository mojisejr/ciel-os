outcome:
  status: recorded
  parallelism: approved
  slice: "3"
  completed:
    - >-
      GOOGLE LINKED, and it is the last thing slice 3 was waiting on. The callback
      answered "Location: /v2/settings/connected?linked=google", and its query
      carried iss=https://accounts.google.com with Google's real scopes - so
      Google's RS256 path and its published key set were exercised against Google
      itself for the first time. Until today that branch had never executed
      anywhere: its only test was an HS256 token, which jose rejects on the
      algorithm header before it resolves a key.
    - >-
      BOTH DIRECTIONS NOW WORK AGAINST REAL PROVIDERS. DoD 3's own sentence -
      "Google-to-LINE and LINE-to-Google linking work" - is satisfied in full.
      Google-to-LINE was proven at 07:00 ICT inside the LINE in-app browser on
      Android; LINE-to-Google was proven in an ordinary browser, which is required
      rather than incidental: linking Google inside the LINE webview is refused by
      design under owner decision 7.
    - >-
      THE SEQUENCE PROVED FOUR MECHANISMS IN ONE PASS, three of them for free.
      Unlinking Google removed all five of its rows and left LINE as the only
      method, and the screen then rendered LINE as an un-unlinkable badge - the
      last-method rule, proven at the surface rather than in a fixture. Re-linking
      Google produced one fresh row. And a bare call to the callback with no query
      at all answered link_error=state_missing, so that refusal is now proven
      against a real request rather than only a test.
    - >-
      THE OWNER HAD TO ADD THE REDIRECT URI TO GOOGLE FIRST, and noticed it
      himself before pressing the button. Worth recording because the failure it
      would have caused - redirect_uri_mismatch - looks like a code fault and is
      not one. The new URI is NEXTAUTH_URL + /api/auth/link/callback/google, which
      is a DIFFERENT path from NextAuth's own
      /api/auth/callback/google; both must exist or sign-in breaks.
    - >-
      A NOTE ON WHERE THE CONFIGURATION TRUTH LIVES. The staging value was read
      from the running container, not from the checked-out copies, because the two
      copies in .assets disagree with each other and with reality - one says
      localhost:3000, the other a production hostname. For a value that must match
      character for character, the running process is the only source worth
      trusting.

  not_completed:
    - >-
      iOS HAS NEVER BEEN EXERCISED. Every webview pass has been Android. The iOS
      app-switch that disable_ios_auto_login=true exists to prevent is the specific
      hazard, and an Android pass says nothing about it. This is the teammate's
      pass before merge, already agreed.
    - >-
      COLLISION AT PRODUCTION SCALE. Proven against one real pair today; only the
      flip reaches the population.
    - >-
      member_missing is unreachable without deleting a member row. Deliberately not
      attempted; the case is not worth the risk.
    - >-
      The merge that made all of this possible is one hand-run SQL statement. No
      member can do it. That is slice 4, still unauthorized.

an_observation_the_owner_made:
  what: >-
    The profile avatar follows whichever provider was used to sign in. Sign in
    with LINE and it is the LINE picture; sign in with Google and it is the Google
    one. The owner decided it is not worth fixing now and asked for it to be
    written down.
  why_it_happens: >-
    Slice 1 closed the avatar gap by refreshing user.picture_url from the
    provider's own CDN on EVERY login, for every provider (commit 03c5dc1). That
    was correct when a member had exactly one way in. Slice 3 has just made two
    ways in normal, so the same rule now rewrites the picture on each sign-in and
    it flips.
  why_it_is_worth_keeping: >-
    It is the first behaviour found where a slice-1 decision only becomes visible
    because slice 3 succeeded. Nothing is broken and no data is lost - the rule is
    doing exactly what it was written to do. But it is a preview of the class of
    question slice 4 will raise repeatedly: when one member has two providers,
    which one supplies the member's face, name, and email. Deciding it per-field
    is a design conversation, not a defect report.
  not_acted_on: No code change, no plan change. Recorded at the owner's instruction.

