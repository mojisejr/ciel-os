for_a_cold_session:
  what_this_lane_is: >-
    MuMate members had one account per provider. This lane gives each member one
    internal identity that can carry both Google and LINE, and moves
    register-login from the backend into mootech-fe behind an unflipped seam.
  where_it_stands: >-
    Slices 1 and 2 accepted and applied. Slice 3 complete as of this record -
    every acceptance item met except the ones named above. Slice 4 (the member
    merges their own two accounts) and 4b (stop creating the second account) are
    planned in revision 0.4 and NOT authorized; each needs its own decision event.
    Slice 5, the flip, waits behind both under owner decision 10.
  the_single_most_important_fact: >-
    constants/api/endpoint.ts is still absent from this branch's diff. Everything
    built here is DARK - no existing route changed behaviour and no real member has
    ever touched it. Check that before believing anything else.
  read_these_in_order:
    - This record.
    - 20260925T060135_..._plan_0_4_merge_is_the_goal.yaml - the four decisions that reshaped the plan.
    - 20260925T100736_..._fe_wedged_on_one_db_connection.yaml - a fault that will arrive with the infra move.
    - workstreams/mumate-login-identity-001/PLAN.md at revision 0.4.
  hard_won_lessons_do_not_relearn_them:
    - >-
      LINE's web login signs its id_token with HS256 against the channel secret.
      The ES256 keys it publishes belong to the LIFF/SDK flow. Reaching for them
      cost a day.
    - >-
      A `type: decision` event with `outcome.status: recorded` authorizes NOTHING
      and reports no error. It must say `decided`. Two events in this lane had it
      wrong.
    - >-
      Three defects in two days were found by a person, none by a gate, and two of
      the gates had been cited as evidence they were not: 2,945 specs green over a
      verifier no test executed, and twelve real-Postgres proofs behind a variable
      nobody exports.
    - >-
      The shadow and production share one database. Every staging login is a real
      account event.

