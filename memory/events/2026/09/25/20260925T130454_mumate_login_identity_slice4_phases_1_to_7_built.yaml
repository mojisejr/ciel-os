outcome:
  # Not terminal scope - names slice 4 of a plan whose last declared slice is 5 - so
  # `recorded` raises no warning, on the reading of read.ts:510-512 and 561-587 that
  # aa54c29 states.
  status: recorded
  parallelism: approved
  slice: "4"
  completed:
    - >-
      PHASES 1 TO 7 ARE BUILT AND COMMITTED at mootech-fe 39862db, 16 files,
      +2,648/-22: the survivor rule, the merge, the signed offer, two routes, the
      screen, and 73 new assertions. The owner granted a long run with permission to
      read production, write where safe, push with --no-verify and manage staging.
      NONE were used, because no phase needed them. Recorded rather than left as an
      absence.
    - >-
      THE RULE IS STATED AS A RULE ABOUT THE LOSER, which is the only form that can be
      code. Owner decision 8 says a paying account may never lose; inverted, the losing
      side must be one we KNOW has not paid. lib/v2/subscription.ts answers true, false
      or null and null fails closed, so only `false` is knowledge - and a pair where
      neither side is `false` is refused to support rather than guessed. The verdict is
      injected and never re-derived, because a second copy of that rule is the defect
      #369 B2 closed.
    - >-
      A DESIGN DECISION THE PLAN DID NOT ANTICIPATE, FOUND BY WALKING THE MIRROR
      DIRECTION. When the SIGNED-IN account is the side that may lose, the credential
      that moves is its own, not the one just proven. And the rule refuses unless the
      losing side holds exactly one working identity, because DoD 4 promises both
      "exactly one row moves" and "the losing account is left with no login method",
      and those contradict each other otherwise. Refusing is the only outcome that
      keeps both, so it is a consequence of the DoD rather than an amendment to it.
    - >-
      A PROPERTY OF THE EXISTING CODE THAT MAKES THAT DIRECTION SAFE, checked rather
      than hoped for. lib/v2/resolve-user.ts resolves a member by (id_token, provider)
      against user_provider, so once the row moves the SAME session resolves to the
      surviving account on its very next request. A member whose own account loses its
      credential is not logged out and needs no new sign-in. The screen says so,
      because a member who believes they have been logged out abandons the flow
      half-done.
    - >-
      THE DISCLOSURE SLICE 3 REFUSES IS MADE HERE, with the reason written at the line
      that makes it. Slice 3 answers a collision neutrally so it cannot reveal that an
      identity belongs to a member of this service. An offer necessarily reveals it,
      and is safe only because reaching that line means one person, in one session,
      holds both a signed session for one account and a fresh provider attestation for
      the other. An offer made before the exchange would be an enumeration oracle.
    - >-
      THE OFFER TRAVELS AS A SIGNED HttpOnly COOKIE AND NEVER IN A URL - a subject in a
      query string lands in browser history, in any access log in front of the app and
      in a Referer header. merge-ticket.ts is link-state.ts's pattern almost line for
      line, PLUS a domain prefix in the signed string: both sign with LINK_STATE_SECRET
      and without it a value minted by one could be presented to the other. A test
      proves a real link-state cookie cannot satisfy the merge verifier.
    - >-
      THE TICKET IS NOT AUTHORITY FOR THE DIRECTION. It proves which subject and which
      session; confirm recomputes the survivor inside the transaction that writes, so a
      payment landing while the member reads cannot leave a payer as the loser.
      planIdentityMerge and mergeIdentity share ONE decision function, so the
      description and the action cannot disagree.
    - >-
      THE LIVENESS INFERENCE READS LENGTHS, NEVER TOKENS, and is polarised so it can
      only refuse more. The adapter selects length(id_token), so a `ya29` access token
      stored as an identity never reaches application memory or an error trace. The
      predicate answers "known dead" - Google, longer than 32, revision 0.3's own
      threshold - so an unfamiliar shape counts as LIVE. That polarity is why it may be
      used here while lib/auth/link-account.ts's recorded KNOWN LIMIT declines to use
      the same inference as an unlink guard: there a false positive denies a member an
      action, here it only hands the pair to support.
    - >-
      THE TRAIL NEEDED NO MIGRATION. ops_audit_log from 0022 already carries action,
      target_user_id and a jsonb payload, indexed on (target_user_id, created_at). The
      payload holds the row id, the previous user_id and the one statement that
      reverses the move, and NO subject, because ops can read that table.
    - >-
      THE TEETH WERE FIRED RATHER THAN CLAIMED. M1 merge on the first press - 4 specs
      fail. M2 let a null verdict lose - 3 fail. M3 take the subject from the request
      body - 1 fail. M4 ignore the loser's identity count - 1 fail. Each mutation was
      applied to the real file, run, and reverted.
    - >-
      ONE OF THESE TESTS FIRST PASSED FOR THE WRONG REASON, which is this round's theme
      arriving in my own work. The fake resolver read `opts.paid[userId] ?? false`, and
      `??` treats null as nullish - so it converted the undeterminable verdict into a
      known-free one and erased the exact distinction half those cases exist to prove.
      Fixed and commented in place.

  not_completed:
    - >-
      NOTHING HAS RUN AGAINST THE SHADOW. Every assertion is against a fake transaction
      or a mocked route. The advisory lock, the UPDATE, the ops_audit_log insert and
      the real unique index have not been exercised together even once.
    - >-
      NO DATABASE-BACKED TEST WAS ADDED. Slice 3 has one, scripts/link-account-db.test.ts,
      behind TEST_DATABASE_URL, and slice 4 should have its mirror before the shadow
      walk. Named here rather than left as a gap someone finds later.
    - >-
      THE LAPSED-PAYER QUESTION IS STILL OPEN AND IS NOW BUILT IN. The default is the
      narrow reading - protected is isPaid true or null, so an expired subscription may
      lose. The predicate is injected and a test proves a wider one reverses the
      outcome with no other change, so answering it later costs one line. It must be
      answered before a real member walks the flow.
    - >-
      iOS, and the whole Connected Accounts surface on a real device, remain
      unexercised as they were at the end of slice 3.

