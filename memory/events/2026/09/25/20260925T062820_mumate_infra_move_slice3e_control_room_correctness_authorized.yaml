  objective: >-
    Authorize slice 3e, a narrow control-room correctness step that closes four
    items already sitting in this lane's unresolved list. Three are repository
    or host corrections that no other lane can make because they live in
    mumate-infra; the fourth is a proof that has been accumulating on its own
    since 2026-09-24 and only needs reading. None of them touches the shadow's
    FE slot, which the login lane holds.

outcome:
  status: decided
  parallelism: approved
  decision: >-
    On 2026-09-25 morning the owner granted this session full authority over
    the server and the infrastructure repository for four named items and no
    others, with the explicit instruction that they need no further agreement
    with any lane because none of them collides. He named them A, B, C and D
    after the parallelism table this session put to him, and he excluded the
    two that do collide: the Caddy/Node keep-alive fix, which recreates the
    login lane's FE container and therefore needs a minute of that lane's
    agreement, and the remaining 3c smoke, which needs the FE slot back on the
    launch team's revision. Those two stay out of this slice.

    A. mumate-infra env/fe.env.example does not list LINK_STATE_SECRET. The
    login lane introduced that variable and the FE link routes fail closed
    without it; the owner placed the value on the host on 2026-09-24 and the
    flow now works, but because the example file omits it, any future host
    rebuild omits the key again while the example file still looks correct.
    Verified by this session on both sides: zero matches in the example file,
    one match in the host's env/fe.env.

    B. wait_healthy() in mumate-infra bin/_lib.sh queries
    `compose ps --status running --status restarting --status exited` and then
    treats any line matching "Exit"/"exited" as ill health, so it cannot return
    success while anything in the project is exited. On 2026-09-24 a throwaway
    pgtmp container left exited since 09-22 made a correct deploy declare
    failure, roll back, and then declare the rollback unhealthy, with a red
    Discord alert - three false verdicts in a row. The workaround was to delete
    the stale container. The defect is the real target here, because a habit of
    tidying up is not a guarantee and the same function will run the slice-4
    flip under a two-hour clock with real users waiting.

    C. The host's /opt/mumate is at 768c71a while mumate-infra origin/main is at
    0025d5a, so runbooks/03 on the host - the file that carries the three
    emergency doors - is behind what the repository says. Anyone reading the
    doors on the host today reads the older text.

    D. DoD 3c item 9, no duplicate reminder, reconciliation or daily Bazi job,
    needs one overnight of shadow logs. That overnight has passed with be and
    bazi untouched since 2026-09-24, so the evidence exists and this slice reads
    and records it rather than arranging anything.
  authority: >-
    Owner, in session, 2026-09-25 morning. The grant is scoped to these four
    items and to commands this session is confident in; it is not a standing
    grant over the infrastructure or the server.

