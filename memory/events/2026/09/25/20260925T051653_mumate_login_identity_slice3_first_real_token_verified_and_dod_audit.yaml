outcome:
  status: recorded
  parallelism: approved
  slice: "3"
  completed:
    - >-
      FIRST REAL LINE TOKEN EVER VERIFIED. At 2026-09-24T21:55:25Z (2026-09-25
      04:55 ICT) the callback returned
      "Location: /v2/settings/connected?link_error=owned_by_another". That reason
      is reachable only after state, PKCE, the code exchange, the HS256 signature,
      issuer, audience, expiry, nonce and subject extraction have ALL succeeded.
      The HS256 repair in "3984e09" is therefore proven against a real provider,
      which no test in the tree could do.
    - >-
      THE COLLISION PATH RAN AGAINST REAL PRODUCTION DATA, also a first. The
      earlier slice-3 record listed exactly this as unexercised: the recovery and
      refusal paths had met a real index but never production's own rows. The
      identity was found to belong to another member and NOTHING was written.
    - >-
      THE OWNER CONFIRMED THE CAUSE HIMSELF. He holds two separate member
      accounts - the Google one he was signed into (user_id b54b765a-..., 2
      charts, 1 payment, providers "google" only) and a second account created by
      logging in with LINE under a Thai display name. He verified by signing in
      with LINE and landing in a different account. The refusal was correct.
    - >-
      A HYPOTHESIS TESTED AND REJECTED. The owner asked whether a partial write
      from the two earlier failed attempts had created the row. It had not, and
      the reason is structural: a row written for HIM would sit under HIS user_id
      and produce "already-linked", not "owned-by-another"
      (lib/auth/link-account.ts:111-113). Both earlier attempts also stopped before
      the write - the first never reached the callback, the second failed
      verification, which precedes linkProvider.
    - >-
      THE COLLISION LOGIC WAS AUDITED RATHER THAN TRUSTED, because a false
      collision would look identical from outside. findIdentityOwner scopes by
      provider - "WHERE id_token = $1 AND lower(provider) = lower($2)"
      (lib/auth/link-account-store.ts:37) - and sameId compares trimmed and
      lower-cased on both sides (lib/auth/link-account.ts:86-88). A false positive
      is not reachable.
    - >-
      A.6's Secure attribute is satisfied in the DEPLOYED environment, established
      by reading the host rather than a test: the fe container reports
      NODE_ENV=production, and start/[provider].ts:34,86 sets secure: !isDev from
      exactly that value. It remains unprovable in the test lane, where NODE_ENV
      is "test" and the route correctly omits Secure.

  not_completed:
    - >-
      SLICE 3 IS NOT COMPLETE. The happy path has never happened. No successful
      link exists in any environment, so DoD 3's own sentence - "Google-to-LINE and
      LINE-to-Google linking work" - is unmet.
    - >-
      NEITHER ATTEMPT WAS ON A PHONE. The User-Agent for both 19:49 and 04:55 is
