      SameSite and disable_ios_auto_login exist for, and the one that took every
      provider's login down on 2026-09-22 - has still never been exercised.
    - Google linking has never been attempted in any environment.

the_dod_audit:
  method: >-
    Audited by a separate agent against the working tree at "49097ff", reading
    each spec rather than trusting this session's account of them, and running the
    link specs both with and without the real-database gate.
  proven_by_test:
    - Tampered state, altered by one byte, refused - real HMAC re-derived independently.
    - Missing or mismatched nonce refused; the nonce check is the module's own code, so injecting a verifier does not hollow it out.
    - LINE's wrong aud, wrong iss and expired exp refused, against locally minted real tokens.
    - Unlink of a non-last method succeeds and of the last method is refused, counted by rows.
    - A collision writes nothing, proven by snapshotting rows and counting inserts and deletes rather than reading a response body.
    - The state cookie is HttpOnly and SameSite=Lax, read from the route's own Set-Cookie header.
    - ConnectedScreen renders a SECOND linked provider as linked - two linked rows, asserted on both.
    - All ten link specs are registered in vitest.config.mts.
  proven_only_around_the_mechanism:
    - >-
      The refusal of a request carrying only cookie-mumate-id. The start-route
      spec mocks BOTH resolvers and never sends a forged cookie; it asserts which
      mock was called. resolveSignedSessionUserId (lib/v2/resolve-user.ts:123) -
      the function that actually decides this, and the one plan item 3 was written
      about - HAS NO TEST OF ITS OWN. This is the security-critical item of the
      slice and its evidence is the weakest.
    - >-
      Every route-level collision and unlink assertion mocks linkProvider or
      unlinkProvider wholesale, so those are fixtures about wiring, not about the
      rule.
    - >-
      readMemberProviders (lib/auth/link-account-store.ts:123), the SQL behind the
      connections read, is mocked in every test and has never run against Postgres
      - not even inside the database gate.
  a_gate_nobody_runs:
    what: >-
      The twelve real-Postgres specs in scripts/link-account-db.test.ts sit behind
      describe.skipIf(!TEST_DATABASE_URL) at :50. That variable is unset by
      default, is in no CI or hook configuration, and .githooks/pre-push:126-133
      only WARNS about skips rather than failing.
    why_it_matters: >-
      Every "12 real-Postgres proofs" claim in this lane's earlier records is true
      only of a lane that runs when a human remembers to export a variable. The
      default suite - the one that gates a push - skipped all twelve. They were
      re-run under the gate during this audit and all twelve passed, so the claim
      is sound; the GATE is not.
  replay_is_weaker_than_the_dod_implies:
    what: >-
      There is no single-use record for a state value. Replay is prevented by
      clearing the cookie on every exit and by the ten-minute TTL; within that TTL
      a re-presented cookie and state would still verify, because link-state.ts is
      stateless-signed. The real backstop is the provider's one-shot code, which no
      test covers.
    not_acted_on: Recorded as a limit of the current design, not a defect to fix inside this slice.
  items_the_plan_states_in_a_way_that_cannot_be_satisfied:
    - >-
      A.1 names the start route for its "no row is written" clause, but the start
      route writes no rows under any outcome - the write is in the callback, which
      takes identity from the signed state and calls no resolver at all.
    - >-
      A.6 asks for Secure to be asserted by reading Set-Cookie, which the test lane
      can never show, because NODE_ENV is "test" there and the route correctly
      omits it. Provable only in a deployed response or by restating the item.
    - >-
      A.7's premise - "this fails today because connectivity is decided by
      string-equality against the session provider" - is now obsolete; the screen
      reads /api/auth/link/connections.
    - >-
      A.8 says the drift test enforces registration. It enforces it directly only
      for .test.tsx; the nine .test.ts link specs are caught by a different rule in
      the same guard. The outcome holds, the stated mechanism does not.

a_population_the_plan_never_considered:
  what: >-
    Members who hold LINE and Google as two SEPARATE, legitimate accounts. Every
    one of them who tries to link will be refused with owned_by_another, exactly
    as the owner was.
  it_is_not_in_the_plan: >-
    Searching PLAN.md for this case returns nothing. Slice 2 measured and cleaned
    COLLISIONS - one identity claimed by two members, a data defect, 20 cases. This
    is a different thing: two valid accounts belonging to one human, which is not a
    defect and which slice 2 neither counted nor touched.
  and_its_volume_cannot_be_predicted: >-
    There is no way to know which LINE account and which Google account belong to
    the same person. LINE carries no email here, and owner decision 2 forbids
    joining by email even where one exists. So the manual-support volume owner
    decision 5 said it would revisit is not measurable in advance - it can only be
    observed as members try to link. What IS measurable is the upper bound: how
    many members hold only one provider.
  why_it_matters_now: >-
    It changes what slice 4 is for. Slice 4 was written around recovering from bad
    data. Its real first customer is a member with two good accounts who wants them
    joined - and the owner is that member.

