outcome:
  status: recorded
  parallelism: approved
  slice: "4"
  completed:
    - >-
      The LINE start route answered 302 promptly. The subsequent callback reached
      Caddy, but the upstream gave no response for 44.979 seconds and Caddy returned
      HTTP 504. A later browser delivery of the same callback returned promptly to
      Connected Accounts with token-exchange-failed; OAuth values were not recorded.
    - >-
      During and after the callback failure, the shadow FE health route answered HTTP
      503 after its own five-second database deadline. The Connected Accounts page's
      read-only /api/profile and /api/auth/link/connections requests each then timed
      out at Caddy after about 79 seconds. This explains the owner's visible
      "โหลดข้อมูลไม่สำเร็จ" state.
    - >-
      Aggregate read-only database evidence over the attempt window found no LINE
      provider creation and no provider identity move, and zero member_identity_merge
      audit records. The one provider update in that window was Google and preceded
      the LINE start; no account merge or LINE relink occurred.
    - >-
      The active shadow FE was image 08285cca7f69ffa28d32eb8c8b6388811d161dda-staging.
      It remained a running container, but its health checks repeatedly exceeded five
      seconds. Compose uses restart unless-stopped, which does not recreate a running
      but unhealthy container.
    - >-
      Source and runtime evidence align with the previously recorded recovery gap:
      the application singleton uses one postgres client with max 1. idle_timeout 30
      can recycle an idle connection but cannot free a query already stuck in its
      queue. The health route detects this and reports 503, but detection does not
      repair the client.
  not_completed:
    - >-
      The exact first stalled operation is unknown. The callback lacks safe stage
      timing around token exchange, provider verification, identity lookup, and merge
      planning, so this record does not claim which await held the client.
    - >-
      The database-client recovery gap remains unfixed. The owner did not authorize
      an FE recreate, a retry, code change, infrastructure change, or deployment in
      this investigation.
    - >-
      Slice 4 shadow acceptance remains unproven. This incident is evidence against
      a blind retry, not evidence that the collision flow has passed.

