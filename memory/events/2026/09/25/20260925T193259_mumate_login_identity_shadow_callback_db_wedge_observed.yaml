unresolved:
  - >-
    The first stalled await needs safe stage telemetry. It may be the unbounded LINE
    token fetch, a database request, or merge-plan reads; existing evidence cannot
    distinguish them.
  - >-
    A request deadline alone is insufficient: racing an HTTP response against a
    database promise leaves the losing database promise queued and cannot recover the
    max-1 client.
  - >-
    Do not raise the database max without measuring the shared transaction pooler, and
    do not apply postgres.js query cancel as a blanket cure: its own documentation
    warns that its cancellation connection can race and cancel another query.
  - >-
    The prior callback attempt was also interrupted by an FE recreate. This record
    does not establish who initiated that separate recreate because retained runtime
    evidence did not identify an initiator.

