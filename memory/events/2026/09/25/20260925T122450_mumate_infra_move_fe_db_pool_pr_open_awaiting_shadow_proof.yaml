      --no-verify, so the owner ran the push. Same wall as the pull-request
      merge in slice 3e; the efficient response is to hand him the line.
    - >-
      One defect in this session's OWN fix was caught by the new test rather
      than by review: the probe budget was read at module scope, so setting the
      variable later did nothing and did so silently. The test measured 5005 ms
      against its own 120 ms budget while the source looked correct. That is the
      same shape of quiet trap the repair exists to remove, and it is the second
      time today a test designed to fail earned its place.

