  evidence_of_limits:
    - >-
      WHY max IS STILL 1, now with the numbers rather than for want of them.
      max spends the CLIENT-side ceiling, which is the 200, not the 15; in
      transaction mode the front connections multiplex onto the pooler's 15 back
      connections. The same code runs in two deployment shapes: a fixed set of
      containers on DigitalOcean, where max 5 would be trivially safe, and
      Vercel serverless with an UNBOUNDED instance count, where 50 concurrent
      instances at max 5 would want 250 client connections and be refused at
      peak. So max is not a number to choose but a decision that depends on the
      deployment shape - and that shape is exactly what slice 4 changes.
      Raising it belongs after the flip, not before.
    - >-
      The observed fault was never max's doing anyway. Zero established sockets
      with an empty log is the signature of a missing idle_timeout - we never
      closed an idle connection, so the pooler could drop one on its own
      schedule while the driver queued against a handle that would never
      dispatch. max 1 causes slowness under load, which is a different complaint
      and can wait.
    - >-
