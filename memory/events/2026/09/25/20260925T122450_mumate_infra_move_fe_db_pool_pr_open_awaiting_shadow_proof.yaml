  owner_sequence_2026_09_25: >-
    The owner chose the order at the pause: the login lane finishes its current
    work first; then this lane builds an image from its branch, proves the
    repair on the shadow, and merges pull request 814; then the login lane
    merges after that. This session stands by until he says so. He was offered
