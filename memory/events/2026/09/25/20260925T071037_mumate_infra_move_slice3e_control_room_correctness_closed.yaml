outcome:
  status: recorded
  completed:
    - >-
      THE DEPLOY TOOL NO LONGER FAILS ON CONTAINERS IT WAS NEVER DEPLOYING.
      wait_healthy in bin/_lib.sh used to run
      `ps --status running --status restarting --status exited` and set bad=1
      on any line matching "Exit"/"exited" - it asked compose for exited
      containers and then treated their presence as proof of ill health, so it
      could not succeed while anything in the project was exited. It now fixes
      its responsibility once on entry (the services the active --profile
      enables, plus any service already running) and judges each service on its
      own State and Health fields, with an empty Health meaning "declares no
      healthcheck" rather than "failed". Fixing the set on entry is what keeps a
      service that exits DURING the wait counted instead of dropping out of the
      expectations.
    - >-
      PROVEN AGAINST REAL CONTAINERS ON mumate-2, old and new side by side, four
      tests. (1) Clean state - old passes, new passes. (2) A real container
      created in the project and allowed to exit, reproducing the 2026-09-24
      incident - OLD FAILS, NEW PASSES. (3) --profile restore-verify, whose
      pgtmp service is not running - NEW FAILS, so a genuinely missing service
      is still caught and the fix is not merely more permissive. (4) No profile
      arguments, the path bin/rollback.sh uses - new passes. The test container
      was removed and `docker compose ps --status exited` is empty again. Test
      3 is the one that matters: without it this would be a fix that works by
      lowering the bar.
    - >-
      env/fe.env.example now lists LINK_STATE_SECRET with the two facts a reader
      needs - it is read at runtime through process.env, not NEXT_PUBLIC and not
      a build arg, so it can be placed or rotated without rebuilding an image;
      and an empty value stops account linking (302 link_unavailable) rather
      than degrading it. Verified on origin/main and on the host.
    - >-
      The host's /opt/mumate is at 4664974 and identical to mumate-infra
      origin/main, so runbooks/03 and its three emergency doors on the machine
      an operator actually reads them from are no longer behind the repository.
      The 768c71a → 0025d5a step was diffed before pulling and touched only four
      documentation files - no compose, script, Caddyfile or env change - and no
      container was restarted by either pull.
    - >-
      DOD 3C ITEM 9 IS PROVEN. One overnight of shadow logs with be and bazi
      untouched since 2026-09-24 shows no duplicate reminder, reconciliation or
      daily Bazi job. be carries exactly two CronjobService lines in 24 hours
      and both are refusals - "Free morning notification disabled
      (MORNING_CRON_ENABLED != true) — skipping" at 02:00 and "Morning
      notification disabled ... skipping" at 23:00. fe has zero lines matching
      cron, reconcile, qstash or scheduled, consistent with QSTASH_TOKEN being
      absent from the shadow. bazi has zero scheduled-work lines at all. The
      be evidence is stronger than silence would have been: a silent log cannot
      distinguish "the scheduler is disabled" from "the scheduler was never
      there", while a scheduler that wakes, announces that it is disabled, and
      declines proves both that the job exists and that the shadow does not run
      it.
  not_completed:
    - The keep-alive/502 fix. Excluded by the owner; the login lane will keep meeting the 502 until it is scheduled.
    - 3c's storage and maintenance-bypass proofs. Still deferred, still needing the FE slot on 7e22f54-staging.
  evidence_of_limits:
    - >-
      THE AGENT COULD NOT MERGE ITS OWN PULL REQUEST. The owner granted
      authority over the server and this repository for these four items, and
      the harness classifier refused `gh pr merge` anyway with "Merge Without
      Review". That is a harness rule, not a CIEL one, and it is not something
      an owner grant inside the session can lift. The agent stopped, handed the
      owner one pasteable line, and he merged. Worth recording because the same
      wall will appear in every future slice that needs a merge, and the
      efficient response is to hand over the line rather than to retry.
    - >-
      bin/rollback.sh passes no profile arguments, so after this change it waits
      on the core services plus whatever is running rather than on a named
      profile set. That is the same scope it effectively had before and no worse,
      but the underlying profile-blindness of rollback.sh is pre-existing,
      unchanged here, and worth its own look before slice 4 leans on it.
    - >-
      Test 3 proves the function still fails when an expected service is absent.
      It does not prove behaviour for a service that is running but reports
      unhealthy, which was not reproduced on a live stack because doing so would
      have meant breaking a service another lane is using. The code path is the
      same Health comparison, but it is inference, not a run.

