  what: >-
    Merging this lane's branch is a PRODUCTION RELEASE of a member-facing flow, not a
    dark deploy. This lane has repeatedly recorded "everything built here is dark"
    against one check - that constants/api/endpoint.ts is absent from the diff - and
    that check is true but narrower than the sentence it was used to support.
  measured_2026_09_25: >-
    Against the new origin/main f55cfc0, `git diff origin/main...HEAD --name-status`
    shows pages/v2/settings/connected.tsx is ALREADY ON MAIN, while every route the
    screen needs is ADDED by this branch: link/start, link/callback, link/unlink,
    link/connections, merge/preview, merge/confirm and register-login-fe, with
    ConnectedScreen.tsx modified.
  why_it_matters: >-
    The page is reachable on production today and simply cannot link, because the routes
    do not exist. The moment this branch merges, the routes exist and the screen works -
    linking, unlinking, and the slice-4 merge offer - for every real member, with
    nothing gating it. In this repository merging into main IS the production deploy.
  what_the_seam_actually_protects: >-
    constants/api/endpoint.ts gates the register-login FLIP: it keeps an EXISTING route's
    behaviour unchanged. It says nothing about NEW routes, which are live as soon as they
    are deployed.
  consequence_for_the_owner_s_sequence: >-
    The order recorded at 96c668a ends "then the login lane merges after that". Taken
    literally, production becomes the first place the merge flow ever runs. Phases 8b to
    8d - build an image from this branch, prove slice 4 on the shadow - must come BEFORE
    that merge, not after it.

