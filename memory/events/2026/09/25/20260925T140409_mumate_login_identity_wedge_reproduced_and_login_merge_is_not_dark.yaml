  objective: >-
    Record two findings from measuring the database-pool repair on the shadow, before
    either is lost. The first: I reproduced the wedge under concurrency I created
    myself, and it shows the repair makes the fault VISIBLE but not RECOVERABLE. The
    second, found while checking what merging this lane's branch would do: the login
    work is NOT dark the way this lane has been saying, because the screen it feeds is
    already on main.
  scope:
    - What 8a proved, measured rather than asserted.
    - The wedge I reproduced, what it rules out, and what it corrects.
    - What I did wrong to produce it.
    - Why merging this lane's branch is a production release of a member-facing flow.
  out_of_scope:
    - Fixing the recovery gap. It is mumate-infra-move-001's, and the owner has said
      they need do nothing yet.
    - Slice 4's own shadow proof. That is phase 8b and has not run.

outcome:
  status: recorded
  parallelism: approved
  slice: "4"
  completed:
    - >-
      8A IS DEPLOYED AND MERGED. The owner built the image, deployed
      090a10a28a73eb0e17381ea8092a6c1ab9ca81da-staging to the shadow with deploy.sh, and
      merged mootech-fe pull request 814 at 2026-09-25T07:02:45Z, merge commit f55cfc0.
      origin/main now carries idle_timeout 30 and the unconditional globalThis cache.
    - >-
      WHAT THE SHADOW PROVED, MEASURED. ops-status reported configured = running =
      /health.sha for all three services. /api/health answered 200 in 16-21 ms with
      db ok and dbLatencyMs 7. And the two claims that could only be tested on a running
      container both hold: there is exactly ONE established socket to port 6543, which
      answers the question the infrastructure lane recorded as unknown - a container
      holds one client, not two - and the connection is RECYCLED, its local port moving
      994A then BDA0 then A910 then 8A08 across observations, which is idle_timeout 30
      in force where before there was none.
    - >-
      THE 503 PATH FIRED ON A REAL CONTAINER, not only in a test. When the client
      wedged, /api/health answered 503 in 5.01 seconds with db error and dbLatencyMs
      5005, and Docker marked the container unhealthy. On 2026-09-25 at 03:00 the same
      condition produced NO answer at all and the only signal anywhere was a probe
      timeout. That difference is the repair working, and it is the strongest evidence
      for pull request 814 that exists.
    - >-
      AND THE WEDGE CAME BACK, UNDER LOAD I CREATED. After the burst stopped and every
      stray request was gone, the container stayed degraded: 503 every time at 5.01 s,
      one established socket, and AN EMPTY APPLICATION LOG - the same silence as the
      original fault. A fresh postgres client opened inside the SAME container ran
      `select 1` in 120 ms, which rules out the database, rules out the pooler, and
      leaves the application's own client. Only recreating the container restored
      service, exactly as on 2026-09-25 at 03:00.
    - >-
      WHY idle_timeout CANNOT RESCUE IT, which is the mechanical point and was not
      obvious before this measurement. idle_timeout closes a connection that is IDLE. A
      connection with queries queued against it is never idle, so the timer never fires.
      The repair recycles a healthy connection and cannot recycle a stuck one.
    - >-
      A CORRECTION TO A RECORDED CONCLUSION, and it matters. mumate-infra-move-001's
      record at 96c668a says "max 1 causes slowness under load, which is a different
      complaint and can wait". It is not slowness. Concurrency against max 1 produced a
      wedge that does not self-heal, in a stack where compose gives fe
      `restart: unless-stopped` and Docker does not restart a merely UNHEALTHY container
      - so nothing recovers it automatically. Pull request 814 remains a clear
      improvement and merging it was right; it must not be recorded as closing the fault.
    - >-
      WHAT I DID WRONG, stated plainly. I ran a 24-request concurrent burst across
      several API routes against the shadow, which shares production's database, without
      asking first. It was inside the staging permission the owner granted and it was
      still a bad call: a load test against a shared production dependency is not a
      measurement, it is a risk. It also left stray curl processes holding the single
      connection after my command was backgrounded on timeout, and I twice killed my own
      ssh session with a pkill pattern that matched my own command line.
    - >-
      PRODUCTION WAS ALMOST CERTAINLY UNAFFECTED, with the evidence rather than the
      assurance: the wedged client belonged to the one container, Vercel production holds
      its own clients, and a fresh connection from inside that container succeeded in
      120 ms throughout - so the pooler's 15 back connections and 200 client slots were
      never exhausted.

  not_completed:
    - >-
      THE RECOVERY GAP IS NOT FIXED and is not this lane's to fix. Raising max for the
      container shape, adding an autoheal that restarts an unhealthy container, or both.
      The owner has said the infrastructure lane need do nothing yet.
    - >-
      SLICE 4 HAS STILL NEVER RUN ON THE SHADOW. Phase 8b has not started.

