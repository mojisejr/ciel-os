  completed:
    - >-
      OWNER AUTHORIZED THIS STEP on 2026-09-25 after a two-round syncup, saying
      "เริ่มได้เลย". The work is FE-only, needs no host access and no deploy.
    - >-
      resolveSignedSessionUserId HAD NO TEST AT ALL, and it is the one function
      between a client-settable cookie and "attach my login to that member's
      account". The DoD item written about it was covered by a start-route spec
      that mocks BOTH resolvers and never sends a forged cookie, so it asserted
      which mock was called and nothing more.
    - >-
      THE PROOF IS A CONTRAST RATHER THAN AN ASSERTION IN ISOLATION. One request
      object, carrying a forged UUID in cookie-mumate-id and no session, goes
      through both resolvers: the lenient one accepts it - deliberately, #391 -
      and the strict one must refuse it AND must not query at all. A test that
      only checked the strict resolver could pass because the request was
      malformed in some unrelated way; this one cannot.
    - >-
      GOOGLE'S RS256/JWKS BRANCH HAD NEVER EXECUTED. Its only case was an HS256
      token, which jose rejects on the alg header before resolving a key, so
      createRemoteJWKSet, the fetch and the signature check - the code that runs
      in production for every Google link - had never run once. The new cases
      stand up a real HTTP server on loopback serving a real JWKS and point the
      provider's jwksUrl at it; jose is not mocked.
    - >-
      TWO TRAPS FOUND WHILE WRITING IT, both worth carrying. First, defaultVerify
      passes keySetFor(provider, jwksUrl) as an ARGUMENT, so the RemoteJWKSet is
      built and cached under the provider before jwtVerify runs - even for a token
      about to be rejected on its alg. Overriding the URL inside the Google
      describe left the cache holding one built from the real Google URL, and the
      first accept failed with "no applicable key found" ONLY when the whole file
      ran. Second, and this one was mine: the config assertions read the live
      ENDPOINTS, which this file overwrites, so setting Google's real jwksUrl to
      null left the whole file green. Configuration is now judged from values
      snapshotted at import; behaviour from the live object.
    - >-
      EVERY CASE WAS MUTATION-CHECKED, not trusted. Restoring the cookie fallback
      reddens the takeover test alone; dropping the provider check reddens the
      half-session test alone; jwksUrl to null reddens the two config tests;
      forcing the symmetric branch reddens the two Google accept tests. Each
      source file was restored and verified byte-identical afterwards.
    - >-
      COMMITTED as mootech-fe "d43d582", parent "49097ff", UNPUSHED. Two files,
      both tests - scripts/resolve-user.test.tsx, scripts/link-verify-default.test.ts.
      No source file changed.
    - >-
      GATES - 2,973 specs pass (2,961 before, plus 12), 183 skipped across 276
      files; tsc --noEmit exit 0 checked without a pipe; npm run lint exit 0 with
      0 errors and the same 135 pre-existing warnings; npm run build exit 0 with
      the VAPID gate line present.
    - >-
      THE REAL-POSTGRES LANE WAS RUN BY HAND and is reported as hand-run: 18 pass
      against localhost:5433 mumate_test with TEST_DATABASE_URL exported - 12 in
      link-account-db, 6 in register-login-fe-db. The default lane skips them.
    - >-
      A DEFECT IN THIS LANE'S OWN 0.4 DECISION EVENT, found and fixed in "676c90a".
      src/portfolio/read.ts:404-419 lets a decision authorize a plan only when its
      type is `decision` AND outcome.status is exactly `decided`. It was written
      with `recorded` - correct for the closeouts this lane produces, wrong here -
      so the machinery read past it and the lane sat at owner-confirmation-required
      with an approving decision beside the plan. Wake now reads lifecycle
      `authorized`, "Owner decision authorizes plan revision 0.4 slice 4".
    - >-
      AND IT WAS NOT A ONE-OFF. HQ scanned every `type: decision` event in the
      repository for `status: recorded` and found exactly one other, in THIS
      workstream: 20260923T163705_mumate_login_hq_relay_protocol_recorded.yaml,
      recorded by codex, carrying evidence.plan and plan_revision "0.2". It is
      shaped like a plan authorization and is inert for the same reason. It is
      harmless now - the plan is at 0.4, so decisionAuthorizesPlan rejects it on
      the revision test regardless of its status - and it is deliberately NOT
      edited. It is recorded because two instances in one lane make the pattern a
      habit rather than a slip, and because anyone rolling this lane back to 0.2
      expecting that decision to authorize would find it does not.

  not_completed:
    - >-
      THE REAL-POSTGRES GATE WAS NOT FIXED, on purpose. .githooks/pre-push warns
      about skips rather than failing, and the comment above it says why: most
