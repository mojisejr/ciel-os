    - No pull request. The body at .assets/mumate/slice3-pr-body.md now predates three commits.

  evidence_of_limits:
    - >-
      The fix is proven against a stubbed connections response, not against a real
      one. What the row shows after a genuine link is unexercised for the same
      reason everything else in this slice is: no round trip has happened.
    - >-
      Only the two linkable providers carry labels. A provider row stored under any
      other spelling would render its raw value; that cannot occur today because
      the endpoint summarises over LINKABLE, and it is noted rather than guarded.

a_pattern_worth_naming:
  what: >-
    Two defects in two days, both of the same shape: a surface asserting something
    it never read. ConnectedScreen decided "connected" by string-equality against
    the session provider; this row printed a constant. Both were found by a person
    looking at a screen, not by a gate.
  why_it_matters: >-
    Every automated check in this repository looks at code and data. Nothing checks
    whether what a screen SAYS is something it actually KNOWS. The membership row
    was the first instance, fixed in its own pass; the two found by this slice are
    the second and third. A fourth is likely wherever a value is rendered beside a
    label.
  not_acted_on: >-
    No sweep of the remaining rows was done. It is not in any slice's DoD and was
    not authorized; recorded so a later session knows the question was asked.

