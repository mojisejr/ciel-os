outcome:
  status: recorded
  parallelism: approved
  slice: "4"
  completed:
    - >-
      OWNER DECISION 11 (2026-09-25): A MEMBER WHO HAS EVER PAID IS PROTECTED, EVEN
      WITH A LAPSED SUBSCRIPTION. His words, in this session: "ผมคิดว่ามันก็เค้า เคสที่
      เทียบได้ว่า เค้าเคย sub แสดงว่าเคยจ่าย account นี้ก็ควรจะเป็น account หลัก" - he
      opened with "ไม่ต้องก็ได้" and then reasoned his way to the opposite, and asked me
      to confirm. I agreed and said why: the harm a merge does is not the loss of a
      subscription, it is losing access to the account that HOLDS the purchases, and a
      lapsed member's charts, QI and order history are still in there. This replaces the
      narrow assumption recorded in d5af896, which that record deliberately stated
      rather than buried so it could be replaced exactly like this.
    - >-
      IT IS BUILT AS ONE PREDICATE AND ONE NEW READ. defaultMayLose is now
      `isPaid === false && !everPaid`, and lib/v2/subscription.ts gains `hasEverPaid`:
      a member_subscription row whose tier_code would decide "paid" on its own - reusing
      that file's already-exported decidesWithoutLegacy rather than inventing a third
      rule, and deliberately NOT filtered by expire_at, since a lapsed PRO row is the
      exact case being protected - or a member_payment row of any date. It lives in the
      module that owns the subject of who has paid, because a private notion of "paid"
      inside the merge is the divergence #525 closed and #514 still tracks.
    - >-
      THE WIDER RULE COSTS THE COMMON CASE NOTHING, which is why agreeing with him was
      easy. An account that appeared by accident on a second provider has never paid, so
      it may still lose. What widens is the set of pairs handed to support: pairs where
      BOTH sides bought something, which deserve a person. The predicate stays injected
      and a test proves narrowing it again reverses the outcome with no other change.
    - >-
      PHASE 7B IS DONE AND PASSES: 8 specs against the real testenv Postgres on port
      5433, mirroring slice 3's scripts/link-account-db.test.ts deliberately. The
      advisory lock, the row-scoped UPDATE and the ops_audit_log insert execute in ONE
      transaction against a real unique index built under production's name. It proves
      what no fake could: that length(id_token) is selectable, that ops_audit_log
      accepts a ::jsonb cast of a stringified payload, that user.create_at exists under
      that name, that the reversal statement the audit row records actually reverses the
      move, and that the MIRROR direction works - the signed-in side's own credential
      moving when the other account is the one that paid.
    - >-
      WHY 7B WAS WORTH INSERTING, MEASURED RATHER THAN ARGUED. Mutant: rename a column
      in the audit insert to one that does not exist. The 49 fake-based assertions stay
      GREEN; only the database-backed file reddens, 3 of 8. That single measurement is
      the whole case for the file, and it is the reason I proposed inserting it before
      the shadow rather than after.
    - >-
      THE NEW FILE'S OWN FIXTURES FIRST TRIPPED THE RULE IT TESTS, and it is recorded in
      the file rather than quietly fixed. Five specs failed with `loser-holds-no-identity`
      because the fixtures were `slice4-proof-<uuid>` - 49 characters - and the liveness
      rule calls a Google row longer than 32 dead, which is the `ya29` class revision 0.3
      measured. The rule was right and the fixtures were wrong, which is the good
      direction for that mistake to point. The helpers now produce a 21-character Google
      identity and a 33-character LINE one, with the trap written down.
    - >-
      THE ARENA IS LEFT AS IT WAS FOUND. Zero leftover provider rows, zero leftover
      members, zero leftover audit rows, and the partial test index dropped - all four
      verified by query after the run.

  not_completed:
    - >-
      NOTHING HAS RUN AGAINST THE SHADOW, and that is phase 8. The connection here is
      direct; production reaches Supabase through the transaction pooler, so the pool
      behaviour this round has spent the day on is still unexercised by slice 4.
    - >-
      hasEverPaid's OWN SQL IS NOT EXERCISED against a database. It reads through the
      application's client, so the database-backed file fakes the standing resolver. The
      rule is proven in the pure suite and the query is an ordinary Drizzle select plus
      the already-covered resolveMembership, so this is named as the smallest remaining
      gap rather than left silent.
    - >-
      iOS, and the whole Connected Accounts surface on a real device, remain unexercised.

