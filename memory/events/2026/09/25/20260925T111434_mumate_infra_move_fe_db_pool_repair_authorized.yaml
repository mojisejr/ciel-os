outcome:
  status: decided
  parallelism: approved
  decision: >-
    The owner gave his go in this session on 2026-09-25 after declining to let
    a relayed go stand. PROVENANCE MATTERS HERE AND IS RECORDED DELIBERATELY:
    his first "go" was spoken in ciel-os-d9's session, observed by d9, reported
    to ciel-os-a3, and relayed to this session - three hops. This session
    refused to start on it, because the instruction it had heard directly from
    the owner was to stand by, and a peer relay is not the owner's approval
    however plausible its content. He then gave the go here, in his own turn,
    along with the two answers that were blocking: the repair takes its own
    branch provided the merge is safe, and the work proceeds without waiting on
    the other session, which is told when it is done.

    WHAT IS BEING REPAIRED, verified by this session against origin/main
    through the GitHub API so that no checkout another lane holds was touched,
    and confirmed independently of ciel-os-a3's own reading of the working
    tree. lib/db/index.ts line 11 constructs
    postgres(DATABASE_URL, { prepare: false, ssl: 'require', max: 1 }) and
    line 12 caches it on globalThis only when NODE_ENV !== 'production', so
    production gets no singleton at all. pages/api/health.ts lines 28-31 await
    db.execute(select 1) inside try/catch with no timeout, so a REJECTION
    reaches the 503 at line 34 but a HANG never does. scripts/health-route.test.ts
    line 17 fakes failure as Promise.reject(ECONNREFUSED) - it proves the one
    path the real fault did not take, while its line 4 header claims the bug
    class "a health endpoint that is green while the app cannot serve a single
    request". That is why the defect survived its own test.

    A FALSE EXPLANATION IS EXCLUDED ON PURPOSE. An earlier fault record said
    lib/db sets no idle_timeout, connect_timeout or max_lifetime. Only
    idle_timeout is genuinely absent: postgres.js 3.4.9 defaults connect_timeout
    to 30 s and max_lifetime to a randomised 30-60 minutes, and the code that
    appears to set all three to null is the driver's internal LISTEN connection,
    not its defaults. The container had been up five hours, so max_lifetime
    would have recycled a connection five to ten times; "nothing replaces a dead
    socket" is therefore not what happened and does not appear in this lane's
    reasoning. What survives is that max 1 serialises every database route
    through a single connection, and that connect_timeout bounds opening a
    socket and never a query already queued - so the failure mode is an
    unbounded silent wait with an empty log.
  order_of_repair: >-
    Singleton first, and this is not stylistic. The built module appears in TWO
    server chunks on the running shadow image - /app/.next/server/chunks/7864.js
    and 1752.js both construct a client, verified by this session inside the
    container - so a container may hold two clients, and raising max before the
    singleton is fixed spends an unknown multiple of the intended budget against
    a pooler shared with PRODUCTION. Then idle_timeout, which is the direct
    repair for the observed symptom: our side never closes idle connections, so
    the pooler can drop one silently while queries keep queueing against a
    handle that will never dispatch. Then bound the health route so a hang
    becomes a 503. Then write the test that was missing - db.execute mocked as
    a promise that NEVER SETTLES, asserting 503 inside a time budget; without it
    the repair has exactly the standing of the test it replaces.

    max IS DELIBERATELY NOT CHANGED IN THIS STEP. Choosing it needs two numbers
    that are not in the repository: the Supabase transaction pooler's configured
    pool size, which only the owner can read from the dashboard, and the real
    client count in a running container, which needs the FE slot. Raising it on
    a guess risks production's pool. prepare: false and ssl: 'require' MUST NOT
    CHANGE - prepare: false is required by the transaction pooler and removing
    it breaks every route at once.
  branch: >-
    A new branch cut from mootech-fe origin/main 9f764e6, not the login lane's
    feat/mumate-login-identity-s1. The owner's condition was that merging be
    safe, and it is, verified rather than assumed: the login branch's 21
    commits touch none of the three files
    (`git log origin/main..feat/mumate-login-identity-s1 -- <paths>` is empty)
    and the files are byte-identical on both branches, so there is no conflict
    surface in either direction and no newer starting material to give up. The
    branch choice therefore decides one thing only - whether this repair can
    ship or be reverted without the login lane's work - and that argument runs
    one way.

