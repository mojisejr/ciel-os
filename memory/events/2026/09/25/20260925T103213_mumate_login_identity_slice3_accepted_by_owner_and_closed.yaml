  not_completed:
    - >-
      WAKE REPORTS THIS LANE AS AUTHORIZED FOR SLICE 4, AND THE RECORD IT READS
      SAYS THREE TIMES THAT IT IS NOT. Found in this session while re-establishing
      state. `bun run wake` prints lifecycle detail "Owner decision authorizes plan
      revision 0.4 slice 4" against decision event 20260925T060135. That event's
      own body says "Slice 4 is NOT authorized to start by this record", "Slice 4
      needs its own owner decision event before any code is written", and lists
      "Any implementation. Nothing in slice 4 or 4b is built by this record" as out
      of scope. The cause is src/portfolio/read.ts:398-401: decisionAuthorizedSlice
      reads `evidence.slice` and treats naming a declared slice AS authorizing it.
      The event names slice 4 because slice 4 is what it redefines. There is no way
      in the current schema to record a decision ABOUT a slice without the
      machinery reading it as authorization OF that slice. The hazard is concrete:
      a cold session that trusts wake's one-line lifecycle - which this
      repository's contract tells it to run first - would begin writing the merge,
      which is the one thing the record forbids. NOT REPAIRED: this is the
      portfolio reader, not this lane's file, and it needs the owner's decision.
    - >-
      SLICE 4b CANNOT BE AUTHORIZED AS THE PLAN IS WRITTEN. PLAN.md declares it as
      heading "### 4b. Stop handing out the second account in the first place", but
      the reader's slice parser at src/portfolio/read.ts:156 is
      /^### (\d+)\.\s/gm, which requires a period straight after the digits and so
      does not match "4b.". declaredSlices is therefore 1, 2, 3, 4, 5 with no 4b,
      and read.ts:474-475 requires a decision's evidence.slice to be one of those.
      A slice-4b decision event would be a validation error rather than an
      authorization. Nobody has tried yet, so this has cost nothing so far; it
      would be found at the moment the owner tries to authorize 4b. NOT REPAIRED:
      the fix is a one-character plan heading change or a parser change, and which
      one is right is the owner's call, not this lane's.
