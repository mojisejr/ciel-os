      deliberately. lib/db/index.ts runs the whole application on `max: 1` with no
      idle_timeout, connect_timeout or max_lifetime, imported by 62 files of which
      36 are under pages/api, and its own header comment says it is for serverless
      API routes - the premise the container move removes. On Vercel a wedged
      connection dies with its short-lived instance; in a long-running container
      one connection serves the process for its whole life. Same code, failure mode
      only in the container, arriving WITH the move. The fault is silent: any
      health probe that fetches a page certifies the outage as healthy, so any
      probe for this stack must touch the database. It belongs to no lane's plan
      and the owner asked for it as its own conversation.
    - >-
      Slice 3's acceptance changes nothing about the keep-alive/502, which is still
      unscheduled because its fix recreates the FE container, or about
      bin/rollback.sh calling wait_healthy with no profile while slice 4 may lean
      on it.

