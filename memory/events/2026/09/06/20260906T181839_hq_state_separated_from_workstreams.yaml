deviations:
  - item: >-
      Plan slice 1 item 1 says to exclude HQ from the terminal-lifecycle
      currency check. The currency check was left as written.
    reason: >-
      That check reads the HQ checkout by nature, so excluding HQ from it would
      mean deleting it and redefining what completed means. Item 2 already stops
      the harm, because a merged-needs-sync workstream no longer occupies its
      projects or raises attention. The smaller change was taken and the larger
      one is not smuggled in. If a later measurement shows completed needs to
      stop depending on the checkout, that is its own plan revision.
  - item: >-
      Plan slice 1 item 5 says to report whether any workstream is executing
      alongside the branch age. Only the branch age was added.
    reason: >-
      A claimed lane is already reported on the workstream itself, so a second
      summary would be a duplicate of derived data and a second place to keep
      correct. The owner asked for as little new state as possible.
  - item: The interrupted lifecycle state was renamed rather than supplemented.
    reason: >-
      Leaving the name while changing the text would keep the false claim in the
      part most likely to be read. One test expectation changed with it.

method_observation: >-
  Recorded for the owner's review of whether the alignment method belongs in
  CIEL. Across the whole session, sixteen questions were asked with the agent's
  own answer written before each, and thirteen matched. The score is the less
  useful half. Twice in round three the agent declared the question tree
  exhausted, and both times it was not: the question that actually governed the
  design, where the owner would sit while working, was never asked at all. The
  worktree layout in revision 0.1 was built on the unasked assumption and was
  withdrawn a few hours later. The method's own documentation warns of exactly
  this, that the tree is drawn from the asker's understanding and so runs out
  early when the understanding is thin. The score did not detect it, because
  guessing well inside a small tree looks identical to understanding. Both
  earlier misses ran the same way, the agent preferring to route around an
  obstacle and the owner preferring to keep the system coherent over time.

unresolved:
  - Whether one standing branch actually holds up under two sessions is unproven. Slice 2 measures it, and the stage-your-own-paths rule is the single point where the arrangement can quietly go wrong.
  - Whether per-workstream next_action is enough for a cold session to resume without asking is unproven, and is the other thing slice 2 measures.
  - Nothing distinguishes a live lane from an abandoned one. A person remains the only way to establish which, and no measurement here suggests a way to change that without recording sessions, which the contract forbids.
  - completed still requires the checkout to sit on a clean current main, so under a standing branch merged work will normally rest at merged-needs-sync. That is now harmless but it is not obviously right, and it is left alone deliberately.
  - The standing-branch convention has not been used yet. This delivery followed the ordinary topic-branch path, because the convention it introduces is not merged.

