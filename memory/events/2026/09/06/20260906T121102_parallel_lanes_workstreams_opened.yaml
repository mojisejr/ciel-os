    - bun run wake reports no validation error or warning and derives all three workstreams as authorized for revision 0.1 slice 1.
    - git diff --check reports nothing.
  measured_findings:
    lane_count: >-
      decisionAuthorizesPlan requires event.lane to equal workstream.lane and a
      plan declares exactly one lane, so a decision on a second lane can never
      authorize a plan. Two parallel lanes must therefore be two workstreams.
      All ten prior workstreams declare lane single, so the grouping by lane has
      never carried real data.
    overlap_counts_hq: >-
      Every workstream lists ciel-os, so the overlap check fires for every
      concurrent pair and cannot distinguish a real child collision from the
      unavoidable HQ overlap.
    completed_is_unstable: >-
      deriveTerminalLifecycle returns completed only when the checkout sits on
      the delivery target branch at exactly fetched origin/main with an empty
      status. On clean main at e91316a the four merged workstreams derive as
      completed. After switching to this topic branch and adding these files,
      all four flipped to merged-needs-sync and every active workstream reported
      a conflict. The trigger is obeying the contract's own topic-branch rule.
      Inside a lane worktree the checkout is never on main, so this state would
      be permanent under the worktree layout.
    one_decision_per_workstream: >-
      Predicted before the run and confirmed here. Three overlapping workstreams
      needed three decision events; a single group approval does not exist,
      because a decision names one plan path and revision.
    start_gate_breaks_in_a_worktree: >-
      The README start gate runs git switch main, which Git refuses in a
      secondary worktree because main is checked out in the primary one.
    worktrees_dir_is_safe_for_checks: >-
      tsconfig includes only src and test, and the test script scans only test,
      so a worktrees directory under the HQ root does not affect bun run check.
    pilots_share_a_contract: >-
      The ledger produces the task JSON the report consumes and both define
      TaskPriority. Separate repositories do not make them independent, so both
      lane plans forbid touching that contract.
  method_observation: >-
    This plan was prepared with the owner's alignment method rather than CIEL's
    own procedure, at the owner's direction to try it a few rounds before
    deciding whether it belongs here. Recorded for that review: ten questions
    were asked across three rounds with the agent's own answer written before
    each; eight matched. Both misses ran the same way, the agent preferring to
    route around an obstacle and the owner preferring to keep the system
    coherent over time. The method's own weakness is that it leaves no file, so
    this paragraph exists because CIEL has somewhere durable to put it. No
    skill, hook, or machinery was added.

