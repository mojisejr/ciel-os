workstream:
  id: ciel-parallel-lanes-001
  lane: single
  objective: >-
    Authorize plan revision 0.2 slice 1, which stops HQ's transient state from
    contaminating workstream status and makes Wake report what a person needs to
    resume work, so that several sessions can run from one folder without
    weakening continuity.
  scope:
    - Exclude the HQ project from the overlap, terminal-currency, and executing-lane reconciliation calculations.
    - Exclude merged-needs-sync from the active-project map while still reporting it.
    - Report a claimed lane as observed rather than asserting execution was left open.
    - Report next_action and unresolved per active workstream.
    - Report the standing branch age and whether any workstream is executing, as facts only.
    - Record the standing-branch arrangement in README.md.
  out_of_scope:
    - Running two sessions. That is slice 2 and needs its own decision.
    - Any pilot code. Both pilot workstreams are blocked until this slice lands.
    - Any Git worktree. Revision 0.1's layout is withdrawn.
    - Any skill, hook, launcher, daemon, write path, event type, or schema change.

outcome:
  status: decided
  parallelism: approved
  authority_source:
    - The owner set three requirements this plan must not break: sessions stay disposable, continuity is at least as good as now, and several sessions run at once from the ciel-os folder.
    - The owner gave the governing image, one body and many souls, which rules out cutting the repository into worktrees and settles the design.
    - The owner directed that compatibility be fixed before the two-session run, because Wake's output is otherwise too noisy to read a result from.
    - The owner asked that the arrangement stay simple and as stateless as possible, and that Wake report facts without judging, so it does not start inventing.
  completed:
    - Authorizes plan revision 0.2 slice 1 on the single lane.
    - Approves the parallelism this plan proposes, which slice 2 will exercise.
  not_completed:
    - Nothing is changed by this decision. It records authority only.
    - Slice 2 and the two pilot workstreams remain unauthorized.

