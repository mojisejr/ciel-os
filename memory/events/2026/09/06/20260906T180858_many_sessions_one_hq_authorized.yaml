    while the worktree design was believed correct.
  root_cause_addressed: >-
    ciel-os is registered as an ordinary project bound to the repository root
    and appears in every workstream's project list, so HQ's branch, currency,
    and cleanliness leak into the derived status of every workstream. The three
    reported symptoms are one defect.

unresolved:
  - Whether excluding HQ from those three calculations breaks something that depends on the present behaviour is unknown; the existing tests are expected to answer it and a red test is the intended way to find out.
  - Whether reporting per-workstream next_action is enough for a cold session to resume is not established by this slice. Slice 2 measures it.
  - Wake still cannot tell a live lane from an abandoned one. This slice stops it claiming otherwise; it does not solve it, and a person remains the only way to establish which.

