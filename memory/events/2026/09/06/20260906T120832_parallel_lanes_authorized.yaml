  repository:
    head: e91316a99aecfdaf205f03acc1cb1a6c610112d1
    branch: docs/parallel-lanes-dogfood
  plan: workstreams/ciel-parallel-lanes-001/PLAN.md
  plan_revision: "0.1"
  slice: "1"
  parallel_with:
