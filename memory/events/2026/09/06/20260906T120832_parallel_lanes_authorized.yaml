    - pilot-report-status-flag-001
  overlap_justification: >-
    The three workstreams overlap only on ciel-os, which every workstream lists
    because plans and events live there. The two pilot lanes share no child
    project with each other. That is the condition the owner declared safe and
    the condition this slice exists to test.

unresolved:
