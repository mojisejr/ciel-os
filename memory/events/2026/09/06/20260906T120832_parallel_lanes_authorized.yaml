workstream:
  id: ciel-parallel-lanes-001
  lane: single
  objective: >-
    Authorize slice 1, which runs two workstreams from two sessions at the same
    time on the pilot projects and records what the current contract does and
    does not survive.
  scope:
    - Run the two pilot workstreams concurrently, each in its own HQ worktree and its own session.
    - Record Wake behaviour, decision-event count, cross-lane evidence visibility, the staggered merge, and one deliberate shared-file conflict.
    - Remove both worktrees and both branches, and record a closeout with commands and observed output.
  out_of_scope:
    - Any change to CIEL code, AGENTS.md, README.md, the event schema, or the plan policy. Slice 1 observes only.
    - Any CIEL skill, hook, launcher, daemon, or write path.
    - Any SMC, CU12, MuMate, hardware, or Windows work.

outcome:
  status: decided
  parallelism: approved
  authority_source:
    - The owner set the rule this proof tests: two workstreams may run in parallel only when they share no child project, and sharing the HQ project does not count.
    - The owner chose the pilot projects deliberately so that a failed run cannot reach any remote.
    - The owner directed that nothing be added to CIEL until a run demonstrates the need, which is why slice 1 changes nothing.
  completed:
    - Authorizes plan revision 0.1 slice 1 on the single lane.
    - Approves parallel execution of this workstream alongside the two pilot workstreams it coordinates.
  not_completed:
    - Nothing is changed by this decision. It records authority only.
    - Slice 2 is not authorized. It needs its own decision after slice 1 reports.

