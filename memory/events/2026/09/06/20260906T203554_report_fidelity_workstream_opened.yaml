    - deriveAttention counts overlap without consulting decisions while deriveLifecycle does, so the two halves of one report contradict each other on approved parallel work.
    - Under one standing branch there is no merge between lanes, so a second writer to a shared file silently replaces the first with no Git signal. No rule currently forbids it.
  ordering_principle: >-
