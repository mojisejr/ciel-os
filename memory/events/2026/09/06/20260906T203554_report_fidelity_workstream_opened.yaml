  findings_carried:
    - Wake presents a record's next_action beside a lifecycle that may contradict it, with no indication which is current. Introduced by ciel-parallel-lanes-001 slice 1. Observed to mislead a cold session into proposing a duplicate pull request.
    - A closeout's topic branch is resolved by name, so reusing hq/<yyyymmdd> on the same day makes merged and complete workstreams report needs-reconciliation. Introduced by the same slice's branch convention.
