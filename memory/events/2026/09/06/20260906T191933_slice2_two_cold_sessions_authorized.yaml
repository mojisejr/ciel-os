unresolved:
  - Whether one standing branch holds up under two writers is the central claim and is unproven. The stage-your-own-paths rule is the single point where it can quietly go wrong.
  - Whether either cold session can resume from Wake and the repository alone is unproven, and is the reason both lanes are cold rather than one.
  - The deliberate shared-file conflict has no predicted outcome; it is run to find out.
  - How much a stale next_action misleads a cold reader is unknown. The remedy needs no new state if it turns out to matter.

