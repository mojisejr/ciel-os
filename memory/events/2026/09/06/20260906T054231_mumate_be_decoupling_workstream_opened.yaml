workstream:
  id: mumate-be-decoupling-001
  lane: single
  objective: >-
    Make the MuMate v2 first-run path independent of mootech-be, so the one route
    every new user must pass cannot be broken by the legacy backend, and record
    precisely what still binds the v2 surface to it.
  scope:
    - Register mootech-fe and mootech-be as CIEL projects so this work can be audited from repository evidence.
    - Establish the workstream and its acceptance contract at plan revision 0.1.
    - Preserve the research findings that justify it, including two that contradict a document already in mootech-fe.
  out_of_scope:
    - Any slice implementation. No file in mootech-fe or mootech-be is changed here.
    - Launching v2, removing the preview gate, or anything depending on mootech-fe#247.
    - Deciding where MuMate's PDPA record should ultimately live. That question is surfaced, not answered.
    - Binding bazi-sft-dataset. This workstream changes nothing in it.

outcome:
  status: prepared
  owner_agreement:
    - Move first-run's write up into mootech-fe itself rather than sideways into the bazi engine.
    - Change lane from CIEL platform work to this product work for one set of slices.
    - The owner asked for the research to be preserved as evidence before the lane changed.
  completed:
    - Prepared plan revision 0.1 with seven invariants, two slices, per-slice acceptance criteria, and one open question reserved for the owner.
    - Registered mootech-fe and mootech-be in projects/ and bound both machine-locally. Wake reports both as available with no validation error.
    - Recorded the six paths by which the v2 surface still reaches mootech-be, ranked by user impact.
    - Recorded two findings that contradict docs/be-phase1-consolidation.md, both reachable from the same file it cites.
  not_completed:
    - No slice has started. mootech-fe and mootech-be are unchanged.
    - Nothing was verified by running either application. Every finding is static analysis of repository files and GitHub metadata.
    - The two PDPA consent stores are not reconciled and this plan does not choose between them.

