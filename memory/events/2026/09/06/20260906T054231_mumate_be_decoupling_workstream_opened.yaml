    security_note: >-
      Ranks two, three and five are client-side calls, so the browser reaches
      mootech-be directly rather than through a same-origin BFF. Launching v2
      therefore requires mootech-be to be publicly reachable, and mootech-be#23
      records that the repository contains no guard file at all.
  findings_that_contradict_an_existing_document:
    document: mootech-fe docs/be-phase1-consolidation.md, added 2026-09-04 in pull request 601, status PLAN
    first:
      section: I, and switch one of section 4
      claim: The be consent module has no endpoint.ts reference and no other FE caller, is already dead from the FE side, and src/consent/ is deletable as the safest Phase 1 switch.
      observed: pages/api/v2/onboarding.ts calls BE POST /consent through NEXT_PUBLIC_BACKEND_URL directly, not through endpoint.ts, which is the only place that document looked.
      consequence: Executing switch one as written would delete the module that stamps onboarded_at, and every new user would loop in first-run.
    second:
      claim: The document treats consent as a single store.
      observed: >-
        Two stores exist. pages/api/consent.ts reaches the engine at
        account/consent keyed by anonId from cookie-mumate-id and is rendered by
        the settings screen, while pages/api/v2/onboarding.ts reaches
        mootech-be keyed by the session user id and is used by first-run.
      consequence: PDPA acceptance for one person can exist in two databases under two identity keys with nothing observed connecting them.
    caveat: >-
      Both findings are static analysis. Neither was confirmed by running the
      application or by querying either database.
  why_fe_rather_than_engine:
    owner_choice: Move the write into mootech-fe.
    supporting:
      - mootech-fe and mootech-be already share one Supabase database, so the target table is already reachable and no data migration is implied.
      - lib/db/schema.ts lines 1033 to 1038 already declare onboardedAt and onboardingGoal, citing the same BE migration that created them.
      - The route already contains a non-production fallback that writes exactly those two columns through the FE database.
      - The consent table is four columns with no PII beyond user_id, by its entity's own recorded intent.
      - The engine's consent record is keyed by anonId, so moving there would place a user_id-scoped legal record in a different database from the user table it refers to.
      - consent.service.ts records that the BE trusts user_id from the request body and has no user auth, while the FE route derives the subject from a signed session and no longer sends one.
      - The BE performs two writes outside a transaction, so a failure between them leaves a consent row with the gate still looping. The FE can do both in one transaction.
    superseded: >-
      An earlier suggestion in the same session to move the write to the bazi
      engine is superseded by the owner's choice and by the anonId key mismatch
      recorded above.
