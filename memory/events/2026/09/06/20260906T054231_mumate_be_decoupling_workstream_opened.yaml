unresolved:
  - Where MuMate's PDPA record should live and under which key. Two stores exist under two identity keys and this plan deliberately does not choose.
  - The accepted_at column is text and currently receives two shapes, a space-separated local time from the BE and an ISO 8601 instant from the FE fallback. Slice 1 must choose one and say what happens to existing rows.
  - Five of the six v2 dependencies on mootech-be are named but untouched. Rank two blocks a user who arrives from LINE, and no slice here addresses it.
  - Nothing in this research was verified by running either application. Every impact statement is read from a code comment or inferred from a call path.
  - Whether any process inside mootech-be calls ConsentService directly, rather than through its HTTP route, is unknown until slice 2 measures it.
  - mootech-fe has no CI on GitHub. The only enforced gate runs on the machine that pushes and can be bypassed, so a green pull request there proves less than it appears to.
  - The local mootech-fe checkout is one hundred commits behind its origin. Any tracked change there must pass that repository's own start gate first.
  - Human approval, review, and external rules are unknown unless a repository record explicitly establishes them.

