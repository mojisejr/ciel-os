evidence:
  repository:
    head: f03e7fb0897a169409cd39671c13c81af2156878
    branch: docs/report-fidelity-workstream
  plan: workstreams/ciel-parallel-lanes-001/PLAN.md
  plan_revision: "0.3"
  supersedes_conclusion:
    event: memory/events/2026/09/06/20260906T201412_two_cold_sessions_proof.yaml
    field: observations.stale_advice
    said: >-
      "Did not mislead. Neither lane acted on this workstream's stale
      instruction to review pull request 36."
    why_it_was_wrong: >-
      Both lanes were reading their own latest record, and both of those records
      were freshly written and unexecuted. Neither lane was ever exposed to
      stale advice, so the observation was drawn from a sample that did not
      contain the condition it claimed to measure. The closeout is merged and
      stays as written; this event records the correction.

  refutation:
    observed_at: The next session started after that closeout merged, run cold by the owner.
    condition: >-
      Pull request 37 had been opened and merged. Wake reported this workstream
      as merged-needs-sync with the detail "The final closeout has merged, but
      this checkout has not returned to a clean, current target branch", while
      the same report carried the latest record's next_action, which said to
      review the standing branch as one pull request and then merge it.
    what_happened: >-
      The session reported that no pull request had been opened, citing an empty
      gh pr list, and offered to open one. Accepting would have produced a
      duplicate pull request for work already merged.
    diagnosis: >-
      This is not a gap in what the repository carries. The word "merged"
      appeared in the lifecycle detail. Wake presented two statements that
      contradicted each other, gave no indication which was current, and the
      more prominent one was the stale instruction. An empty list of open pull
      requests was then read as proof that none had ever existed.
    attribution: >-
      The condition was introduced by slice 1 of this workstream, which made
      Wake report next_action at all. Before that, the contradiction could not
      arise. The remedy was already named in plan revision 0.3: a record's own
      commit can be tested for reachability from origin/main, which
      deriveTerminalLifecycle already does for terminal closeouts.

  branch_name_reuse:
    observed: >-
      With the checkout on a clean current main and a newly opened hq/20260906
      holding one unmerged commit, ciel-parallel-lanes-001 and
      pilot-ledger-count-command-001 both reported needs-reconciliation with the
      detail "The topic branch at refs/heads/hq/20260906 has commits outside the
      fetched target branch; do not clean it up". Both are merged and complete.
      Deleting the new branch returned both to completed.
    cause: >-
      deriveTerminalLifecycle resolves a closeout's recorded topic branch by
      name. The hq/<yyyymmdd> convention introduced in slice 1 guarantees the
      same name recurs whenever two rounds happen on one day, so a new branch
      inherits the identity of an old one.
    consequence: >-
      Completed work is reported as needing reconciliation on the strength of an
      unrelated branch. The convention cannot be used twice in a day until this
      is addressed.
    also_noted: >-
      README as written directs every HQ write to a standing branch. The
      standing branch exists for rounds with several sessions; an ordinary
      single-session change needs no such branch, and saying so would make the
      collision rarer as well as the rule truer. This event was written on an
      ordinary topic branch for that reason.

