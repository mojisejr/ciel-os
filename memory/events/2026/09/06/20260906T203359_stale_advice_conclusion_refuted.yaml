  - Whether the stale-advice remedy should mark a record as acted upon, hide it, or annotate it is undecided. Only the underlying test, reachability from origin/main, is settled as available without new state.
  - The count of findings from the slice 2 run is now five rather than three, and their order of severity has changed. The stale-advice defect outranks the status vocabulary, because it caused a session to propose doing work that was already done, while the vocabulary defect so far only hides a workstream.
  - One refutation is one observation. It establishes that stale advice can mislead, not how often.

