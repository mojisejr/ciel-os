workstream:
  id: dac2-decision-support-001
  lane: single
  objective: >-
    Deliver reusable owner assets and historically safe season allocation
    without AI or LLM behavior.
  scope:
    - Owner equipment and owned-land register with explicit season inclusion.
    - Deterministic depreciation, separate starting capital, and immutable close snapshots.
    - Pure calculation, PostgreSQL, SSR, authenticated server, and local Playwright proof.
  out_of_scope:
    - Deployment, tax depreciation, market valuation, multi-enterprise allocation, and AI or LLM behavior.
    - Physical-phone rendering and human-comprehension claims.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      An owner can create reusable equipment or owned-land records once, use
      either a Buddhist start year or approximate prior years, edit current
      facts, retire an asset, and keep every record isolated by owner.
    - >-
      Open seasons exclude assets by default and require an explicit include or
      remove action. One asset can be reused across multiple open seasons
      without copying its cost, life, age, or residual facts.
    - >-
      Pure rules calculate straight-line planning depreciation over inclusive
      start and exclusive useful-life and retirement boundaries without reading
      wall-clock time. Invalid costs, life, residual, years, and extreme values
      fail explicitly; owned land always contributes zero depreciation.
    - >-
      Final confirmation snapshots the selected asset facts and contribution in
      the same PostgreSQL transaction that closes the season. Later edits or
      retirement affect open previews but cannot rewrite the closed forecast,
      actual, comparison, or asset snapshot.
    - >-
      Manual fixed cost, automatic non-cash depreciation, manual investment,
      selected asset value, and starting capital remain separately named.
      Existing rows are neither guessed nor migrated, and starting capital
      changes only the explicit investment analysis.
    - >-
      Server-rendered asset management and season selection work without
      client-side JavaScript. Closed seasons expose their immutable snapshot
      without edit controls, while duplicated seasons copy starting capital but
      never silently copy asset selections.
    - >-
      Local Playwright created an asset, proved default exclusion and explicit
      selection, set starting capital, reused the asset, closed a season, and
      verified open and closed asset geometry at 320, 360, 393, and 412 pixels.
    - >-
      The calculation and application dependency trees remain deterministic
      with no AI, LLM, model API, prompt, embedding, vector store, inference
      endpoint, or generated-advice surface.
  not_completed:
    - Application pull request 12 and CIEL HQ pull request 68 await owner merge.
    - Physical-device and human-comprehension proof are not claimed for Batch 4.

