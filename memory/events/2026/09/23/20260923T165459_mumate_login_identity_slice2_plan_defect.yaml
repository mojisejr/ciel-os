outcome:
  status: recorded
  completed:
    - >-
      Blocker established by measurement, not by reading. mootech-fe
      testenv/scripts/anonymize.sql sets user_provider.id_token = '' on every
      row, by design - the comment above it records that a real id_token is a
      JWT carrying user claims. Measured on the running arena at 2026-09-23
      16:5x - 5872 rows, 5872 blank, exactly 1 distinct value in the column.
    - >-
      Therefore DoD 2 of plan revision 0.2, "on an anonymized local restore,
      duplicate mappings are zero, the unique index builds successfully", CANNOT
      BE MET. A unique index on (provider, id_token) would collide on the 3004
      LINE rows that are all ('LINE',''). Duplicate resolution has nothing real
      to resolve. This is a defect in the plan, not in any extraction of it.
    - >-
      Independently confirmed by HQ ciel-os-a3, which also found that
      testenv/scripts/reset-user.sh documents the same consequence in its own
      header, and that testenv/scripts/stack.sh applies restore+anonymize on
      bring-up.
    - >-
      What DOES survive anonymisation - provider spelling. The restore reports
      LINE 3004, GOOGLE 1787, blank 657, google 423, dev 1, tracking the plan's
      inventory. The normalisation half of the cleanup can be built and tested
      locally today.

