options:
  - >-
    (a) Change the anonymizer to PSEUDONYMISE id_token rather than blank it - a
    salted digest preserves distinctness and the duplicate structure while
    revealing nothing. Requires a fresh production dump and restore, which is a
    materially larger access than a read-only query: more rows, more columns,
    and a copy that persists on this machine.
  - >-
    (b) RECOMMENDED. Do not copy production. Run the inventory as an
    owner-authorized read-only SELECT, and prove the migration and the index on
    a synthetic seed built to the shape the inventory reports. The index proof
    needs the right shape - duplicates present, then resolved - not real
    identities. Taking another production copy to prove what synthetic data
    proves is the larger access for no extra evidence. Fixing the anonymizer
    remains worth doing as a separate small change that every future lane
    benefits from.

corrections_to_the_reviewed_sequence:
  - >-
    The slice-2 decision event must repeat outcome.parallelism approved.
    mumate-infra-move-001 also holds mootech-fe and the approval recorded for
    slice 1 does not carry to a new slice-authorizing decision.
  - >-
    The read-only re-measure reads PRODUCTION. It is not local work. The
    precedent in this workstream is an explicit owner grant, so it is a gate.
  - >-
    "Unique normalised provider-identity index" hides a design choice - on
    (provider, id_token) or on (lower(provider), id_token). Revision 0.2 keeps
    spelling asymmetric on purpose, so a plain unique index would let google and
    GOOGLE coexist again if any writer ever sent the other spelling.
    lower(provider) is strictly safer and costs nothing.
  - >-
    The negative control committed today in "d973716" INVERTS once the index
    exists. It asserts the unlocked race leaves more than one provider row; with
    the index the second insert raises a unique violation, one row survives, and
    the assertion fails. It must be rewritten for the post-index world to assert
    that one caller fails with a unique violation and exactly one row exists.
    Flagged against my own work so it is not met later as a regression.

