outcome:
  status: decided
  parallelism: approved
  decision: >-
    The owner reviewed the research and decided: fix slice 1 before accepting
    it; keep the no-join-by-email rule and state its cost; delete the dead
    credential rows and route the affected members to support; pursue the LINE
    email scope through the team because the owner does not hold those rights;
    and ship collision recovery as manual support first.
  authorizes:
    - Plan revision 0.2 of mumate-login-identity-001.
    - Fixing the seven slice-1 defects listed in the plan, under the existing slice-1 authorization.
  does_not_authorize:
    - Slices 2-5, production SQL, a deploy, a route flip, an automatic merge, or any LINE console change.
  completed:
    - >-
      Owner decision 1 - slice 1 is accepted only after its defects are fixed.
      Seven are recorded in the plan, the two most severe being that every
      failure path returns the flag both callers read as "sign the member out",
      and that the referral refusal fires for ordinary members because the
      legacy login page writes a non-empty default into the referral cookie.
    - >-
      Owner decision 2 - the parity table keeps the no-join-by-email rule and
      must state its cost - 98 members whose only credential rows are dead, of
      whom 90 hold a chart, none hold a subscription and none have signed in
      since 1 August.
    - >-
      Owner decision 3 - the 657 blank-provider rows holding expired Google
      access tokens are deleted; recovery for those members goes to support
      rather than to an email-adoption path.
    - >-
      Owner decision 4 - the LINE email scope is wanted but is a team
      dependency. The owner checked the console and does not hold the rights to
      request the scope or add a redirect URI. If granted, an email may suggest
      an account but may never by itself bind one.
    - >-
      Owner decision 5 - collision recovery ships as manual support first. An
      audited automatic merge is revisited only if manual volume justifies it.
    - >-
      Fact corrected - QI, wallet and ledger are in the same Supabase database
      as user and user_provider, not in a separate one. No engine runtime path
      reaches Neon. The remaining Neon references are stale comments, an unused
      dependency, and a README line.
    - >-
      Fact corrected - the QI balance is a stored column, not a sum of the
      ledger, so a merge must rewrite it rather than only append a transfer row.
    - >-
      Fact corrected - roughly thirty engine tables are keyed per member, not
      the six revision 0.1 implied, and several grant value automatically on
      read.
    - >-
      Normalisation target settled - normalise per provider to the spelling the
      live writer already sends. Lower-casing LINE would silently empty four
      backend queries that match the stored value; no query reads a stored
      Google spelling.
  not_completed:
    - No slice-1 defect is fixed yet at the time of this decision.
    - No application file changed and no checkout moved for this decision.
    - The one duplicate identity whose two members both hold a chart is not resolved.
  evidence_of_limits:
