what_this_lane_got_wrong_and_what_caught_it:
  - >-
    THE DECISION LIST RODE IN A TEMP TABLE. The Supabase SQL editor opens a new
    session per run, so it was gone by the next statement. Caught by the owner
    hitting "relation does not exist" - a design mistake that cost a round trip
    and no data.
  - >-
    THE EXPECTED COUNTS WERE ORDER-DEPENDENT AND ONE WAS WRONG. The inventory
    found exactly one same-user duplicate pair, so the migration expected to
    collapse one row. That pair was itself inside the dead-credential class, so
    the preceding step had already deleted both rows and the duplicate step
    found nothing. The guard raised, the transaction rolled back, and NOTHING
    was written to production. A comment stating the expectation would have been
    equally wrong and the run would have half-applied.
  - >-
    I also tested the migration only against a seed I wrote myself, and my seed
    did not contain the one shape production had - a duplicate that is itself
    inside the class an earlier step deletes. The test passed because the test
    did not know what to look for.
  - >-
    This is the FOURTH time in this workstream that something was caught by
    asking "how would I know if this were wrong?" rather than by reading the
    code and judging it correct. The first three are in the preceding closeout -
    a concurrency proof that passed with the lock removed, a step parser that
    returned header comments instead of statements, and a conflict detector that
    read the error code at the wrong depth. The through-line is that every one
    of them LOOKED right on review and was only exposed by a mechanism that
    would fail loudly.
  - >-
    The transferable rule, which is why the production run cost nothing - a
    migration asserts its expected counts and aborts, rather than stating them
    in a comment and proceeding.

slice_2_definition_of_done:
  - >-
    PLAN.md's DoD 2 says "on an anonymized local restore, duplicate mappings are
    zero, the unique index builds successfully, concurrent registration leaves
    one mapping, and rollback SQL is demonstrated". The restore cannot host it -
    anonymize.sql blanks every id_token by design. What was met instead, stated
    plainly so nobody reads the plan's wording as satisfied -
  - Duplicate mappings are zero IN PRODUCTION, measured after the run.
  - The unique index BUILT IN PRODUCTION, behind a guard that refused while any collision survived.
  - >-
    Concurrent registration leaving one mapping is proven on a SYNTHETIC seed
    against a real Postgres with the same index, including a negative control
    that requires the duplicate to appear without the lock - not in production.
  - >-
    Rollback SQL is demonstrated for the STRUCTURE (index and CHECK) and is
    explicitly NOT available for the deleted rows; the dumps are the only
    recovery, which the rollback file states rather than implies.

