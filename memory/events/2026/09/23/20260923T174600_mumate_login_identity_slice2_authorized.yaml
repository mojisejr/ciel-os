  authorizes:
    - Slice 2 of plan revision 0.2.
    - >-
      One read-only production identity inventory query, run inside a forced
      read-only transaction (default_transaction_read_only=on), emitting only
      aggregates or non-identifying references - never raw tokens or personal
      data.
    - >-
      A deterministic synthetic seed for the local proof, built to the shape the
      inventory reports. No fresh production dump or restore is taken.
    - >-
      Cleanup that deletes only dead user_provider credential rows. Member rows
      and member data are never deleted.
    - >-
      A unique index on (lower(provider), id_token), with stored spellings left
      asymmetric as revision 0.2 settled them - Google google, LINE LINE.
    - Adding or verifying a CHECK that prevents blank provider values, so the dead-credential class cannot regrow.
    - >-
      Retaining the advisory transaction lock, and adding unique-violation
      recovery so a racing caller is routed into the existing-member path
      instead of surfacing a retryable server fault.
  does_not_authorize:
