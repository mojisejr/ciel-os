the_regression_the_rebase_exposed:
  what: >-
    Re-running the env-gated lane after the rebase turned SEVEN TESTS RED, and
    not because of the rebase. Rewriting the migration file as the version that
    actually ran (mootech-fe "8b5c17d") changed its comment banners, and the
    proof split the file into steps BY those banners - so every assertion failed
    at once with "migration has no STEP 2". That rewrite was committed without
    re-running the lane that covers it, because the edit looked like prose.
  why_it_is_the_worst_of_the_five: >-
    The other four proof failures in this workstream were caught by a mechanism
    built for the purpose. This one was caught only because the owner happened
    to ask for a rebase. Without that, a green-looking branch would have carried
    a proof that could not run at all.
  the_repair: >-
    mootech-fe "91a2f1b" removes the coupling rather than restoring the banners.
    The proof now extracts the migration's DO block and runs it VERBATIM. Since
    that block asserts production counts, the seed reproduces the production
    SHAPE AT PRODUCTION SCALE - 5,937 rows including the duplicate pair sitting
    inside the dead-credential class - so the file and the seed cannot drift
    apart without the file's own guards failing the test.
  two_traps_on_the_way:
    - The migration quotes an illustrative `DO $$` inside a PART A comment, so a plain indexOf extracted the comment. The search is anchored to a line start.
    - The collision fixture first used a lower-case `line`, which tripped the spelling assertion before the collision assertion it was meant to exercise.
  the_rule: >-
    Re-run the lane that covers a file after editing that file, including when
    the edit is "only comments". A test that parses prose has no such thing as a
    comment-only change.

