unresolved:
  - >-
    is_info drift. Legacy hardcodes false on first login even when the profile
    carries a name - the GO TO FORM signal - where this route answers
    Boolean(name). Nothing in mootech-fe reads it today, so it is inert in the
    app and matters for rollback. Owner chooses the honest value or bug
    compatibility.
  - >-
    is_email drift. Legacy hardcodes true on every returning branch regardless
    of the stored email; this route answers Boolean(email). The FE value is the
    accurate one, but a rollback flips it back.
  - >-
    LINE avatar gap, user-visible. Legacy copies the image to S3 and saves it to
    user.picture_url on returning logins; this route writes user_provider only
    and never refreshes user.picture_url after creation, so a returning LINE
    member's avatar will not update. Object-storage migration is not claimed by
    this slice.
  - >-
