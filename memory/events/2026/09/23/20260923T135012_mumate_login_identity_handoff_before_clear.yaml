handoff_notes:
  what_a_cold_session_must_know:
    - >-
      The two defects that matter most are login-breaking and only appear at the
      traffic flip. First - the new route answers ok:false on every failure
      including a server fault, and both existing callers (pages/index.tsx in the
      callApiRegister result handler, and lib/auth/use-self-heal-identity.ts in
      its result handler) clear the member cookies and call signOut on that flag.
      The legacy backend sets it only for a genuine LINE identity rejection.
    - >-
      Second - the route answers 422 to any non-empty refer_code, and
      pages/login/index.tsx writes the REFCODE_FGF cookie from its callback query
      parameter which DEFAULTS TO "/" - a truthy value. So ordinary members who
      never touched a referral link carry a non-empty referral code, home passes
      it into the register call, and on the flip every member would be refused
      and signed out. This was verified by reading the login page, not inferred.
    - >-
      The provider spelling rule is settled and the reasoning is not obvious -
      normalise Google to lower case and leave LINE upper case, because four
      backend queries match a stored LINE exactly and would silently return zero
      rows if lower-cased, while no query anywhere reads a stored GOOGLE. Picking
      the live spelling also means no production file has to change.
    - >-
      Do not rebase the topic branch yet. Rebase once, immediately before the
      pull request, then re-run the full suite and tell HQ the new hash because
      HQ tracks this lane by hash.
    - >-
      One unmerged upstream branch touches auth - fix/maintenance-gate-and-line-share
      changes middleware.ts guardV2 to return null instead of next(). This lane
      does not touch middleware.ts, so there is no collision, but a rebase after
      it merges should be re-checked.
    - >-
      QI, wallet and ledger are in the same Supabase database as user and
      user_provider. No engine runtime path reaches Neon. Revision 0.1 said
      otherwise and was wrong.
  order_of_work:
    - Fix defects 1 and 2 first - they are the two that break login for everyone.
    - Then defects 3 to 5 - provider spelling, null versus empty string, and the unconditional profile overwrite.
    - Then bring the local arena up and run the env-gated Postgres proof, capturing its output for the acceptance record.
    - Then correct the parity table, including the cost of the no-join-by-email rule.
    - Then offer slice 1 for owner acceptance. Commit in pieces, report each to HQ, never push.

