gotchas_learned_today_worth_not_rediscovering:
  - >-
    A legacy NAME survives a migration and misleads the next reader.
    downloadLineImageToS3 writes to Supabase Storage. Read the implementation,
    never the identifier.
  - >-
    The Supabase SQL editor opens a NEW SESSION per run. Temp tables do not
    survive between runs, and neither would a transaction spanning them. Make
    every part self-contained.
  - >-
    A migration must ASSERT its expected counts and abort, not state them in a
    comment. Today an order-dependent expectation was wrong and the assertion
    rolled the whole transaction back with nothing written to production.
  - >-
    testenv/scripts/anonymize.sql sets user_provider.id_token = '' on every row,
    so the local restore cannot host any identity-uniqueness work. Every future
    lane needing identity distinctness hits this.
  - >-
    Drizzle wraps driver errors in a "Failed query:" error whose own code is
    undefined. Any error-code check must walk the cause chain.
  - >-
    FOUR times in this workstream a test passed for a reason unrelated to what
    it claimed to prove, and all four were caught by asking "how would I know if
    this were wrong?" rather than by review. Every one looked right on review.

