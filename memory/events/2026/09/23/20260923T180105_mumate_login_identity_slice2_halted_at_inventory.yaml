a_pattern_this_lane_has_now_produced_twice:
  - >-
    Twice in this workstream a test passed for a reason unrelated to what it
    claimed to prove, and both times the catch came from asking "would this fail
    if the mechanism were absent?" rather than from review. First - slice 1's
    concurrency proof passed with the advisory lock replaced by a no-op. Second
    - the migration proof's step parser returned each step's HEADER COMMENT
    instead of its statements, so eight assertions passed against a completely
    unchanged table.
  - >-
    A third, caught the same way and worth the same attention - the
    unique-violation recovery's detection read `code` at the top level, but
    drizzle wraps the driver error in a "Failed query:" error whose own code is
    undefined. The unit test passed; five of eight callers failed in the real
    Postgres proof. Had only the unit test existed, the recovery would have
    shipped dead.

