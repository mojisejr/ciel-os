      how long any statement takes on a real table.
    - >-
      The plan's 2026-09-23 row counts were taken before slice 1 landed and are
      not re-measured here. They must not be treated as migration input.

why_the_query_was_not_run:
  provenance_objection_withdrawn: >-
    The lane held the query pending directly attributable approval.
    evt_20260923T175100, written by the session that received the owner's words
    rather than by the relay, closes exactly that gap, and the objection is
    withdrawn rather than replaced. A rule that only ever says no is as useless
    as one that only ever says yes.
  the_remaining_blocker_is_not_authority: >-
    This checkout's active .env points at the local arena by design -
    testenv/scripts/stack.sh deliberately swapped the real env aside and
    shadowed every other .env file, and the production credentials now live only
    in testenv/.backups as *.prod.bak. Running the query would mean reaching
    past that safety structure to pull a production credential out of a backup,
    in a checkout three lanes share, where a mistake leaves the shared
    repository pointed at production instead of the arena.
  and_a_guard_the_lane_will_not_work_around: >-
    This session's harness carries a production guard that fired earlier today
    on a mere MENTION of the production project ref inside a SQL comment. Its
    own instruction is to ask the owner first. A committed event written by an
    agent is not what that guard is asking for. The lane did not attempt to
    bypass it - not because the attempt would fail, but because attempting it is
    the wrong act regardless of whether it succeeds. Only the owner can lift it.
  the_honest_sentence: Authorized, and still not runnable from this seat.
  what_closes_it: >-
    The owner pastes lib/db/0034_provider_identity_inventory.sql into a
    production SQL session and returns the fourteen counts. No credential leaves
    its backup, no guard is bypassed, and slice 2 gets its real numbers.

