outcome:
  status: recorded
  parallelism: approved
  completed:
    - >-
      Migration 0034 and its rollback, hand-authored for the owner to run one
      statement at a time, in mootech-fe "9b1608c". Six steps - dump, inventory,
      delete the dead credential class, collapse same-user duplicates, normalise
      spelling, then build the index behind a guard that RAISES while any
      identity is still claimed by more than one member - plus a CHECK so the
      dead class cannot regrow. The rollback restores the structure and says
      plainly that it does not restore the deleted rows, which is why step 0 is
      not optional.
    - >-
      The index is on (lower(provider), id_token), not on (provider, id_token).
      Revision 0.2 keeps spelling asymmetric on purpose, so a plain unique index
      would let google and GOOGLE coexist again the moment any writer sent the
      other case. The proof asserts a duplicate is refused in EITHER spelling.
    - >-
      The proof runs the REAL migration file, split on its own step banners,
      inside a schema it creates and drops - never the arena's restored tables,
      verified unchanged at 5872 rows afterwards. Eight cases.
    - >-
      Unique-violation recovery in the route, mootech-fe "5149b0c". Once the
      index exists a racing caller gets a violation; left alone it surfaced as a
      500 with no ok:false, which both callers read as retryable, so a member's
      browser would retry back into the same race. The route now retries exactly
      once into the existing-member path.
    - >-
      The negative control is SPLIT rather than rewritten, because both worlds
      are real and the plan described only one. The pre-index control stays and
      now states that it describes today. A new post-index block creates the
      0034 index in its own schema and asserts the opposite outcome for the same
      race - one identity survives and every caller is answered - and also runs
      the locked version, which is how it will ship.
    - >-
      lib/db/0034_provider_identity_inventory.sql, mootech-fe "1f20e5d" - the
      authorized inventory query, written so its safeguards are structural
      rather than promised: fourteen counts, no id_token, no email, no name, no
      user_id, inside a transaction that sets default_transaction_read_only.

  not_completed:
    - >-
      THE INVENTORY QUERY WAS NOT RUN, so slice 2 cannot be closed. Its DoD rests
      on real numbers and there are none. Everything above is proven against a
      synthetic seed of the right SHAPE, never against production reality.
    - No production statement, push, pull request, provider change or traffic change occurred.
    - PLAN.md is untouched, including its phase and its DoD 2.

  evidence_of_limits:
