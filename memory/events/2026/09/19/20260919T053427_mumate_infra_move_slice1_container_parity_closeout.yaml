workstream:
  id: mumate-infra-move-001
  lane: single
  objective: >-
    Build a DigitalOcean sgp1 replacement for the exact MuMate system the
    product team launches (mootech-fe, mootech-be, Bazi engine), keep Supabase
    as the single source of truth, prove it in parallel, then flip inside an
    owner-controlled maintenance window. Slice 1: each launched service runs as
    the same service in a container, with truthful readiness, no product
    behaviour change, and no production or DigitalOcean change.
  scope:
    - Containerise mootech-fe, mootech-be and bazi-sft-dataset from freshly fetched production branches.
    - Add truthful liveness/readiness surfaces; keep every build-time secret out of images and logs.
    - Exercise the built images against the local arena, not development servers.
    - Open one draft pull request per application; record their heads here.
  out_of_scope:
    - Any production deployment, DNS, Vercel/Render/Supabase setting, DigitalOcean resource, or provider change.
    - The private mumate-infra control room and its registration (slice 2).
    - Deciding the Bazi source-of-truth branch, hostnames, Droplet size, GHCR visibility, BE pool mode (#637 §10, slice 2).

outcome:
  status: slice-complete-draft-prs-open
  completed:
    - >-
      Start gate passed independently in the three applications after a fresh
      fetch. mootech-fe local main was behind by 8 and was moved to origin/main
      17d5c67 (the launch team's current production revision); mootech-be main
      57da359 = origin/main; bazi-sft-dataset origin/pdf-dev had moved to
      593318d and is the observed production branch (main 1d41a91 has diverged
      29/383 — left as the open #637 §10 question, not decided here).
    - >-
      Arena: a fresh production dump was taken read-only (owner authorised;
      pg_dump through the vault, 61 bazi tables confirm the single shared DB),
      restored and anonymised into the testenv Postgres on :5433; app envs
      swapped to local by stack.sh. The anonymiser refused the first run because
      two 2026-09 tables (bazi_user_profile, bazi_data_export_request) still
      held real emails; anonymize.sql was extended and the second run passed.
    - >-
      mootech-be — draft PR mojisejr/mootech-be#27, head ae8a895 on
      infra/container-parity from 57da359. Pinned multi-stage Dockerfile (base =
      the digest node:19-alpine resolves to today, 19.9.0-alpine3.18, exact
      parity with Render), Thai font from the repo instead of a build-time
      download, runner = dist + prod node_modules + src/assets + public as
      `node`. GET /health runs SELECT 1 through the DataSource (200/503; GET /
      unchanged). src/runtime-guard.ts exits 1 before Nest boots on any spelling
      of DB_SYNCHRONIZE=true and reads an explicit pool bound (DB_POOL_MAX /
      CONNECT_TIMEOUT / IDLE_TIMEOUT, defaults = pg's). Proof: lint 0 errors,
      tsc clean, jest 149/149, container-smoke green (hygiene, canvas + Thai
      font render inside the image, refusal rc=1, /health db ok with the built
      SHA against the arena). A container-build workflow runs the same smoke --no-db on manual dispatch only.
    - >-
      bazi-sft-dataset — draft PR mojisejr/bazi-sft-dataset#36, head 52126b7 on
      infra/container-parity from origin/pdf-dev 593318d, base branch pdf-dev.
      Standalone image (node:22 Debian-slim by digest; output "standalone" only
      under NEXT_OUTPUT_STANDALONE=1 so the Vercel build is untouched).
      src/lib/runtime-files.ts is the manifest of every file the server reads
      via process.cwd() (compiled knowledge, question network, shinse index,
      louise-hay index, knownlage txt/extracted/distilled); the Dockerfile copies
      exactly that tree, /api/health reports it, a test keeps it honest against
      the repo and sweeps src/lib for unlisted readers. /api/health went from
      four constants to select 1 (+ the manifest check only when APP_RUNTIME=container,
      set by the Dockerfile; on Vercel it reports "not-checked" so production keeps
      answering 200) → 200/503 with the built SHA. Proof:
      eslint clean, test:default-gate 102/102, smoke green (8/8 manifest entries
      inside the image, db ok, POST /api/bazi/public-calc computes a chart, LINE
      webhook with a bad signature → 401 under standalone). Image 632 MB.
    - >-
      mootech-fe — draft PR mojisejr/mootech-fe#711, head 2b50862 on
      infra/container-parity from 17d5c67. Dockerfile replaces the 2025 file that copied .env.${NODE_ENV}
      into the image: node:22 Debian-slim by digest, standalone behind the same
      env toggle, build args limited to the public values Next inlines
      (NEXT_PUBLIC_*, NEXTAUTH_URL/ENVIRONMENT/HOST for publicRuntimeConfig) +
      APP_GIT_SHA; the repo's two postbuild secret gates run inside the build.
      pages/api/health.ts (allow-listed by middleware since #605, unanswered
      until now) runs select 1 through lib/db → 200/503. Proof: tsc clean,
      vitest 2686 pass, smoke green — hygiene, /api/health db ok, GET / 200, and
      the same image under MAINTENANCE_MODE=on: / → maintenance page,
      /api/health + /api/auth/csrf allow-listed, /api/cron/* → the route's 401,
      ?bypass → redirect + mnt_bypass cookie with the secret stripped. Image
      651 MB. .env.example declares APP_GIT_SHA (drift gate).
  not_completed:
    - No image was pushed to any registry; no DigitalOcean resource exists; nothing on Vercel, Render or Supabase changed.
    - The database legs of the three smokes run only on this machine against the arena; CI runs build + hygiene (--no-db) and says so.
  evidence_of_limits:
    - >-
      The mootech-fe pre-push hook blocks on verify-architecture, which is red on
      untouched origin/main 17d5c67 (features/v2-shell/components/AppHeader.tsx:185,
      a launch-team file) — reproduced in a clean worktree. Every other hook gate
      was run by hand and is green (lint, vitest, guard-workflow-integrity,
      gitleaks over both commits). The branch was pushed with --no-verify on the
      owner's explicit instruction, and the PR body says so.
    - >-
      bazi `npm run typecheck` carries one pre-existing error from a stale,
      gitignored .next/dev/types/validator.ts (2026-08-30); identical without
      the change. One mootech-fe spec (v1-header-upgrade-closed.test.tsx) flaked
      once under full-suite load and passes alone; not a file this slice touches.
    - >-
      Node majors: BE pinned to 19.9.0 for exact Render parity (EOL — a later
      slice decides the upgrade); fe and bazi use 22 (bazi engines = 22.x; the
      fe Vercel project's Node setting was not read from here and should be
      confirmed before slice 3).

