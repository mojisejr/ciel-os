workstream:
  id: mumate-infra-move-001
  lane: single
  objective: >-
    Build a DigitalOcean replacement that matches the FE + BE + Bazi system
    launched by the product team, keeps Supabase as the single source of truth,
    and moves the real domains under an owner-controlled maintenance window.
    Slice 2: the control room can create, deploy, fail, restore, and report,
    dogfooded with BE, with no production, DNS, or scheduler change.
  scope:
    - Authorize slice 2 of plan revision 0.1 and record the owner's answers to the slice-2 decisions.
    - Record the operating arrangement the owner chose for the agent as the lane's DevOps operator inside CIEL.
  out_of_scope:
    - Any DNS, hostname, scheduler, production environment, or provider-cancellation change (slices 3-5).
    - The Bazi source-of-truth branch, final hostnames, and the pre-launch Droplet size (slice 3).

outcome:
  status: decided
  parallelism: approved
  decision: >-
    On 2026-09-19, after slice 1 closed and its three PRs reached production,
    the owner opened slice 2 and decided: (1) the control room lives in the
    private repository mojisejr/mumate-infra (created empty by the owner);
    every change goes through a pull request merged by the owner, never a
    direct push — GitHub Free offers no branch protection on a private
    repository, so the same .githooks/pre-push guard the application repos
    use enforces this on the machine, and CIEL's merge-is-an-owner-action rule
    covers the rest. (2) The agent operates DigitalOcean on the owner's behalf
    through doctl with two owner-created tokens in the company Team context:
    mumate-agent-read (read only) and mumate-agent-ops (create/read/update on
    droplet, firewall, reserved_ip, ssh_key, tag, project, monitoring, image;
    no delete scope). Deletion, billing, membership, Spaces object keys, DNS,
    and every secret value stay with the owner. The owner decides in chat, the
    agent operates, records each resource touch as a closeout, and objects
    (and waits) on new cost, irreversibility, production data, user exposure,
    or unclear authority. (3) Alerts go to the owner's existing Discord, a
    channel of the owner's choosing, via a webhook placed in the server env by
    the owner. (4) Spaces bucket mumate-backups (sgp1, ~$5/month) is approved
    for this slice because the backup/restore proof needs an off-host target.
    (5) Defaults accepted unless the owner objects: GHCR images public (the
    three repositories are already public; the Droplet pulls without a token);
    Droplet s-2vcpu-4gb in sgp1, Ubuntu 24.04, weekly backups, Reserved IP,
    Cloud Firewall (22 from the owner's address only, 80, 443).
  authorizes:
    - Slice 2 of plan revision 0.1 as written in the plan, sequenced as the eleven steps the agent laid out in chat (repository seed, BE image to GHCR by SHA via the existing manual workflow, Droplet + firewall + Reserved IP, owner-placed env, first deploy, backup to Spaces and restore into a disposable database, deliberate failed deploy with automatic rollback, alert proof, deploy-user permission proof, host reconstruction, closeout).
    - Registering projects/mumate-infra in CIEL once the repository has its first commit.
    - One small mootech-be pull request extending container-build.yml to push ghcr.io/mojisejr/mootech-be:<sha> on manual dispatch.
  does_not_authorize:
    - Deleting any DigitalOcean resource (Team Owner action).
    - Any DNS record, public hostname serving users, enabled scheduler, production environment, Vercel or Render change.
    - Storing a secret value in any repository, event, or response.
    - Slices 3-5.

