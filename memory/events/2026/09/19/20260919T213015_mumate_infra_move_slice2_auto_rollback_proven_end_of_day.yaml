    - >-
      Second image for the rollback proof. The owner's re-dispatch on main
      rebuilt 0705378 (run 35448336255, same tag, harmless). GitHub's Run
      workflow takes a branch, and the workflow file at 7e609c6 predates the
      push input, so the agent pushed branch rollback-target/7e609c6-ci on
      mootech-be = 7e609c6 + cherry-pick of 4f24dcd (workflow file only,
