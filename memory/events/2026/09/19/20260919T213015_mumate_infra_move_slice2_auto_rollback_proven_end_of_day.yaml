      with push=true (run 35448515382, success) → ghcr.io/mojisejr/
      mootech-be:46f57a2a203c19cbbfa7d472a52e1745ecfd7c09, public (manifest
      200). Keep the branch while the image is referenced.
    - >-
      Unhealthy-deploy path, attempt 1 (host on 25fe716 = rollback gets its
      own ROLLBACK_TIMEOUT): HEALTH_TIMEOUT=1 bin/deploy.sh BE_TAG=46f57a2…
      → timed out → step 5 → alert "rolled back to last-good, service
      healthy" and .env back to 0705378 — BUT the running container was
      still 46f57a2 (ops-status ❌ configured ≠ running). Root cause: step 3
      exports the new tags into the shell; shell variables override .env in
      compose interpolation, so the rollback's up -d saw the new tag and
      recreated nothing. The automatic rollback had never actually rolled
      back; bin/rollback.sh (fresh shell) was unaffected. Third deploy.sh
      defect of the day, again caught by ops-status.
    - >-
      Fix: re-source .env.last-good (set -a; . LAST_GOOD; set +a) before the
      rollback's up -d, plus the separate ROLLBACK_TIMEOUT (default 120 s)
      so a short HEALTH_TIMEOUT cannot condemn a good last-good. mumate-infra
      PR #5 (infra/rollback-full-timeout @ 43fa71a) carries both.
    - >-
      Unhealthy-deploy path, attempt 2 (host on 43fa71a): HEALTH_TIMEOUT=1
      bin/deploy.sh BE_TAG=46f57a2… → timed out at 1 s → automatic rollback
      → container recreated on 0705378, healthy, .env = last-good, ops-status
      ✅, alert ⚠️ "rolled back to last-good, service healthy", exit 1; 37 s
      wall clock. Automatic rollback PROVEN. The forced failure is a timeout
      (the new image is functionally identical to the old), i.e. the
      "deploy too slow" class; a crash-loop image would follow the same
      step-5 path.
