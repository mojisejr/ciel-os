unresolved:
  - >-
    Keep-alive navigation stall, now with evidence and no cause. In every
    diagnosed stall the server answered the same URL with the same cookie in
    15 to 18 ms over a fresh connection, while Chrome's request had been
    sent at +0 ms on a reused connection (no connect phase) and received
    nothing for the full timeout. The stall is therefore on the server side
    of an existing keep-alive connection (hyper 1.9 via axum 0.8.9 with
    tower-sessions), not disk, which stayed above 56 GB free, and not
    Chrome's connection queue. A phone browser reuses connections the same
    way, so this is a candidate product defect rather than only proof
    flakiness. Today's rate, four stalls in nine runs, is higher than the
    one-per-run seen on 2026-09-13. Recommended: a separate owner-authorized
    slice before Batch 4, since Batch 4 must extend the route matrix and
    cannot carry a fifty-percent stall rate.
  - The classify questions, cost wording, and the two-group fixed-costs list are hypotheses until Batch 4's comprehension study.
  - Guided fields bind values as properties, so server-rendered markup shows empty fields until hydration; the browser proof waits for hydration and the flash is not measured.
  - Existing plans with selected assets and no fixed rows read as unknown until the owner confirms the manual group; no data was rewritten to guess.
  - Closed seasons remain immutable and no correction policy exists.
  - The application remains localhost-only with its existing deployment debts.
  - Physical-device, non-Chromium, landscape, zoom, and altered-font proof remain open.

