workstream:
  id: dac2-pilot-deployment-001
  lane: single
  objective: >-
    Put the DAC2 application on a public HTTPS address, backed by a hosted
    PostgreSQL and a real mail relay, at zero recurring cost, so that likely
    orchard owners can open it on their own phones and the comprehension
    study 4b of dac2-guided-inputs-001 becomes possible.
  scope:
    - Slice 1 - a container image configured entirely by the environment, proved against the local compose services with the route matrix and the stall probe.
  out_of_scope:
    - Rate limiting, the https/secure-cookie start check, and the pilot notice (slice 2).
    - GitHub Actions, GHCR, render.yaml, any external account (slices 3 and 4).
    - Any change to results, wording, schema, calc, close snapshot, or forecast_mode.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      A multi-stage Dockerfile builds the application on rust:1.88-bookworm
      with cargo-leptos 0.3.7 from its published binary and leaves a
      debian:bookworm-slim image (249 MB, linux/arm64 on the owner's machine)
      holding the binary, target/site, and a CA bundle, running as uid 10001.
      .dockerignore keeps target, node_modules, .env, and .git out of the
      context. Cache mounts hold the registry and target between builds.
    - >-
      The binary reads its Leptos configuration from LEPTOS_* variables when
      crates/web/Cargo.toml is absent and from the file otherwise; PORT, when a
      host sets it, replaces the port alone; COOKIE_SECURE sets the cookie
      Secure flag; the mail configuration is validated before the server binds
      and the relay host, port, and mode are printed without credentials.
    - >-
      SMTP_TLS=starttls selects a STARTTLS relay over rustls with SMTP_USERNAME
      and SMTP_PASSWORD; unset or off keeps the plaintext Mailpit path; any
      other word, a missing login, or a non-numeric port stops the process
      naming the variable. The rules are pure functions over a lookup and are
      unit-tested without touching the process environment; lettre gains the
      tokio1-rustls-tls feature on the rustls and ring already in the lock.
    - >-
      Running the release binary for the first time found it aborting with a
      worker stack overflow on the dashboard with the default 2 MiB stack and
      on the analysis page at 8 MiB, natively on macOS as well as in the
      container; the debug build cargo leptos serve produces does not. The
      runtime is now built by hand with one worker thread, unchanged, and a
      32 MiB worker stack; 16 MiB was the smallest size that passed the whole
      route matrix.
    - >-
      scripts/check-container.sh builds or reuses the image, runs it against
      the compose services with environment variables alone, and points the
      responsive proof and the stall probe at it. README gains "Run the
      container locally" and .env.example gains the new names.
  not_completed:
    - Application pull request 17 awaits owner review and merge; CIEL HQ pull request 71 carries the plan, both opening records, and this closeout.
    - Slices 2, 3, and 4 are not implemented or authorized by this closeout.
    - The image has not run on linux/amd64 or on any host outside the owner's machine.

