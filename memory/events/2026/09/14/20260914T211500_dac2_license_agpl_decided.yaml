outcome:
  status: license-decided
  decision: >-
    On 2026-09-14 the owner chose the GNU Affero General Public License,
    version 3 or later, for dac2-durian-smart-account. The owner's aim is
    that the second Durian Academy cohort and their teacher can use, change,
    and carry the application on, while anyone who offers a changed copy as
    a service must offer its source under the same terms. The owner first
    considered forbidding commercial use, understood that this would not be
    open source and that PolyForm Noncommercial was the standard way to do
    it, and chose the AGPL instead so the work stays open source. The
    LICENSE file is the verbatim gnu.org text; the README carries the notice
    with the copyright holder written as the owner's GitHub name until the
    owner names a person or entity. This record's status word is deliberately
    one the delivery machinery does not act on: it is a decision inside
    slice 3, not a slice authorization.
  constraints:
    - The LICENSE text is not edited; the notice lives in README.
    - Contributions are accepted under the same license, stated in README.

