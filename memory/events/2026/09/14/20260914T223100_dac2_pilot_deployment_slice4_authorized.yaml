workstream:
  id: dac2-pilot-deployment-001
  lane: single
  objective: >-
    Put the DAC2 application on a public HTTPS address, backed by a hosted
    PostgreSQL and a real mail relay, at zero recurring cost, so that likely
    orchard owners can open it on their own phones and the comprehension
    study 4b of dac2-guided-inputs-001 becomes possible.
  scope:
    - Owner-created Neon project, Brevo sender and SMTP key, and Render web service from the published image, every credential in the owner's own store.
    - Non-secret environment variables set by the agent through the Render MCP; deploys triggered and logs read through it; the four secrets pasted by the owner in the dashboard.
    - render.yaml descriptor and a moderator runbook in the application README.
    - Public proof - route matrix and stall probe against the public address, a real registration through Brevo, cold-start measurements, rate-limit behaviour behind the proxy.
  out_of_scope:
    - A custom domain, paid instances, backups, monitoring, alerting.
    - Any change to results, wording, schema, calc, close snapshot, or forecast_mode.
    - The 4b protocol, which is recorded in dac2-guided-inputs-001 after this slice closes.

outcome:
  status: decided
  decision: >-
    On 2026-09-14, after slice 3 merged at application fddab20 and CIEL HQ
    PR 73 merged, the owner authorized slice 4 against plan revision 0.1 and
    began it: Neon project and Brevo sender created, a Render project named
    DAC2 opened. The owner granted the agent permission to operate the
    Render MCP and CLI tools on the owner's behalf for this slice, asked to
    be told step by step who does what, and asked that nothing be broken.
    The Render MCP cannot create an image-backed service, so the owner
    creates the web service in the dashboard from the published image and
    pastes the four secrets there; the agent sets the non-secret variables,
    triggers deploys, and reads logs through the MCP. Observed through the
    MCP before this decision: the owner's workspace tea-cspv7bogph6c73d0657g
    already runs mootech-be in Singapore, so the region is available.
  constraints:
    - The agent never receives, prints, or stores DATABASE_URL, SESSION_KEY, SMTP_USERNAME, or SMTP_PASSWORD; the owner pastes them in the dashboard and keeps them in the owner's own store.
    - CLIENT_ADDRESS_SOURCE=forwarded-for behind Render, as slice 2 recorded; the runbook raises RATE_LIMIT_ACCOUNT for an in-person study day.
    - The service deploys the image tag named in a closeout, never a moving tag, and never automatically.
    - Brevo's authorized-IP restriction, if kept, lists Render's Singapore outbound ranges; the owner chooses between adding them and disabling the restriction.
    - Free instance type; any paid change is the owner's separate decision.

