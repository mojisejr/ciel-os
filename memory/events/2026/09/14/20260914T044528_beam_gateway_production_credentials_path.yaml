outcome:
  status: decided
  decision: >-
    Production Lighthouse credentials reached the owner on 2026-09-14 before any
    Playground did. Plan revision 0.6 records that PRs 650-653 never depended on
    Playground and may merge once 0027 is on production; that the proof for
    slices 2-4 may run on Production behind the still-present V2_PREVIEW_KEY gate
