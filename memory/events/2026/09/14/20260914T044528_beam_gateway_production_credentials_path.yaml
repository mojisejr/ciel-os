    client) with real money at the smallest catalog price and a refund after;
    and that Beam keeps its own webhook route /api/v2/payment/webhook-beam,
    registered in production Lighthouse only after 650 and 651 are deployed.
    No slice is authorized by this record; slice 2's production run is the
    owner's next authorization.
  constraints:
    - "Three values are required, all from production Lighthouse: BEAM_MERCHANT_ID, BEAM_API_KEY, BEAM_WEBHOOK_HMAC_KEY. One value has arrived and its identity is unconfirmed; it is confirmed by one authenticated GET, never by guessing."
    - "Secrets stay in the owner-controlled ignored file and the Vercel Production scope; none enters a repository file, event, or pull request."
    - "PAYMENT_GATEWAY on Production stays unset until 650-653 are deployed, 0027 is applied, the webhook is registered, and the owner authorizes the run."
    - "Rollback during the run is PAYMENT_GATEWAY=omise plus redeploy; both webhook routes stay registered."

