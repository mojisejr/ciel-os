outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      Two budgets per client address guard the account doors, each written
      as attempts/seconds in the environment. RATE_LIMIT_ACCOUNT, default
      5/3600, covers registration, verification resend, and the
      password-reset request, the routes that send a message;
      RATE_LIMIT_LOGIN, default 10/300, covers login, the verification link
      and form, and the reset itself. Everything else is unlimited. The
      limiter is an in-process sliding window keyed by budget and address,
      swept when it grows past 4096 keys; a refused attempt is not counted.
    - >-
      A refused request gets 429 with Retry-After. A browser form, by its
      Accept header, sees a plain page - "รอสักครู่", the sentence naming the
      wait, then "(rate limit)" as the secondary term; a hydrated form sees
      the same sentence in the server-function error encoding and shows it
      where it shows every other message.
    - >-
      Forms now show a server's message as written: the transport prefix
      "error running server function" led every auth message before this
      slice and is dropped in one place, app::plain_message. This is a
      display rule for auth forms, not a result-surface change.
    - >-
      The client address is the connection's peer unless
      CLIENT_ADDRESS_SOURCE=forwarded-for, which reads the first
      X-Forwarded-For entry; the choice for Render is left to slice 4.
    - >-
      Every variable the server needs is read and refused by name before the
      first connection: DATABASE_URL and SESSION_KEY missing, a flag not
      true/false, a limit that does not parse, an https APP_BASE_URL with
      COOKIE_SECURE unset or false. Values are never printed.
    - >-
      PILOT_NOTICE=true shows a one-line notice on every page - "นี่คือสำเนาทดลอง
      ข้อมูลที่กรอกใช้เพื่อการศึกษาและอาจถูกลบ (pilot)". The notice is always in the
      App markup and hidden by the stylesheet; the shell puts data-pilot on
      <html>, outside what the body hydrates, so localhost and the study
      address hydrate the same tree.
    - >-
      Tests: seven gate unit tests, four gate_http tests over a router with
      the middleware and injected peer addresses, one shell_ssr test, two
      settings tests, one app test. check.sh runs the new suites; the three
      proof scripts widen the budgets so a rerun inside the window is not
      refused, with the default limits proved by gate_http.
  not_completed:
    - Application pull request 18 awaits owner review and merge; CIEL HQ pull request 72 carries the slice-1 merge record, the slice-2 authorization, and this closeout.
    - Slices 3 and 4 are not implemented or authorized by this closeout.
    - Whether Render's forwarding header is trusted, and therefore whether CLIENT_ADDRESS_SOURCE changes, is decided in slice 4.

