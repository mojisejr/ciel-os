unresolved:
  - The open-source license is not chosen. Until a LICENSE file exists the code is public but all rights are reserved, which does not let the cohort or the teacher reuse it; the owner chooses and records it, MIT or Apache-2.0 being the usual choices for this purpose.
  - The owner's commit author address is in every commit of a public repository; that is the owner's to accept or change for future commits.
  - Cold Actions build time for a Rust and wasm image on a two-vCPU runner is unknown; the closeout records it.
  - Docker RUN cache mounts are not carried by the Actions layer cache, so a main build may be cold every time; the closeout records whether that is acceptable for the pilot's cadence.

next_action:
