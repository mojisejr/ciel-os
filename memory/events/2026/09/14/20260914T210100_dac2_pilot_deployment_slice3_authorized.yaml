    Pass the application start gate on clean fetched main at d16c216, create
    feat/pilot-image-from-git, add the workflow with SHA-pinned actions,
    open a draft application pull request so the pull-request job runs
    against it, record the run's minutes, and after merge confirm the image
    on GHCR by pulling it on the owner's machine. Then add the workflow's
    check as a required status check on main and record the slice-3
    closeout on this HQ branch.
  acceptance_check:
    - The pull-request job passes on the application pull request and its minutes are recorded.
    - After merge the image ghcr.io/mojisejr/dac2-durian-smart-account:main exists, its digest is recorded, and pulling and running it on the owner's machine passes the slice-1 acceptance.
    - main requires the workflow's check; enforce_admins remains true.
