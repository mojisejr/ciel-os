  scope:
    - Step 0, time-boxed to six hours: the keep-alive navigation stall recorded at application 1e390a7.
    - Dashboard, four Analysis tabs, Demo, close review, comparison, and History copy and structure.
    - Readiness by named decision shared by hub, dashboard, and analysis.
    - Close review naming unavailable comparisons; comparison and history showing unavailable, not zero, for seasons closed with an unknown section.
