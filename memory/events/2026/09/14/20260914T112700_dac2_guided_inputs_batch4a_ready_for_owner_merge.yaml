  objective: >-
    Deliver the results-close-history batch: plain-first language on every
    result surface, readiness named by decision, a close that never blocks on
    an incomplete forecast, a complete phone-width route matrix, and the
    keep-alive stall resolved or recorded, without changing DAC2's
