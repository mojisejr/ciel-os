    - Reporting the leptos race upstream, which is the owner's external action.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      Step 0 found the cause, not only a mitigation, in about two and a half
      hours of the six-hour box. A framing proxy between Chrome and the
      server showed the stalled response had sent its headers and its
      Suspense fallback and never its resolved chunk; the database was idle
      and nothing panicked. A browser-free probe (scripts/check-stall.sh)
      reproduced it by reading whole responses over persistent sockets while
      other sockets downloaded the wasm bundle: 8 stalls in 900 pages on the
      default multi-thread tokio runtime, 0 in 1,800 pages with one worker
      thread. The Suspense machinery in leptos 0.8.20 / reactive_graph
      0.2.14 races between the thread rendering the page and the thread
      resolving its resource: the Suspense effect gives up silently when
      try_read meets lock contention and waits for a change that never
      comes, and the async-derived waker path checks its flag before
      registering the waker. The application now runs on one worker thread
      (c139bd7), with the reason in a comment; the fix belongs upstream. The
      proof's stall diagnosis now covers every navigation and reload and
      captures request timing, the application's sockets, and the database
      sessions at the moment of a stall.
    - >-
      Readiness is named by decision (c755e90). PlanForm::decision_readiness
      yields one statement for each of six decisions — profit, buyer
      comparison, cash, investment, self-assessment, and close — and the
      hub, the dashboard, and the analysis page render the same list: ready,
      or the single missing fact with a link to the page that asks it, or
      the optional fact that would add the result. Closing is always ready.
    - >-
      The dashboard no longer withholds every figure until profit exists.
      Its hero is the profit figure or the missing question with a button;
      every tile and row shows its value or the reason it is absent, never
      a zero; every label leads with the owner's question and keeps the
      accounting term as a secondary label. The browser-only sample renders
      the same figures without links. Analysis panels compare KPI rows to
      the owner's own target, answer the completeness rules as plain
      questions with the rule's formal name second, say how the owner scored
      themselves instead of grading the orchard, and read the tax figures
      and the scenario heading plainly. The health input page asks how ready
      the orchard looks to its owner on a 1-5 scale instead of labelling 1
      as urgent repair.
    - >-
      Eight ⓘ sentences (0de14cb) were rewritten in DESIGN.md first, since
      the wording is the owner's, and mirrored in explanations.rs: profit
      versus cash no longer predicts collapse; break-even kilograms no longer
      double as price tolerance; weighted price names its two inputs instead
      of one permitted way to raise it; contribution per kilogram no longer
      says a season should not be attempted; market fulfillment, fertilizer,
      and electricity figures no longer infer a fix, a wasted input, or a
      leak; loss share no longer grades itself; the tax text no longer
      describes a recommendation it is not. Every explanation names the page
      holding its inputs and the sheet ends with a link there.
    - >-
      The close and review pages (2e08c9d) list the six comparisons with
      "จะเทียบได้" or "จะเทียบไม่ได้" from the same forecast snapshot the
      close writes, say that an incomplete forecast does not stop the close,
      and on a detailed season name the missing question with a link. The
      comparison page says "เทียบไม่ได้ ตอนปิดยังไม่มีประมาณการตัวนี้" and
      "ไม่มีตอนปิด" for a frozen forecast without a figure; the history table
      says the same for a missing previous season; every compared figure
      leads with the owner's words. The tax "cheaper" verdict stays
      withheld, as decided.
    - >-
      The real-Chrome matrix (952e78d) grew from 30 to 38 routes at 320,
      360, 393, and 412 pixels: unknown route, missing season, missing
      section, comparison before close, review without a draft, entry and
      review after close, the empty season list and history measured before
      any season exists, and the hub's loading fallback measured during a
      hydrated navigation whose data request is held back. Its first run
      found the recovery links on every not-found page at 21 pixels, under
      the 48-pixel rule; they are buttons now.
    - >-
      Application dependency and source checks found no AI, LLM, model API,
      prompt, embedding, vector store, or inference runtime surface. No
      schema changed.
  not_completed:
    - >-
      4b, the comprehension study, is not started; its protocol is decided
      by the owner now that 4a is ready, per the Batch 4 decision.
    - >-
      Every result wording in 4a is a hypothesis until 4b. The owner reviews
      the rewritten ⓘ sentences in DESIGN.md during the pre-merge
      walkthrough, since that text is theirs.
    - >-
      The leptos race is mitigated, not fixed. Reporting it upstream and
      removing the one-worker line on a fixed release are owner decisions.
    - >-
      Physical-device, non-Chromium, landscape, zoom, and altered-font proof
      remain open and are not claimed.

