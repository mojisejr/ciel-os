outcome:
  status: owner-walkthrough-open
  completed:
    - >-
      This record supersedes the repaired closeouts at application heads
      f9d3056 and 3037457 without changing the application head. The owner
      continued the local walkthrough on 2026-09-14 and found two things
      that keep Batch 3 open; they are recorded here so the next session can
      start from them rather than from memory.
    - >-
      Earlier repair, still standing: the fixed-costs page states counted
      depreciation from included assets. During the owner's walkthrough, including an asset in a
      season changed the result but the fixed-costs page said nothing about
      it, so the owner could not tell whether to enter it again. The page now
      states the counted depreciation with a link to the assets page and asks
      only about other regular costs; the hub status and the live figure on
      input pages count included assets. SSR and browser proof cover it.
    - >-
      The earlier repair at f9d3056 stands: this record also supersedes the
      original closeout at 11b0544. During the owner's walkthrough a repeat-row number field kept
      only the first typed digit: every list re-rendered on each keystroke
      and recreated the focused input. Lists now re-render only when a row is
      added or removed; the browser proof types five characters into a fresh
      variable-cost quantity and reads them all back.
    - >-
      Migration 202609130002 adds the two section-state columns (default
      unknown), the unclassified_expenses table, and a nullable total_amount
      with a check that refuses a total alongside quantity or unit price. A
      store test steps a legacy plan forward and back through it without
      changing its values; a legacy line still totals quantity times price.
    - >-
      Rows always mean entered items; an emptied list reverts to unknown,
      never to confirmed none; the store refuses confirmed none while rows
      exist and writes nothing. Confirmed none is a known zero for cost,
      cash flow, total, and cost per kilogram; an unknown section keeps only
      its dependents unavailable while revenue stays available.
    - >-
      Behavior change recorded rather than hidden: an unknown fixed section
      now stays unknown even when selected assets add depreciation. Before,
      depreciation alone was reported as the whole fixed cost. A plan with
      assets and no fixed rows must now confirm the manual section empty; the
      confirm-none control on the fixed-costs page does that in one tap.
    - >-
      Remembered expenses are captured on their own page with name, amount,
      and note, enter no total, survive leaving and returning, and are named
      by count on the hub, the live total, and the guided next step. Two
      familiar questions file each item as variable (with its kind) or fixed
      (cash or non-cash) with its amount intact; the capture page owns all
      three cost lists because classification is a move.
    - >-
      A variable line is answered either per unit or as one total; a
      total-only line contributes its total and no per-unit efficiency
      figure. Blank harvest, transport, and packing quantities show the
      applied sellable kilograms beside the field; explicit overrides and
      total-only lines show no such note.
    - >-
      The assets page leads with ของที่ใช้หลายปี and เงินก้อนที่ลงไป and keeps
      สินทรัพย์, ค่าเสื่อมราคา, มูลค่าคงเหลือ, อายุการใช้งาน, เงินลงทุน, and
      เงินทุนเริ่มต้น as secondary labels; its arithmetic is unchanged.
    - >-
      Defect found by the browser proof and fixed: a back navigation after a
      save could replay the owner page from the HTTP cache as it was before
      the save, reading as a lost answer. Owner pages are now served
      Cache-Control: no-store; the HTTP test asserts it and the journey
      passed twice in a row afterwards.
    - >-
      Application dependency and source checks found no AI, LLM, model API,
      prompt, embedding, vector store, or inference runtime surface.
  not_completed:
    - >-
      Defect: on the assets page, "รวมในฤดูนี้" saves but the page does not
      reload its data until a manual refresh. The page resource is keyed by
      plan id only (crates/web/src/assets.rs) and never re-fetches after the
      selection action completes. The browser proof missed it because its
      submitAndReload helper reloads after every submit; the proof must
      observe the change without a reload.
    - >-
      Owner design decision, agreed in conversation and not yet built: the
      fixed-costs page shows one list in two clearly labelled groups —
      "กรอกเอง" (editable rows, where the unknown / confirmed-none question
      lives) and "ของที่ใช้หลายปี · ค่าเสื่อม" (read-only rows derived from
      assets included in the season, each linking to the assets page) — with
      one total that matches the dashboard. Depreciation is a non-cash fixed
      cost; the pages differ by source, not by kind, and the owner found the
      split confusing. No schema or calculation change is needed. The
      counted-depreciation note added at 3037457 is superseded by this list
      once built.
    - Application pull request 15 stays draft until both items above are delivered and a fresh closeout cites the head.
    - Batch 4 is not implemented or authorized by this closeout.
    - Human comprehension and physical-device behavior remain unproved and are not claimed.

