    - COOKIE_SECURE flag, defaulting to false for localhost.
    - SMTP_TLS selecting STARTTLS with SMTP_USERNAME and SMTP_PASSWORD, defaulting to today's plaintext Mailpit path.
    - README "Run the container locally" section and .env.example names.
    - Container proof - responsive matrix and stall probe against the running container.
  out_of_scope:
