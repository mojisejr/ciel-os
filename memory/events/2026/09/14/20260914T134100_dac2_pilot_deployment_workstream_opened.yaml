    repository: dac2-durian-smart-account
    base: c97d71e0a53948e451fe5d0340b36af487e1d8b2
    branch: main
    working_tree: clean
  observed_in_application:
    - crates/web/src/main.rs binds 127.0.0.1:3000 from crates/web/Cargo.toml, runs one Tokio worker thread on purpose, sets the session cookie Secure=false, and runs migrations at start.
    - crates/web/src/mail.rs uses a plaintext builder_dangerous SMTP transport with Mailpit defaults and no credentials.
    - README.md records that a network deployment requires rate limiting, real SMTP, HTTPS, and the Secure cookie first, and that no deployment configuration exists.
    - No Dockerfile, .github/workflows, or deploy descriptor exists; .sqlx offline data exists; leptos_config 0.8.10 honours LEPTOS_* environment overrides.
  research_basis:
    - Public pricing and documentation pages of Render, Koyeb, Neon, Supabase, Aiven, Fly.io, Google Cloud Run, Cloudflare, Brevo, and Resend read on 2026-09-14; recorded in the plan as external, unverified claims.

