workstream:
  id: dac2-pilot-deployment-001
  lane: single
  objective: >-
    Put the DAC2 application on a public HTTPS address, backed by a hosted
    PostgreSQL and a real mail relay, at zero recurring cost, so that likely
    orchard owners can open it on their own phones and the comprehension
    study 4b of dac2-guided-inputs-001 becomes possible.
  scope:
    - Slice 1, container and environment-driven configuration.
    - Slice 2, network gate - rate limiting, secure-cookie requirement, pilot notice, startup checks.
    - Slice 3, GitHub Actions build publishing an image to GHCR, no automatic deploy.
    - Slice 4, owner-provisioned Render, Neon, and Brevo, first deploy, public proof, runbook, measurements.
  out_of_scope:
    - Any change to results, wording, schema, calc, close snapshot, or forecast_mode.
    - Custom domain, paid instances, backups, retention, monitoring, alerting.
    - The 4b protocol itself and the leptos race upstream report.

outcome:
  status: decided
  decision: >-
    The owner opened this workstream on 2026-09-14 after Batch 4a of
    dac2-guided-inputs-001 merged at application c97d71e, observing that 4b
    cannot run while the application is reachable only on the owner's
    machine. The owner chose to deploy before 4b and asked for a stack that
    is free in every part. After a research pass the owner accepted the
    stack recorded in the plan: Render free web service running a Docker
    image, Neon free PostgreSQL over the direct endpoint, Brevo free SMTP,
    GitHub Actions building to GHCR, a Render subdomain. Vercel was rejected
    because the application is a long-running Axum process whose one-worker
    stall mitigation a function runtime cannot guarantee; Supabase was
    rejected because its seven-day pause would leave a participant facing a
    dead database. This decision opens the workstream and its plan revision
    0.1 and authorizes no slice; slice 1 waits on its own decision.
  constraints:
    - Every external account, credential, and external write is the owner's; the agent prepares descriptors and operates the Render MCP only on explicit per-action authorization.
    - No secret enters a repository file, event, pull request, or response.
    - The deployment is a pilot carrying study data only and says so on its surface.
    - The one-worker mitigation is carried unchanged; no schema, calc, or wording change enters this workstream.
    - Free-tier figures in the plan are external claims re-verified at signup in slice 4.

