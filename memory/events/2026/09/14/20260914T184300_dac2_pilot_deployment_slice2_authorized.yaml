    Pass the application start gate on clean fetched main at c75d8bd, create
    feat/pilot-network-gate, implement the network gate with tests, open a
    draft application pull request from the first commit, re-run the
    responsive matrix and the container proof, and record the slice-2
    closeout on this HQ branch.
  acceptance_check:
    - Tests show each guarded route refusing after the configured count and releasing after the window.
    - An https base URL with an insecure cookie stops the process with the reason named; with COOKIE_SECURE=true the cookie carries Secure.
    - The pilot notice renders at 320, 360, 393, and 412 pixels and the responsive proof passes.
    - scripts/check.sh and scripts/check-container.sh pass.
