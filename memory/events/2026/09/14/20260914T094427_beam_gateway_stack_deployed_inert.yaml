lessons:
  - >-
    Merging a stacked PR without deleting its branch leaves the next PR
    pointed at the old base; the next merge then lands on the wrong branch.
    Delete-branch on every merge, and confirm the retarget before the next.
  - >-
    GitHub does not recompute a PR's diff when its base branch moves; the
    Files-changed count can lag the real merge-base. Re-setting the base
    forces a refresh; local git diff base...head is the truth meanwhile.
  - >-
    Production secret writes and PR state flips are the owner's clicks in
    this session's permission mode; prepare the exact command or script,
    never route the write through a peer session.

