outcome:
  status: decided
  decision: >-
    On 2026-09-30 the agent recommended dropping port 5000 from the
    application, because macOS gives it to AirPlay. The owner replied
    "เลิกตามที่คุนแนะนำครับ", and added that if the plan needed no change
    the agent should go ahead and record the decision ("ถ้าไม่ต้องคุนจัดการ
    ได้เลย แล้วอาจจะบันทึก decision ของเราเอาไว้หน่อย"). The plan did need
    one change, stated below and in revision 0.6, and it stays inside what
    the owner decided. His "ลุยยาวๆ" of 2026-09-28 stands for going on
    slice by slice, each with its own decision.
  correction: >-
    Revision 0.5 and the 2026-09-28 records said the port list had no
    simulator choice and that the application defaulted to
    tcp:127.0.0.1:5000. Both are wrong. The list already offers
    `simulator (tcp:127.0.0.1:5000)` (crates/ui/src/admin.rs, since slice
    4). The stored port has no default and stays empty until saved
    (settings() in crates/app/src/logic.rs). On the 2026-09-28 walk that
    entry was chosen, and the application met AirPlay on 5000. The agent
    had read only the serial half of the list. The HQ coordinator carried
    the "default" wording to the owner, and this record corrects it. The
    owner's decision is unaffected: 5000 leaves the application.
  authorizes:
    - >-
      Slice 10 of plan revision 0.6, on a topic branch from smc-v2 main
      444cc48, delivered as a draft pull request. The existing entry becomes
      `Simulator (ทดสอบ)` on tcp:127.0.0.1:5012. A stored 5000 from an
      earlier build is shown as the old simulator port with a note to
      choose again. The banner `เชื่อมต่อกับตู้จำลอง ไม่ใช่ตู้จริง` shows on
      every screen while the endpoint is TCP. The switch to and from the
      simulator is recorded in actions, and every action taken while on it
      is marked by a new column in a reviewed migration, shown on the
      บันทึก page and in the CSV. The append-only triggers stay. DESIGN.md
      is updated.
  does_not_authorize:
    - Slice 11.

