  completed:
    - >-
      cu12-simulator 9762268 on feat/console-binary, branched from main
      0d7c4b1, is pushed as pull request 7. The new binary cu12-console
      puts the wire on tcp:127.0.0.1:5012 and the console on
      http://127.0.0.1:5013, starts with physics on at 550 ms and every
      door closed, and binds both ports before printing. It prints the wire
      address first and opens the browser. On a taken port or a bad
      variable it gives a Thai message and waits for Enter. tcp.rs gains
      serve_listener, and serve_loopback calls it, so the cu12-simulator
      binary is unchanged. release.yml is workflow_dispatch only. It tests
      and builds on windows-latest and uploads cu12-console-windows-x64.exe
      to the release named by its tag input.
      scripts/build-macos-console.sh zips the Apple Silicon build, because
      a bare file downloaded by a browser loses its execute bit. README
      gains a team section with the first-open steps for an unsigned file.
    - >-
      Checks: cargo test 48 passed, 0 failed (42 before plus 6 new). fmt
      --check, clippy --all-targets -D warnings, and cargo check --target
      x86_64-pc-windows-msvc --all-targets pass. The macOS zip was built
      and unzipped. The binary is an arm64 Mach-O with rwx mode, ad-hoc
      signed. Run with no variables, it printed tcp:127.0.0.1:5012 first
      and served the state (hooks FF 0F) and the Thai page on 5013.
