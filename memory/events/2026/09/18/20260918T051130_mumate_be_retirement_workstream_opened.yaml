workstream:
  id: mumate-be-retirement-001
  lane: single
  objective: >-
    Take the legacy NestJS backend mootech-be out of the MuMate system
    completely, so v1 and v2 both keep working with mootech-fe talking only to
    the bazi engine and Supabase, and Render can be suspended and deleted -
    before the server move, so the move carries two containers, not three.
  scope:
    - Open the workstream at plan revision 0.1 with four slices and authorize slice 1 (identity, consent, friend writes, image upload move into the frontend).
    - Record the four decisions the owner took this morning and the four open questions with their defaults.
    - Keep the three read-only research reports beside the plan as its evidence.
  out_of_scope:
    - Slices 2-4; each needs its own decision after the preceding closeout.
    - Any change to mootech-fe, mootech-be, bazi-sft-dataset, Render, or Vercel in this record.

outcome:
  status: decided
  parallelism: approved
  decision: >-
    On 2026-09-18 morning the owner raised a concern before the server move:
    the backend costs money and would otherwise have to move too, so retire it
    first, keeping v1 and v2 working "100%" with only the frontend and the
    engine left. The owner authorized read-only research by sub-agents. Three
    passes ran against mootech-fe main 1312292, mootech-be main 57da359 and
    bazi-sft-dataset pdf-dev 04bc2bd and are filed under
    workstreams/mumate-be-retirement-001/research/. What they established:
    the backend has no user authentication of its own; nothing but the
    frontend calls it; v1 payment is dead in fact (sales closed 2026-08-24,
    expired Omise key, webhook already moved to v2); the frontend already
    declares every backend table but one (consent); 26 live call sites
    collapse into eleven pieces of work, ten of them small, and one large -
    the v1 chart compute - whose correctness can be proven by replaying every
    stored log_calculate row. The agent presented three paths for the chart
    (verbatim port; engine substitution, which breaks v1 my-destiny; verbatim
    port proven by replay) and recommended the third. The owner answered
    "เอาตามนี้ เปิด workstream เลย". This record opens the workstream and
    authorizes slice 1. The workstream overlaps mootech-fe with
    mootech-ga4-instrumentation-001 (active, slice 3 parked until day 7) and
    with the parked beam lane; the file sets are disjoint (identity, consent,
    friend, upload routes versus GTM/GA and lib/payment), and the owner's
    direction to start now is recorded here as approval of that overlap.
  authorizes:
    - Slice 1 of plan revision 0.1 - register-login, consent, member-with-friend writes, and image upload served by mootech-fe, on a draft pull request, with no behaviour change elsewhere.
  does_not_authorize:
    - Slice 2 (chart port + replay), slice 3 (v1 leftovers, payment freeze, dead code), slice 4 (backend leaves the system); each needs its own decision.
    - Suspending or deleting the Render service; merging any pull request.

