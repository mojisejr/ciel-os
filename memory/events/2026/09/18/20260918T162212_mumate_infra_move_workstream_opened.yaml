workstream:
  id: mumate-infra-move-001
  lane: single
  objective: >-
    Build a DigitalOcean replacement that matches the FE + BE + Bazi system
    launched by the product team, keeps Supabase as the single source of truth,
    and moves the real domains under an owner-controlled maintenance window.
  scope:
    - Open plan revision 0.1 and authorize slice 1, container parity with no production change.
    - Keep launch and migration as independent lanes joined only by the final production Git revisions.
    - Record the two-hour maintenance budget, owner-controlled flip, and default seven-day warm rollback window.
  out_of_scope:
    - Product launch ownership or launch decisions.
    - Supabase migration, backend retirement, product feature work, or provider cancellation.
    - Any DigitalOcean resource, DNS, environment, database, or production change in this decision.

outcome:
  status: decided
  parallelism: approved
  decision: >-
    On 2026-09-18 the owner reported that the product team will launch v2 on
    the existing hosting independently. After two alignment rounds, the owner
    confirmed that this lane moves the launched topology exactly first; keeps
    the current Supabase project as the unchanged single source of truth;
    builds and proves DigitalOcean before cutover; places users behind the
    existing passkey-enabled maintenance gate; allows up to two hours for the
    flip and proof; and retains the old stack for seven days by default or an
    explicitly accepted shorter period. The owner controls maintenance, DNS,
    environment, cron, and both hosting sides. The company DigitalOcean Team
    exists and billing is ready. Slice 1 is authorized because it changes only
    container/readiness support and cannot affect production before review and merge.
  authorizes:
    - Slice 1 of plan revision 0.1: container and readiness parity for FE, BE, and Bazi on draft application pull requests.
  does_not_authorize:
    - Creating or deleting a DigitalOcean resource.
    - Creating a private GitHub repository or storing any secret.
    - Deploying, changing DNS or provider settings, enabling a scheduler, flipping traffic, or cancelling a service.
    - Slices 2-5; each needs a new owner decision after the preceding closeout.

