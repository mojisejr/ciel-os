  objective: >-
    Give the simulator an opt-in door-physics mode that matches what the
    owner recalls of the real cabinet, and tester-provoked faults, so SMC v2
    can be built and proven against the simulator alone.
  scope:
    - Open the workstream at plan revision 0.1; slice 1, the opt-in door physics, waits for the owner's own word.
  out_of_scope:
    - Slice 2 (faults and trace) until the application's gateway exists; any hardware-fidelity claim; USB, COM, electrical or multi-board work.

outcome:
  status: decided
  decision: >-
    While opening smc-v2-app-001 on 2026-09-18 the owner asked whether the
    simulator had to be finished first or the application could start
    against it as it is. The agent's reading: the simulator already covers
    the application's happy path, and what it lacks - a board that does
    not answer, error ASK codes, a wire trace - is best shaped once the
    application's gateway exists. The owner agreed. The owner then
    recalled that after Unlock the real cabinet's door pops open and the
    hook reads 0 until closed by hand; the agent proposed an opt-in
    physics mode so that developing against the simulator does not need a
    typed "hook N unlocked" after every unlock, with the default left
    unchanged for the existing tests, as a small slice to run beside the
    application's first slice. This decision opens the workstream and
    authorizes no slice; slice 1 starts on a separate decision once the
    owner says so, and slice 2 waits for the gateway.
  authorizes:
    - Nothing. The plan is recorded; no slice may execute on this event.
  does_not_authorize:
    - Slice 1 until the owner authorizes it; slice 2 until smc-v2-app-001 slice 1 has shown which faults the gateway must survive.

