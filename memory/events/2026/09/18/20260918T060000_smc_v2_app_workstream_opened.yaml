workstream:
  id: smc-v2-app-001
  lane: single
  objective: >-
    Rebuild the Smart Medication Cart - a 12-slot patient-medication cabinet
    for a hospital ward on one KERONG CU12 board - lean, easy to sell and
    repair, liked by the people who use it, robust, true to the hardware,
    and built to completion against the CU12 simulator only.
  scope:
    - Open the workstream at plan revision 0.1 and record the owner's agreement; slice 1 waits for the owner's own word.
  out_of_scope:
    - Real hardware, USB-to-RS485, Windows COM against a cabinet, a second cabinet, scanning from the home screen, any medical-device or compliance claim.

outcome:
  status: decided
  decision: >-
    On 2026-09-18 the owner set the goal: build SMC v2 anew from the
    mistakes of the legacy application, lean, practical in a hospital,
    easy to sell and repair, liked by its users, robust, not fighting the
    hardware - and finish it as a usable application against the simulator
    alone, with no real hardware yet. The owner first asked whether the
    simulator was ready for that. The agent read the simulator, the CU12
    manual and the legacy controller and answered that it covers the happy
    path already and lacks only provoked faults, which are better shaped
    once the application's gateway exists; the owner accepted. The owner
    then recalled the cabinet's behaviour from use - after Unlock the door
    pops open and the hook bit reads 0 until a person closes it - and
    confirmed that the simulator's twelve-hook mapping matches the cabinet
    in use. The agent then ran a syncup of seventeen questions in three
    rounds, each with its lean; thirteen leans held and four were
    corrected by the owner: the ward PC has a mouse, keyboard and a
    barcode scanner rather than a touch screen; a secure offline license
    with expiry is wanted, not cut; the UI is to be the legacy UI
    identically, captured into DESIGN.md first; and "audit" means a
    user-facing who-did-what log plus a separate technician-facing system
    log for debugging, not a tamper-evident chain. The full agreement is
    in the plan's owner-agreement section. The owner asked for a checkpoint
    commit before going on; this decision opens the workstream and records
    the agreement. It authorizes no slice: slice 1 starts on a separate
    decision once the owner says so.
  authorizes:
    - Nothing. The plan and the registry are recorded; no slice may execute on this event.
  does_not_authorize:
    - Slice 1 - the CU12 gateway - and slices 2 to 6; each needs its own decision.
    - Creating the GitHub remote; the owner creates it or gives the agent an explicit go at the time.

