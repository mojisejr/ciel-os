  objective: >-
    Open a workstream for moving mootech-fe and the bazi engine from Vercel to
    DigitalOcean on the owner's terms: DigitalOcean must already do 100% of
    what Vercel does, the lost instant rollback is replaced by a designed and
    measured one, and a real staging environment survives the move.
  scope:
    - Open the workstream at plan revision 0.1 with seven slices and seven owner decisions (D1-D7), each with the agent's recommendation.
    - File the three read-only research reports of 2026-09-27 beside the plan.
    - Link, not reopen, the completed mumate-infra-move-001 and mumate-control-room-ops-001.
  out_of_scope:
    - Authorizing any slice. Slice 1 needs the owner's answers to D1-D3 and its own decision.
    - Any change to mootech-fe, bazi-sft-dataset, mumate-infra, a droplet, DNS, Vercel or Render.

outcome:
  status: recorded
  parallelism: none
  decision: >-
    On 2026-09-27 the owner asked how ready MuMate is to leave Vercel, then
    asked for detailed research focused on what must be done additionally
    when not on Vercel. Three read-only passes ran (mootech-fe fd3220b,
    bazi-sft-dataset origin/pdf-dev 72ca612, mumate-infra origin/main cc3ce8b
    plus the ciel-os records) and the HQ session re-read the highest-impact
    claims in code. The owner then said DigitalOcean must be 100% before any
    move, that Vercel's easy rollback is what we lose because we would run
    everything ourselves, that retiring the staging role would leave no test
    ground so a staging droplet must be considered, and to open a new
    workstream for this alone, linking, closing or parking older ones as
    needed. This record opens it. Nothing needed closing or parking:
    mumate-infra-move-001 and mumate-control-room-ops-001 are already completed
    and are cited; the active be-retirement and login lanes are observing to
    2026-10-04 and are sequenced ahead of any flip by D7.
  not_authorized:
    - Every slice of plan revision 0.1.
    - Creating a droplet, changing staging's connections or keys, or any spend.
    - Parallel lanes; the overlap with the observing lanes on mootech-fe and bazi-sft-dataset is put to the owner with slice 1.

