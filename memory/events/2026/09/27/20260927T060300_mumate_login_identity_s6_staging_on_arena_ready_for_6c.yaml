  completed:
    - >-
      SAFETY CHECK FOUND THREE THINGS THE PLAN DID NOT SAY. (1) bazi runs the
      QI engine, including referral and mission QI, and writes through
      APP_DATABASE_URL, which pointed at production. The compose file sets the
      FE's BAZI_BASE_URL to http://bazi:3000, overriding fe.env, so the shadow
      FE calls the shadow bazi. That bazi was repointed too, which 0.9's "only
      if the Caddy log shows it" would have done after the fact. (2)
      LOGIN_ASK_BEFORE_CREATE was unset on the shadow, so slice 5's question
      would not have appeared. It is now true, as on production. (3) The shadow
      FE ran a slice-4 branch build (c23440f). It now runs main.
    - >-
      CHECKED SAFE. BE crons: both @Cron jobs are gated by
      MORNING_CRON_ENABLED=false, MIGRATION_ENABLED=false, and
      DB_SYNCHRONIZE=false. The BE's login path makes no bazi call. The FE holds
      no QSTASH_TOKEN. bazi's runtime reads only getDatabaseUrl
      (APP_DATABASE_URL ?? DATABASE_URL). The shadow bazi (722cdf1) is 9 commits
      behind pdf-dev, and none of them touch QI, referral, missions or the DB.
    - >-
      ARENA UP from s3://mumate-backups/pg/mumate-2-20260926T091103Z.sql.gz
      (taken 2026-09-26 16:12 Bangkok, before D8): 185 tables, 5,121 users,
      5,308 provider rows, 2 psql errors, expires 2026-10-03. The fresh Google
      account used for D8's "no" path is therefore unknown in the arena and can
      be reused.
    - >-
      F2 PROVEN FOR THE DATABASE. pg_stat_activity on the arena shows exactly
      one connection each from be (172.18.0.2), fe (172.18.0.4) and bazi
      (172.18.0.5). Health: fe 200 db ok sha e97ede7, dbLatencyMs 2; be db ok
      sha 0705378, dbLatencyMs 1; bazi 200. identity-status answers through
      app.staging.mumate.co.
