  execution_phase: "5"
  completed:
    - >-
      FIX A. The self-heal's mint moved unchanged into lib/auth/mint-member.ts,
      and the self-heal now calls it. /v2/welcome-back mints MEMBER_ID for the
      proven account before it attaches, so the connected screen no longer
      meets a valid session with no member cookie.
    - >-
      BELT. After a 401, the connected screen reads /api/profile once more when
      MEMBER_ID arrives. A member who is really signed out keeps the card.
    - >-
      FIX C. POST /api/auth/identity-hold holds the signed session's identity in
      a 10-minute, HttpOnly, domain-prefixed HMAC cookie. It holds only an
      unowned identity, accepts only same-origin requests, and rejects a LINE
      session whose providerId and id_token disagree. After the proof, POST
      /api/auth/identity-attach spends the cookie through linkProvider under
      every link rule, offers no merge from a hold, and clears the cookie on
      every exit. If there is no hold, the page falls back to the link start
      route.
    - >-
      THE OWNER'S WALK AS A TEST. scripts/identity-yes-seam.test.tsx uses the
      real question screen with its real hold, attach and mint, the real
      connected screen, a cookie jar, and /api/profile's actual rule. It shows
      OAuth started once, MEMBER_ID minted, "เชื่อม Google เรียบร้อยแล้ว" shown, and
      no "ไม่พบข้อมูลผู้ใช้".
  lessons:
    - >-
      A FLOW THAT SWITCHES WHO IS SIGNED IN MUST RE-ESTABLISH EVERY CREDENTIAL
      THE APP READS, NOT ONLY THE ONE IT CHANGED. The session was right; the
      member cookie that /api/profile trusts was never minted. The first slice-5
      PR proved each unit and no seam between them. The fix for that is a test
      shaped like the walk, not more unit tests.
    - >-
      WHAT THE OWNER FEELS AS A FAULT IS A REQUIREMENT, EVEN WHEN THE CODE IS
      CORRECT. The second Google screen was by design, and it still read as a
      bug. Holding the verified identity removed it at the same proof standard.
    - >-
      A MUTATION THAT STAYS GREEN IS A FINDING TO READ, NOT A FAILURE TO HIDE.
      Removing hold's "owned → refuse" line left the tests green because the
      next guard refuses the same case. It is recorded as defence in depth, not
      presented as all red.
    - >-
      A TIMESTAMP WRITTEN BY GUESS BECOMES A PERMANENT FALSEHOOD. The
      2026-09-26 21:55 closeout was stamped about 50 minutes ahead of when it
      was written. From this session on, recorded_at comes from `date`.

