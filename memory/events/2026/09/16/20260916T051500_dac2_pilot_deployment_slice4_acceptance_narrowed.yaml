    friends use it and collect defects for a later change rather than finish
    the close-and-history steps as a formal proof now. Revision 0.2 of the
    plan records the narrowed acceptance, lists what is deferred and why, and
    assigns the deferred items to dac2-guided-inputs-001 as its first items
