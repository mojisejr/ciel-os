  objective: >-
    Give the DAC2 application a name of its own - ตาไก๊, spoken บัญชีตาไก๊,
    Takai in English - and an entry screen that a durian grower recognises at
    once and passes on by word of mouth, with Durian Academy cohort 2 as the
    byline rather than the name, so later cohorts and teachers can adopt it.
  scope:
