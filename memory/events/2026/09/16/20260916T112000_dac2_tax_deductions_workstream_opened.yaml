workstream:
  id: dac2-tax-deductions-001
  lane: single
  objective: >-
    Let an orchard owner write down, for a season, what they deduct from
    taxable income and how much - one line per deduction, a name and an
    amount - so the tax estimate uses their own deductions instead of a
    fixed 60,000, and so they can open that season later and see what they
    deducted that year.
  scope:
    - Open the workstream at plan revision 0.1 and authorize slice 1, the DESIGN.md section, with no code.
  out_of_scope:
    - Income from outside the orchard, the bracket ladder, the flat-expense rate, deduction caps or rules, the history page.

outcome:
  status: decided
  parallelism: approved
  decision: >-
    On 2026-09-16, after dac2-takai-identity-001 closed, the owner asked
    whether the application had any way to enter tax deductions and whether
    the 60,000 was fixed. The agent read calc::tax and the tax screen and
    confirmed both: a constant, no input, nothing stored. The owner then
    stated the need - lines of name and amount, entered one by one, per
    season, kept so the year can be looked at again - and answered two
    rounds of alignment questions. The owner chose: the owner enters every
    line and every amount, with no pre-filled personal allowance
    ("ต้องมากรอกเองแต่แรกดีกว่า"); until something is entered the estimate
    deducts nothing and says so, with a way to the section (Q9 = ก);
    suggested names as autocomplete, amounts always typed ("ให้เค้าใส่เอง");
    lines belong to the season; a closed season locks them; income from
    outside the orchard is not touched ("focus ที่สวนอย่างเดียว"); looking
    back means opening that season. The owner confirmed the shared summary
    with one word ("ตรง"). Both finished DAC2 workstreams on this branch
    still occupy the application project until hq/20260915 reaches
    origin/main; the owner directed this work to start on the same branch
    now, and that overlap is recorded here as approved. Slice 1 is
    authorized by this decision.
  authorizes:
    - Slice 1 of plan revision 0.1 - the DESIGN.md section on a draft application pull request, no code.
  does_not_authorize:
    - Slice 2 code or slice 3 deploy; each needs its own decision after the preceding closeout.

