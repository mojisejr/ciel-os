  decision: >-
    On 2026-09-16 morning the owner asked what พี่ปอง wanted to see and
    whether GA or GTM could show it. The agent read mootech-fe main d82ee31
    and the engine pdf-dev 1de7235: GTM has no reports; GA can show DAU,
    recurring, login and sign_up only once member_state is registered as a
    custom dimension, which no slice had done; /ops shows total members and
    new members; no screen shows the percentage, because GA never holds the
    denominator and /ops has no numerator. The owner weighed the Data API
    pull and database-side counting, judged both heavier than the moment
    needs, and chose light-to-heavy ("เริ่มจากเบาไปหนัก ทำให้เค้าเห็นของที่
    เค้าต้องการเห็นก่อนแล้วค่อยเดินต่อ"): run slice 3 as revised, deliver the
    report and runbook, and revisit the /ops percentage with the seven-day
    numbers in hand. The owner then said start ("ผมว่าเราพร้อมเริ่มเลยนะ ทำใน
    hq branch นี้แหละ ... เริ่มกันเลยครับ"). The owner approved this lane
    continuing in parallel with the beam-gateway lane on mootech-fe when
    plan 0.2 was authorized; slice 3 touches no mootech-fe file, and the
    approval is repeated here so Wake reads it from the latest decision.
  constraints:
    - No mootech-fe change in this slice. The lane's writes are workstreams/mootech-ga4-instrumentation-001/** and memory/events/**/*mootech_ga4_* on hq/20260915.
    - The seven days start on the first day the Exploration shows a row with member_state = member, not on the v4 publish date; the closeout names that date.
