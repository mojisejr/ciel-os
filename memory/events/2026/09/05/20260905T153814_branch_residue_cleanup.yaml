  decided_by_gate_as_written:
    - branch: chore/reconcile-pr-workflow-adoption
      revision: ec5abac
      log_origin_main_to_branch: empty
      pull_request: 17, merged
    - branch: docs/ciel-wake-evidence-boundary
      revision: 7e1c5fb
      log_origin_main_to_branch: empty
      pull_request: 14 and 15, merged
  undecided_by_gate_as_written:
    branches:
      - backup/pr-workflow-phase2-closeout
      - chore/adopt-local-main-history
    revision: 7c0b1260b49e829a147660914eddad4b16f0a812
    why_the_gate_stalled: >-
      git log origin/main..7c0b126 reported one commit, so the gate as written
      forbids deletion. The prior closeout evt_20260905T150410 recorded these as
      commits outside main that must not be cleaned, which is what the gate
      reports and is not what the repository contains.
    what_the_repository_actually_contains: >-
      7c0b126 was re-applied onto main as 8c378cc, the commit directly following
      the PR 16 merge 40071bf. The two commits carry the same tree, so the
      content is already in main under a different commit id.
    proof:
      - "git rev-parse 7c0b126^{tree} and 8c378cc^{tree} both report cb7df39716232a65a4a540dd40c24f63f921f563."
      - "diff of the two patches is empty."
      - "git cherry -v main 7c0b126 prints a leading minus, which is Git's own report that the change is already upstream."
      - "git merge-base --is-ancestor 8c378cc main succeeds."
      - "The event file 20260904T065816_pr_workflow_phase2_prepared.yaml is byte-identical between 7c0b126 and main."
      - "workstreams/ciel-pr-workflow-policy-001/PLAN.md on main is six commits further evolved than the copy on 7c0b126, so the branch held the older state, not a newer one."
    conclusion: >-
      Deleting the two branches discarded no content. Only a duplicate commit id
      was lost.
  finding:
    what: >-
      An empty git log origin/main..<branch> proves a branch is merged, but a
      non-empty one does not prove anything is unmerged. A commit re-applied
      onto the target, as a rebase or a cherry-pick does, keeps its own id
      forever and so keeps failing the range check while its content sits in
      main.
    consequence: >-
      The gate has a false negative that preserves residue indefinitely and
      cannot clear itself. It produced exactly that outcome here: two branches
      survived a documented cleanup pass and were then recorded in a closeout as
      unsafe to delete.
    what_would_close_it: >-
      git cherry <target> <branch> answers the content question directly and is
      the check actually used above. Whether README.md should adopt it is an
      owner decision, not a change this closeout makes.
  checks:
    - git status --short
    - git fetch origin --prune
    - git rev-parse HEAD and origin/main
    - bun run bin/ciel.ts wake
  result: >-
    After the deletions, HQ reports main alone locally and origin/main alone
    remotely, HEAD equals origin/main at eac3b5e, and the working tree is clean.
    Wake reports validationErrors and validationWarnings empty, reconciliation
    expected-evolution, and every bound checkout clean.

