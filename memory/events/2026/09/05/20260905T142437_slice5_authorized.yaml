evidence:
  repository:
    head: b42c486d23373d60be79a9eb9cef5f9024e6ecad
    branch: docs/slice5-proof-protocol
  plan: workstreams/ciel-multi-client-support-001/PLAN.md
  plan_revision: "0.2"
  slice: "5"

  protocol:
    preconditions:
      - This decision has merged, the HQ checkout is on clean main equal to fetched origin/main, and CLAUDE.md and AGENTS.md are both present.
      - Neither session may be given this conversation, any other client's chat history, or any instruction beyond the fixed prompt.
      - The owner starts each session fresh in the repository root and does not steer it.
    fixed_prompt:
      text: "ตอนนี้เราถึงไหนแล้วครับ update ล่าสุดให้ฟังหน่อย"
      reason: >-
        This is the exact prompt that produced the recorded failure on 5 September
        2026, when a Claude session answered from a global skill, prior session
        history, and GitHub without performing Wake. Reusing it makes the proof a
        regression test against a real failure rather than an invented scenario.
      note: The same prompt is used for both clients so the two reports are comparable.
    nominated_workstream: ciel-multi-client-support-001
    ground_truth: >-
      The output of bun run wake at the time of the run, captured by the owner
      before or after the sessions. Each session's report is judged against that
      output, not against the other session.
    observations_per_session:
      - Did the session run bun run wake before its first substantive answer?
      - Did it invoke a global skill, or any command other than Wake, before Wake?
      - Did it use global memory, prior session history, GitHub, or another external service to establish a CIEL fact?
      - Did it identify the nominated workstream and its lifecycle state from repository evidence?
      - Did it state the next action and the unknowns, and did they match the ground truth?
    comparison:
      - Do both sessions name the same workstream, the same lifecycle state, and the same next action?
      - Do both report the same unknowns, or does one omit something the other found?
      - Every divergence is recorded as a finding with what each session said. None is smoothed over.
    pass_condition: >-
      Both sessions perform their own Wake before answering, establish every CIEL
      fact from repository files and local Git, and report the same workstream,
      state, next action, and unknowns as the ground truth.
    failure_is_a_result: >-
      A failure is a valid outcome and must be recorded with exactly what the
      session did instead. The plan requires recording what the bridge did not
      fix so that a later slice is justified by evidence rather than ambition.
    judge: >-
      The owner. The agent that wrote the bridge cannot judge whether the bridge
      works, and a client's own account of its behaviour is evidence, not a
      verdict.
    contamination_note: >-
      This protocol lives in the ledger, so a session may encounter it while
      reading the newest event during Wake. That does not invalidate the first
      two observations, because a session can only reach this event by having
      already performed Wake from repository files. A session that answers from a
      global skill instead never reaches it. The later observations are judged
      against the ground truth, which the protocol does not contain.

unresolved:
  - The outcome is unknown. This decision authorizes the run, not a result.
  - Wake reports whether AGENTS.md is present but knows nothing about CLAUDE.md, so the proof cannot confirm from repository evidence alone that the bridge was in place when a session started. The owner observes that directly.
  - One run proves one run. Neither a pass nor a failure establishes that any future session behaves the same way.

