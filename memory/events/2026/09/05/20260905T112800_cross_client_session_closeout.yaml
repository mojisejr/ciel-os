  lifecycle_defect:
    location: src/portfolio/read.ts isTerminalCloseout, lines 399 to 408
    observed: >-
      After both merges and full branch cleanup, Wake still reports
      cu12-simulator-sprint-003 as needs-owner-decision with the detail
      "No execution phase is selected; no owner decision can authorize execution",
      while ciel-pr-workflow-policy-001 and cu12-e2e-lab-001 report completed.
    cause: >-
      isTerminalCloseout joins a closeout to its plan on execution_phase. The
      sprint-003 closeout records execution_phase "1" while the plan header
      records "none", which the reader parses as null. The comparison fails, so
      deriveTerminalLifecycle returns null and the entire post-merge path of
      awaiting-owner-merge, merged-needs-sync, merged-needs-cleanup, and
      completed is skipped.
    policy_conflict: >-
      The owner's current policy is that a plan records intended scope and
      acceptance criteria and never carries execution or implementation state.
      The two workstreams that still report completed do so only because their
      plan headers retain pre-policy execution markers. Under the current policy
      no workstream can reach a terminal lifecycle.
    proposed_fix: >-
      Stop joining on execution_phase. Match a terminal closeout on workstream
      id and plan_revision, and treat execution_phase as optional so a plan
      header of "none" does not block the match. This requires an owner-approved
      workstream against the CIEL runtime and was not attempted here.
  cross_client_findings:
    friction:
      - Claude Code loads CLAUDE.md and does not read AGENTS.md, so this session began with no operating contract in context and answered from a global skill instead.
      - A global skill matched a Thai status question and ran before the mandatory Wake procedure.
      - This client's defaults reach for global memory, prior session transcripts, and GitHub, which are the three sources the Wake evidence boundary excludes.
      - AGENTS.md carries no rule about commit trailers, while this client's host instructed a session-locator trailer that the portfolio-flow plan forbids. The owner resolved it by keeping the repository's no-trailer convention.
      - The agent withheld the draft-to-ready transition although README.md line 143 assigns that action to the agent after proof.
      - This event was first written without any checkpoint reference. It passed validation and was committed and pushed, yet it silently degraded Wake reconciliation to unknown. The owner's question about a fresh session exposed it before the merge.
    root_cause: >-
      AGENTS.md states the draft rule in one line, but the operative procedure,
      including the ancestor proof, the review template, who advances a pull
      request, and branch cleanup, lives in README.md and in decision events that
      AGENTS.md does not reference. A client that reads only AGENTS.md fills the
      gap with its own defaults and sounds correct while doing so.
    worked_without_help:
      - bun run wake was self-explanatory and needed no external instruction.
      - The plan and event structure made the pending work identifiable without any prior conversation.
      - Proof Charter section 1 was satisfied across two different clients rather than two sessions of one client.
  checkpoint_defect:
    location: src/events/validate.ts against src/wake/read.ts findCheckpoint
    observed: >-
      An event with no evidence.repository.head, evidence.repository.base_revision,
      evidence.base_revision, or evidence.prior_checkpoint passes validation, but
      Wake then reports reconciliation "unknown" and makes no ancestry claim.
    cause: >-
      The validator requires evidence to exist but never inspects its contents,
      so the one field Wake needs to reconcile recorded history against live Git
      is optional in practice. This is the same honor-system gap as recorded_by,
      where a wrong or missing value is invisible to every automated check.
    proposed_fix: >-
      Have the validator warn or fail when a closeout carries no checkpoint
      reference that findCheckpoint accepts, so a client cannot silently disable
      reconciliation for every session that follows.
  environment_note: >-
