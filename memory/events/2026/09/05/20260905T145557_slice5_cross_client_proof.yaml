    effect: >-
      Observations one through three are unaffected, because a session reaches the
      protocol only after performing Wake from repository files. Observations four
      and five are partly contaminated and their strength was overstated when the
      protocol was written.
    author: This agent wrote that protocol and its incorrect claim.
