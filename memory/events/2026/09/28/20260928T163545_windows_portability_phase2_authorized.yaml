      bun run check, the child divergence, and cargo test.
    - >-
      Parallel working: the Windows machine commits only this workstream's
      paths (its events, its PLAN.md, docs/portability/) and pushes only
      win/*. The Mac merges it into the round branch at a quiet moment;
      the Mac stays primary.
  does_not_authorize:
