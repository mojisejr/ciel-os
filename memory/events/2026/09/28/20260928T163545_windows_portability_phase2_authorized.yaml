  authorizes:
    - >-
      Phase 2 of plan revision 0.1. The Windows machine clones ciel-os at the
      pushed round branch with core.autocrlf=false (the repository has no
      .gitattributes) into its own branch win/20260928, and clones
      cu12-simulator into checkouts/. It follows WINDOWS_BOOTSTRAP.md:
