  slice: "2"
  decision: >-
    The owner asked whether slice-2 code could stay unmerged and be built to
    DigitalOcean until the move ends. The agent advised against it: the merge
    is only postponed to the cutover, platform and code would change on the
    same day, the D10 flip-back would change code as well as host, the
    branch drifts from a busy main, and D4 (staging deploys the merged SHA,
    production promotes the same SHA) needs the code on main. It recommended
    merging each change in a form that does nothing on Vercel, behind five
    fences: a test that the unset-env path is unchanged; proof on staging from
    a branch build before merge; no merge before 2026-10-04; one merge at a
    time, bazi before FE, watched, revertable; and an owner-run check of the
    Vercel Production and Preview env before any merge that depends on it.
    The owner accepted: "โอเค งั้นไปตามคุนว่า ... ลุยได้".
  owner_answers:
    A: "No mootech-fe or bazi-sft-dataset PR merges before 2026-10-04 (owner: 'ผมยังไม่ต้อง merge pr ไหนเลยจนกว่าจะถึง 10-04 ... โอเค'). mumate-infra PRs touch staging only and are not held."
    B: "The agent dispatches container-build.yml itself with target=staging for this slice ('dispatch เองได้เลย'). Production builds stay with the owner, or เอ็ม under D4. This changes the 2026-09-19 rule for staging builds only."
    C: "/launch buttons are disabled off Vercel ('ปิดปุ่มเลย เพราะ launch ไปแล้ว')."
    D: "bazi rate limits and budgets become per user through the FE's trusted identity; this is the one slice-2 change meant to alter Vercel production behaviour."
