outcome:
  status: ready-for-owner-review
  completed:
    - >-
      Runtime-shared switches: physics on and off, the unlock time, a
      one-shot no-pop, and a board switch (up; silent; unplugged, which
      closes the connection and refuses new ones) that can be timed. A
      monitor keeps the connection state, the request count, the last
      request's time, command and lock, and the last 50 frames and notes.
    - >-
      A loopback HTTP endpoint on CU12_SIM_CONTROL_PORT: GET /api/state as
      JSON, and POST hook, physics, nopop, drop, ask, board and reset with
      query arguments, each answering with the new state. A foreign Host or
      Origin is refused with 403. CU12_SIM_HOOKS sets the initial hooks.
      README gains an agent section with one curl line per action.
    - >-
      No dependency was added (plan invariant 6): the HTTP server is
      hand-rolled on std. Whether a real browser needs more is slice 2's
      test.
    - >-
      One behaviour change outside the new variables: a client's broken
      TCP connection now ends that connection, not the simulator. Before,
      the error ended the process. No earlier test depended on that.
    - >-
      cu12-simulator e03134f on feat/control-endpoint (base 17771d5), pushed.
      Draft pull request 5 is open. The new tests/control_endpoint.rs has 8
      black-box tests that drive the endpoint only and check literal frames
      over TCP. cargo test passed 41, run three times in a row with no
      failure. Every earlier test passes unchanged. cargo fmt --check,
      clippy with -D warnings, and cargo check for x86_64-pc-windows-msvc
      pass. smc-v2 main 444cc48 cargo test (60 passed) runs against this
      simulator build, including its kill-and-restart gateway test. A live
      curl returned valid JSON.
