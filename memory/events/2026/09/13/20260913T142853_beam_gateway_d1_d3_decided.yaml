workstream:
  id: mootech-fe-beam-gateway-001
  lane: single
  objective: >-
    Put Beam Checkout behind the existing v2 payment port so the MuMate v2 shop
    takes real money through Beam (PromptPay and card) with Omise kept installed
    and selectable as the rollback, proven by a live charge and a live refund.

outcome:
  status: decided
  decision: >-
    The owner settled the three open decisions of plan revision 0.1 on
    2026-09-13, and the plan moved to revision 0.2 to carry them. D1: cards go
    through Beam Payment Links (hosted page, top-level redirect) and PromptPay
    stays in-app through the Charges API, chosen over negotiating a CVV/3DS
    exemption; no publishable key or browser tokenizer is needed. D2: the Beam
    merchant account belongs to the company; the owner holds the Developer role
    on it. D3: purchases are paused with the existing /ops/packages is_active
    toggle; no env flag is built. No slice is authorized by this record.
  constraints:
    - "Card data never reaches mootech-fe; routing PAN or CVV through it needs a new owner decision."
    - "Payment Link rows hold link:<id> until payment_link.paid resolves the ch_ id; refund and reconcile work by the resolved charge id."
    - "The reconciler must include link: rows; only pending: remains a placeholder."
    - Omise stays installed and selectable; PAYMENT_GATEWAY unset or omise restores today's behaviour exactly.

