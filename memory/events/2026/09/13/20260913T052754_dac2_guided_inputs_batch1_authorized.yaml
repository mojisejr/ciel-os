workstream:
  id: dac2-guided-inputs-001
  lane: single
  objective: >-
    Deliver the field foundation and safe-navigation batch for a hybrid guided
    flow without changing DAC2's deterministic no-AI product boundary.
  scope:
    - Quick hydrated-state safety and truthful Quick/Detailed wrong-mode routes.
    - Guided field primitive, result-readiness statuses, scoped validation, and shared account/season/recovery copy.
    - History authentication alignment, tax-estimate boundary, and phone-width browser proof.
  out_of_scope:
    - Batch 2 market and production data semantics.
    - Batch 3 cost knowledge-state schema and expense-first capture.
    - Batch 4 result-wide rewrite and orchard-owner comprehension study.
    - AI, LLM, generated advice, deployment, and production data.

outcome:
  status: decided
  decision: >-
    The owner approved the hybrid guided flow and authorized Batch 1 if no
    implementation blocker changed the agreed scope. No such blocker was found
    during the clean-main and design-contract preflight.
  constraints:
    - >-
      Guidance recommends one next question but never locks an open season into
      a linear wizard; overview navigation, back, pause, resume, and current
      results remain available.
    - >-
      Missing optional or explicitly unknown facts are never invented. Only the
      requested result's real dependencies can keep that result unavailable.
    - >-
      Familiar language is primary and correct accounting terminology remains a
      readable secondary label with persistent help rather than placeholder-only guidance.
    - >-
      Existing market-demand meaning is not changed in Batch 1 and human
      comprehension remains unproved until its later study.
    - >-
      Tax remains a clearly bounded planning estimate and does not recommend a
      cheaper method without a reviewed current rule contract.

