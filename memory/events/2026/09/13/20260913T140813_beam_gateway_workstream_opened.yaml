workstream:
  id: mootech-fe-beam-gateway-001
  lane: single
  objective: >-
    Put Beam Checkout behind the existing v2 payment port so the MuMate v2 shop
    takes real money through Beam (PromptPay and card) with Omise kept installed
    and selectable as the rollback, proven by a live charge and a live refund.
  scope:
    - Gateway selector, v2_payment.gateway column, second webhook route, purchase pause (slice 1).
    - Beam adapter for PromptPay, webhook verification, event normalisation, reconciler mapping, proven headless on Playground (slice 2).
    - Beam card path in the shape D1 decides (slice 3); screens, CSP, branding (slice 4); production flip and live proof (slice 5).
  out_of_scope:
    - The server move recorded in mootech-fe#637 and any DigitalOcean provisioning.
    - mootech-be and the v1 Omise path; retiring Omise from v2.
    - Recurring billing, saved cards, CIT/MIT, mobile banking, e-wallets, installments, BNPL, partial refunds.
    - Provider comparison against 2C2P or others.

outcome:
  status: decided
  decision: >-
    The owner directed on 2026-09-13 that the Beam Checkout gateway comes first
    and the server move is deferred until the payment lane is live on Beam,
    reasoning that Omise is now live on production and a single move afterwards
    is simpler. The owner authorized opening this workstream after a research
    pass over Beam docs v1.24.0 and the payment lane at mootech-fe e57827a. No
    slice is authorized yet; slice 1 waits on the owner's answers to D1-D3.
  constraints:
    - >-
      Omise stays installed and selectable; PAYMENT_GATEWAY unset or omise must
      restore today's production behaviour exactly.
    - >-
      Preview deployments used for Beam testing must point at a non-production
      database; a preview found on production stops the slice.
    - >-
      CVV pass-through (D1 option ก) is an explicit owner decision, never a
      default; no card data enters logs, events, or repository files.
    - >-
      Production keys, the production webhook, migration 0027 on production,
      the PAYMENT_GATEWAY flip, and every live charge or refund are owner
      actions per instance.
    - >-
      This lane's slice 5 and mootech-fe#637 P3 never flip on the same day.

