workstream:
  id: mootech-fe-payment-lane-001
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.
  scope:
    - Apply the outstanding money-affecting migrations to the production database and read the result back.
    - Run the five database-backed payment suites once against the local arena.
  excluded:
    - Adding those suites to the pre-push gate.
    - Any change that starts real money moving.
    - Restoring production data from a dump, or pointing any suite at production.

outcome:
  status: decided
  completed:
    - >-
      The owner authorised applying the migrations on the condition that, after
      the implementation was finished, they were still true and still necessary,
      and only if the agent was sure they were safe for the database. If any
      risked data loss the agent was to stop and ask rather than proceed.
    - >-
      The owner authorised running the database-backed suites before launch,
      limited to what the money lane needs, and directed that anything which
      neither blocks real payment nor is serious be skipped entirely.
  not_completed:
    - No migration had been applied and no suite had been run when this decision was recorded.

