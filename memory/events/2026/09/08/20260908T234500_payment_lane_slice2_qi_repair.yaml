workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      Made a failed QI grant recoverable. Migration 0019 adds a nullable
      v2_payment.qi_granted_at and a partial index on exactly the repair
      predicate. The settle path records a confirmed grant; a failure to record
      cannot masquerade as a failed grant, because the QI is already credited
      and leaving the row unmarked simply schedules a retry the engine dedups.
      A second reconciler pass scans APPROVED, tier QI, qi_granted_at IS NULL,
      after the PENDING pass and behind the same kill switch.
    - >-
      Chose no backfill and no time window, and recorded why. Marking existing
      rows as granted would throw away the only chance to repair a genuinely
      failed one, and windowing would make the money permanent while the goods
      stayed permanently missing, which is the bug itself.
    - >-
      Added /api/cron/ to the maintenance allowlist. Both Vercel crons were
      being rewritten to the maintenance page and answering HTTP 200, so
      Vercel's cron log would record success while nothing ran. This costs no
      security: the route already refuses any caller without CRON_SECRET.
    - >-
      Moved the payment-lane CSP from guardV2's return value to the whole of
      middleware(), so it keys on the request rather than on which gate
      answered. That coupling was why the launch change kept guardV2 alive
      returning next(), which in turn made it impossible for /v2 to ever reach
      the maintenance gate that #606's step order depends on.
    - >-
      Proved each part with a mutant. Recording before the engine confirms
      kills four assertions; counting a failed write as a repair kills one;
      dropping the cron path from the allowlist kills two; deleting the CSP call
      at its new home kills fourteen.
  not_completed:
    - >-
      Nothing is deployed. The agent is blocked from merging by a host
      permission gate, so this is a pull request awaiting the owner.
    - >-
      The cron behaviour under maintenance is proven by unit test only.
      MAINTENANCE_MODE is off on production, so it cannot be observed there
      until the cutover turns it on.
    - >-
      No claim is made that the engine is idempotent on ref equals charge_id.
      The entire retry rests on that, it lives in another repository, and every
      test here would still pass if it were false. Only slice 4's real QI
      purchase, read at the buyer's balance, can establish it.

