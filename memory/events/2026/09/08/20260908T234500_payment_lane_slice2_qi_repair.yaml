unresolved:
  - >-
    The retry's safety rests entirely on the engine deduplicating on
    ref equals charge_id. If that guarantee is ever dropped, this pass becomes a
    double-credit machine and must be deleted in the same change. A test states
    the dependency; it cannot verify it.
  - >-
    A permanently ungrantable row, such as one with a package code the catalog
    does not know, will be retried every fifteen minutes forever and logged each
    time. That is noisy on purpose rather than silent, but nobody has decided
    what should eventually happen to such a row.
  - >-
    The note added above guardV2 in slice 1 is still a comment, and this slice
    did not turn it into a mechanism. #606 B3 remains the intended safe removal
    path and nothing enforces it.

next_action:
