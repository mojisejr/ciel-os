workstream:
  id: mootech-fe-payment-lane-001
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.
  scope:
    - Implement plan revision 0.1 slice 2 in mootech-fe on a topic branch, with a pull request the owner merges.
    - Make a failed QI grant a row the reconciler repairs, using the engine's existing idempotency on ref equals charge_id.
    - Keep both cron jobs reachable while maintenance mode is on, so neither answers 200 with the maintenance page.
    - Let /v2 fall under the maintenance gate at launch without losing the payment-lane content security policy.
  excluded:
    - Any change that starts real money moving. Live keys are a separate owner-gated step in slice 4.
    - Any production database write. Slice 3 covers those and each one is confirmed separately.
    - Every ticket listed as deferred in the plan, including the sales-copy set and the ops route test hole.
    - mootech-be. It is read for evidence only.

