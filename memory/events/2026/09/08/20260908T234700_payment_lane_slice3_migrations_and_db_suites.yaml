unresolved:
  - >-
    Those suites DROP TABLE v2_payment CASCADE. Issue 407 describes the hazard
    as DELETE, which understates it. Pointing TEST_DATABASE_URL at a database
    holding real rows destroys the table, not just its contents.
  - >-
    The hand-maintained migration list in three suites has no enforcement. The
    next v2_payment ALTER will break them the same way, and again nobody will
    know until someone runs them. reconcile-cron-db.test.ts predicted this in
    writing before it happened.
  - >-
    The date-dependent assertion had been wrong in five months of every year and
    nothing caught it, because a suite that never runs cannot fail. It is not
    established that the other four suites hold no similar assertion.
  - >-
    0018 makes Pro monthly sellable at 199. Reaching it still requires the team
    gate, and the gateway is still in test mode, so nothing real can be bought
    yet — but the row is live from now on.

