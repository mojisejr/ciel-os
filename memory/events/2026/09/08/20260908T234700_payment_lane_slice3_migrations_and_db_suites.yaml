workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      Applied 0018 and 0019 to the production database, each as a whole file in
      a single transaction, and read the result back. V2_PRO_MONTHLY now reads
      199 and active, which the live shop toggle had been offering while the
      row still refused it. v2_payment now carries a nullable qi_granted_at and
      the partial repair index.
    - >-
      Proved nothing was lost. Row counts before and after are identical:
      v2_payment 12, member_subscription 22, payment_package 29.
    - >-
      Established that migrations 0016 and 0017 were already applied to
      production, which closes blocker 2 of issue 605. All four QI packs exist
      at 35, 99, 219 and 449, active, and both tier CHECK constraints already
      include QI. No package row has a null tier.
    - >-
      Ran the five database-backed payment suites — the ones nothing runs —
      against a local arena brought up to 0019. 72 passed, 0 failed. The webhook,
      the reconciler cron, the discount race and the subscription writer have now
      met a real Postgres.
    - >-
      Found and fixed the two things that made them unrunnable. Three suites
      rebuild v2_payment from a hand-maintained list of migration files, so 0019
      had to be added to each. And one assertion hard-coded a 1M package as 31
      days when the code uses calendar months, so it had been passing only in
      the seven 31-day months.
    - >-
      Verified independently that the money math is correct. Three real
      production member_subscription rows, including two carry-over cases, match
      the formula in provision.ts to the day. Issue 458 says expire_at has never
      been proven; for these three rows it now has been.
  not_completed:
    - >-
      The suites are not added to the pre-push gate, deliberately. The hook's
      own note explains that an unpredictable wait in front of every push is what
      teaches people to reach for --no-verify.
    - >-
      Nothing establishes that the local arena stays current. It was eight
      migrations behind and nothing prevents that recurring.
    - >-
      Three real rows are three rows. The expire_at formula is confirmed for
      first purchase and for carry-over, not for buffer days, not for monthly
      packages, and not for February.

