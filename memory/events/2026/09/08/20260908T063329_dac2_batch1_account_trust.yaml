outcome:
  status: draft-pr-closeout-prepared-for-final-pr-review
  completed:
    - >-
      Added registration with two inputs only, one canonical email comparison
      policy, a database uniqueness constraint, and Argon2id password hashes.
    - >-
      Added single-use hashed verification and reset tokens with separate tables,
      twenty-four-hour and one-hour expiries, altered-token rejection, and resend
      invalidation of the earlier verification token.
    - >-
      Added local Mailpit SMTP delivery and a working one-click verification link.
      No real message provider, provider account, or SaaS was introduced.
    - >-
      Added signed HttpOnly SameSite=Lax database-backed sessions. Successful login
      rotates the session ID, logout flushes it server-side, and a password reset
      changes the auth hash so every older session is rejected and flushed on reuse.
    - >-
      Added server-side protection for the plan route and simple Thai registration,
      login, verification, recovery, and account screens. User information is only
      the email address; no name, image, avatar, social login, or second factor exists.
    - >-
      Kept the already-applied account migration stable and added a following
      additive migration for ASCII-only canonicalization, so both fresh databases
      and the existing localhost volume migrate without deletion or checksum repair.
    - >-
      Added mandatory local unit, PostgreSQL, HTTP session, and Mailpit integration
      entry points and kept the existing calculation, persistence, SSR, hydration,
      Clippy, Wasm, and dependency-boundary gates passing.
    - Returned the workstream execution marker to none and idle after proof completed.
  not_completed:
