unresolved:
  - >-
    This slice was executed before this plan and its decision event existed.
    The agent went from Wake straight to Execute on a live production defect and
    skipped Align and Plan. The owner caught it. The work and its evidence are
    real, but the ordering was wrong and no decision event authorised it; the
    owner's own merge of pull request 609 is the authority this slice actually
    rested on.
  - >-
    The gate was removed inside an unrelated user-interface commit and no
    review caught it. Nothing in the repository made the dependency between
    that change and issue 605 visible at the moment of the change. The note now
    added above guardV2 is a comment, not a mechanism, and a comment can be
    deleted by the next person as easily as the code was.
  - >-
    Production ran exposed for roughly three hours. Zero rows were created in
    that window, but absence of rows is not proof that nobody reached the shop,
    only that nobody completed a charge.
  - >-
    The owner's issues 605 and 606 recorded this exact ordering constraint
    before the change was made, and the change was made anyway. That is a
    communication failure between people, and no repository artefact this
    workstream adds can be claimed to fix it.

