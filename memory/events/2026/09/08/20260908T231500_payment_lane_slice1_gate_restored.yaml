workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      Established that the /v2 preview gate had been removed and was live on
      production. The removal shipped inside mootech-fe commit c959aa8
      ("rebuild /v2/destiny to Figma parity") as one bullet among twelve files
      and reached production at 2026-09-08 20:24 +07 via pull requests 607 and 608.
    - >-
      Established the exposure it created. Omise v2 on production is still in
      test mode, and nothing in lib/payment, lib/qi, or the payment routes
      checks the gateway mode, so any visitor who could sign in with Google or
      LINE could pay with an Omise test card and receive a real
      member_subscription row or real engine QI, written into the same tables
      as paying customers. lib/v2/resolve-user.ts holds no allowlist.
    - >-
      Established that nobody used it. A read-only production query returned
      zero v2_payment rows created after the deploy, and the newest v2 row
      belongs to the team on 2026-09-07.
    - >-
      Restored the gate to its pre-c959aa8 state in middleware.ts,
      lib/v2/gate.ts, pages/v2/index.tsx and the two gate test files, kept the
      later unrelated fix 00f026e that hides the first-run reset badge on
      production, and added a note above guardV2 recording why the next removal
      must go through issue 606 B3 rather than by hand.
    - >-
      The owner merged pull request 609 himself, which deployed it, and the
      restored gate was then verified on production.
  not_completed:
    - >-
      No claim is made that the payment lane can take real money. No live key
      is installed, no real charge has ever settled, and no QI purchase has
      ever been made on this system.
    - >-
      The agent could not merge or deploy. The merge was blocked by a host
      permission gate and required the owner's hand.

