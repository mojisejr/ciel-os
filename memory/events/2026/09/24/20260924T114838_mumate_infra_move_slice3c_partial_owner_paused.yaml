  owner_rulings_2026_09_24:
    - >-
      The v1 leg of DoD 3c item 7 is DROPPED, not deferred. The owner's words:
      v1 is not used, so there is nothing to prove there. The v2 leg is proven
      in full by the purchase walk above (shop, checkout, qrcode, status,
      result). PLAN.md revision 0.2 still reads "representative v1/v2 paths";
      it was not edited, because a revision bump with no execution behind it
      would be process without proof. Whoever resumes this lane honours this
      ruling and, if a revision is opened for another reason, amends the DoD
      sentence then.
    - >-
      The lane is PAUSED at the owner's word, not blocked and not finished.
      PLAN.md's State is set to paused in the same commit as this record.
    - >-
      The shadow's FE slot passes to mumate-login-identity-001 now rather than
      after the remaining smoke items, so that lane is not held behind work the
      owner has deferred.
  evidence_of_limits:
    - >-
      A DEPLOY-TOOL DEFECT WAS FOUND AND ONLY WORKED AROUND. wait_healthy() in
      bin/_lib.sh:38 reads the whole compose project's container list and
      treats any line containing "Exit" as not healthy. The throwaway pgtmp
      container from a restore-verify run had been sitting at "Exited (0)"
      since 2026-09-22, so the FIRST deploy after that - this one - waited its
      120 s, declared failure, rolled back, waited another 120 s, and declared
      "deploy FAILED and rollback is NOT healthy - human needed", sending a red
      Discord alert at 11:33. Every part of that verdict was false: the new
      images were healthy within a minute, and the rollback restored the old
      images correctly. The workaround was to remove the stale pgtmp CONTAINER
      only (docker compose --profile restore-verify rm -f pgtmp), keeping the
      mumate_pgtmp_data volume; the redeploy then passed in nineteen seconds
      with exit 0. The defect itself is untouched and will recur the next time
      any container is left exited. It belongs to mumate-infra and needs its
      own pull request.
    - >-
      The agent reported "step 4 succeeded" from an ops-status read taken
      INSIDE the deploy script's health-wait window, before the script had
      decided anything, and had to correct it minutes later. The rule this
      lane should carry: a deploy's verdict is deploy.sh's exit code, not a
      status command run while it is still waiting. Related: piping deploy.sh
      through tail masks that exit code, which is how the first run reported
      exit 0 for a failed deploy.
    - >-
      The shadow talks to LIVE Beam and holds LIVE Omise keys - env/fe.env has
      no BEAM_API_BASE, so lib/payment/beam-gateway.ts falls back to
      https://api.beamcheckout.com, and the Omise keys are pkey_/skey_ with no
      _test segment. Any payment taken on the shadow is real money. The card
      path additionally returns to production, because OMISE_RETURN_ORIGIN_V2
      and OMISE_WEBHOOK_URL_V2 on the shadow point at https://bazichart.mumate.co;
      PromptPay was used precisely because it has no redirect. A future tester
      who wants this without real money should use the Beam Playground, whose
      recipe is already written at mootech-fe docs/runbooks/beam-playground-session.md
      and whose only differences from production are BEAM_API_BASE and four
      secrets.
    - >-
      An earlier warning in this session that dual webhook delivery could
      double-provision was WRONG for the path actually under test and is
      corrected here so it is not repeated: that race exists in the v1 Omise
      path on mootech-be (resolveSettleablePayment reads status, then
      approves), but the v2 Beam path settles in one transaction predicated on
      "charge_id = ? AND status <> 'APPROVED'" and lib/payment/provision.ts is
      pure, so the database arbitrates and exactly one update can match. The
      real reason not to leave a second live endpoint standing is different and
      still holds: while it is active the shadow is a live payment processor
      for every real customer, which is why it was disabled immediately.

