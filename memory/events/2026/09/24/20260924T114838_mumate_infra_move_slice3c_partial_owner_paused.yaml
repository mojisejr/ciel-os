      curl/8.7.1 at 11:30:39 and again at 11:37:34, then 200 to Beam's own
      delivery (User-Agent Go-http-client/2.0, request id 00de797b) at
      11:38:26. The whole purchase ran on app.staging.mumate.co with no hop to
      production - /v2/shop, checkout QI_60, POST /api/v2/payment/promptpay,
      charge ch_3Jl9FHoDA2x6TnfRffn1VVz8uWC for 3500 satang, fourteen
      /api/v2/payment/status polls, and a result page at state=APPROVED. The
      owner received his credits. Whether the shadow or production won the
      settle race is not visible from the shadow's side and does not change the
      item: the shadow received, verified the signature, dispatched, and
      answered 200.
    - >-
      The staging webhook endpoint was disabled by the owner as soon as the
      proof was in hand, and the shadow's env/fe.env was restored from the
      backup the swap had made (env/fe.env.bak-3c on the host), so the shadow
