outcome:
  status: recorded
  completed:
    - >-
      The churn gate was re-read from GitHub at the moment of the go rather than
      trusted from the cold-entry record, and was open: mootech-fe main 7e22f54
      last committed 2026-09-23 18:06 +07, bazi-sft-dataset pdf-dev 722cdf1 last
      2026-09-23 19:00 +07, mootech-be main 0705378 unchanged since 2026-09-19.
      About fifteen hours quiet against a two-hour rule.
    - >-
      The Vercel production environment was diffed by NAME only, in a scratch
      directory holding nothing but a copied .vercel/project.json, which was
      deleted afterwards; no checkout another lane holds was touched and no
      value ever reached disk (the CLI prints every value as "Encrypted").
      Present on Vercel production and absent from the shadow -
      LAUNCH_DEPLOY_HOOK_URL, LAUNCH_KEY, VERCEL_TOKEN, RENDER_API_KEY (all
      provider tooling, correctly absent on DigitalOcean) and QSTASH_TOKEN.
      Present on the shadow and absent from Vercel - PORT, which the container
      needs. The QSTASH_TOKEN gap is the one that matters - the shadow holds
      QSTASH_URL and both signing keys, so it can VERIFY an inbound QStash
      callback but cannot PUBLISH a job. That is a duplicate-work safety
      property today and a flip-checklist item for the real cutover. The diff
      compares names, not values; a variable whose value changed under an
      unchanged name would not appear.
    - >-
      The owner dispatched container-build in both repositories (target
      staging, push true) and both images reached GHCR:
      ghcr.io/mojisejr/mootech-fe:7e22f54c618855e969122f1e1853cac0117db4de-staging
      and
      ghcr.io/mojisejr/bazi-sft-dataset:722cdf1b5f35f2124c9f59042caf8a9c5d6106b7-staging,
      each verified with docker manifest inspect from the host itself because
      the Mac's gh token has no read:packages scope.
    - >-
      The shadow was redeployed and is healthy on the rebuilt images - be
      0705378 (never rebuilt, never touched), fe
      7e22f54c618855e969122f1e1853cac0117db4de-staging, bazi
      722cdf1b5f35f2124c9f59042caf8a9c5d6106b7-staging, with
      configured = running = /health.sha on all three. That is DoD 3c's last
      item.
    - >-
      PAYMENT CALLBACK IS PROVEN ON THE SHADOW - the item every prior record
      expected to end unproven. The owner created a SECOND Beam webhook
      endpoint at https://app.staging.mumate.co/api/v2/payment/webhook-beam
      beside the existing production one
      (https://bazichart.mumate.co/api/v2/payment/webhook-beam), put that
      endpoint's own HMAC key into the shadow's env/fe.env, paid a real
      PromptPay charge on the shadow, and the Caddy access log on the shadow
