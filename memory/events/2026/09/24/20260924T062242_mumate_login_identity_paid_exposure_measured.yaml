  slice: "2"
  completed:
    - >-
      MEASURED BY THE OWNER, read-only, 2026-09-24. Of the members holding no
      usable Google row - affected_members 1,443 - the paid exposure is
      paid_money_moved 1 and membership_ever 5. The broad figure of 5 includes
      comped rows, because member_payment cannot distinguish a real payment from
      a promo redemption; the narrow figure of 1 is money provably moved across
      v2_payment, payment, member_pay_as_use and book_order.
    - >-
      google_only is 1,443 - ALL of them. Not one of the affected members holds
      a working LINE row, so for every one of them the Google credential is the
      only way in and there is no fallback. The harm per person is total; the
      paying population it lands on is one.
    - >-
      UNDER OWNER DECISION 6 THE FLIP IS NOT BLOCKED BY THIS. One paid member,
      at most five in the broad set, is exactly the case-by-case volume the
      decision anticipated rather than a population needing a rescue mechanism.
      PLAN 0.3's slice-5 precondition is satisfied in shape; it must be re-run
      immediately before the flip because the set shrinks on its own.
    - >-
      THE PROPERTY THAT MAKES THE ACCEPTANCE SAFE, and it was not obvious before
      the measurement: a member caught by the flip is NOT deleted. They receive a
      NEW empty account while their original `user` row and every row keyed to it
      - charts, history, wallet - stay exactly where they are. Recovery is
      therefore a one-row operation at any later date: attach the member's now
      known stable Google subject to their original user_id. Nothing about the
      flip destroys the ability to fix an individual case, which is what makes
      "fix it case by case" a real plan rather than a hope.

  not_completed:
