workstream:
  id: mumate-login-identity-001
  lane: single
  objective: >-
    The owner placed LINK_STATE_SECRET and the linking flow reached LINE's
    consent screen for the first time. It then failed at the callback with
    link_error=bad-token. Record what the flow actually did, the cause - which
    is a defect of this slice's own code and not a configuration gap - and the
    repair, which is committed but has NOT been through a live round trip.
  scope:
    - The staging attempt at 19:49 ICT, read from the edge access log.
    - The HS256 defect, its repair, and the test hole that let it ship green.
    - One unrelated 502 found in the same minute, which belongs to another lane.
  out_of_scope:
    - The traffic flip. Still undecided; slice 3's own authorization says so.
