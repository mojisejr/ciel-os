outcome:
  status: recorded
  # Repeated because the grant is real and standing, not to make wake read green:
  # the owner approved this lane's overlap when slice 1 opened and it is written
  # into PLAN.md's authority section. This record does not bump the revision.
  parallelism: approved
  slice: "3"
  completed:
    - >-
      THE SECRET REPAIR WORKED. The owner placed LINK_STATE_SECRET in
      /opt/mumate/env/fe.env and recreated the fe service on the SAME image.
      Verified from the host afterwards - fe reports "Up 3 minutes (healthy)" on
      image "3615dcfceac8e775ef98e55a941502c83941014a-staging", the identical tag
      it ran before, so no rebuild and no retag occurred. A presence-only check
      was used; no secret value was read, printed, or transmitted.
    - >-
      EVERYTHING BEFORE THE SIGNATURE CHECK NOW WORKS, and this is new. The edge
      access log records the whole chain - GET /api/auth/link/start/line returned
      302 to access.line.me carrying state, nonce, code_challenge S256 and
      disable_ios_auto_login=true; LINE accepted the redirect_uri and rendered
      consent; the member consented; GET /api/auth/link/callback/line arrived with
      code and the matching state, and the state cookie came back intact.
    - >-
      IT THEN FAILED AT THE LAST STEP. The callback answered 302 with
      "Location: /v2/settings/connected?link_error=bad-token" at 12:49:38Z
      (19:49:38 ICT), request id "98fa48d8-9f3b-4c21-a555-2f5c77c2ad83". The
      screen showed its FALLBACK banner because `bad-token` is deliberately not
      in its message map. No provider identity was written.
    - >-
      THE CAUSE IS THIS SLICE'S OWN CODE, not a missing setting. LINE's WEB login
      signs the id_token with HS256 using the channel secret. lib/auth/link-verify.ts
      allowed only RS256 and ES256 and fetched a key from
      https://api.line.me/oauth2/v2.1/certs, whose ES256 keys belong to the
      native/LIFF/SDK flow. jose checks the `alg` allowlist BEFORE it resolves a
      key - verified in the installed copy at
      node_modules/jose/dist/node/cjs/jws/flattened/verify.js:62-65, which runs
      before the resolver call at :75 - so the token was rejected on its header
      and the key set was never even fetched.
    - >-
      THEREFORE IT WAS NEVER INTERMITTENT. It would have failed 100% of the time,
      on every device and for every member. No amount of retrying, no other phone
      and no network condition could have produced a different result.
    - >-
      THE ANSWER WAS ALREADY IN THE REPOSITORY. next-auth's own LINE provider -
      which drives the sign-in working in production today, same channel, same web
      flow - pins `id_token_signed_response_alg: "HS256"`. The new code was written
      against an assumption the repository already contradicted.
    - >-
      FIXED IN mootech-fe "3984e09", parent "f916986", NOT PUSHED. The algorithm
      allowlist is now per provider rather than shared, because the algorithm and
      the key material must agree and that pairing belongs to the provider - google
      keeps RS256 against the public JWKS, line uses HS256 against
      LINE_CLIENT_SECRET. Widening the old shared allowlist to include HS256 would
      have fixed LINE and opened algorithm confusion on Google in the same edit;
      it was not done that way. Paths - lib/auth/link-providers.ts,
      lib/auth/link-verify.ts, scripts/link-verify-default.test.ts,
      vitest.config.mts.
    - >-
      THE TEST HOLE IS NAMED AND CLOSED. scripts/link-verify.test.ts injects
      verifyToken in all thirteen of its cases, so defaultVerify - the only
      function that chooses an algorithm and a key - was executed by NO test in
      the tree. 2,945 specs, tsc and eslint passed over code that could never have
      worked. The new spec runs the real verifier - LINE's own HS256 token is
      accepted; a forged secret, an asymmetric substitute, a wrong audience, a
      wrong issuer and an expired token are each refused; Google refuses HS256;
      and the key/algorithm pairing is pinned for every provider so a later one
      cannot repeat it. It reaches no network.
    - >-
      GATES AFTER THE FIX - 2,958 specs pass (2,945 before, plus the 13 new), 183
      skipped across 276 files; tsc --noEmit exit 0 checked without a pipe; npm run
      lint exit 0 with 0 errors and the same 135 pre-existing warnings; npm run
      build exit 0 with the VAPID gate line present.
    - >-
      A FACT CORRECTED WITHIN THIS SESSION. The attempt was made from Chrome on
      macOS, not from a phone - the User-Agent in the access log says so. It was
      reported to the owner as a phone test first and corrected on reading the log.
      The LINE in-app webview on a real iPhone therefore remains completely
      unexercised, which is the case the state cookie is most at risk in.

  not_completed:
    - >-
      SLICE 3 IS STILL NOT ACCEPTED. No LINE round trip has ever completed. The
      fix makes the mechanism correct; it does not prove LINE accepts us.
    - >-
      "3984e09" is UNPUSHED and the shadow does not run it. The shadow still runs
      3615dcf, which contains the defect. A new image IS required this time - this
      is a code change, unlike the secret repair.
    - No pull request. The body at .assets/mumate/slice3-pr-body.md predates both f916986 and 3984e09.
    - >-
      Google's RS256 path is still not exercised end to end. jose 4.15.9 fetches a
      key set through node's http module rather than global fetch, so a JWKS cannot
      be stubbed without intercepting the transport; the new spec proves Google
      REFUSES HS256 but does not mint a token it accepts.
    - The 12 real-Postgres specs were not re-run. Nothing in this change touches the store or the database.

  evidence_of_limits:
    - >-
      Every claim about the attempt comes from the edge access log, which records
      request lines and response headers. The application itself logged nothing for
      this request - the failure path is silent by design - so the Location header
      is the whole of the runtime evidence, and it is sufficient only because the
      code emits the reason into it.
    - >-
      That LINE web login uses HS256 is established here by LINE's documentation
      and by next-auth's pinned setting for the same channel, plus the observed
      bad-token. An actual LINE id_token header was never captured and decoded.
      The next live attempt is what turns this from strong inference into proof.

a_separate_502_found_in_the_same_minute:
  what: >-
    GET /api/missions returned 502 at 12:49:39Z, request id
    "946c460c-5824-4b1f-9034-edc4560ac52c", 0.0436 s, zero bytes and no
    Content-Type. The owner saw it in Grafana and asked whether it was related.
  it_is_not_related: >-
    It happened AFTER the link had already failed, while the settings page was
    loading. It is the badge-amount fetch at ConnectedScreen.tsx:148, wrapped in
    `.catch(() => {})`, so it fails silently and only costs the badge its number.
  the_cause_is_transport_not_the_route: >-
    Caddy's error log records "read tcp ...:3000: read: connection reset by peer"
    with err_trace reverseproxy.statusError - Caddy synthesised the 502 itself and
    the Next route never ran. fe's KEEP_ALIVE_TIMEOUT is unset, so node closes idle
    sockets at 5 s while Caddy holds its upstream pool for 2 minutes and does not
    retry; a connection idled ~7.5 s across the member's trip to LINE and was
    reused after node had closed it.
  what_was_ruled_out: >-
    Not the engine - mumate-bazi-1 was up 9 hours, healthy, RestartCount 0, and
    /api/missions answers correctly when probed directly. Not BAZI_BASE_URL, not
    the compose profile gate, not an OOM or crash - fe RestartCount 0,
    OOMKilled false, no errors in its log. The route's own 502 branch at
    pages/api/missions.ts:47-49 did not fire; it would have returned a JSON body.
  a_correction_this_record_owes: >-
    This session first told the owner the 502 meant the engine was unreachable and
    that mission definitions could not be read on staging. That was wrong. The
    mission path is healthy; nothing about connect_google is blocked by it.
  whose_it_is: >-
    mumate-infra's. The repair is one line in that repository - either
    KEEP_ALIVE_TIMEOUT on the fe service above Caddy's idle window, or a
    `keepalive` shorter than 5 s on Caddy's transport, optionally with
    lb_try_duration so a dead socket retries instead of 502-ing. This lane does
    not edit that repository and made no change there. Its holder should be told.

