  - >-
    MISSION TIMING IS WRONG TODAY, found while answering the connect_google
    question and NOT fixed because it is in no slice's DoD.
    ConnectedScreen.tsx:167-175 fires the connect_line mission when the SESSION's
    provider is line, not when a link succeeds. So a member who signed in with
    LINE and merely opens the screen is credited, while a member who signs in with
    Google and genuinely links LINE is not. Adding connect_google without
    repairing this would mirror the same error onto Google.
  - >-
    Carried unchanged - the traffic flip, slice 4, the AWS bucket, and Vercel
    Preview resolving to the production database.
  - >-
    Recorded as a standing hazard, not a defect of this slice: the shadow FE and
    production share one Supabase database - same host and same database user,
    compared by hash without reading either value; only the pooler port differs.
    Staging traffic therefore writes real production rows. It is the right shape
    for a shadow, and it means a staging login is a real account event.

