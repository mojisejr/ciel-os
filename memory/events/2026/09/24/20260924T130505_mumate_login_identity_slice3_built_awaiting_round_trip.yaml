three_findings_from_building_it:
  the_recovery_is_coupled_to_the_index_NAME:
    what: >-
      isProviderIdentityConflict treats a 23505 as recoverable only when the
      constraint name is empty or contains 'user_provider_identity'. Under any
      other name the index still rejects the duplicate but the recovery does not
      fire and the member receives a 500.
    how_it_surfaced: >-
      The first version of the real-Postgres file named its index
      slice3_proof_identity_unique. The forced-collision test failed with a raw
      query error rather than recovering - the recovery was watched not firing.
    why_it_matters: >-
      RENAMING THE PRODUCTION INDEX WOULD SILENTLY DISABLE THE RECOVERY. Nothing
      in either repository said so. It is now written in the file that would catch
      it, and the test carries production's index name so it stays evidence.
  the_sharpest_open_risk_is_partly_retired: >-
    Since this morning the lane has carried "the unique-violation recovery is the
    code path that matters and has never executed against an index". It has now
    executed, deterministically, against a real Postgres unique index on the real
    expression under the real name, through the real driver and Drizzle wrapper.
    What is still untested is that index over production's data at production
    scale, which only the flip reaches.
  a_mutant_contract_of_mine_was_false: >-
    The screen's spec header claimed that putting Apple back in its list would go
    red. Checked: it does not - all 20 stay green, because the list is driven by
    /api/auth/link/connections and the screen's constant is only the pre-answer
    fallback. The guard belongs server-side, so the assertion moved to
    link-connections-route.test.ts where it does go red, and the header now says
    what happened instead of dropping the claim. A contract listing a mutation
    nobody ran is the same false comfort the practice exists to remove.

design_decisions_worth_not_rediscovering:
  - >-
    The member is captured from the SIGNED session at start and carried inside the
    HMAC; the callback never re-reads identity from the returning request.
    resolveSessionUserId's cookie-mumate-id fallback is client-settable and not
    httpOnly - acceptable for reads, an account-takeover primitive for a route
    that attaches a login credential. resolveSignedSessionUserId exists for that.
  - >-
    Both halves live under /api/auth, not /api/v2. The maintenance gate allowlists
    /api/auth and not /api/v2/account/*, and a rewrite to /maintenance answers HTTP
    200 - the provider would read success while the link never happened.
  - >-
    The state cookie is SameSite=Lax and never None (None broke every provider's
    login on 2026-09-22 in the LINE webview), and the LINE authorize URL carries
    disable_ios_auto_login (without it iOS app-switches mid-authorize and the
    cookie jar dies). Google carries prompt=select_account, or a member silently
    links whichever account Google already holds, with no undo but unlink.
  - >-
    Unlink counts OTHER PROVIDERS, not rows. Several rows of one provider are
    still one way in - the shape 1,443 members are actually in. Its known limit is
    written into the function: it cannot tell whether the remaining provider's rows
    can still authenticate.
  - >-
    The collision message names nobody. Saying whose account holds an identity
    would confirm it belongs to a member of this service.

