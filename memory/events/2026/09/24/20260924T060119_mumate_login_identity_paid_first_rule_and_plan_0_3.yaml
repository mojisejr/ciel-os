outcome:
  status: decided
  parallelism: approved
  slice: "2"
  completed:
    - >-
      OWNER DECISION 6 (2026-09-24, his own turn). Paid members are the thing
      being protected; a paid member harmed by any change here is fixed case by
      case. A member who has not paid and breaks is an acceptable cost. Cleanup
      that is not urgent is not done. The goal is that a new member can link
      their own account and an existing ACTIVE member can come in, use the
      product and link. Prefer whatever is not risky and not dangerous; the
      system must move forward and the user flow must work.
    - >-
      THE NUMBER 0.2 GOT WRONG. 0.2 put the cost of no-join-by-email at 98
      members, measured over one class only - blank provider holding a "ya29"
      access token - and slice 2 deleted those. Measured read-only by the owner
      2026-09-24 the real exposure is 1,443 members holding NO usable Google row,
      out of 2,253 google rows of which only 466 can still identify anyone.
    - >-
      THE 1,787 UNUSABLE ROWS ARE THE SAME 1,787 SLICE 2 RESPELLED from GOOGLE to
      google. The migration was correct and changed no behaviour, but it
      normalised the spelling of rows that remain unusable, so they now look
      healthy to any query that checks spelling. Recorded so a later reader does
      not conclude the cleanup covered them.
    - >-
      WHY THEY EXIST AND WHY NO SQL REPAIRS THEM. mootech-be
      src/user/user.service.ts registerOrLogin looks a member up by id_token,
      falls to email discovery on a miss, and then calls createUserProvider with
      the CURRENT login's token - it adds a row and never repairs the old one.
      Before token.providerId = account.providerAccountId landed (last old-style
      row 2026-06-19) the value sent as identity was a short-lived Google access
      token, so every login minted one more dead row for the same human. A stable
      subject cannot be derived from a dead token; it is only learned when the
      member authenticates again.
    - >-
      THE COROLLARY THAT MAKES DECISION 6 COHERENT. One login through the legacy
      path heals a member completely, because the same email-discovery branch now
      writes the stable subject. The 1,443 are therefore not members the system
      broke - they are members who have not logged in with Google since roughly
      2026-06-19. The exposed group IS the inactive group by construction, while
      the active members the owner wants served heal themselves for as long as
      the legacy path serves traffic.
    - >-
      PLAN.md ADVANCED 0.2 -> 0.3, execution phase 1 -> 3. Adds revision 0.3
      section, decision 6, the measurement, ten slice-3 design constraints, eight
      DoD 3 additions, the slice-5 paid-member precondition, and the corrected
      DoD 2.
    - >-
      DoD 2 CORRECTED with owner authority. It said "on an anonymized local
      restore", which is unachievable because testenv/scripts/anonymize.sql
      blanks user_provider.id_token on every row - the exact column the unique
      index is built on. It now reads "on a SYNTHETIC seed that reproduces the
      production shape at production scale", which is what the slice was actually
      proven on. Two sessions deliberately left this untouched rather than
      advance it quietly; the owner asked for the correction on 2026-09-24.

  not_completed:
    - >-
      NOTHING IS PUSHED. The mootech-fe branch push was ATTEMPTED and blocked -
      see the pre-push finding below. ciel-os is unpushed at 25 commits before
