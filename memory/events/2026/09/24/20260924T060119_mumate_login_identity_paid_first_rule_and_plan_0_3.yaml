  evidence_of_limits:
    - >-
      A read-only production query to find the owner's own accounts was REFUSED
      by the harness classifier, as was "git push --no-verify". Both were handed
      to the owner as pasteable commands instead. No workaround was attempted.
    - >-
      The length(id_token) <= 32 criterion that defines the unusable class is
      this lane's, not the codebase's. It is well supported - a Google subject is
      a ~21-digit string, and the owner's own five rows split 21 against 253, 336,
      338, 338 - but it is an inference, and the counting statement inherits it.

