the_pre_push_finding:
  what: >-
    The push was attempted and refused by .githooks/pre-push. verify-architecture
    reported four violations: pages/v2/fortune/sage.tsx:15,
    pages/v2/shop/checkout.tsx:13 and pages/v2/shop/qrcode.tsx:7 import
    useCurrentUser inside pages/v2, and features/v2-shell/components/AppHeader.tsx:185
    carries an arbitrary Tailwind class in default props.
  whose_they_are: >-
    Not this lane's. All four exist verbatim on origin/main and this branch
    touches none of those files, verified file by file. origin/main currently
    does not pass its own pre-push gate, so any branch pushed from this
    repository hits the same four.
  what_passed_anyway: >-
    lint, npm test at 2734 passed / 171 skipped, the tsx lane at 6 files, and
    gitleaks at 0 findings across the 12 commits - gitleaks was run by hand
    afterwards because verify-architecture dies before the hook reaches it, so
    the secret scan would otherwise have been skipped silently.
  not_fixed_because: >-
    The four files belong to other lanes and this plan forbids editing code
    another lane owns. The owner chose to push with --no-verify himself.

slice_3_constraints_found_by_reconnaissance:
  redirect_uri_unblocked: >-
    The owner confirmed 2026-09-24 that he DOES hold the right to add redirect
    URIs and added them. PLAN 0.2's "team dependency" is superseded for the
    redirect URI. The LINE email-scope request is a separate permission, remains
    a team dependency, and slice 3 does not need it.
  callback_path_corrected: >-
    This lane told the owner to register /api/v2/account/link/line/callback and
    he did. THAT PATH IS WRONG and the correction is owed to him. guardV2 is open
    post-launch, but the MAINTENANCE gate allowlists /api/auth and NOT
    /api/v2/account/*, so with MAINTENANCE_MODE=on a provider callback is
    rewritten to /maintenance and answers HTTP 200 - the provider reads success
    while the link never happens. Identical to the failure the Omise webhook
    exemption exists to prevent. Routes belong at /api/auth/link/*.
  session_fallback_is_a_takeover_primitive: >-
    resolveSessionUserId falls back to cookie-mumate-id, which is client-settable
    and not httpOnly. Acceptable for reads; for a route that attaches a login
    credential to an account it is an account-takeover primitive. Slice 3 needs a
    session-only variant; none exists.
  google_inside_the_line_webview: >-
    Google OAuth is hard-blocked in LINE's in-app browser and must be escorted to
    an external browser, which carries neither the v2_access cookie nor the
    NextAuth session cookie. A Google link started from inside LINE arrives at
    the callback with no signed-in session. The codebase has no answer. Decide
    before implementation, not in test.
  net_new_security_code: >-
    Nothing in the repository mints or verifies an OAuth state, a PKCE verifier
    or an OIDC nonce, and nothing verifies an id_token signature, iss, aud or
    exp. lib/calculator/nonce.ts is the right shape to copy but binds only a
    timestamp. pages/api/instagram/callback.ts checks no state at all and is a
    cautionary example, not a model. This is the largest new-code item in slice 3.
  cookie_rules_already_paid_for: >-
    The state cookie must be SameSite=Lax, Secure in production, HttpOnly.
    SameSite=None is proven to be dropped by the LINE webview - that took every
    provider's login down on 2026-09-22. The LINE authorize URL must carry
    disable_ios_auto_login=true or iOS app-switches mid-authorize and destroys
    the state cookie. Do not use the broader disable_auto_login; tried, rejected.
  ok_false_is_the_sign_out_flag: >-
    Both callers of the register-login response clear member cookies and call
    signOut on ok === false, while the House B convention under pages/api/v2
    returns { ok: false } on every failure. A link route that follows House B
    blindly logs the member out mid-link.
  connected_screen_is_a_lie_by_construction: >-
    ConnectedScreen.tsx:120 decides "connected" by string-equality against the
    current session's provider, so a second linked provider still renders as not
    linked however well the backend works. No endpoint returns the caller's
    linked providers; /api/profile does not.

how_paid_and_active_are_measured:
  login_at_is_not_a_login_clock: >-
    "user".login_at is set only in the first-time create branch
    (mootech-be src/user/user.service.ts:515); the three refresh-on-login sites
    at :586, :641 and :700 are commented out, and the FE store that would refresh
    it is not wired to anything. It is effectively the account-creation
    timestamp. Reading it as recency gives a wrong answer with no error.
  closest_true_login_clock: >-
    user_provider.update_at, restamped on each successful non-LINE login carrying
    an email (src/user-provider/user-provider.service.ts:111-126). Migration 0034
    deliberately did not restamp it, so it is uncontaminated. Corroborate with
    log_calculate."createAt", log_activity."createAt", user_matching.create_at -
    all 'YYYY-MM-DD HH:mm:ss' Asia/Bangkok strings that sort lexically.
  paid_spans_six_tables: >-
    v2_payment (APPROVED and failure_code not 'gateway_reversed'), payment
    (APPROVED), member_pay_as_use (total > 0, never balance - that starts at 3
    free credits), book_order (PAID or DONE), member_payment (plan_code MEMBER),
    member_subscription (tier_code PLUS or PRO). QI, SINSAE and BOOK purchases
    write NO member_* row, so a membership-only test drops every one of those
    buyers.
  comps_cannot_be_separated: >-
    member_payment is written both by a real approved payment and by a promo code
    redemption with an empty payment_id, and the table has no payment_id column.
    The measurement therefore reports money-provably-moved separately from the
    broader set including comps. Protect the broad set.

