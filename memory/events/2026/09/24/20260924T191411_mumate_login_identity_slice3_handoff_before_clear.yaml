the_acceptance_failure_and_whose_it_is:
  what_happened: >-
    Two requests to /api/auth/link/start/line returned 302 to
    /v2/settings/connected?link_error=link_unavailable. The FE log classified both
    as "LINK_STATE_SECRET is not configured". No request reached the callback, no
    token exchange occurred, and user_provider saw zero creates and zero updates.
  the_code_behaved_correctly: >-
    This is the fail-closed path working exactly as designed. lib/auth/link-state.ts
    throws rather than signing with a fallback secret, and the start route turns
    that into a redirect with a reason instead of beginning a flow it cannot
    finish safely. There is no half-linked state to clean up.
  the_omission_is_mine: >-
    I introduced LINK_STATE_SECRET, declared it in mootech-fe/.env.example with
    the fail-closed rule written out, and put it in the pull-request body under
    Secrets. But when I handed the owner the five remaining steps - push, rebase,
    build, deploy, phone - I DID NOT LIST PLACING THE SECRET ON THE SHADOW. He
    followed the list I gave him and it was incomplete. The test asserting the
    throw passed all along; what was missing was the deployment prerequisite in
    the one place he would act on.
  the_repair_needs_no_rebuild: >-
    LINK_STATE_SECRET is read at runtime through process.env, inside the request.
    It is NOT a NEXT_PUBLIC value and is not among container-build.yml's build
    args, so Next does not inline it and THE SAME IMAGE IS FINE. The repair is:
    the owner places the key in /opt/mumate/env/fe.env, then recreates the fe
    service so it picks the new env file up. No new tag, no new build.
  it_will_happen_again_unless_the_template_changes: >-
    mumate-infra env/fe.env.example does not list LINK_STATE_SECRET - verified,
    zero matches. That file is mumate-infra-move-001's, not this lane's, so this
    lane does not edit it; its holder should be told. Until it is listed, any
    future shadow rebuild omits the key the same way.

the_defect_found_after_the_attempt:
  what: >-
    lib/auth/link-state.ts and scripts/link-account.test.ts were written with
    LITERAL control bytes - a NUL and unit separators - where the source should
    have carried the six-character escape text. Fixed in f916986.
  why_it_mattered: >-
    The code was correct and every gate passed: a character class holding the
    literal characters matches exactly what the escapes would, so 2,945 specs, 12
    real-Postgres specs, tsc, eslint and the build were all green through the
    whole slice. What broke was VISIBILITY. `file` classified both sources as
    binary, so grep skipped them SILENTLY - searching the repository for
    LINK_STATE_SECRET returned the .env.example line, the tests and a comment, but
    not the one file that reads it.
  how_it_surfaced: >-
    While writing this hand-off I grepped for LINK_STATE_SECRET to confirm where
    it is read, and the read was missing while the tests asserting it passed. The
    contradiction is what exposed it, not a tool warning.
  the_rule: >-
    A source file the tooling cannot see is a file the next reader will miss, and
    a NUL byte in source is its own hazard - some tools truncate there. Behaviour
    was proven unchanged before and after; the scan covered every file on the
    branch and only these two were affected.

