workstream:
  id: mumate-control-room-ops-001
  lane: single
  objective: >-
    Make the MuMate control room (mumate-infra, host mumate-2) something the
    owner and the agent run fast and in time: alerts a human reads in three
    seconds, one ops page, management access that does not depend on the
    owner's residential address, and a passive watcher that wakes the agent
    only when a decision is needed. The owner decides; the agent watches and
    acts through the repository's scripts.
  scope:
    - Open plan revision 0.1 and authorize slice 1 (readable alerts, Grafana dashboard, owner runbook, token register, rehearsal on the shadow).
    - Declare the relationship to mumate-infra-move-001 - this workstream is a precondition of that lane's slice 4 (flip) and outlives it; that lane keeps plan 0.2 unchanged. Both lanes share the project mumate-infra; the owner approves that overlap (one session, one lane at a time).
    - Record the owner's four directions of 2026-09-21 morning (ops first, Tailscale for port 22, no self-built monitor on Vercel, watcher local and passive on the existing Claude Code login).
  out_of_scope:
    - The migration lane's step 3c, the payment-gateway trial, the slice-3 closeout, and the flip.
    - Any DNS, public-hostname, application-repository, Vercel, Render, Supabase, or scheduler change.
    - The firewall change of slice 2 (needs its own decision after the slice-1 closeout).
    - A watcher on a server or any API-key-based agent; application-side observability (both after the flip).

outcome:
  status: decided
  parallelism: approved   # same project (mumate-infra) as mumate-infra-move-001; one session works the two lanes one at a time, own paths only
  decision: >-
    On 2026-09-21 morning the owner read the lane's timeline and next steps,
    then the research on Tailscale's free plan, on open-source ops pages
    versus a self-built monitor, and on a passive watcher with claude -p, and
    said the operations side must be tight before the migration continues
    ("ส่วนที่เป็น ops ควรจะแน่น และทำให้เราสองคนทำงานได้อย่างรวดเร็วและทัน
    สถานการณ์ก่อน"). The owner confirmed Tailscale is installed on the Mac and
    the phone but unused; accepted the readable-Discord proposal; accepted the
    local passive watcher; asked that it live inside mumate-infra and not at
    the CIEL level; and agreed that a server-side watcher is parked until an
    API key and token controls exist. Asked whether this should be a new
    workstream linked to the migration lane rather than a plan revision, the
    owner said yes and to start ("โอเคเริ่มได้"). The name
    mumate-control-room-ops-001 and the authorization of slice 1 together
    with the opening are taken as included in that go; the owner may narrow
    either in this chat before slice 1 changes anything on the host.
  authorizes:
    - Slice 1 of plan revision 0.1: one mumate-infra pull request (alert.sh and health service with embeds, state file and recovery; Grafana contact-point template and runbook_url on every rule; dashboard export; runbooks/00-owner-3-minutes.md; token and expiry register), applied on the shadow host with the owner's go, and one rehearsal (stop and start bazi) watched by the owner.
  does_not_authorize:
    - Any DigitalOcean firewall, DNS, or Droplet change; slice 2 needs its own decision.
    - Running the watcher or any claude -p automation (slice 3).
    - Installing Beszel or Dozzle, creating a Spaces key, or enabling Droplet Backups (slice 4).
    - Any change in mootech-fe, mootech-be, bazi-sft-dataset, Vercel, Render, or Supabase.

