  lesson: >-
    An address allowlist on the management port and a residential
    connection do not mix without a self-service update path; the
    control room must be able to let its own operator back in through
    the same repository-and-token route it uses for everything else, or
    the policy should be key-only plus fail2ban. Diagnose by separating
    "service down" from "my path down": public health routes, the
    provider's droplet status, then the firewall rules - in that order,
    before touching anything.
