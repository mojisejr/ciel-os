outcome:
  status: recorded
  completed:
    - >-
      Symptom 08:4x +07:00: ssh mumate timed out on 167.99.29.220 while
      https app/api/bazi.staging.mumate.co answered 200 (~250 ms) and
      :80/healthz 200 on the same address, and doctl showed the droplet
      active - so not an outage, a network-path problem to port 22 only.
    - >-
      Cause: cloud firewall mumate-web (dc94f372-…) inbound tcp/22 =
      101.109.13.197/32, 101.109.54.71/32, 223.204.231.197/32; the last
      is the owner's home address of 2026-09-20 (visible as client_ip in
      yesterday's access log); this morning the ISP had moved it to
      223.204.241.131. The firewall did exactly what slice 2 asked.
    - >-
      Fix with the owner's go: doctl compute firewall add-rules
      tcp/22 223.204.241.131/32, remove-rules tcp/22 223.204.231.197/32
      (create/update token, no delete scope needed); ssh ok within
      seconds; uptime 1 day 3 h 43 m; ops-status three ✅, caddy ok,
      alloy ready, 1147/3915 MB.
    - >-
      Overnight evidence (first night with the observability base): 0
      5xx on real paths in 10 h; 106 scanner probes on dotfile paths
      answered 404 by Caddy; health timer sent 0 alerts since the DoD
      test; alloy 8851 lines sent, 0 dropped; fail2ban active.
  not_completed:
    - The durable port-22 policy - two options for the owner in today's plan step 6: (a) open 22 to the world with key-only auth + fail2ban (already present), or (b) keep the allowlist and add bin/ssh-allow.sh that puts the current address into the rule via doctl before each session; the agent leans (b) because the shadow becomes production.
    - The two other allowlisted addresses (101.109.13.197, 101.109.54.71) are not identified in the records; the owner confirms whether they are still needed.
