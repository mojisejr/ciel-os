    overnight: two thirds of the mockups were already decided against on
    purpose with reasons that stand; seven finish defects need no user
    data; the larger questions wait for the comprehension study. The
    report closed with eight questions, each with the agent's lean. On the
    morning of 2026-09-17 the owner answered every one "เอาตามคุน" - polish
    first as one pull request, the decision list in full only on the hub,
    the season row instead of the form, whole baht for amounts, verdict
    rows only once a target exists, no icons yet, the 4b study with three
    friends after this deploys, no one has tried it seriously yet - and
    added one: the hat mark becomes ตาไก๊ himself. The agent noted that
    DESIGN.md chose the hat because a face blurs at sixteen pixels; the
    owner chose the face. The only other open DAC2 workstream is paused;
    the owner directed this work to start now on the standing branch, and
    that is recorded here as approved. Slice 1 is authorized by this
    decision.
  authorizes:
