unresolved:
  - >-
    The competing explanation for today's 401s — that the installed signing
    secret is not the one the account signs with — is not eliminated. A
    self-signed probe cannot distinguish it, because both sides of that test
    carry the same value. The 401-branch log settles it on one delivery; until
    then the comma fix is necessary but not proven sufficient.
  - >-
    The grace window closes at about 11:02 on 2026-09-10. After it, an unfixed
    verifier starts answering 200 on its own and the fault becomes unobservable
    until the next roll. Reopening the window means asking the account holder to
    roll again, which then obliges installing the newer secret inside its own
    twenty-four hours.
  - >-
    Production is selling 900 QI for 219 baht and 2,100 QI for 449 right now, and
    this is not conditional. The slice 3 closeout of 2026-09-08 read all four QI
    pack rows back as 35, 99, 219 and 449 active, and 0020 has not been applied
    since. The gate is closed so no public buyer can reach it. This event does
    not authorize doing anything about it; slice 3 needs its own decision.
  - >-
    Whether the /ops surface — which grants tier and adjusts QI with no money
    moving — must be covered before launch is an owner decision that has not been
    made. It is deferred, not judged safe.
  - >-
    /dev-access/ still answers 200 on production with nine internal preview
    pages, carried forward unresolved from the 11:47 record.

