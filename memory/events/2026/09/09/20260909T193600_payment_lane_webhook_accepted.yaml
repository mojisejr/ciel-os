unresolved:
  - >-
    The header itself was still not read. The 401 branch logs its shape, and a
    200 takes a path that logs nothing, so this delivery left no record of how
    many signatures it carried. That it carried two rests on the grace window
    from the 11:02 roll still being open, and on the before-and-after above,
    rather than on an observation of the header. The gap is small and it is
    stated rather than closed.
  - >-
    The grace window closes at about 11:02 on 2026-09-10. After it, a delivery
    carries one signature again, and this observation cannot be reproduced until
    someone rolls the secret. Anything that depends on seeing a two-signature
    header accepted must happen before that hour.
  - >-
    mootech-be still carries the identical defect and remains outside this lane.
    Nothing about today's fix reaches it.
  - >-
    Whether an expired QR's row is written at the expiry instant or at the next
    cron pass is still open, and this charge is a live probe of it: it expires at
    19:42:10 and the reconciler runs every fifteen minutes.

next_action:
  action: >-
    Step two. Buy a QI_60 pack for 35 baht with real money on production, with
    the preview gate still closed, and establish that it settles by webhook
    rather than by the reconciler — qi_granted_at within seconds of payment, not
    on a quarter-hour boundary. The credit must be 90 QI and not 60, which also
    confirms the catalog and the package rows agree after 0020. Then step three,
    the membership refund.
  acceptance_check:
    - A real charge settles without waiting for the reconciler.
    - The engine wallet rises by 90 QI, read back through the engine rather than from a row.
    - A refunded membership purchase loses its entitlement.
    - The preview gate is still closed when all of it is observed.
