workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: recorded
  completed:
    - >-
      A webhook Omise signed was ACCEPTED on production, for the first time in
      the life of this endpoint. The account's delivery log shows charge.create
      to the v2 payment webhook on the production host answering 200 at 19:27:11,
      one second after the charge was created. Slice 5's first acceptance
      criterion is met.
    - >-
      Eliminated the competing explanation that had survived every earlier
      record. The worry was that the installed signing secret was not the one the
      account signs with, which a self-signed probe cannot distinguish. It is
      now settled by the timeline rather than by another probe: the owner
      replaced OMISE_WEBHOOK_SECRET at about 11:47, and a delivery at 14:11 still
      answered 401 with that correct value in place. The only thing that changed
      between that 401 and this 200 is the verifier.
    - >-
      Established the before and after with one variable moved. Seven deliveries
      answered 401 between 10:08 and 14:11 while the code compared the whole
      Omise-Signature header against a single digest. mootech-fe#615 shipped the
      comma split and the byte comparison, merged as 3ac96bc, and the next
      delivery answered 200 inside the same twenty-four hour grace window that
      produced the two-signature headers.
    - >-
      Confirmed the fifteen-minute PromptPay lifetime still holds after both
      #614 and #615 reached production. The charge created at 19:27:10 carries
      charge_expires_at at 19:42:10, fifteen minutes to the second.
    - >-
      Confirmed the delivery reached the production host and not a preview or a
      stale endpoint. The endpoint in the delivery log is the exact value of
      OMISE_WEBHOOK_URL_V2, which is the production origin that NEXTAUTH_URL and
      OMISE_RETURN_ORIGIN_V2 also name.
  not_completed:
    - >-
      The paid path is not proven by this. A charge.create event is not settleable,
      so the handler accepted the delivery and correctly did nothing. Whether a
      charge.complete settles a real charge without the reconciler is step two and
      has not been attempted.
    - The refund proof has not been attempted.
    - >-
      No money moved for this observation. The charge was left unpaid on purpose
      and will expire at 19:42:10.

