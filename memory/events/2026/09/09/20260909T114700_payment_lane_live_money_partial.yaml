unresolved:
  - >-
    The agent claimed the Omise webhook secret was correct on the strength of a
    request it had signed itself with the value the server verifies against. That
    proves the HMAC code runs; it cannot disagree about the value, because both
    sides of the test were the same value. The account's delivery log showed 401
    and settled it. A self-signed probe is not evidence about a shared secret.
  - >-
    The webhook remains unproven. Until a delivery Omise signed is accepted, every
    buyer waits fifteen to thirty minutes for goods the reconciler hands them.
    That is not a launch state, and it is the only thing left that blocks one.
  - >-
    The engine's grant failure was invisible. runQiGrantRetry swallows a per-row
    throw in a bare catch and reports a count, so a paid customer's missing goods
    produced no line naming a cause. The diagnosis came from eliminating the two
    branches that DO log. A count is not a reason.
  - >-
    api_version 2019-05-29 reports webhook_deliveries as an empty list even for
    events the dashboard shows as delivered. That field cannot be used as evidence
    on this account, and issue 374 still has no answer.
  - >-
    The engine's 250 MB function limit was cleared with a flag, not understood.
    Why the deployment eighteen hours earlier built the same source successfully
    is unexplained.
  - >-
    /dev-access/ still answers 200 on production with nine internal preview pages.

next_action:
  action: >-
    Read the account's delivery log for the PromptPay charge's two events to learn
    whether the rotated signing secret is accepted. If it still answers 401, the
    secret is still not the one that endpoint signs with. Once a delivery Omise
    signed is accepted, buy a membership package and refund it to close the last
    proof this slice needs.
  acceptance_check:
    - A webhook Omise signed is accepted on production, and a charge settles without the reconciler.
    - A refunded membership purchase loses its entitlement.
    - The preview gate is still closed when both are observed.
