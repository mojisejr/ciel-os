workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: recorded
  completed:
    - >-
      Took real money twice on production with live keys, behind the closed
      preview gate, and delivered the goods both times. A card charge of 35 THB
      and a PromptPay charge of 35 THB both reached status successful with
      paid true at Omise, both settled to APPROVED in v2_payment, and both
      credited QI that was read back from the engine's own wallet rather than
      from a row.
    - >-
      Established that the QI purchase lane had never worked, in any mode, since
      it was built. Zero rows with tier_code QI existed before today. The cause
      was that the engine project on Vercel had no QI_GRANT_SECRET at all — not a
      wrong value, an absent one — so its grant route took the fail-closed branch
      its own comment describes and answered 401 to every caller. The frontend
      half had been set five days earlier. One end of the wire was live and the
      other was never connected.
    - >-
      Repaired it by generating one secret and installing it on both projects
      from the same file, so the two sides cannot differ by a typo. The engine
      redeploy first failed on an unrelated 250 MB function-size limit, which was
      cleared with the flag Vercel's own error names.
    - >-
      Proved the reconciler on real money, twice. Both charges were settled by
      the reconciler and not by a webhook, because the webhook never arrived —
      which is precisely the failure that lane was built for and had never been
      exercised with money. The first purchase also proved the QI retry pass: it
      settled while the engine was still refusing, then credited on a later run
      once the secret was in place, with no second payment and no manual write.
    - >-
      Proved the fifteen-minute PromptPay QR on production. The charge carries
      expires_at exactly fifteen minutes after creation, agreeing on both sides,
      and a human paid inside that window — which no PromptPay buyer had managed
      since the lifetime was shortened to five minutes.
    - >-
      Proved idempotency is wired as designed. Each QI credit in the engine
      ledger carries ref equal to its charge id, and the once-per-lifetime
      first-purchase bonus fired on the first purchase and not the second.
  not_completed:
    - >-
      The Omise webhook still does not reach us. Omise delivered both events for
      the first charge and our endpoint answered 401 twice, which the account's
      delivery log showed and the API did not. The signing secret was rotated and
      installed, and the second charge's deliveries have not been read yet, so
      whether the rotation fixed it is unknown rather than answered.
    - >-
      The refund proof has not been attempted. It needs a membership package,
      because revokeByChargeId returns early for tier_code QI.
    - >-
      A declined card releasing its hold is deferred, as revision 0.3 records.

