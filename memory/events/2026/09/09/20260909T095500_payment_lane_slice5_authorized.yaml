unresolved:
  - >-
    Whether QI_GRANT_SECRET on Vercel matches the engine's cannot be established
    before the purchase. The variable is sensitive and does not read back. A
    mismatch settles the charge and never credits the QI, and the only symptom is
    a log line the buyer never sees.
  - >-
    Issue 374 stays unproven and now cannot be proven on this account without
    removing the static webhook again. The design question behind it — whether
    api_version 2019-05-29 supports per-charge webhook_endpoints — is still
    unanswered, and every charge on the account still reports the field as null.
  - >-
    Fifteen minutes is a judgement, not a measurement. Nothing establishes how
    long the two expired buyers actually needed; the rows record only that five
    minutes was not enough twice.
  - >-
    /dev-access/ answers 200 on production and carries nine internal preview
    pages. Installing live keys does not change that, and it is still undecided.

next_action:
  action: >-
    Raise the PromptPay QR lifetime to fifteen minutes in mootech-fe and open its
    pull request with proof. Install the three live values on Vercel production.
    Then let the owner merge, which rebuilds with the live public key inlined, and
    run the proof steps in the order the plan names.
  acceptance_check:
    - Omise answers 200 to the installed secret key before any charge is attempted.
    - The build that carries the live keys proves the public key reached the bundle.
    - The preview gate is still closed when the first real charge is made.
