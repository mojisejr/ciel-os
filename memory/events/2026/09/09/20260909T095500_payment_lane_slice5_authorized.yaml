workstream:
  id: mootech-fe-payment-lane-001
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.
  scope:
    - Install the Omise live key pair and the live webhook signing secret into the three production variables that still hold test values.
    - Raise the PromptPay QR lifetime from five minutes to fifteen before any real money is put through that lane.
    - Prove on production, with the preview gate still closed, that a card charge settles, a PromptPay charge settles, a QI pack credits the buyer's balance in the engine, and a refund takes a membership entitlement back.
  excluded:
    - >-
      Proving that a declined card releases its hold. Live mode refuses test card
      numbers and this lane cannot reliably arrange a genuine decline on a real
      card, so it moves to the deferred list with its reason rather than being
      dropped from the acceptance check in silence.
    - >-
      Claiming issue 374. The account's live static webhook now points at the v2
      endpoint, so an event would arrive whether or not the per-charge mechanism
      works. The slice records the static webhook's state beside the observation
      instead of claiming the per-charge path delivered it.
    - Opening /v2 to the public. The preview gate stays closed for the whole proof.
    - Anything in mootech-be, and anything that exists only to keep v1 taking money.

outcome:
  status: decided
  completed:
    - >-
      The account holder produced a rotated live key pair and moved the account's
      live static webhook to the v2 endpoint. The new secret key was verified
      against Omise on 2026-09-09: GET /account answers 200 with livemode true,
      country TH, api_version 2019-05-29, and webhook_uri already pointing at the
      v2 payment webhook. GET /capability reports card and promptpay both enabled.
    - >-
      The owner authorized installing the live keys on Vercel. The condition
      attached to that authorization in revision 0.1 — that /v2 be provably closed
      to the public — was checked against production rather than assumed: /v2
      answers 200 with the gate page, /v2/shop and /v2/shop/checkout answer 307
      into it, /api/v2/payment/status and /api/cron/reconcile-payment answer their
      own 401, and the webhook answers 405 to a GET, which is the route refusing a
      method rather than the gate refusing the caller.
    - >-
      The owner decided to raise the PromptPay QR lifetime from five minutes to
      fifteen, on evidence read from the production rows: of the four real
      PromptPay charges, the only success was created while the lifetime was still
      Omise's 24-hour default, and both charges that carry a charge_expires_at —
      five minutes to the second — expired. Under five minutes the lane is 0 for 2.
    - >-
      Established that no QI pack has ever been bought through this lane in any
      mode. Every one of the ten payments on production is a membership package,
      so grantQiPurchase has never run from a real charge. The engine answers on
      both its grant and wallet endpoints, but whether QI_GRANT_SECRET on Vercel
      matches the engine's cannot be read back — the variable is marked sensitive —
      and the QI purchase in this slice is what will settle it.
    - >-
      Established that a refund of a QI pack takes nothing back. revokeByChargeId
      returns early for tier_code QI, with a comment recording that clawing back
      granted QI is an undecided policy. The refund proof therefore uses a
      membership package.
  not_completed:
    - Nothing has been installed on Vercel yet and no real money has moved.
    - The QR lifetime change is not written, tested, or merged.
    - No proof step has been attempted.

