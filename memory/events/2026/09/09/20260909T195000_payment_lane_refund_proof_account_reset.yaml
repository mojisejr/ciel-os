      - V2_PRO_YEARLY at 1590, tier PRO
      - V2_PLUS_YEARLY at 790, tier PLUS

unresolved:
  - >-
    A lapsed account is not the same as a never-paid one, and the proof this
    produces is about the RESTORED branch rather than about a first-time buyer
    losing access. A genuinely new account would exercise NEEDS_HUMAN instead.
    Neither shape covers the other, and only one is being run.
  - >-
    Restoring the account afterwards is a manual step held only by this record.
    Nothing in the system will notice if it is forgotten, and the owner would be
    left silently lapsed on their own account.
  - >-
    The v2 side and the legacy shadow disagree on this account today: the ACTIVE
    subscription row is PLUS to 2027-09-01 while the shadow names V2_PRO_YEARLY
    to 2028-08-31. That disagreement predates this session and is neither created
    nor repaired by it.

next_action:
  action: >-
    Apply the two updates inside one transaction, read back that the account
    reads as unpaid, and hand it to the owner to buy V2_PRO_MONTHLY at 199 baht
    with a real card and then refund it from the Omise dashboard. Restore the
    recorded values afterwards.
  acceptance_check:
    - The purchase gate allows V2_PRO_MONTHLY for this account after the change.
    - A refunded membership purchase loses its entitlement, with the shadow RESTORED rather than left for a human.
    - The shadow expiry and the ACTIVE subscription row are written back to the recorded values when the proof is done.
