workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.
  scope:
    - >-
      Lapse the owner's own account to FREE on production so the purchase gate
      will allow a membership purchase, which is what the refund proof needs.
    - >-
      Do it reversibly: move the membership shadow's expiry to a past date rather
      than deleting the row, and set the single ACTIVE subscription row to
      EXPIRED. Both are restored by writing the recorded values back.
  excluded:
    - >-
      Any account but the owner's own. This touches one user id and nothing else,
      named by an equality on that id alone.
    - >-
      Deleting any row. Nothing is removed; two values are changed and both are
      recorded here so they can be written back.
    - >-
      The purchase and the refund themselves, which need a real card and the
      Omise dashboard and are the owner's actions, not the agent's.

outcome:
  status: decided
  completed:
    - >-
      Established that the refund proof cannot run on this account as it stands.
      decidePurchase refuses every sellable membership package: the two PRO
      packages as ALREADY_ON_THIS_TIER and the PLUS one as CANNOT_DOWNGRADE,
      because TIER_RANK places PRO at the top and this account already holds a
      paid membership. The refusal happens at the door, so no charge would ever
      be created and nothing about the refund path would be exercised.
    - >-
      The owner chose to lapse their own account rather than defer the proof, and
      confirmed the account is a development one where dirty data is acceptable.
      The agent had recommended against editing membership rows and said so; the
      owner reaffirmed, which makes it their decision to take.
    - >-
      Read and recorded the exact state to restore, before touching anything. The
      membership shadow holds one row for this user, plan MEMBER, package
      V2_PRO_YEARLY, created 2026-06-22, starting 2026-09-01, expiring
      2028-08-31. The subscription table holds five rows for this user, of which
      exactly ONE is ACTIVE: id 152d1d13-81ad-48a8-9fe8-ddc4f4c5c28c, tier PLUS,
      package V2_PLUS_YEARLY, 79000 satang, starting 2026-09-01, expiring
      2027-09-01. The other four are already REPLACED and are not touched.
    - >-
      Chose to lapse rather than delete, for a reason that improves the proof
      rather than only reducing risk. A deleted shadow row would leave
      prev_member_expire_at NULL at settlement, and a reversal on a NULL hands the
      shadow to a human and writes nothing over it — the NEEDS_HUMAN branch. A
      lapsed row leaves a real previous value, so the refund exercises the
      RESTORED branch of issue 484, which is the one that actually takes an
      entitlement back.
  not_completed:
    - >-
      Nothing has been written at the time this event is recorded. The write
      follows it, which is the ordering this plan's corrections say was broken
      twice.
    - >-
      The purchase and the refund are not the agent's to perform. They need a
      real card in a browser and the Omise dashboard.

