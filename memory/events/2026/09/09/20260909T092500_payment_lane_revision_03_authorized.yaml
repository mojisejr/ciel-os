  owner_confirmed:
    - v1 is being retired and /v2 is what ships.
    - mootech-be is not touched unless v2 provably needs it.
    - The plan is revised to that focus now, and the conversation resumes after the checkpoint.
  supersedes:
    - >-
      The next action recorded at evt_20260909T090000_payment_lane_session_record,
      which told the next agent to treat the api_version question as the single
      largest open question in the workstream and to ask the account holder three
      things. Two of those three still stand; the third no longer gates.

unresolved:
  - >-
    Whether the live webhook signing secret the team holds is still current is
    unverified and cannot be verified without a live webhook arriving. The
    secret key stored beside it is expired, which is the reason to doubt it.
  - >-
    The production values of BAZI_BASE_URL and QI_GRANT_SECRET have not been
    read. They live on Vercel. A mismatched grant secret settles the charge and
    never credits the QI, and the failure is a log line rather than anything the
    buyer sees.
  - >-
    /dev-access/ answers 200 on production and now carries nine internal preview
    pages, one of which arrived with the slice 4 merge. The owner has still not
    decided on it. It is not a money defect; it is an internal harness on a
    public URL, and it should be settled before launch rather than at it.
  - >-
    The PromptPay QR lifetime is five minutes, and three of the four real
    PromptPay charges on production ended expired. Whether those three predate
    or postdate the five-minute change is unverified. If they postdate it, the
    lifetime is a product decision that deserves a look before real money, not
    after.

next_action:
  action: >-
    Take the checkpoint: commit plan revision 0.3 with this decision and its
    closeout, push the branch to ciel-os pull request 55, and present it for the
    owner's merge. Then resume the conversation on slice 5, which starts with
    the request to the Omise account holder and cannot begin before a live key
    Omise answers 200 to is in hand.
  acceptance_check:
    - Plan revision 0.3, this decision, and the closeout are on the pull request head and verified there.
    - Slice 5 does not begin without its own decision.
