workstream:
  id: mootech-fe-payment-lane-001
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.
  scope:
    - Adopt plan revision 0.3, which narrows this lane to v2 because v1 is being retired.
    - Put mootech-be and the v1 payment path outside the lane's authority boundary.
    - Rewrite slice 5 for a v2-only Omise account, and demote the api_version question from blocker to open.
  excluded:
    - >-
      Executing slice 5. This decision adopts its shape; starting it needs its
      own decision, and nothing in it can begin before a live key Omise answers
      200 to is in hand.
    - >-
      Retiring v1 itself. The owner's decision sets this lane's focus; the
      migration of v1 users, screens, and subscriptions is not this plan's work
      and has no owner named here.
    - >-
      Anything in mootech-be. If a v2 dependency on it is found, it is
      established in this plan first and the owner decides before it is changed.

outcome:
  status: decided
  completed:
    - >-
      The owner stated that v1 is being retired, that /v2 is what ships, and
      that mootech-be is not to be touched unless v2 provably needs it, then
      directed that the plan be revised to that focus.
    - >-
      Plan revision 0.3 records the reading the narrowing rests on: the v2 money
      lane is entirely inside mootech-fe, reaching outward only to api.omise.co
      and to the bazi engine that credits a QI purchase, with no call to
      mootech-be anywhere in the lane.
    - >-
      Slice 5 was rewritten. It now names what must be obtained from the Omise
      account holder — a rotated live key pair, the live webhook signing secret
      READ BACK rather than rotated, and the removal of the test-mode static
      webhook that currently points at the v2 endpoint — and it requires the
      static webhook's state to be recorded alongside the 374 observation so a
      later reader can tell which mechanism delivered the event.
    - >-
      Issue 374's question about api_version 2019-05-29 was demoted from the
      workstream's largest blocker to an open question. With v1 retired nothing
      contends for the account's single live static webhook, so the lane no
      longer waits on that answer.
    - >-
      A defect in the plan's own text was corrected: revision 0.2's slice 5
      acceptance line began "Slice 4 is done when", which would have let a cold
      reader close the wrong slice.
  not_completed:
    - No key was obtained, installed, or tested. Nothing on Vercel changed.
    - Slice 5 is not authorized to execute and has not started.
    - >-
      The plan does not say how v1 is retired, only that this lane stops serving
      it. Existing v1 subscriptions, customers mid-purchase, and the v1 screens
      have no owner in this record.

