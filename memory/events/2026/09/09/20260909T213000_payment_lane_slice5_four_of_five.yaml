the_refund_defect:
  what_was_done:
    refund: "rfnd_68ymhs6wskczqmp67us, livemode true, voided true, 3500 THB, at 21:21:53"
    charge: "chrg_68ylhf590g119lfivdi, the card QI purchase"
  what_happened_on_our_side: >-
    Nothing. failure_code was polled twelve times between 21:23:16 and 21:27:01
    and stayed empty, more than five minutes after the refund, while every
    webhook earlier in the evening landed within one to thirty-six seconds.
  first_reason: >-
    The charge does not become reversed. Read back from the account after the
    refund, the charge's own status is still successful, with the refund nested
    inside it carrying status closed. isReversal requires evt.status ===
    'reversed', so it can never be true for a refunded charge. The word reversed
    in Omise means a voided authorization, which is not the same event as a
    refund; issue 484 was written about refunds taking entitlements back, and the
    code implements the other meaning of the word.
  second_reason: >-
    parseChargeEvent reads data.id and data.status, which are correct for a
    charge event and wrong for a refund event: on a refund.create the data object
    is the REFUND, so data.id is the refund id, data.status is closed, and
    data.charge — the only field carrying the charge id — is never read. Either
    reason alone is enough to stop the revoke; both are present.
  what_is_not_established: >-
    Which event or events Omise actually delivered for this refund. The 401 branch
    logs the header's shape, but the accepted path logs nothing at all, so a
    delivery that was received and did nothing leaves no trace. That gap is why
    this took a poll and a charge read rather than one log line.
  why_it_was_invisible_until_tonight: >-
    revokeByChargeId is only reachable from the webhook route; the reconciler
    never handles reversals. Until 19:27 today no webhook had ever been accepted
    by this endpoint, so this code path had never run in production in any mode.
    The first defect was hiding the second.

side_findings:
  promptpay_cannot_be_refunded_by_api: >-
    The 199 baht membership charge was paid by PromptPay and the refunds endpoint
    answered failed_refund. Read back, that charge reports refundable false while
    the card charge reports refundable true. The refund proof therefore cannot be
    run on a PromptPay purchase at all, which is not a defect in our code but is a
    constraint on how this proof can ever be performed.
  env_file_is_not_a_mirror_of_vercel: >-
    .env.production.local holds a correct DATABASE_URL and a stale
    OMISE_SECRET_KEY. A refund attempted with it answered not_found, which is what
    a test-mode key returns for a live charge. The live values were installed on
    Vercel this morning and the local file was never updated. The filename invites
    exactly the assumption that broke here.
  agent_tooling_limits: >-
    This session could not read the live Omise secret key or run vercel env pull;
    both were refused by the session's own policy, so every call that moves money
    was run by the owner. Recorded because it shapes what a future session can and
    cannot verify unaided.

unresolved:
  - >-
    The refund defect is open and it blocks the launch on its own terms: a
    customer who is refunded keeps what they bought, and nothing in the system
    says so. The plan's objective names delivering what was bought; taking it
    back when the money goes back is the same promise.
  - >-
    A QI refund taking QI back is still an undecided policy, separate from this
    defect. Tonight's refund was of a QI purchase, and the ninety QI remain
    credited with the money returned. That is what the code intends today.
  - >-
    Nothing logs an accepted webhook that does nothing. A delivery that is
    received, understood as no action, and answered 200 is indistinguishable from
    one that was never sent. That is precisely the shape that hid tonight's
    defect.
  - >-
    mootech-be still carries the signature defect this lane fixed on the v2 side.
  - >-
    The owner's account carries an extra ACTIVE PRO row to 2026-10-09 from the
    199 baht PromptPay purchase, which is real and was not refundable. It is left
    in place deliberately.

next_action:
  action: >-
    Fix the refund path in mootech-fe. Read data.charge when the event key is a
    refund event, and decide the revoke on the refunded amount rather than on a
    charge status of reversed — keeping the existing reversed branch, which is a
    different real case. Cover it with a test built from a refund.create payload
    shaped like the one Omise actually sends, and a second test that a charge
    which is still successful but fully refunded revokes. Then repeat the proof
    with a CARD purchase, because PromptPay charges cannot be refunded by API.
  acceptance_check:
    - A refunded membership purchase loses its entitlement, observed on production.
    - A test built from a refund event payload reddens when the data.charge read is removed.
    - The QI early-return still holds, so a refunded QI purchase revokes nothing and waits for no human.
