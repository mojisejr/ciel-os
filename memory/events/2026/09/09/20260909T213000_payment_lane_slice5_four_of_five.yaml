workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: recorded
  completed:
    - >-
      Fixed the webhook verifier and proved it on production. The Omise-Signature
      header may carry more than one signature, comma-separated; our verifier
      compared the whole header against one 64-character digest behind a length
      check, so every delivery after the 11:02 secret roll was refused before any
      comparison happened. mootech-fe#615 splits on commas and compares decoded
      bytes. The next delivery answered 200 at 19:27:11, one second after its
      charge was created — the first webhook this endpoint has ever accepted.
    - >-
      Eliminated the competing explanation without another probe. The worry was
      that the installed signing secret was not the one the account signs with,
      which a self-signed probe cannot distinguish. The timeline settles it: the
      owner replaced OMISE_WEBHOOK_SECRET at about 11:47 and a delivery at 14:11
      still answered 401 with that correct value in place. Between that 401 and
      this 200, only the verifier moved.
    - >-
      Proved a card charge settles by webhook and not by the reconciler. A 35
      baht QI_60 charge created at 19:38:35 had qi_granted_at at 19:39:03 —
      twenty-eight seconds. The reconciler runs every fifteen minutes, so 19:30
      and 19:45, and 19:39:03 is neither. Only two places write APPROVED, the
      webhook route and the reconcile cron; charge-flow deliberately does not,
      and the status endpoint the screen polls never calls settleAndProvision.
    - >-
      Proved a PromptPay charge settles the same way. The 199 baht
      V2_PRO_MONTHLY charge was created at 20:06:58 and its member_subscription
      row was written at 20:07:34 — thirty-six seconds, again between cron
      passes. For contrast, this morning's two charges settled at 10:24 and
      11:39:59, both on quarter-hour boundaries, which is what the reconciler
      looks like.
    - >-
      Proved the QI credit reaches the engine's own wallet with the new
      quantities. The balance read 220 before and 310 after, exactly ninety, not
      the sixty the pre-0020 catalog granted — which independently confirms the
      code and the payment_package rows agree. The once-per-lifetime first
      purchase bonus did not fire a second time.
    - >-
      Proved the membership provisioning arithmetic on a lapsed account. The
      purchase granted PRO from 2026-09-09 to 2026-10-09, one calendar month, and
      carried nothing forward from the lapsed row, which is the
      first-purchase branch behaving as written.
    - >-
      Confirmed, with real money, that a full refund does NOT take an entitlement
      back — see the defect below. This is a failure of the acceptance check and
      it is the most valuable thing this session found.
    - >-
      Closed an open question that had only been suspected. An unpaid QR created
      at 19:27:10 expired at 19:42:10, still read PENDING at 19:44:57, and read
      REJECT with gateway_expired at 19:59:20. The row is written by the cron
      pass, not at the expiry instant, so a buyer whose QR has died can be shown a
      waiting screen for up to a quarter of an hour.
    - >-
      Restored the owner's account to its pre-session state, and found that the
      restore values recorded before the change were incomplete — only expire_at
      was written down, while the purchase had also overwritten package_code and
      start_at. The first restore therefore produced an incoherent row, a monthly
      package expiring in 2028. All three fields are now back to V2_PRO_YEARLY,
      2026-09-01, 2028-08-31, and the PLUS subscription row is ACTIVE again. The
      genuinely purchased PRO row to 2026-10-09 was deliberately left in place.
  not_completed:
    - >-
      The refund proof FAILED, and slice 5 is therefore four of five. A refund
      does not revoke anything, and the acceptance check that a refunded
      membership purchase loses its entitlement is not met.
    - >-
      The declined-card proof remains deferred with its reason, as revision 0.3
      recorded.

