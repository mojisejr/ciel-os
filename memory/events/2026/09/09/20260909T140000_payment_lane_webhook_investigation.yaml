workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: recorded
  completed:
    - >-
      Proved our side of the webhook is correct, without the circular test that
      produced a wrong answer earlier today. The signing secret was read out of a
      screenshot of the Omise dashboard, base64-decoded, used to sign a payload
      with the same HMAC the verifier uses, and sent to the live production host.
      Production answered 200. The value came from Omise and the check ran against
      the deployment serving traffic, so the two ends of the test are independent:
      the running deployment verifies against exactly the secret Omise signs with.
    - >-
      Established the timeline that clears our configuration entirely. The account
      holder rolled the secret at 11:02. The owner installed it. The redeploy
      carrying it was created 11:16:20 and was serving by roughly 11:20. The
      PromptPay charge was created 11:23:49 and its charge.complete fired at
      11:24:12, four minutes after the correct secret was live — and the row was
      still settled by the reconciler at 11:39:59 rather than by a webhook.
    - >-
      Established a baseline for what a working webhook looks like on this
      product, by measuring test-mode settlements: the gap between a charge row
      and the member_subscription written for it is two to three seconds for card
      and thirty-three for the PromptPay one, which is a human scanning. The
      reconciler cannot produce those numbers — it waits fifteen minutes. So the
      webhook worked in test mode, every time.
    - >-
      Explained why test mode worked. The signing secret differs per mode. The
      value that had been on Vercel since mid-August was the TEST-mode secret, so
      test events verified and live events did not. Nobody misconfigured anything;
      the move to live keys did not carry the webhook secret with it.
    - >-
      Calibrated the events API and found it useless for this question. Across 120
      events in both modes — including test-mode events proved delivered by the
      three-second settlements above — webhook_deliveries is an empty array every
      single time. An empty array on this account does not mean "not delivered".
      It means the field is not populated. The dashboard's Recent Deliveries table
      is the only place delivery status exists.
    - >-
      Ruled out, by direct test rather than reasoning: a Vercel firewall or bot
      rule (a request shaped like Omise's reaches the app and gets the app's own
      401, not a platform 403), the preview gate (middleware exempts the path
      before reading the key), the package or payment method (the signature is
      checked before the body is parsed, so the route does not yet know what was
      bought), and the per-charge webhook_endpoints field (test mode sent it too
      and delivered in three seconds).
  not_completed:
    - >-
      Whether Omise delivered the 11:23:50 and 11:24:12 events is still unknown,
      and now cannot be learned from the API. It needs the dashboard.
    - The refund proof and the membership provisioning proof are still not done.

