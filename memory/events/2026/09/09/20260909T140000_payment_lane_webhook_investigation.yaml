unresolved:
  - >-
    A REAL DEFECT, found by accident. lib/payment/gateway.ts isReversal fires only
    on status 'reversed'. A refund does not produce that status: Omise still
    reports the charge successful and paid with reversed false, and records the
    refund in refunded_amount instead. So revokeByChargeId can never be reached by
    a refund, and issue 484's rule — a payment that did not stay successful grants
    nothing — is not implemented for the case people actually use. The intent is
    right and the trigger is wrong. This charge was a QI pack, which
    revokeByChargeId skips anyway, but a refunded MEMBERSHIP would keep its
    entitlement. Slice 5's refund acceptance check cannot pass until this is fixed,
    and the fix is not a key or a setting — it is code.
  - >-
    The agent designed the diagnostic badly and it answered nothing. It chose
    refund.create, an event the route deliberately ignores, and watched a log
    channel that only surfaces console output. A silently accepted delivery and a
    delivery that never arrived produce identical evidence there: nothing. The
    money came back, so the cost was zero, but the question is exactly as open as
    before. Design the observation around what the system will visibly do, not
    around what is convenient to trigger.
  - >-
    That is the second reasoning error in this investigation. The first was
    calling the webhook secret correct on the strength of a self-signed request.
    Both share a shape: a test whose two ends were not independent of each other.
  - >-
    With the API calibrated as silent and our side proved correct, the remaining
    hypothesis is that Omise is not delivering, or that its delivery does not reach
    production. Neither can be advanced without the dashboard's delivery log.

next_action:
  action: >-
    Get one screenshot of the account's Recent Deliveries table for today, showing
    the rows at 11:23:50, 11:24:12 and 13:49:06 with their status. A 401 there
    contradicts the proof above and belongs in a support case with Omise; a 200
    means delivery works and the failure is downstream; no row at all means Omise
    is not sending. Then fix isReversal so a refund can revoke an entitlement, and
    only then buy and refund a membership package to close slice 5.
  acceptance_check:
    - The delivery status of those three events is known and recorded.
    - A refunded membership purchase loses its entitlement, proved on production.
    - The preview gate is still closed when that is observed.
