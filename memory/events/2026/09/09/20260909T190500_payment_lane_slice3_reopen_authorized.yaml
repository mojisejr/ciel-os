workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.
  scope:
    - >-
      Read the four QI rows of payment_package back from the production database
      before writing anything, because the last read was 2026-09-08 and another
      author has been in the product repository since.
    - >-
      Apply lib/db/0020_qi_packs_reprice_2026-09.sql to the production database
      as a whole file in a single transaction, moving QI_500 from 219 to 249 and
      QI_1200 from 449 to 499, and bringing all four descriptions up to the
      quantities the shipped code already grants.
    - >-
      Read the rows back afterwards and record before and after side by side,
      with the payment_package row count, which must not change.
  excluded:
    - >-
      Migrations 0021 and 0022, which arrived in the same pull request and are
      not money. Revision 0.4 defers them. Migrations from 0005 upward are
      hand-applied one file at a time, so applying 0020 does not carry them along.
    - >-
      Re-running the five database-backed suites. They ran 72 green on
      2026-09-08 against a local arena, and 0020 changes no schema.
    - Anything in mootech-be, and opening /v2 to the public.

outcome:
  status: decided
  completed:
    - >-
      The owner authorized applying 0020 to the production database in this
      session, which is the per-instance authorization this plan's authority
      boundary requires for a production write. Recorded here before the write
      rather than narrated after it, which is the ordering the plan's own
      corrections say was broken twice.
    - >-
      Stated what was believed to need correcting, WHICH TURNED OUT TO BE WRONG
      and is corrected by the closeout that follows this event. The belief was
      that 0020 had not been applied, reasoned from the 2026-09-08 row read of
      35, 99, 219 and 449 — a read that predates mootech-fe#614 — and therefore
      that production was selling 900 QI for 219 baht. Nothing had been read from
      production at the time this decision was recorded, which the not_completed
      list below says plainly, and the read is what the decision authorized.
    - >-
      Distinguished the three databases by the file that names each, before
      touching any of them, because issue 407 is precisely the hazard of pointing
      a tool at the wrong one. Production is the Supabase project named by
      .env.production.local, which .env.preview.local also names. A DIFFERENT
      Supabase project is named by .env.local and is not production. The local
      arena is the mumate_test database on localhost, named by .env. The
      identifiers themselves are deliberately not written here: this plan records
      names and locations, never values.
    - >-
      Assessed the change as safe to apply. 0020 is four UPDATE statements
      against payment_package, additive and idempotent, with no schema change and
      no DROP. It touches amount and description on four rows and nothing else. A
      charge already in flight carries the amount it was created with, so no
      pending payment can be repriced underneath a buyer.
    - >-
      Recorded a guard that fired correctly. This event was first written with
      the production project identifier spelled out, and the repository's own
      pre-tool guard refused it. The plan's authority boundary already said that
      no value goes into a repository file, and the agent was about to break it
      while writing the event whose purpose is to respect it.
  not_completed:
    - >-
      Nothing has been written to production. The psql call was refused by this
      session's tooling policy and the owner has been asked to allow it. The
      before-read has therefore not happened either.
    - >-
      Whether the four rows still hold 35/99/219/449 is not established as of
      this event. The 2026-09-08 read is the most recent one and it predates
      #614's merge.

