    0020 as a whole file in one transaction, read the rows back, confirm the
    payment_package count is still 29, and record before and after in a closeout.
  acceptance_check:
    - The four QI rows read back as 35, 99, 249 and 499, active.
    - The payment_package row count is unchanged.
    - The buy screen's quantity and the row's price agree for all four packs.
