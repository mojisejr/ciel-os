unresolved:
  - >-
    The pricing itself is not this lane's judgement. 0020 carries another
    author's price table, merged into production code before its data half
    existed, and this decision applies that table rather than approving it. If
    the owner disagrees with 249 or 499, the number to change is in the migration
    and this is the moment to say so.
  - >-
    Nothing prevents the same split from happening again. A price lives in a row
    and a quantity lives in the code, and a pull request can move one without the
    other with no test failing. That is a shape, not an incident, and it is not
    fixed here.
  - >-
    The five database-backed suites still DROP TABLE v2_payment CASCADE, carried
    forward from the 2026-09-08 closeout. Pointing TEST_DATABASE_URL at
    production destroys the table rather than its contents.

