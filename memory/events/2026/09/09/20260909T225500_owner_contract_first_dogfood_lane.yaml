    - a card charge settled by webhook in twenty-eight seconds, not by the reconciler
    - a PromptPay charge settled by webhook in thirty-six seconds
    - a QI pack credited the buyer's balance read back through the engine
    - a full refund set failure_code to gateway_reversed in thirty-three seconds

where_the_contract_showed_its_teeth:
  deferral_without_a_new_system: >-
    Seven side issues, zero new states or workstreams, all in existing unresolved
    lists as prose.
  minimum_fix_then_return: >-
    The missing 0019 in one test suite was fixed; the unenforced list it belongs
    to was recorded, not solved.
  decision_before_execution: >-
    Every production write carried a decision event written first, including
    under owner urgency.
  asking_rather_than_scoping: >-
    The /ops admin surface arrived in another author's merge, grants tier and
    adjusts QI with no money moving, and was left for the owner to decide rather
    than pulled into the lane.

where_it_did_not_fully_hold:
  - >-
    The agent raised the partial-refund question as though it were a policy
    decision the owner had to make, and the owner pushed back asking whether the
    product could even issue one. Research then showed it cannot — no code calls
    the refunds endpoint and the gateway port has no refund method at all — and
    the question collapsed into a one-line guard. Asking before researching turned
    a small thing into a decision point, which is a mild form of the failure this
    contract exists to prevent.
  - >-
    The agent designed a three-step production test plan without first checking
    whether the test account could buy anything. The purchase gate refused every
    sellable membership package for it, and the plan had to be reworked mid-flight.
  - >-
    Three times in the lane the agent treated a record as the current state of a
    live system: a source comment claiming a verifier was ported exactly, a row
    read the previous day, and its own incomplete note of what to restore on the
    owner's account. Each check that would have settled one was a single query or
    request. This is not a contract failure — the contract does not speak to it —
    but it is the dominant error shape of the lane and belongs beside the rest.

observation_offered_for_owner_decision:
  what_was_observed: >-
    The machine holds fifty-one skills under the user's global skills directory.
    Exactly one of them, syncup, appeared in this session's available-skills
    listing, and it was never invoked. Its description alone carried the owner's
    name, a workflow vocabulary, and a stance about how to converse — all of which
    reached the agent's context without any skill being run.
  suggested_interpretation: >-
    A skill description behaves as ambient instruction. CIEL's contract travels
    with the repository; the skills travel with the machine. The same repository
    read by the same model in another person's harness would therefore be worked
    on differently, and the difference would be invisible from inside the
    repository.
  what_already_defends_against_it: >-
    CLAUDE.md already names this and names it first: while establishing a Wake
    fact, only repository files and local Git may be used, and "a global skill,
    global memory, prior session history" cannot establish one — described there
    as the recorded way this contract gets broken. Tonight every material claim
    went through Wake, Git, a vendor's own documentation, or a read-back from
    production, so the defence held where it matters.
  the_gap_that_remains: >-
    Nothing tells a reader which skills were present in a given session, so the
    ambient half of the environment is not recorded anywhere. Whether that is
    worth closing, and how, is an owner decision. This event does not propose a
    mechanism, because OWNER.md says CIEL already has sufficient vocabulary and
    the agent must not add one from inference.

unresolved:
  - >-
    One encounter is not three, and one day is not four weeks. A single lane that
    went well says little about a contract; the failure it is meant to prevent is
    one that shows up over time, and this lane had unusually clear acceptance
    criteria and an owner present throughout.
  - >-
    The agent evaluating the contract it was operating under is the party with
    the least standing to judge it. Everything above is what happened, and the
    reading of it belongs to the owner.
  - >-
    Whether "progress before meta-optimization" would have held on a lane with a
    vaguer committed outcome is untested. This one had a defect list, an
    acceptance check per slice, and money as the arbiter.

