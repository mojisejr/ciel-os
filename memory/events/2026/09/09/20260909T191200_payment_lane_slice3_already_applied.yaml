    Merge mootech-fe#615, which fixes the Omise signature verifier, then watch a
    real delivery and record what the header actually carried, before the
    twenty-four hour grace window from the 11:02 roll closes at about 11:02 on
    2026-09-10. Then buy a membership package and refund it, which is the last
    proof slice 5 needs.
  acceptance_check:
    - A webhook Omise signed is accepted on production and a charge settles without the reconciler.
    - The 401 log, or an accepted delivery, establishes what the header actually carried.
    - A refunded membership purchase loses its entitlement.
    - The preview gate is still closed when both are observed.
