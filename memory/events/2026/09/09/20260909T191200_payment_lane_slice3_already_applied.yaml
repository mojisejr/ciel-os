unresolved:
  - >-
    This is the second time in one day that a stale record was treated as the
    current state of a live system, and the second time the check that would
    have settled it was cheap. The first was a source comment saying the verifier
    had been ported exactly; this was a row read from the day before. Recording
    the pattern rather than a mechanism: what both share is that the stale source
    felt authoritative enough to skip the read.
  - >-
    A misread of table names nearly produced a second wrong claim inside the same
    check. 0021 creates bazi_destiny_cache and the first query asked for
    destiny_cache, which answered empty and briefly looked like a missing
    migration. The migration file named the table; the query did not.
  - >-
    Nothing prevents a price in a row and a quantity in the code from moving
    apart again. A pull request can change one without the other and no test
    fails. This time they agree because another author applied their own
    migration promptly, not because anything enforces it.
  - >-
    The five database-backed suites still DROP TABLE v2_payment CASCADE. Pointing
    TEST_DATABASE_URL at the database read here would destroy the table rather
    than its contents.

next_action:
