outcome:
  status: decided
  completed:
    - >-
      The owner asked whether the QR-maybe-expired screen should be repaired
      before launch and answered yes, against the agent's presented evidence
      that three of the four real PromptPay charges on production ended expired,
      so three of four real users of that method reached that screen.
    - >-
      That decision moved issue 480 out of the deferred list this plan itself
      wrote in revision 0.1. Deferral is a judgement about blocking and harm and
      the owner holds it, so the plan is revised rather than quietly widened.
    - >-
      The owner separately directed that everything else which neither blocks
      real payment nor is serious stays deferred. Only this one moved.
  not_completed:
    - No implementation, test, photograph, or merge is claimed by this decision.
    - Slice 5, the real-money proof, is unauthorised until its own decision.

