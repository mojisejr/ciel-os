workstream:
  id: mootech-fe-payment-lane-001
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.
  scope:
    - Adopt plan revision 0.2, which promotes issue 480 out of this plan's deferred list and declares it as slice 4.
    - Make the QR-maybe-expired screen draw every action its sentence names, without removing either audience.
    - Repair the browser-truth specs covering this lane so a stale red cannot hide the next real regression.
  excluded:
