workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      The QR-maybe-expired screen now draws both actions its sentence names. It
      is the one row that does not know which of two people is reading it, so
      neither action could be dropped: the unpaid reader needs a fresh QR, and
      the reader whose money already left must not be pushed into paying twice.
    - >-
      Put the safe action first. The filled button checks; the outlined button
      asks for a new QR. The sentence leads with the unpaid case because it is
      the common one, and the buttons deliberately do not follow it, because an
      unpaid reader who checks first loses a tap while a paid reader who asks
      for a new QR first can pay twice. The repo had already made that trade in
      RECONCILING.
    - >-
      Took the photograph the ticket asked for, and it found a second defect the
      tests could not see. At 393, the main width, the body wrapped so that one
      Thai particle sat alone on a third line. The sentence was shortened by two
      words, losing neither audience, and now ends on exactly the words printed
      on the button. QR_EXPIRED had already been treated for the same disease.
    - >-
      Added teeth at the screen, not only at the table. Both earlier bugs on
      this screen were table-right and screen-wrong, so the new class assertion
      renders each state and requires a button for every action its words name,
      with a counter so the loop cannot silently check nothing.
    - >-
      Emptied the KNOWN_GAP list that had carried this row since issue 455, and
      kept its self-expiry assertion so it cannot rot again.
    - >-
      Repaired a browser-truth spec that had been red since the Figma-parity
      rebuild. A settled charge now renders PlanPaySuccess, not ResultScreen,
      so the assertion could only have been satisfied by a not-paid state — the
      opposite of what the test is named for.
    - >-
      Added a dev-only preview harness for this screen. Two of its bugs have now
      been found in a photograph and by nothing else, because reaching it for
      real needs a session, a charge and a webhook.
  not_completed:
    - Nothing is deployed. Both pull requests await the owner's merge.
    - >-
      No claim that the other deferred screen tickets are unaffected by the same
      class. The new assertion covers only the two action phrases it names.

