  plan_revision: "0.2"
  repository:
    head: e99d2ef941f3a216875aef2060e3ece431db18e4
    branch: feat/payment-lane-screen-debt
  owner_confirmed:
    - Focus is v2. v1 is being retired.
    - mootech-be is not touched unless v2 provably needs it.
    - The plan is discussed further before it is revised.
  v2_money_lane_boundary:
    inside_mootech_fe:
      - pages/v2/shop/* and features/v2-shop/* call same-origin /api paths only
      - /api/v2/payment/preview, charge, promptpay, status, webhook
      - /api/cron/reconcile-payment, on the Vercel cron every 15 minutes
      - settlement and provisioning in lib/payment/repo.ts, straight to Postgres via Drizzle
    external_hosts:
      - api.omise.co — tokenisation from the browser, charge and retrieve from the server
      - BAZI_BASE_URL — POST /api/qi/grant, the engine that credits a QI purchase
    mootech_be_calls_in_the_v2_payment_lane: none
    nearest_v2_call_to_mootech_be: pages/api/v2/onboarding.ts posts to /consent, which is not the money lane
  production_origin: >-
    The frontend's production origin is the value of NEXTAUTH_URL in the
    Vercel-pulled production environment. The v2 webhook path under it is
    /api/v2/payment/webhook.

unresolved:
  - >-
    Retiring v1 is a decision about the payment lane, not about the backend.
    mootech-be still serves several non-payment flows the frontend calls, so
    "drop v1" must not be read as "shut down Render" without a separate check of
    what v2 still depends on.
  - >-
    The production values of BAZI_BASE_URL and QI_GRANT_SECRET were not read.
    They live on Vercel and could not be established from the repository. If the
    secret does not match the engine's, a charge settles and the QI never
    arrives, and the failure is a log line rather than an error the buyer sees.
  - >-
    Whether the live Omise webhook signing secret held in the operator's local
    copy of the Render environment is still current is unverified, and cannot be
    verified without a live webhook arriving. The secret key beside it in that
    same file is expired, which is the reason to doubt it.
  - >-
    The previous record's next action told the agent to ask the Omise account
    holder three questions, one of which was framed as the largest open question
    in the workstream. This record supersedes the weight of that third question
    but not the first two. A cold session reading only the older record would
    still treat api_version as a blocker.
  - >-
    Retiring v1 has consequences outside this lane that nobody has enumerated —
    existing v1 subscriptions, v1 customers mid-purchase, and the v1 screens
    themselves. This record establishes the focus, not the migration.

next_action:
  action: >-
    Continue the conversation with the owner on what slice 5 becomes now that v1
    is being retired, then revise the plan and record its decision before any
    execution. The narrower shape to put to the owner is: rotate the Omise live
    key pair, read back the live webhook signing secret rather than rotating it,
    point the account's live static webhook at the v2 endpoint once v1 is
    provably off, and prove the six real-money steps on production with the
    preview gate still closed.
  acceptance_check:
    - The plan is revised and its decision recorded before slice 5 executes.
    - A live secret key that Omise answers 200 to is in hand before anything is installed on Vercel.
    - Nothing in mootech-be is changed unless a v2 dependency on it is first established here.
