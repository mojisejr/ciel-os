workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: recorded
  completed:
    - >-
      The owner narrowed this lane's focus: v1 is being retired, and mootech-be
      is not to be touched unless something in v2 provably needs it. Work that
      exists only to keep v1 taking money is out of scope from this point.
    - >-
      Established by reading the code that the v2 money lane is entirely inside
      mootech-fe. The browser talks only to same-origin /api/v2/payment/*, and
      the only external hosts the lane reaches are api.omise.co and the bazi
      engine at BAZI_BASE_URL. A grep for NEXT_PUBLIC_BACKEND_URL, its generator,
      and the ENDPOINT constant across pages/api/v2/payment, lib/payment,
      lib/v2, features/v2-shop and pages/v2 returns nothing. Settlement,
      provisioning, and the reconciler all reach Postgres directly through
      Drizzle.
    - >-
      Established the one delivery dependency that is NOT in mootech-fe. A QI
      purchase is credited by POST {BAZI_BASE_URL}/api/qi/grant to the engine
      (bazi-pdf-dev), idempotent on ref = charge_id. Membership tiers are
      written straight to the database; only QI leaves the app. The engine is
      not mootech-be.
    - >-
      Established that v1 had NOT been migrated onto the frontend, which is what
      the owner asked to have checked. constants/api/endpoint.ts still routes
      payment.pay_via_credit_card, pay_via_qr_code, create and retrieve to the
      NestJS backend, and four v1 pages still call them. Only payment_package.get
      and the whole v2 lane are same-origin. That is what makes retiring v1 a
      scope decision rather than a cleanup.
    - >-
      Drew the consequence for issue 374. That ticket exists because one Omise
      account has a single static webhook per mode and v1 already owns the live
      one. If v1 is retired, nothing contends for it, so the account's live
      static webhook can point at the v2 endpoint directly and the unanswered
      question about api_version 2019-05-29 stops being a launch blocker. It
      remains worth answering; it no longer gates.
  not_completed:
    - >-
      The plan is still at revision 0.2 and its slice 5 text is written for a
      world where v1 and v2 share the account. It has NOT been revised. That is
      deliberate: the owner said the conversation continues, and a plan revision
      is an owner decision, not a tidy-up the agent performs on its own.
    - No live key is installed, nothing on Vercel changed, and no code was touched this session.
    - Slice 5 has no decision and has not started.

