    delivers what was bought, proved on production behind a closed gate. The
    launch itself is mootech-fe#606, which gates on #605 and is not this
    workstream's work. Nothing here is waiting on the agent.
  acceptance_check:
    - The lane's six slices each carry a closeout naming what was proved and what was not.
    - The preview gate is still closed.
    - The owner has what they need to decide on #606 without reopening this lane.
