workstream:
  id: mootech-fe-payment-lane-001
  lane: single
  objective: >-
    Make the MuMate v2 payment lane provably able to take real money and
    deliver what was bought, before /v2 is opened to the public.

outcome:
  status: ready-for-owner-merge
  completed:
    - >-
      A refund now revokes, proved with real money on production. A 35 baht card
      charge was refunded in full at 22:33:48 and v2_payment.failure_code read
      gateway_reversed by 22:34:21 — inside about thirty-three seconds, the same
      order as every other webhook this evening. Before mootech-fe#616 the same
      action on the same kind of charge wrote nothing at all, for five minutes of
      polling.
    - >-
      The QI early return behaved exactly as designed and was watched rather than
      assumed. The refund was recorded on the payment row while member_subscription
      was not touched — the owner's PRO and PLUS rows both stayed ACTIVE — the
      membership shadow kept the value restored earlier in the session, and the
      credited QI was not clawed back. v2_payment.status stayed APPROVED, because
      the payment did happen and history is not rewritten.
    - >-
      Slice 6 shipped as mootech-fe#616. parseChargeEvent reads data.charge and
      data.amount; isRefund routes refund events to revokeByChargeId, which was
      not changed; a full refund revokes and a smaller one changes nothing at all,
      not even failure_code; and an accepted webhook that matches no branch is no
      longer silent.
    - >-
      Fixed two test faults found while proving it. parseChargeEvent, isReversal,
      isSettleable and isTerminalFailure had NO main-lane test of any kind — the
      only coverage lived in DB suites that skip without TEST_DATABASE_URL, which
      is the lesson the verifier's own header states. And this lane's reversal DB
      suite could not run at all: it rebuilds v2_payment from a hand-maintained
      migration list that was missing 0019, so settleAndProvision failed with
      42703 before any assertion. The slice 3 closeout predicted that recurrence
      in writing on 2026-09-08 and named the reason: nothing enforces the list.
    - >-
      Ran the proof twice, because the first run was invalid and saying so was
      cheaper than explaining a false negative later. The pull request merged at
      22:21:01 and the purchase was made at 22:21:30, twenty-nine seconds later,
      while Vercel was still building; the deploy reached Ready at about 22:22:27
      after a one minute twenty-two second build. The refund fired before that and
      met the old code. The charge from that run still carries an empty
      failure_code and is left that way as evidence of the pre-fix state.
  not_completed:
    - >-
      The membership revoke was NOT exercised on production. The proof used a QI
      purchase, and revokeByChargeId returns early for tier_code QI, so the branch
      that moves member_subscription and restores the shadow was not reached by
      real money. It is covered by the database-backed suite instead: nineteen
      tests green against a real postgres, including a full refund ending the v2
      lane and the shadow going back to its pre-purchase value, both of which
      redden when the branch is removed.
    - >-
      The owner was offered a 199 baht membership purchase and refund to close
      that on production and declined it. Recorded as a decision, not as an
      omission: what was broken was the routing, and the routing is what real
      money proved.
    - >-
      A declined card releasing its hold stays deferred with the reason revision
      0.3 gave it.

