what_this_lane_delivered:
  - The v2 preview gate was restored and stayed closed through every proof.
  - A failed QI grant became a row the reconciler repairs, and the cron paths answer their own 401.
  - Production package rows and the code that reads them agree, verified by reading the rows back.
  - The QR-maybe-expired screen draws every action its words name.
  - >-
    Real money moved on production with live keys: a card charge and a PromptPay
    charge both settled, a QI pack credited the buyer's balance in the engine,
    and a membership was provisioned for one calendar month.
  - >-
    The Omise webhook is accepted. It never had been, in any mode, before
    2026-09-09 — the verifier compared a possibly-multi-signature header as one
    string.
  - A refund is no longer silent: it revokes.

unresolved:
  - >-
    An expired QR's row is written by the cron pass and not at the expiry
    instant, measured tonight: expired 19:42:10, still PENDING at 19:44:57,
    REJECT by 19:59:20. A buyer whose QR has died can be shown a waiting screen
    for up to fifteen minutes. Not money lost, and not fixed.
  - >-
    Whether a refunded QI purchase should take the QI back is still an undecided
    policy. Tonight it did not, which is what the code intends today, and the
    buyer keeps ninety QI with the money returned.
  - >-
    Disputes and chargebacks send their own Omise events and nothing in our code
    reads any of them. No dispute has ever been observed on this account, so this
    is recorded rather than scoped — but it is the same shape as the defect this
    slice fixed.
  - >-
    The migration list inside three DB suites is still hand-maintained with
    nothing enforcing it. This session hit the predicted recurrence and repaired
    one more file; the next ALTER will break whichever file is left.
  - >-
    mootech-be carries the identical signature defect this lane fixed on the v2
    side, and would break the first time anyone rolls a secret while v1 takes
    money.
  - >-
    /dev-access/ still answers 200 on production with nine internal preview pages.
  - >-
    Whether the /ops admin surface — which grants tier and adjusts QI with no
    money moving — needs covering before launch is an owner decision that has not
    been made.
  - >-
    Three times in one session the agent treated a record as the current state of
    a live system: a source comment claiming the verifier was ported exactly, a
    row read from the previous day, and its own incomplete note of what to restore
    on the owner's account. Each check that would have settled it was cheap. The
    pattern is recorded rather than turned into a mechanism.

next_action:
