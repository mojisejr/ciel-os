    The proof asserts geometry, not comprehension. It cannot tell whether a
    farmer understands a screen, and the explanation wording still has not been
    read by one.
  - >-
    Only Chrome is driven, at four widths, in portrait, with no zoom and no
    system font scaling. A reader who enlarges text is not covered.
