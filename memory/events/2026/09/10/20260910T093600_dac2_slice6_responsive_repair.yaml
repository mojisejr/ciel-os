outcome:
  status: draft-pr-closeout-prepared-for-final-pr-review
  completed:
    - >-
      Repaired the class of layout failure rather than its instances. Grid and
      flex items in the layout containers no longer keep their content-based
      automatic minimum, so an over-wide child overflows its container instead of
      widening every ancestor. The scenario table now scrolls inside its own
      frame and the sticky first column written in slice 6 works for the first
      time.
    - >-
      Re-anchored the explanation card to the row or card and pinned both edges,
      so its width is its column's width and it cannot overflow by construction.
      Raised it above the bottom navigation, which had been cutting the middle
      out of the answer.
    - >-
      Gave every figure row one shape below 380 pixels, so values share a column
      a reader can follow with one thumb instead of scattering to six left edges.
    - >-
      Moved the 48-pixel rule from a list of class names onto the interactive
      elements themselves, which is why the header link had been exempt in
      silence, and let the five-button score row wrap rather than overflow.
    - >-
      Added scripts/check-responsive.sh and scripts/responsive.mjs, a browser
      proof at 320, 360, 393, and 412 pixels asserting that no page exceeds its
      device, that no interactive label is silently clipped, and that every
      activation target meets 48 pixels and stays reachable under the sticky bars.
    - >-
      Kept every prior suite passing and left the calculation, persistence, and
      account layers untouched.
  not_completed:
    - >-
      No visual redesign. The interface is still the owner's parked item; this
      made the existing design hold, it did not restyle it.
    - >-
      The segmented control's longest Thai labels now wrap to two lines inside
      their pills rather than escaping them. That is legible and passes, but a
      scrolling strip would read better and was not done.
    - >-
      Several smaller findings from the screenshot review were left: three levels
      of card nesting on the tax panel, the distance between a destructive text
      button and the checkbox above it, and the absence of a save control near
      the sticky total on long forms.

