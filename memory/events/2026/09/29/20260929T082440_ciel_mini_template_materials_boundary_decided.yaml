workstream:
  id: ciel-mini-template-001
  lane: single
  objective: >-
    Amend the CIEL-mini template plan so a learner can safely use local raw
    project material with their AI builder without turning that material into
    committed project history or a new harness.
  scope:
    - Plan revision 0.2 and Slice 1's visible ignored `materials/` folder.
    - Owner-directed AI use of named local PDFs, CSVs, images, notes, and other
      source material.
    - The boundary between raw local inputs and durable Git/memory/lesson facts.
  out_of_scope:
    - Creating the template child repository or pilot clone in this decision.
    - Automatic scanning, upload, sync, external sharing, or indexing of raw
      material; any provider, remote, deployment, or CIEL runtime work.

outcome:
  status: decided
  parallelism: approved
  completed:
    - >-
      The owner directed that the template contain a local raw-material bucket
      because a learner may arrive with a PDF, CSV, evidence, or another source
      that should inform the project without being committed.
    - >-
      The plan uses visible `materials/`, not a hidden folder, so a learner can
      find and use it. Its contents are ignored while its tracked guide and AI
      instructions explain the boundary.
    - >-
      AI source use is owner-directed: it looks in `materials/` when asked for
      a named source, derives only the needed conclusion, and does not copy raw
      or private content into Git, memory, lessons, or an external service by
      default.
  not_completed:
    - >-
      No raw material has been copied, inspected, committed, uploaded, or sent
      to an external service. No child repository exists yet.

