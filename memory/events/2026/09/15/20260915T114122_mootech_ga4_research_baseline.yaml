unresolved:
  - >-
    Data retention at 2 months means the first month of collected data starts
    expiring in mid-October 2026; raising it to 14 months is a one-click,
    no-downside change that still waits on the owner's say-so.
  - >-
    The two seeded key events qualify_lead and close_convert_lead measure
    nothing and will mislead anyone reading the key-events report; removing
    them is a decision for the plan, not this record.
  - >-
    Because the payment lane shuts GTM out, the purchase signal must come from
    the server (GA4 Measurement Protocol on the APPROVED webhook) or from a
    screen after /result; the server path keeps #493 intact and is the
    preferred shape, but it needs an api_secret created in the GA4 stream and
    an owner decision on what identifier, if any, joins the server hit to the
    browser session.
  - >-
    Birth date and time, LINE identity, and email must never travel as event
    parameters; the event specification has to say so explicitly because the
    consent switch today governs nothing.
  - >-
    GTM Publish is a production deploy that bypasses Git and this repository's
    review gate; who may publish, and how a publish is announced, is not yet a
    rule anywhere.
  - Human approval, review, and external rules remain unknown unless a repository record establishes them.

