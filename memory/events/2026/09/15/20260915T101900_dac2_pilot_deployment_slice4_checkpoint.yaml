outcome:
  status: checkpoint
  completed:
    - >-
      The pilot is live at https://dac2-pilot.onrender.com - Render free web
      service dac2-pilot (srv-dak17dp42hec73bk6ha0) in Singapore running
      ghcr.io/mojisejr/dac2-durian-smart-account:c495e5447f66ec0f56c5106ce9f9ffb742f929b4
      (manifest sha256:cf79f103f2d007500a5e347c05005ee341e05c95f62fdf80999111bacc40765b),
      Neon free PostgreSQL over its direct endpoint, Brevo's HTTP API for
      mail. The owner created every account and object and pasted the three
      secrets in the Render dashboard; the agent set the non-secret variables
      through the Render MCP and never saw a secret.
    - >-
      Application PR 20 merged as c495e54: MAIL_TRANSPORT=brevo-api, mail
      failures logged by cause, render.yaml, the README runbook, 201 tests
      in 12 suites. The push run built the image in 7 min 21 s after a
      7 min 37 s check.
    - >-
      Proved on the public address: HTTP/2 over HTTPS with the pilot notice
      on; the wasm bundle served; the start-up log showing the database
      probe, "mail via the Brevo HTTP API (key configured)", the gate
      reading x-forwarded-for, and listening on 10000; ten wrong logins
      answering 500 and the eleventh 429 with Retry-After through the proxy;
      a registration reaching Brevo in 1.6 s; the verification mail arriving
      in the owner's inbox and its link verifying the account. Neon woke in
      0.9 s on its first query.
    - >-
      Two free-tier facts differ from the research and are recorded in the
      lessons record beside this one: free Render blocks outbound SMTP, and
      Brevo blocks unknown IPs by default (the owner deactivated the
      blocking for the pilot).
  not_completed:
