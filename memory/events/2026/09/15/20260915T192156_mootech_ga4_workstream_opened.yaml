  objective: >-
    Give the team the share of v2 members active each day, and the login and
    sign_up events under it, measured on bazichart.mumate.co alone with a
    consent switch that governs the tag.
  scope:
    - Split the app into its own GA4 property through a hostname lookup in GTM; retention and seeded key events cleaned (slice 1).
