    WordPress landing site's ("ไม่ต้องรวม ไม่งั้นไม่รู้ค่าจริง"), that the
    denominator is every v2 member from the database from now on ("ให้ใช้
    ข้อมูลของ v2 ตั้งแต่นี้ไปเลย"), and authorized opening this workstream
    with plan revision 0.1. No slice is authorized by this event; slice 1
    waits on the owner's go in the same session.
  constraints:
    - No birth data, identity, or raw id ever leaves the app as an analytics field.
    - The payment-lane CSP stays as it is; no tag fires on the three shop paths.
    - Google-side changes and the PR merge are owner actions per instance; the agent prepares, guides, and verifies.
    - GTM publishes get a notice in chat first, including the team's own pixel tags.

