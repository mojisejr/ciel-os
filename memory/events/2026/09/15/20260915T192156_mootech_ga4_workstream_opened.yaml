unresolved:
  - >-
    GA4's active-user definition needs an engaged session, so a member who
    opens the app for under ten seconds and leaves is not active; the team's
    number inherits that definition until slice 3 shows whether it matters.
  - >-
    Whether the register-login round-trip response distinguishes a new
    member from an existing one is not yet read; D3 avoids depending on it by
    using first-run completion for sign_up, but login on a brand-new account
    will fire before sign_up on the same day.
  - >-
    A member who onboarded before slice 2 ships never fires sign_up; the
    denominator counts them, the sign_up series does not, and the slice-3
    reconciliation must start from the slice-2 date.
  - >-
    Consent mode default denied may lower measured DAU relative to today's
    unconditioned tag; the team should know the series changes meaning at
    the slice-2 publish, which is why slice 1 records the start date.
  - Human approval, review, and external rules remain unknown unless a repository record establishes them.

