outcome:
  status: checkpoint
  completed:
    - >-
      Traced the reset request from the Leptos form through canonical email
      lookup, the verified-account guard, token issuance, and Brevo delivery.
      The handler returns the same public sentence for known, unknown,
      unverified, and internal-failure paths, but silently discards database,
      token, mail-configuration, and delivery errors.
    - >-
      The owner reported that the same test account completed verification and
      could log in. Login and reset read the same users row and both require
      email_verified_at to be non-null, so the observed login rules out the
      proposed cause that verification failed to update the production row.
      This is an inference from the production login behavior, not a direct
      SQL observation.
    - >-
      Identified two live alternatives that the current implementation cannot
      distinguish after the fact: the shared account budget of five requests
      per hour per client address may refuse register, resend, and reset
      together; or Brevo delivery may fail after token issuance while the
      reset handler emits no safe diagnostic log.
    - >-
      Identified a separate privacy defect: verified accounts wait for token
      writes and synchronous Brevo delivery, with a twenty-second client
      timeout, while unknown or unverified accounts return after lookup. Equal
      response text therefore does not provide equal response timing.
    - >-
      Confirmed existing controls in source: a 32-byte random token stored only
      as a SHA-256 hash, one token per user, one-hour expiry, transactional
      single use, no automatic login, and session invalidation through the
      changed password hash.
    - >-
      cargo test -p web --features ssr --lib passed 62 tests. Three read-only
      research lanes independently reached the same diagnostic-blind-spot and
      timing conclusions. The application checkout remained clean at c495e54,
      equal to origin/main.
    - >-
      Read-only Render logs showed the deployed process configured for the
      Brevo HTTP API and a fresh process startup at 2026-09-15T08:01:25Z. They
      contained no reset delivery outcome because that path logs none. The new
      startup means cold-start measurement needs a new idle window.
  not_completed:
    - >-
      No direct production SQL query was obtained. The owner-open Neon Console
      rendered blank, the shell has no production DATABASE_URL, and the local
      ignored .env points to a local database. No credential was revealed or
      copied to work around that boundary.
    - >-
      The exact cause of the missing reset mail is not proved. A controlled
      request with a verified account and observable safe delivery outcome is
      still required.
    - No reset code, tests, runbook, deployment, or provider setting was changed.
    - Public responsive, stall, cold-start, and remaining phone-walkthrough proof are still pending from the earlier slice-4 checkpoint.

