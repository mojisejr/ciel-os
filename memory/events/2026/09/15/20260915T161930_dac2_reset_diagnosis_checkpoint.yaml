unresolved:
  - >-
    The minimum operational fix is safe reason-coded logging for reset token,
    configuration, and delivery failures without email, token, API key, or
    provider response body, plus endpoint-level negative controls for Brevo
    refusal and timeout.
  - >-
    Uniform response timing needs an explicit design. The current synchronous
    provider call leaks account state through latency; making delivery
    asynchronous introduces reliability and lifecycle choices on a free
    process and must not be invented as a hidden infrastructure expansion.
  - >-
    The gate is per process and per client address only. It has no per-account
    throttle, resets when the process restarts, and repeated successful
    requests invalidate previously issued reset links.
  - >-
    The deployment plan says application defects return to
    dac2-guided-inputs-001, while the earlier checkpoint mentions carrying any
    reset fix in a small application change. A checkpoint cannot silently
    expand plan authority; the owner must choose the authorized repair boundary
    before code changes begin.
  - >-
    The standing HQ branch is local, one commit ahead of origin/main before
    this event, and intentionally has no pull request while the multi-session
    round continues. Merge timing remains the owner's decision.

