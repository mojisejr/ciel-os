workstream:
  id: cu12-simulator-sprint-002
  lane: single
  objective: >-
    Prove a macOS application can use a simulator-provided virtual serial
    endpoint to exchange existing manual-derived CU12 frames without physical
    RS485 hardware.
  scope:
    - A local macOS PTY endpoint with explicit client path and 19200/8N1/raw configuration.
    - One shared stream/dispatch loop for loopback TCP and macOS PTY transports.
    - Deterministic protocol, generic transport, TCP, and PTY black-box proofs.
  out_of_scope:
    - USB-to-RS485 adapters, real CU12 hardware, cabling, electrical bus behavior,
      new commands, UI, persistence, production driver, remote, push, or CIEL platform infrastructure.

outcome:
  status: prepared_for_owner_review
  completed:
    - Child commit df032d3947d836e8f4a502ff4cdb4f200af787fb adds a macOS-only PTY mode selected with CU12_SIM_TRANSPORT=pty.
    - The simulator prints a client-facing /dev/ttys path and holds it open until a client connects.
    - The shared generic stream loop serves the existing TCP endpoint and the PTY endpoint without changing manual-derived frame/device semantics.
    - The PTY black-box test opens the advertised path, configures raw 19200/8N1, sends fragmented and concatenated requests, and receives exact status and version response bytes.
    - A live binary printed /dev/ttys000; an independent local client configured that path and received 02 00 00 80 10 02 03 99 02 00 02 00 00 8f 10 02 03 c8 10 12.
  not_completed:
    - No USB-to-RS485 adapter or physical CU12 device was connected.
    - No electrical RS485, cabling, termination, biasing, multi-drop, or real-hardware behavior was tested.

