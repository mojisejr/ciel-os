workstream:
  id: cu12-simulator-sprint-001
  lane: single
  objective: >-
    Prove that a real external TCP client can send selected CU12 V1.1 wire
    frames to a headless local simulator and receive manual-derived responses.
  scope:
    - One local-only CU12 Simulator Git checkout with no origin remote.
    - One virtual board at address 0x00 and unicast commands 0x80, 0x81, and 0x8F.
    - Parser, checksum, virtual state, TCP server, golden vectors, and black-box tests.
  out_of_scope:
    - Broadcast, multi-board, remaining commands, UI, persistence, serial,
      fault injection, real hardware, Medical Cart integration, production driver,
      remote, push, or CIEL platform infrastructure.

outcome:
  status: prepared_for_owner_review
  completed:
    - A local-only cu12-simulator checkout was initialized at checkouts/cu12-simulator on main with no origin remote.
    - Child commit 9deab0d5021749970d6d66bf30977bc9d546ea71 adds the headless Rust simulator.
    - Manual-derived unicast Get Status, Unlock, and Query Version responses match byte-for-byte in golden-vector tests.
