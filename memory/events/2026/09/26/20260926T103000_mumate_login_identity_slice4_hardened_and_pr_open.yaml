outcome:
  status: ready-for-owner-merge
  parallelism: approved
  slice: "4"
  execution_phase: "8d"
  completed:
    - >-
      THE OWNER CHOSE THE PATH WHERE MERGE MEANS MEMBERS CAN USE IT. He said it plainly -
      "ถ้า merge user ต้องใช้งานได้เลย" - which rejects the dark deploy I had recommended.
      His reasoning is better than mine was: a dark merge puts 28 commits on production and
      returns one corrected text row, which does not pay for the risk of deploying at all.
      The decision stands on a property neither of us had to argue about - the login flow is
      untouched, so nobody who does not open the settings screen is affected either way.
    - >-
      AND THE ORDER IS RIGHT FOR A REASON WORTH RECORDING. Turning linking on while the
      traffic flip is NOT done is safer than the reverse, not merely acceptable. The legacy
      backend route with its email discovery is the net under every sharp edge on this
      surface: a member who strands themselves, who removes a method, or who holds a dead
      credential row is healed by one ordinary Google login. That net is what slice 5
      removes. So "link first, flip later" is the safe sequence and not a shortcut.
    - >-
      FOUR HARDENING CHANGES, one commit (6247a71), because all four touch the same screen
      file and splitting them would have produced commits that fail their own tests.
      ① A member could remove the method they were signed in THROUGH - recorded 2026-09-25 as
      a hazard with no guard, correctly deferred because unlink was unreachable. It is
      reachable ON MERGE and not on the switch, because unlink is the one write here that
      never reads LINK_STATE_SECRET. The guard sits beside the last-method rule inside the
      same transaction on the same rows.
      ② The connect mission paid for the session's provider instead of for what the member
      holds, so opening the screen paid someone who linked nothing while someone who signed
      in with Google and genuinely linked LINE was never paid.
      ③ link_unavailable was not in MESSAGES and fell through to "please try again".
      ④ The merge had no way to be discovered; one line under an unlinked provider says what
      linking does, inferring nothing about whether the member holds a second account.
    - >-
      MY OWN TEST CAUGHT MY OWN BUG, AND IT IS THE INTERESTING ONE. I wrote the current-method
      check BEFORE the last-method check in the route's rule while summariseConnections had
      the opposite order - so a member with exactly one method, signed in through it, would
      have been told to sign in the other way when there IS no other way, and the button and
      the route would have given one member two different reasons for one refusal. Both now
      report last-method first, and a test names the precedence as the rule rather than as a
      preference.
    - >-
      THE PRODUCTION CONFIGURATION, READ FROM PRODUCTION AND NOT FROM A FILE. NEXTAUTH_URL is
      https://bazichart.mumate.co, established from production's own /api/auth/providers -
      no secret was read, pulled or written to disk to learn it. LINK_STATE_SECRET is absent
      from the production environment, confirmed by name listing. The four provider
      credentials and NEXTAUTH_URL are all present. The owner added both link callback
      redirect URIs to the Google and LINE consoles during this session.
    - >-
      PULL REQUEST 815 IS OPEN on mootech-fe, base main, 28 commits, 51 files, +10,195/-43.
      Its description carries the six CIEL sections and states what merging turns on BEFORE
      the switch, separately from what the switch turns on.
  not_completed:
    - >-
      THE PULL REQUEST IS NOT MERGED and LINK_STATE_SECRET is not set. Both are the owner's,
      and they are deliberately two steps: if something breaks after one step, the cause is
      attributable to the deploy or to the switch and not to both at once.
    - >-
      iOS IS STILL UNEXERCISED and the owner has accepted that explicitly - nobody on the
      team uses iOS, macOS behaved normally, and he will absorb it as support if it appears.
      Recorded as his decision, not as a closed risk.
    - >-
      THE MERGE BRANCH STILL HAS NO PRODUCTION EXERCISE. His own production account holds
      both providers after slice 3, so a collision cannot be staged there at all. The first
      production merge will be a real member's.

the_recommendation_the_plan_overruled:
  what_i_said: >-
    Twice, that the unlink route's last-method rule must be fixed before linking is turned on,
    because it counts provider NAMES and production still holds Google rows whose stored token
    is dead - a name that is not a way in.
  why_it_was_wrong: >-
    PLAN.md revision 0.5 had already assessed exactly this and written "the trigger is the
    FLIP, not this branch". A member holding a dead row plus one live method who removes the
    live one logs in with Google, the stored dead token does not match the fresh id_token, the
    lookup misses, email discovery finds them by email, and one login heals them completely.
    That rescue exists until slice 5 deletes it.
  what_it_cost: >-
    Nothing was built on the wrong advice; the correction came before the work started, and it
    removed roughly half a day from the path the owner chose.
  the_lesson: >-
    The deferral reasoning in a plan revision is evidence, not a leftover. I read the unresolved
    LIST and re-derived a judgement the plan had already made better, in a section I had read in
    the same session.

what_merging_turns_on_before_the_switch:
  established_by: reading each route and its gate, not inferred from the feature's name
  live_and_a_bug_fix: >-
    The settings row that hardcoded the word "LINE" now reads the member's real providers via
    /api/auth/link/connections, which is read-only, returns no identifier and needs no secret.
  live_and_a_write: >-
    DELETE /api/auth/link/unlink/<provider>. Gated by a signed session only - it never reads
    LINK_STATE_SECRET - so it goes live with the code. This is the whole reason hardening item
    ① could not wait for slice 5.
  fails_closed: >-
    Link start throws without the secret and redirects back with link_unavailable; merge
    preview and confirm both need a ticket signed with the same secret and answer 409 no_offer
    without it; the FE register-login route has no caller in the application at all.
  carries_no_migration: >-
    Migration 0034 and its index were applied to production by hand on 2026-09-23. The .sql
    files are read only by tests, and no migration runner exists in this repository, so the
    schema is AHEAD of the code - the safe direction, and it means a rollback is a Vercel
    instant rollback with nothing to undo in the database.

