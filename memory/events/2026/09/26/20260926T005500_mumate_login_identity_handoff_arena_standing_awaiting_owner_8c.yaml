the_staging_step_that_now_sits_inside_8c:
  why_it_moved: >-
    S6 was planned as "stage the pair, then walk 8c". In a 09-19 snapshot the pair may
    already exist or may not exist at all, and only the owner's own provider authorization
    can tell us which - so the first press of the walk is also the measurement.
  case_a_it_collides_immediately: >-
    His second provider's identity is owned by another account in this copy. The merge offer
    appears on that first press and 8c is complete with no SQL written at all.
  case_b_it_links_plainly: >-
    The identity is unowned in this copy, so slice 3's path attaches it to his account and
    no offer appears. That is not a failure; it is the answer. The row it just created is
    then identifiable with NO personal data: it is the only user_provider row whose create_at
    is today, because the snapshot is six days old and nothing else writes to this database.
    Move that one row to a freshly created empty account and the collision is deterministic;
    the reversal is the same statement with the two ids swapped, and it is recorded before it
    is needed.
  what_must_not_happen: >-
    Neither case may be reached by pressing confirm. 8c ends at the preview. 8d is a separate
    owner action after he has read what the offer says.

