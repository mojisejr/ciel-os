      was postgres - not a superuser, but table owner with bypassrls,
      createrole and createdb - so K7's condition applied.
    - >-
      THREE SILENT DEFECTS IN backup.sh, not two. Failures other than a tiny
      object never alerted; pg_dump piped into gzip inside alpine's sh had no
      pipefail, so a dump dying midway would publish as the newest backup; and
      the retention loop returned 1 whenever its last pass deleted nothing, so a
      SUCCESSFUL run exited 1 before its 💾 - enabling a failure alert without
      that fix would have produced a false 🚨 every night. The test proves it:
      run against the previous backup.sh it fails "successful backup exited
      non-zero".
    - >-
      mumate-infra PR 23 (feat/backup-alerts, head 28ce053): gzip on the host,
      upload to partial/ and move into pg/ only after the size check, an EXIT
      trap alerting with the step, a stamp read by the new bin/backup-age.sh,
      ops-status and health-notify reporting a stale backup as ❌ without ever
      blocking FE recovery, and scripts/backup.test.sh, which goes red against
      each removed guard.
    - >-
      K7 APPLIED ON PRODUCTION. Role mumate_backup: LOGIN BYPASSRLS, granted
      pg_read_all_data (postgres holds it with admin option; postgres lacks grant
      option on 21 auth/realtime/storage tables, so per-table grants would have
      silently narrowed the dump), default_transaction_read_only on. Created
      from a SCRAM verifier computed on the host, so the password reached
      neither Postgres logs nor this session. Checked as the role: INSERT,
      UPDATE, DELETE and CREATE all false, CREATE TABLE refused; a full pg_dump
      exited 0 with empty stderr in 39 s and the same 221 COPY tables as the
      postgres dump of 09-19. env/backup.env now connects as it; the pre-role
      copy made for rollback was deleted once proven.
    - >-
