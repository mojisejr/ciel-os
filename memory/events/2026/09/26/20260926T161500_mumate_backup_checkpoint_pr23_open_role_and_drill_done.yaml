      in 78 s (5,018 users, the 2 documented noise errors); the shadow FE
      pointed at it answered db ok 5 s later with 1 connection seen in pgtmp -
      RTO 83 s from start to serving. fe.env returned byte-identical by
      checksum, FE back on the pooler at 6 ms, arena down, no temporary env copy
