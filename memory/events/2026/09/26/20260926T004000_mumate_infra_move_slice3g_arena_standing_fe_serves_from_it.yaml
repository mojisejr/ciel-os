findings_that_contradict_what_i_wrote_hours_earlier:
  there_is_no_nightly_backup:
    observed: >-
      mumate-backup.timer is disabled and inactive; systemctl lists only mumate-health.timer.
      s3://mumate-backups/pg/ holds exactly ONE object: mumate-1-20260919T220406Z.sql.gz,
      125.7 MiB, from 2026-09-19 22:05 UTC - six days old.
    what_i_had_written: >-
      The runbook table I added in pull request 22, and the records at 20260926T000200 and
      20260926T002800, describe bin/backup.sh as producing a nightly dump with 14-day
      retention. That describes the timer's design, not its state. The off-platform layer is
      in fact one manual dump, and BACKUP_KEEP_DAYS prunes only when a run happens, so
      nothing is rotating either.
    is_it_a_defect: >-
      No. runbooks/02 says the timer is enabled only when a slice permits it, so disabled is
      the deliberate state. The error was mine: I described a designed layer as a live one,
      in the same file where I had just corrected someone else's assumption about PITR. Two
      assumed backup facts in one evening, from different authors, in the same paragraph -
      which is the argument for checking a recovery claim against the host rather than
      against the repository that describes it.
    what_it_means_together_with_PITR_off: >-
      Production's recovery today is Supabase Pro's own daily backups, seven days, to each
      day's backup point. The off-platform copy is a single six-day-old file. Not
      unprotected - the managed layer runs - but thinner than any document here said.
    action: >-
      A runbook correction is next, and enabling the timer is an owner decision I am not
      asking for tonight.
  the_arena_is_six_days_stale:
    consequence_for_slice_4: >-
      None that matters. The rehearsal needs production's SHAPE and volume, which it has,
      and phase 8c's collision pair is staged deliberately in S6 rather than found, so the
      snapshot's age does not change what the merge proves. Members created after 09-19 are
      absent, and the owner's own slice-3 linking from 09-25 is absent, which if anything
      makes the pair easier to arrange.
    what_i_did_not_do: >-
      I did not run bin/backup.sh to take a fresh dump. That reads production and writes to
      Spaces, and the owner authorized standing the arena up, not a new backup.

