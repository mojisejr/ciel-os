the_two_steps_and_why_they_were_two:
  timing:
    - "12:39:57 +07 - pull request 815 merged"
    - "12:40:00 - Vercel production deployment created from main. Feature OFF: no secret existed."
    - "~12:44 - LINK_STATE_SECRET added to the production environment. Feature still OFF: the running deployment predates it."
    - "~12:53 - redeploy. The secret reaches the functions. Feature ON."
    - "~13:05 - both provider consoles verified by probe with negative controls."
  what_the_separation_bought: >-
    A failure after the merge would have been attributable to the code; a failure after the
    switch, to the switch. Because they were separate, the four-minute window where the variable
    existed but was not in effect was a recognisable state rather than a mystery - and the fix
    was a redeploy rather than a hunt through the callback.
  how_to_reverse_each: >-
    The switch: `vercel env rm LINK_STATE_SECRET production` then redeploy; the code stays. The
    code: Vercel instant rollback, with nothing to undo in the database - migration 0034 has been
    on production since 2026-09-23 and this release carried no migration, so the schema is ahead
    of the code, which is the direction that lets code roll back alone.

lessons:
  a_gate_is_a_property_of_each_route_not_of_a_feature: >-
    I described the whole linking surface as "gated behind LINK_STATE_SECRET" and it was almost
    true. The unlink route - the one write that DELETES a login credential - never reads that
    variable: it needs only a signed session, so it went live with the code and not with the
    switch. I only found it because I read each route's gate separately instead of reasoning
    about the feature. "Behind a flag" is a claim to verify per entry point, and the entry point
    most likely to be missed is the destructive one, because it is not the feature's headline.
  a_plans_deferral_reasoning_is_evidence_not_a_leftover: >-
    Twice I recommended fixing the unlink route's last-method rule before enabling linking.
    PLAN.md revision 0.5 had already judged it, better than I did, in a section I had read the
    same session: "the trigger is the FLIP, not this branch", because one legacy Google login
    heals a member whose only other row is a dead token, and the legacy path still serves every
    login. I had read the unresolved LIST and re-derived a worse answer. When an unresolved item
    looks like a blocker, find where the plan decided to defer it and read that reasoning first.
    Correcting this removed roughly half a day from the path the owner chose.
  a_probe_that_cannot_fail_proves_nothing: >-
    My first redirect-URI test asked Google's authorize endpoint about the link callback, got
    302, and I reported it as accepted. The negative control with a deliberately bogus path also
    returned 302 - Google defers redirect_uri validation until after the redirect chain. Only
    following the chain to the end made the test discriminate, at which point the bogus URI
    produced Error 400 redirect_uri_mismatch and the real one produced a sign-in page. A
    configuration probe is worth nothing until a known-bad input has been shown to fail it.
  when_two_places_mirror_one_rule_test_the_PRECEDENCE: >-
    I added the current-method refusal to unlinkProvider BEFORE the last-method check while
    summariseConnections had the opposite order. For a member with exactly one method, signed in
    through it, both refusals fire - and the two would have disagreed, telling one member to
    sign in a way that does not exist while the button said the opposite. That is precisely the
    thing both are written to make impossible. My own test caught it before it left the machine,
    because it asserted the order as the rule rather than asserting each outcome separately.
  set_and_in_effect_are_two_different_facts: >-
    On Vercel an environment variable that exists in the project is not an environment variable
    the running functions can read; a deployment carries the values as they were when it was
    built. `vercel env ls` showing the name is therefore not evidence the feature is on. The
    general form: for any configuration, distinguish "recorded in the control plane" from
    "loaded by the process", and name which one the evidence supports.
  configuration_truth_lives_in_the_running_system_and_this_is_the_second_time: >-
    The production environment the team supplied at .assets/mumate/infra-mumate/from-jareonsak/
    fe-env.env is a development environment - NEXTAUTH_URL is http://localhost:3000, NODE_ENV is
    development - and using it would have produced a redirect URI that could never match. The
    real value came from production's own /api/auth/providers, which states every callback URL
    it actually builds. The 2026-09-25 record already warned that both .assets copies of that
    variable disagree with reality. A lesson that recurs is a pattern, not an incident: for any
    value that must match character for character, ask the running process, never a file.
  an_account_that_holds_everything_cannot_test_anything: >-
    The owner's account holds both providers after slice 3, so on production he could neither
    press a link button (there is none to press) nor stage a collision. The verification had to
    be redesigned around that: probe the consoles directly, and read the already-linked path as
    the safe round trip. This is the same affordance gap the records already carry as a member
    problem, surfacing as a TESTING problem. It belongs in DoD 4b, because 4b is where the
    screen learns to talk to a member who already has both.
  a_precise_claim_beats_a_true_one: >-
    The 2026-09-26T00:40 record says gitleaks "found nothing" for that commit. It reports two
    findings, both synthetic fixtures in scripts/link-verify-default.test.ts that were present
    then too. The conclusion it supported - no real secret on the branch - still holds, and the
    claim was still wrong. Say "two findings, both read, both fixtures" rather than "nothing".

