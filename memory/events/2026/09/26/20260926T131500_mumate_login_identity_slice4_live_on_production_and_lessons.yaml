outcome:
  status: slice-complete-pr-merged
  parallelism: approved
  slice: "4"
  execution_phase: "8d"
  completed:
    - >-
      SLICES 1-4 ARE ON PRODUCTION. Pull request 815 merged to mootech-fe main at
      2026-09-26T05:39:57Z as 1ab900c, 28 commits, 51 files, +10,195/-43. Vercel deployed it
      from main within seconds. Verified from outside rather than taken on trust.
    - >-
      THE DEPLOY WAS PROVEN BY A PROBE THAT COULD ONLY PASS IF THE NEW CODE WAS LIVE. Before
      the merge, /api/auth/link/connections and /api/auth/register-login-fe were both swallowed
      by NextAuth's catch-all at pages/api/auth/[...nextauth].ts and answered "This action with
      HTTP GET is not supported by NextAuth.js". After it they answer 401 and 405 respectively,
      and /api/auth/link/start/google answers 302 to ?link_error=not_signed_in. The more
      specific file routes now win over the catch-all, which is the thing that had to be true
      and had only ever been observed on staging.
    - >-
      THE ORDINARY LOGIN FLOW IS UNCHANGED, confirmed by the owner from his phone. That was the
      one check that could have stopped the release, because this merge carries a parallel
      register-login route that must stay dark: constants/api/endpoint.ts:55 still resolves to
      the backend and nothing in the application calls the FE route.
    - >-
      THE FEATURE WAS THEN TURNED ON AS A SEPARATE STEP, and the separation earned itself
      within four minutes. The owner added LINK_STATE_SECRET to the production environment AFTER
      the deploy had already been built, so the running functions did not have it and the
      feature was still off while `vercel env ls` showed the variable present. A redeploy is
      what puts it in effect. This is exactly the trap the runbook named one message earlier,
      and it cost nothing because the two steps were separate and the state was checked between
      them rather than assumed.
    - >-
      BOTH PROVIDER CONSOLES ARE VERIFIED, WITH NEGATIVE CONTROLS, AND WITHOUT TOUCHING AN
      ACCOUNT. Google accepts .../api/auth/link/callback/google - it reaches the real sign-in
      page carrying app_domain=https://bazichart.mumate.co - and rejects a deliberately bogus
      sibling path with Error 400 redirect_uri_mismatch. LINE answers 200 with its login page
      for .../api/auth/link/callback/line and 400 for the bogus one. No token was issued, no
      row was written, and nothing was read from a secret store: the client ids came from
      production's own NextAuth sign-in payload, where they are public parameters.
    - >-
      THAT PROBE CLOSED THE LARGEST UNVERIFIED RISK OF THE WHOLE RELEASE. A wrong redirect URI
      fails as redirect_uri_mismatch, which looks like an application bug, is invisible to us,
      and would have been discovered by members. It was also the one thing no amount of work on
      the arena could have tested, because the URI is per-domain.
    - >-
      THE OWNER DECIDED TO OPEN IT TO MEMBERS AND HANDLE EDGE CASES AT THE COALFACE. Recorded as
      his decision with the residue named to him first, not as an assumption. The residual
      failure mode is the designed fail-closed path - a Thai sentence saying the feature is not
      ready - and reversing the switch is one command plus a redeploy.
