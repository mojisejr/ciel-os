outcome:
  status: recorded
  parallelism: approved
  slice: "3"
  execution_phase: "3g"
  completed:
    - >-
      bin/arena.sh exists with three verbs. `up` checks the disk against eight times the
      compressed object BEFORE touching pgtmp, brings pgtmp up, terminates connections,
      drops and creates the database, streams the newest Spaces object through psql,
      writes source, creation date and deletion date into an arena_meta table INSIDE the
      arena, then verifies. `status` reports what was loaded, days remaining, the restore
      error count, and whether FE points at the arena. `down` refuses while FE still
      points at it, then removes the container and the volume.
    - >-
      THE VERIFICATION GATE IS NOT A TABLE COUNT ALONE. More than 100 tables and user
      rows greater than zero are kept from the existing restore proof, and each of the
      five tables slice 4 actually touches must be readable: user, user_provider,
      member_subscription, member_payment, ops_audit_log. A table count passes while the
      one table the login flow needs is absent, which is the failure this gate exists to
      refuse. On failure it alerts and stops, so FE is never pointed at a half-loaded copy.
    - >-
      RUNNING IT TWICE IS THE FEATURE, AND IS WHY THIS IS NOT restore-verify.sh --keep.
      That script proves a backup restores and --keep exists so the slice-2 BE dogfood
      could borrow the result; borrowed as an arena it does not drop before loading, so a
      second run layers two dumps, and it carries no expiry, no notion of who is using it
      and no stated way back. Owner decision 13 asks for a command that can be run again
      whenever a risky step needs a rehearsal, so drop-then-load is the first thing up does.
    - >-
      PSQL STDERR IS NEVER PRINTED. It goes to .arena-restore.err at mode 600 and only
      the number of ERROR lines is reported, because a psql error line can carry the row
      that failed and those rows are real member data.
    - >-
      ONE DEFECT OF MY OWN, FOUND AND FIXED BEFORE THE COMMIT. report_contents logged to
      stdout while also returning the table count, so TABLES=$(report_contents) captured
      the log text with the number and the -gt 100 gate would have compared a
      non-numeric string - it would have failed silently in the direction of refusing a
      good arena. Logging now goes to stderr, the count alone to stdout, with the reason
      written beside it.
    - >-
      Checked with what can be checked off the host: shellcheck -S warning clean, bash -n
      clean, docker compose config valid with tags supplied. Pull request 21 is open with
      its description written to the CIEL template.
  not_completed:
    - >-
      NOTHING HAS RUN ON THE HOST. Not --dry-run, not up. The repository's first rule is
      that the server is the result of git, so the host runs this only after the owner
      merges, exactly as pull request 20 was merged before the shadow fast-forwarded to it.
    - >-
      DoD 3g IS THEREFORE UNMET. The arena is not standing, the shadow FE still serves
      production, and no deletion date has been recorded for a copy that does not exist yet.
    - >-
      HEALTH_DB_TIMEOUT_MS is still equal to the Docker probe timeout. It is one value in
      the same file the owner opens to point FE at the arena, and it is carried rather
      than fixed here.

