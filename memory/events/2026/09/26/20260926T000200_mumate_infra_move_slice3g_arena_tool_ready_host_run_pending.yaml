unresolved:
  - >-
    The arena is a direct connection, so the transaction pooler is in no test path. A
    pooler-specific fault will not reproduce on it.
  - >-
    While FE points at the arena, be and bazi still read production. The login flow is
    FE-native so it is coherent, but any FE route reading engine tables reads a snapshot.
  - >-
    The arena holds real member data on the droplet for as long as it lives. The recorded
    deletion date and status's warning are the mitigation; nothing enforces it.
  - >-
    A runbook line in this repository says Supabase's own PITR and daily backups are the
    first recovery layer. If the PITR add-on is in fact already paid for, then the cost
    half of owner decision 12's reasoning is weaker than written - the branch would then
    include data without a new charge. It does not change the decision, which also rests
    on our dump already existing, but it should be answered rather than left implied.
  - >-
    Carried by this lane - 3c under the quiet gate, the payment test webhook from the
    team, Vercel Preview resolving to the production database, and mootech-fe origin/main
    failing its own verify-architecture pre-push gate.

