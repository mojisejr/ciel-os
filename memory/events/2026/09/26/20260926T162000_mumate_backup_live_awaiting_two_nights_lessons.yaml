lessons:
  - >-
    READ THE SCRIPT BEFORE ARMING IT. The plan said "make failure loud, then
    enable the timer". Reading it found a third defect nobody had listed - a
    successful run exiting 1 - which the new alert would have turned into a
    false alarm every night. An alarm that cries wolf on day one teaches the
    owner to ignore it, which is worse than no alarm.
  - >-
    A PIPE INSIDE A CONTAINER LEAVES THE HOST'S PIPEFAIL. `set -o pipefail` in
    _lib.sh never saw pg_dump, because the pipe ran inside alpine's sh. Where a
    pipeline crosses a docker run boundary, ask whose shell owns each pipe.
  - >-
    A FAKE CAN HIDE THE DEFECT IT WAS WRITTEN TO CATCH. The first test passed
    against the reintroduced in-container pipe, because the fake docker never
    ran sh -c. It needed a structural guard. Every mutation is worth running,
    because the one that stays green shows where the test is blind.
  - >-
    GRANT THE ROLE, NOT THE TABLES. postgres lacked grant option on 21
    auth/realtime/storage tables, so per-table grants would have silently
    narrowed the dump. pg_read_all_data, which postgres holds with admin
    option, plus BYPASSRLS gave identical coverage. It was proven by diffing
    the COPY lists, not assumed.
  - >-
    A PASSWORD SENT AS SQL CAN LAND IN A LOG. The role was created from a SCRAM
    verifier computed on the host, so the plaintext reached neither Postgres
    logs nor this session.
  - >-
    A NUMBER THAT MOVES NEEDS ITS CAUSE FOUND BEFORE IT IS ACCEPTED. 185 → 184
    tables looked like a table lost to the new role; it was the arena's own
    bookkeeping table. Diffing the two dumps settled it in one command.
  - >-
    THE BIGGEST RISK WAS OUTSIDE THE THING BEING FIXED. The inventory step,
    meant as a footnote, found 7.1 GB of member files outside every backup. The
    owner accepted that risk knowingly, which is a different state from nobody
    knowing.

