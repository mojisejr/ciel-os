production_write_accounting:
  what_reached_production_during_the_whole_rehearsal: >-
    Caddy's log for api.staging.mumate.co from 2026-09-25T23:24Z: 5 successful POST
    /user/register-login, 3 OPTIONS preflights, 9 GET /health, 3 GET /chinese-horoscope.
    Every POST is the legacy login path, which for a LINE identity that already exists reads
    the provider row, calls LINE to check the user id, downloads the member's profile image
    to the S3 bucket, sets picture_url and saves the `user` row, then ensures a refer_code.
  so: >-
    Production's `user` row for the owner's own account was written up to five times, and an
    S3 object written per call. No provider row, no account and no merge touched production;
    every identity movement happened in the arena and was reversed there once.
  why: >-
    The arena isolates the FE's own database, not the FE's callers. register-login traffic is
    not flipped yet, so the FE posts to the BE, and the BE container reads and writes
    production. Pointing be and bazi at the arena is possible - slice 2's dogfood set DB_HOST
    to pgtmp - and should be done before slice 5 rehearses the flip itself.

findings_reported_not_acted_on:
  oauth_codes_and_state_reach_the_log_pipeline:
    observed: >-
      Caddy logs the full request URI including the query string, so every provider callback
      records its `code` and `state`. 31 access-log lines in this morning's window carry one
      or both. alloy/config.alloy redacts e-mail, Thai mobile numbers and JWT-shaped strings,
      and drops the BE's indented user-record lines; an OAuth authorization code and this
      lane's signed link `state` match none of those shapes, so they are shipped to Grafana
      Cloud as written.
    how_bad: >-
      An authorization code is single-use and short-lived, and each one observed here was
      already consumed by the exchange that logged it. The link `state` is signed with
      LINK_STATE_SECRET and bounded. So this is not an open door; it is secrets in a log
      store that a third party holds, which is a different and smaller problem than a
      credential leak - and it is one narrow redaction rule away from not existing.
    whose: the infrastructure lane's pipeline, with the app's URL shapes as input. Not this lane's to change.
  be_logs_the_whole_login_input:
    observed: >-
      mootech-be's registerOrLogin opens with console.log('registerOrLogin _input', _input),
      printing email, name, image URL and the idToken the FE sent. alloy's drop rule catches
      the BE's multi-line indented records; a single-line inspect of that input is not
      indented, and a LINE userId is not JWT-shaped, so it can pass the filters. It is a
      stable personal identifier rather than a password - authentication still goes through
      LINE - and alloy's own comment already says fixing the source belongs to the
      application repository.
    whose: mootech-be, reference-only for this lane.

