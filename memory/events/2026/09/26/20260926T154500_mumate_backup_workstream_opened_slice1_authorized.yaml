  decision: >-
    On 2026-09-26 the owner read this session's summary of the MuMate lanes,
    agreed that the backup layer comes first, asked for a step table, a DoD
    table and the decisions needed, and answered each: K1 open the workstream;
    K2 keep the Droplet, because DigitalOcean is to become MuMate's main server
    and not only staging; K3 nightly at 09:00 Bangkok with 14-day retention;
    K4 member data in the private Spaces bucket for 14 days accepted; K5 drill
    into pgtmp, a Supabase-project restore deferred; K6 no PITR until truly
    needed; K7 a read-only role for the dump if the current one is a superuser.
    He said to open the workstream and run it to the end unless blocked
    ("ถ้าพร้อมคุนเปิด workstream แล้วลุยได้เลย ถ้าไม่ติด blocker อะไรก็ยาวจนจบได้เลย").
  authorizes:
