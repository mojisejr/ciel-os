    - Creating one read-only database role on production Supabase for pg_dump, only if the current role is found to be a superuser or owner.
  does_not_authorize:
    - Any other write to production Supabase, or a restore over production.
    - Buying PITR or any new paid service.
    - Repointing be or bazi, or any change outside mumate-infra and ciel-os.
