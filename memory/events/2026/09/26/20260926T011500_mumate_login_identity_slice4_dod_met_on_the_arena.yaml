the_copy_defect_the_owner_found_and_what_closed_it:
  what_happened: >-
    On the first walk he read the offer panel, found the Thai readable, pressed through both
    gates deliberately - and afterwards could not say that the LINE credential he was signed
    in with was the one about to move. He had guessed the direction correctly from knowing
    which of his accounts holds his purchases, not from anything on the screen. That is a
    DoD 4 failure: the rule says the member is told what stays behind BEFORE anything is
    written.
  the_three_causes: >-
    ① The only provider named on the panel was the one he had just verified, which is the
    side that STAYS - so the single concrete noun pointed at the wrong half. ② Both accounts
    were abstractions, "this account" and "the other one", while a member thinks in "my
    LINE" and "my Google". ③ "will have no way to sign in" is true of the losing row set and
    false of the member's experience, because the surviving account ends up holding BOTH
    credentials - so the sentence frightened him about the one thing that does not happen
    and buried the thing that does, which is that the data left behind becomes unreachable.
  the_fix: >-
    preview now returns movingProvider and reason, both already decided by
    planIdentityMerge, so nothing extra is read and neither carries a user id or the proven
    subject. The panel names the credential that moves, names the side kept, says WHY it was
    kept - the owner's decision, because he had reasoned it out himself and wanted the
    screen to say it - states that both providers still work afterwards, and puts the cost on
    the data.
  the_proof_it_closed: >-
    On the second walk, with the rewritten copy, the owner reported it read completely and
    clearly, answered every question the screen is supposed to answer without asking me, and
    then confirmed. Guards were added so it cannot regress: the route spec now covers the
    MIRROR case - when the signed-in side loses, movingProvider must be its own provider and
    not the verified one, which is precisely his case - and the screen spec asserts the
    mover is named, the kept side is named, each reason renders its own sentence, both
    providers appear in the after-merge line, an older server sending neither field renders
    without substituting the verified provider as if it were the mover, and - inverted from
    what it used to assert - that the cost line does NOT claim a login method is lost.

the_correction_i_owe_about_production:
  what_i_said: >-
    Repeatedly, including in this event's predecessors and in the acceptance checks I wrote
    for them: "nothing outside the arena is written at any point".
  what_actually_happened: >-
    Caddy's access log for the walk window shows 15 requests reaching the BE container,
    among them TWO successful POST /user/register-login and one OPTIONS preflight. The BE is
    a different container and it reads and writes PRODUCTION - pointing the FE at the arena
    never moved it. Reading mootech-be's registerOrLogin for the LINE branch with an existing
    provider row: it calls LINE to check the user id, downloads the member's LINE profile
    image and uploads it to the S3 bucket, sets picture_url and calls
    userRepository.save(user), then ensures a refer_code. So production's `user` row was
    written, and an object was written to the bucket, twice.
  how_bad_it_is: >-
    Not damaging. That is the ordinary production login path, identical to what runs every
    time any member opens the real application, and it wrote the member's own row with his
    own picture. No merge, no provider row and no account touched production - our merge
    happened entirely in the arena, and production's user_provider is as it was.
  why_it_happened_and_what_it_teaches: >-
    The arena isolates the FE's OWN database. It does not isolate the FE's callers. Traffic
    for register-login has not been flipped yet, so the FE still posts to the BE, and the BE
    is pointed at production. A hermetic rehearsal would have to point be - and bazi - at
    the arena too, which slice 2's dogfood already proved is possible by setting DB_HOST to
    pgtmp. That is a concrete improvement for slice 5's rehearsal, where the thing being
    rehearsed is the flip itself and a stray production write would be far less innocent.
  what_i_should_have_done: >-
    Checked where every container pointed before claiming isolation, rather than checking the
    one I had just changed. I recorded "be and bazi still read production" as an unresolved
    item and then wrote "nothing outside the arena is written" in the same records - the
    contradiction was already on the page.

observations_in_other_lanes_code_reported_not_chased:
  be_logs_the_whole_login_input: >-
    registerOrLogin begins with console.log('registerOrLogin _input', _input), which prints
    email, name, image URL and the idToken the FE sent. The infrastructure lane already knew
    the BE prints whole user records and built redaction in alloy/config.alloy: it DROPS the
    indented key/value lines the BE emits and replaces e-mail, Thai mobile and JWT-shaped
    strings on every service before anything reaches Grafana Cloud. A JWT idToken is
    therefore redacted. A LINE userId is not JWT-shaped, so a one-line inspect of that input
    could carry it out - a stable personal identifier rather than a password, since
    authentication still goes through LINE. The alloy comment already says fixing the source
    belongs to the application repository. Reported here because I read it while verifying
    something else; it is not this lane's code and I changed nothing.
  a_delete_endpoint_answers_GET: >-
    GET /api/v2/account/delete returned 304 with a zero-length body during the walk, which
    is a prefetch being served from cache rather than a deletion - and the row counts prove
    nothing was deleted. Still, a destructive route that answers a cacheable GET at all is
    worth someone's attention eventually. Deferred.

