    - >-
      crates/license: payload {v, customer, machine, issued, expires, note}
      signed with Ed25519 into one line "SMC1.<payload>.<sig>" in URL-safe
      base64; open() verifies against a public key; check() gives Valid,
      Expired, WrongMachine, ClockRolledBack (today more than a day before
      the last day seen), Invalid or Missing, with allows_load (Valid only)
      and allows_dispense (Valid, Expired, ClockRolledBack). Machine code:
      SHA-256 of the OS machine identifier (Windows MachineGuid via reg
      query, macOS IOPlatformUUID via ioreg, Linux /etc/machine-id) shown as
      twelve Crockford-base32 characters in three groups; normalise()
      forgives case, spaces and o/i/l. A dependency-free UTC Date with
      +days/+months/+years (month ends clamped). 7 tests.
    - >-
      smc-license binary: keygen --out (refuses to overwrite), issue --key
      --customer --machine with --days/--months/--years/--lifetime and
      --out, inspect (embedded key or --pubkey), machine. Tried end to end:
      a yearly and a lifetime license issued for this Mac's code
      X71V-ZXS8-8XXD and inspected.
    - >-
      A development key pair generated; the public half is embedded in
      crates/license/src/pubkey.rs with KEY_LABEL "development"; the
      private half is at .assets/smc-v2/dev-license-signing.key in CIEL HQ,
