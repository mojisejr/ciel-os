      owner's .assets/mumate/.env-from-beam.md; GEMINI_API_KEY and OPS_ADMINS
      from the owner's addition.env; APP_DATABASE_URL built from the BE
      Supabase credentials on the transaction pooler port 6543 (Bazi's
      client sets prepare:false for that pooler) after the owner confirmed
      it is the MuMate Supabase database, not Neon (Neon holds Bazi's own 60
      tables and stays as DATABASE_URL). Six FE-internal secrets were
      generated fresh for the shadow (64 hex each): ANALYTICS_USER_ID_KEY,
      CALC_NONCE_SECRET, GLASS_BOX_KEY, OPS_DASHBOARD_KEY, V2_PREVIEW_KEY,
      WHATIF_KEY — they gate shadow-only pages and hashes, nothing shared.
      Still empty on purpose or pending: GITHUB_TOKEN (ops activity page;
      owner will rotate later), QSTASH_CURRENT_SIGNING_KEY,
      QSTASH_NEXT_SIGNING_KEY, QSTASH_URL (irrelevant while QSTASH_TOKEN is
      stripped). Strip list applied as decided: VERCEL_*, TURBO_*, NX_DAEMON,
      VERCEL_TOKEN, LAUNCH_DEPLOY_HOOK_URL, LAUNCH_KEY, RENDER_API_KEY,
      QSTASH_TOKEN — every stripped name grep-verified as either unread by
      app code or fail-closed by design (LAUNCH_KEY hides /launch;
      QSTASH_TOKEN absent = no scheduling).
    - >-
      Host. fe.env 53 vars, bazi.env 31 vars, 600 deploy:deploy, no quotes,
      no duplicates. First full-profile deploy: FE healthy, Bazi unhealthy
      (empty APP_DATABASE_URL) → deploy.sh rolled .env back, BE untouched.
