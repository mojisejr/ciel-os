      Bazi bundle has no pk_test_dummy. Images 632 MB / 590 MB.
    - >-
      Vercel "sensitive" variables. vercel env pull (and the API, and the
      dashboard) never reveal values of type "sensitive": FE 20 of 77, Bazi
      4 of 52 came back empty, including Bazi's APP_DATABASE_URL, which made
      the first Bazi container report db: error (zod .url() rejects "").
      Recovered without any Vercel access: AI_CONSUME_SECRET, CONSENT_SECRET,
      CREDIT_ENFORCE from the BE Render export (shared FE↔BE values);
      OPEN_WEBUI_API_TOKEN for Bazi from the FE export; BEAM_API_KEY,
