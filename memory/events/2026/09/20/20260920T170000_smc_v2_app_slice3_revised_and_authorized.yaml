outcome:
  status: decided
  decision: >-
    The owner, present and speaking directly on 2026-09-20 afternoon, said
    the legacy application cannot be run on this Mac: the setup is hard
    without the hardware and the pieces are not all there. The owner asked
    for a workaround that still yields the structure of every screen, said
    a source reading is enough - "ไม่ต้องเหมือนเป๊ะ ก็ได้ แต่ให้แบบทรงเดิม" -
    and asked the agent to propose a design that is robust and simple, that
    improves where it can, that stays inside the legacy theme, mood and
    tone, and that asks when it does not understand. Three read-only
    surveys of the legacy renderer (shell and theme, dialogs and journeys,
    settings and logs) were run and returned the shape, the classes, the
    colours and every Thai string with file and line references. One
    sync-up round of ten questions followed; the agent's lean held on all
    ten. The answers, now part of the plan: source capture replaces
    screenshots; Prompt stays and is self-hosted; the wait dialogs lose
    their ตกลง button and close on the hook observation, with ยกเลิก only
    when the door did not pop; the emergency "!" moves to the admin slot
    tab; the reset button on an occupied card stays but asks for an admin
    PIN and a reason; the lock colours stay with a state word beside them;
    the logs page stays open to everyone, gains a date range, and its CSV
    export asks for an admin PIN, xlsx cut; admin has four re-cut tabs with
    the broken all-slots buttons removed, a confirmation before deleting a
    user, and self-service PIN change for the admin; deviations are
    numbered with a default of yes; the deliverable is DESIGN.md alone as
    smc-v2 pull request 4.
  authorizes:
    - Slice 3 of plan revision 0.2 - DESIGN.md at the root of smc-v2, written from the legacy source, on a topic branch, as a draft pull request for the owner's review.
  does_not_authorize:
    - Any UI code; slice 4 waits for the merged DESIGN.md and its own decision.
    - Running the legacy application or writing into its checkout.

