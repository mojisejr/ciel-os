workstream:
  id: mumate-infra-move-001
  lane: single
  objective: >-
    Build a DigitalOcean sgp1 replacement for the exact MuMate system the
    product team launches, keep Supabase as the single source of truth,
    prove it in parallel, then flip inside an owner-controlled maintenance
    window. Slice 2: the control room can create, deploy, fail, restore,
    and report — proven by dogfooding mootech-be on a company-owned
    Droplet, with every DoD item exercised for real.
  scope:
    - Private mumate-infra control room (compose, Caddy, deploy/rollback, backup/restore-verify, alert, ops-status, disabled timers, three Thai runbooks) — PRs #1-#5 merged, #6 open.
    - Company Team resources: Droplet, Reserved IP, firewall, project, alert policies, Spaces bucket + key.
    - Dogfood on BE: deploy by SHA, failed deploy (pull failure and unhealthy-after-up) → automatic rollback, manual rollback, backup → restore-verify, alert to Discord, deploy-user boundary, timed host reconstruction.
  out_of_scope:
    - FE and Bazi on the host, hostnames, TLS certificates, enabled timers, production Supabase as BE's database (slice 3).
    - Cutover, DNS, maintenance window (slice 4+).

