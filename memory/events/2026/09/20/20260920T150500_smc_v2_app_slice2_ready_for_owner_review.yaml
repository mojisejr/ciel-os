outcome:
  status: slice-closed
  completed:
    - >-
      Application commit 13c1bd6 on feat/workflow-store from 283798c,
      pushed, draft pull request 2 opened (base feat/cu12-gateway, stacked).
    - >-
      crates/workflow: Cabinet::step(Input) -> Result<Vec<Effect>, Refusal>
      over twelve SlotStates - Empty, AwaitOpen, Open, Loaded - with Load,
      Dispense by HN, Cancel, Clear (admin, loaded only), ForceClear (admin,
      any), Observed, Tick. One HN holds one slot; nothing starts while a
      door reads open, before the first observation, or while another slot
      is in transition; a door not open after 2 s and a door open beyond
      60 s are each warned once and recorded; a restore is reconciled with
      the doors on the first observation. 8 tests.
    - >-
      crates/store: sqlx SQLite, migrations/0001_init.sql - users (argon2id
      PIN hash; the PIN alone identifies the user, so it is unique among
      active users; 4 to 8 digits), slots (state as JSON plus the columns
      screens read), actions with triggers that refuse UPDATE and DELETE,
      settings. 6 tests, in memory and on a file that survives reopen.
    - >-
      crates/cabinet: Service::start(endpoint, store, config) opens the
      board, restores the slots, starts the poller and the tick;
      load/dispense/cancel/clear/force_clear take a PIN and return
      WrongPin, NotAdmin, Refused(Refusal) or Board(GatewayError); snapshot()
      and a broadcast of Events for the shell. Background tasks hold only a
      Weak to the core, so dropping the last handle closes the board. An
      unlock the board refuses puts the slot back and writes "cancelled"
      with the reason after "load-requested".
    - >-
      Five scenarios through the spawned simulator, asserting on the
      actions rows: load then dispense then clear with the tester playing
      the door (rows: load-requested, door-opened, load-completed,
      dispense-requested, door-opened, dispense-completed, cleared - admin
      on the last, the nurse on the rest) and a second service restoring
      the store; door physics popping the door and a door left open warned;
      a door that does not open warned, another slot refused meanwhile, and
      the cancel; a restart with the door open, closed while down,
      completed on restart; a board gone silent reported, a load against it
      failing cleanly with "unlock failed" recorded.
    - >-
      Checks at 13c1bd6: fmt; cargo test --workspace (40 passed); clippy
      -D warnings; rust-toolchain.toml pins 1.88 with the Windows and wasm
      targets, as DAC2 does, because sqlx's tree needs 1.88.
  departures:
    - >-
      The plan named two crates; a third, cabinet, was needed to run the
      scenarios the plan asked for through the gateway and the simulator.
      It is the application core the desktop shell will call, not extra
      scope.
    - >-
      Every start records one "reconciled" row per slot whose door reads
      open on the first observation. Against the simulator's fixture that
      is eleven rows; against a cabinet with its doors closed, none.
  boundaries:
    - Timings in the scenarios are shortened (50 ms poll, 400 ms grace, 800 ms left-open); production defaults are 500 ms / 2 s / 2 s / 60 s.

