outcome:
  status: recorded
  completed:
    - >-
      Production launched (the team pressed GO LIVE on Vercel: MAINTENANCE_MODE
      off, V2_PREVIEW_KEY deleted, per lib/launch/vercel.ts). The shadow had
      a freshly generated V2_PREVIEW_KEY, so /v2 was still gated there:
      removed from env/fe.env on the host and from the owner's .assets copy,
      FE recreated (same image 921f449…-staging, ~15 s), /v2 open on both.
      A fresh vercel env pull diffed against the morning copy: no other
      variable added, removed, or changed. FE code SHA equal on both
      (921f449). Rule adopted for the rest of slice 3: after any team
      launch/env change, re-pull and diff before rebuilding, not only after
      a new commit.
    - >-
      Owner registered https://app.staging.mumate.co/api/auth/callback/google
      in Google Cloud (Google Auth Platform → Clients) and logged in with
      their own account: NextAuth succeeded (no error in the FE log; the only
      log line is the benign TWITTER_OAUTH_2_BETA warning).
    - >-
      Diagnosis of "เข้าสู่ระบบไม่สำเร็จ / เราเชื่อมต่อบัญชีของคุณไม่ได้ในตอนนี้"
      (components/screen-identity-stuck.tsx, shown by useV2AuthGate after 8 s
      of identity limbo, #246): /v2 needs MEMBER_ID, minted by the BROWSER
      calling BE directly (constants/api/api-user-register-or-login →
      NEXT_PUBLIC_BACKEND_URL = https://api.staging.mumate.co, inlined in the
      image). The shadow BE runs the Render value CORS_ORIGINS=
      https://bazichart.mumate.co, so a preflight with Origin
      https://app.staging.mumate.co returns 204 WITHOUT
      Access-Control-Allow-Origin (verified with curl) → the browser blocks
      the call → no MEMBER_ID → limbo → the re-login screen. Not an OAuth,
      cookie, or database problem.
  not_completed:
    - The fix: append https://app.staging.mumate.co to CORS_ORIGINS in env/be.env on the host (BE splits on commas) and recreate BE; a shadow-only, necessary deviation from production like NEXTAUTH_URL, reverting naturally at the real-domain flip.
    - Caddy has no access log, which made this diagnosis code-driven instead of log-driven; propose a PR enabling JSON access logs with rotation before the next smoke.
    - The rest of the parity smoke (FE→BE, FE→Bazi, storage, payment, maintenance bypass, v1/v2 paths).
  evidence_of_limits:
